     * 入力内容をls.dialoguesへ書き戻してから切り替える(でないと今見えて
     * いないサブタブの内容がls.dialoguesに反映されないまま消える)。 */
    document.querySelectorAll('[data-dialogue-subtab]').forEach(b=>{
      b.addEventListener('click', ()=>{
        commitVisibleDialogueRowsToMemory();
        state.ui.dialogueSubTab = b.getAttribute('data-dialogue-subtab');
        render();
      });
    });
    document.querySelectorAll('[data-save-dialogues]').forEach(b=>{
      b.addEventListener('click', saveLiverDialogues);
    });
    document.querySelectorAll('[data-dialogue-bulk-freq]').forEach(b=>{
      b.addEventListener('click', ()=>bulkSetDialogueFreq(b.getAttribute('data-dialogue-bulk-freq')));
    });

    on('gotoMarketBtn', gotoMarket);
    document.querySelectorAll('[data-market-tab]').forEach(b=>{
      b.addEventListener('click', ()=>switchMarketTab(b.getAttribute('data-market-tab')));
    });
    document.querySelectorAll('[data-market-buy-sub]').forEach(b=>{
      b.addEventListener('click', ()=>switchMarketBuySubTab(b.getAttribute('data-market-buy-sub')));
    });
    document.querySelectorAll('[data-market-sell-sub]').forEach(b=>{
      b.addEventListener('click', ()=>switchMarketSellSubTab(b.getAttribute('data-market-sell-sub')));
    });
    document.querySelectorAll('[data-market-refresh]').forEach(b=>{
      b.addEventListener('click', refreshMarketData);
    });
    document.querySelectorAll('[data-market-open-book]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const [bucket, key] = b.getAttribute('data-market-open-book').split(':');
        openMarketStackBook(bucket, key);
      });
    });
    on('marketStackBackBtn', backMarketStackList);
    document.querySelectorAll('[data-market-buy-stack]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const [bucket, key, price, stock] = b.getAttribute('data-market-buy-stack').split(':');
        openMarketBuyStackPopup(bucket, key, Number(price), Number(stock));
      });
    });
    document.querySelectorAll('[data-market-open-buy-equip]').forEach(b=>{
      b.addEventListener('click', ()=>openMarketBuyEquipPopup(b.getAttribute('data-market-open-buy-equip')));
    });
    document.querySelectorAll('[data-market-open-sell-stack]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const [bucket, key] = b.getAttribute('data-market-open-sell-stack').split(':');
        openMarketSellStackPopup(bucket, key);
      });
    });
    document.querySelectorAll('[data-market-open-sell-equip]').forEach(b=>{
      b.addEventListener('click', ()=>openMarketSellEquipPopup(b.getAttribute('data-market-open-sell-equip')));
    });
    document.querySelectorAll('[data-market-cancel-listing]').forEach(b=>{
      b.addEventListener('click', ()=>cancelMarketListing(Number(b.getAttribute('data-market-cancel-listing'))));
    });
    document.querySelectorAll('[data-market-open-empty-slot]').forEach(b=>{
      b.addEventListener('click', ()=>switchMarketTab('sell'));
    });
    const marketEquipSortSelect = document.getElementById('marketEquipSortSelect');
    if(marketEquipSortSelect) marketEquipSortSelect.addEventListener('change', (e)=>setMarketEquipSort(e.target.value));

    /* マーケットのポップアップ内の個数・単価入力は、フル再描画(render())
     * だとカーソル位置が飛んで打ちづらくなるため、合計金額の再計算・
     * 所持金不足の判定は直接DOM操作で行う(確定/キャンセル/開閉のみ
     * render()を使う既存の他のポップアップと同じ方針)。 */
    const marketPopupBackdrop = document.getElementById('marketPopupBackdrop');
    if(marketPopupBackdrop){
      marketPopupBackdrop.addEventListener('click', (e)=>{ if(e.target === marketPopupBackdrop) closeMarketPopup(); });
    }
    on('marketPopupCancelBtn', closeMarketPopup);
    const marketPopup = state.ui && state.ui.marketPopup;
    if(marketPopup && marketPopup.type === 'buyStack'){
      const qtyInput = document.getElementById('marketPopupQty');
      const updateTotal = ()=>{
        const qty = Math.max(1, Math.min(marketPopup.stock, Math.floor(Number(qtyInput.value)||0)));
        const total = qty * marketPopup.price;
        document.getElementById('marketPopupTotal').textContent = total + 'G';
        const insufficient = total > state.gold;
        document.getElementById('marketPopupInsufficient').style.display = insufficient ? '' : 'none';
        document.getElementById('marketPopupConfirmBtn').disabled = insufficient;
      };
      if(qtyInput) qtyInput.addEventListener('input', updateTotal);
      on('marketPopupConfirmBtn', confirmMarketBuyStack);
    } else if(marketPopup && marketPopup.type === 'buyEquip'){
      on('marketPopupConfirmBtn', confirmMarketBuyEquip);
    } else if(marketPopup && marketPopup.type === 'sellStack'){
      const priceInput = document.getElementById('marketSellStackPrice');
      const qtyInput = document.getElementById('marketSellStackQty');
      const updateTotal = ()=>{
        const price = Math.max(1, Math.floor(Number(priceInput.value)||0));
        const qty = Math.max(1, Math.min(marketPopup.owned, Math.floor(Number(qtyInput.value)||0)));
        document.getElementById('marketSellStackTotal').textContent = (price*qty) + 'G';
      };
      if(priceInput) priceInput.addEventListener('input', updateTotal);
      if(qtyInput) qtyInput.addEventListener('input', updateTotal);
      on('marketPopupConfirmBtn', confirmMarketSellStack);
    } else if(marketPopup && marketPopup.type === 'sellEquip'){
      on('marketPopupConfirmBtn', confirmMarketSellEquip);
    }

    const chatReportPopupBackdrop = document.getElementById('chatReportPopupBackdrop');
    if(chatReportPopupBackdrop){
      chatReportPopupBackdrop.addEventListener('click', (e)=>{ if(e.target === chatReportPopupBackdrop) closeChatReportPopup(); });
    }
    on('chatReportPopupCancelBtn', closeChatReportPopup);
    on('chatReportPopupConfirmBtn', submitChatReport);

    const chatUserMenuBackdrop = document.getElementById('chatUserMenuBackdrop');
    if(chatUserMenuBackdrop){
      chatUserMenuBackdrop.addEventListener('click', (e)=>{ if(e.target === chatUserMenuBackdrop) closeChatUserMenu(); });
    }
    on('chatUserMenuCancelBtn', closeChatUserMenu);
    on('chatUserMenuProfileBtn', ()=>{
      const menu = state.ui && state.ui.chatUserMenu;
      if(!menu) return;
      closeChatUserMenu();
      openProfile(menu.playerId, 'town', menu.playerName);
    });
    on('chatUserMenuReportBtn', ()=>{
      const menu = state.ui && state.ui.chatUserMenu;
      if(!menu || menu.messageId == null) return;
      closeChatUserMenu();
      openChatReportPopup(menu.messageId);
    });

    on('gotoProfileBtn', ()=>openProfile(state.playerId, 'town'));
    on('backFromProfileBtn', backFromProfile);
    on('backFromProfileLiverDetailBtn', backFromProfileLiverDetail);
    on('viewProfileFromLiverBtn', viewProfileFromLiverDetail);
    on('backToRankingFromLiverBtn', backToRankingFromLiverDetail);
    document.querySelectorAll('[data-open-profile-liver]').forEach(b=>{
      b.addEventListener('click', ()=>openProfileLiverDetail(b.getAttribute('data-open-profile-liver')));
    });
    document.querySelectorAll('[data-open-ranking-character]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const from = (state.screen === 'rankings' || state.screen === 'rankingDetail') ? state.screen : 'rankings';
        openProfileLiverFromRanking(
          b.getAttribute('data-open-ranking-character'),
          b.getAttribute('data-liver-id'),
          from,
          b.getAttribute('data-fallback-name')
        );
      });
    });
    on('saveProfileCommentBtn', saveProfileComment);
    on('editProfileCommentBtn', ()=>{
      if(!state.ui) state.ui = {};
      state.ui.profileCommentEditing = true;
      render();
    });
    on('cancelProfileCommentEditBtn', ()=>{
      if(!state.ui) return;
      state.ui.profileCommentEditing = false;
      profileCommentStatus = null;
      render();
    });
    document.querySelectorAll('[data-open-profile-report]').forEach(b=>{
      b.addEventListener('click', ()=>openProfileReportPopup(b.getAttribute('data-open-profile-report'), b.getAttribute('data-target-name')));
    });
    const profileReportPopupBackdrop = document.getElementById('profileReportPopupBackdrop');
    if(profileReportPopupBackdrop){
      profileReportPopupBackdrop.addEventListener('click', (e)=>{ if(e.target === profileReportPopupBackdrop) closeProfileReportPopup(); });
    }
    on('profileReportPopupCancelBtn', closeProfileReportPopup);
    on('profileReportPopupConfirmBtn', submitProfileReport);
  }

  /* ---------------- チャット(全ユーザー共有、Supabase Realtime) ---------------- */
  const CHAT_CHANNEL_DEFS = [
    { id:'general', name:'総合チャット' },
    { id:'strategy', name:'攻略チャット' },
    { id:'casual', name:'雑談チャット' },
  ];
  const CHAT_REPORT_REASONS = [
    { id:'spam', label:'スパム・広告' },
    { id:'harassment', label:'誹謗中傷・嫌がらせ' },
    { id:'inappropriate', label:'不適切な内容' },
    { id:'impersonation', label:'なりすまし' },
    { id:'cheat', label:'不正・チートの疑い' },
    { id:'other', label:'その他' },
  ];
  let chatCache = [];
  let chatChannel = null;
  let activeChatChannel = 'general';

  async function loadChat(channel){
    try{
      const { data, error } = await sb.from('chat_messages')
        .select('*').eq('channel', channel).order('created_at', {ascending:false}).limit(100);
      if(error) throw error;
      return (data||[]).slice().reverse().map(m=>(
        { name: m.player_name, id: m.player_id, messageId: m.id, text: m.body, ts: new Date(m.created_at).getTime() }
      ));
    }catch(e){
      console.error('load chat failed', e);
      return [];
    }
  }

  function renderChatMessages(){
    if(!chatCache.length) return '<p style="color:var(--text-muted);">まだ発言はない。</p>';
    return chatCache.map(m=>{
      const isOwn = !!(state && state.playerId && m.id === state.playerId);
      const menuHtml = (m.id != null)
        ? `<span class="chat-report-trigger" data-open-chat-user-menu="${m.id}" data-user-name="${esc(m.name)}" data-is-own="${isOwn}" data-message-id="${m.messageId!=null?m.messageId:''}" title="マイページ・通報">⋮</span>`
        : '';
      const nameHtml = `<span style="color:var(--gold);">${nameWithId(m.name, m.id)}</span>`;
      return `<p>${menuHtml}${nameHtml}: ${esc(m.text)}</p>`;
    }).join('');
  }

  async function refreshChatDOM(){
    const el = document.getElementById('chatLog');
    if(!el) return;
    chatCache = await loadChat(activeChatChannel);
    el.innerHTML = renderChatMessages();
    el.scrollTop = el.scrollHeight;
  }

  function switchChatChannel(channelId){
    if(!CHAT_CHANNEL_DEFS.some(c=>c.id === channelId)) return;
    activeChatChannel = channelId;
    toggleBottomTab('chat');
  }

  async function sendChatMessage(rawText){
    const text = (rawText||'').trim().slice(0,200);
    if(!text || !state) return;
    try{
      const { error } = await sb.from('chat_messages').insert({
        player_id: state.playerId, player_name: state.name, body: text, channel: activeChatChannel
      });
      if(error) throw error;
      // 表示への反映は、下のRealtime購読側のINSERTイベントで(自分の発言も含めて)行われる
    }catch(e){
      console.error('send chat failed', e);
      pushLog('チャットの送信に失敗した。通信状況を確認してほしい。', 'system');
      render();
    }
  }

  function openChatReportPopup(messageId){
    const msg = chatCache.find(m=>m.messageId === messageId);
    if(!msg) return;
    if(!state.ui) state.ui = {};
    state.ui.chatReportPopup = {
      messageId, authorName: msg.name, authorId: msg.id, text: msg.text,
      submitting:false, error:''
    };
    render();
  }

  function closeChatReportPopup(){
    if(!state.ui) return;
    state.ui.chatReportPopup = null;
    render();
  }

  async function submitChatReport(){
    const popup = state.ui && state.ui.chatReportPopup;
    if(!popup || popup.submitting) return;
    const reasonSelect = document.getElementById('chatReportReasonSelect');
    const reasonText = document.getElementById('chatReportReasonText');
    const category = reasonSelect ? reasonSelect.value : 'other';
    const detail = reasonText ? reasonText.value.trim().slice(0,500) : '';
    popup.submitting = true;
    popup.error = '';
    render();
    try{
      const { error } = await sb.rpc('submit_chat_report', {
        p_message_id: popup.messageId, p_reason_category: category, p_reason_text: detail || null
      });
      if(error) throw error;
      state.ui.chatReportPopup = null;
      pushLog('通報を受け付けました。運営にて内容を確認いたします。', 'system');
      render();
    }catch(e){
      console.error('submit chat report failed', e);
      popup.submitting = false;
      popup.error = /already reported/.test(e.message) ? 'この投稿はすでに通報済みです。'
        : /cannot report own message/.test(e.message) ? '自分の投稿は通報できません。'
        : '通報の送信に失敗しました。通信状況をご確認ください。';
      render();
    }
  }

  function renderChatReportPopup(){
    const popup = state.ui && state.ui.chatReportPopup;
    if(!popup) return '';
    const reasonOptionsHtml = CHAT_REPORT_REASONS.map(r=>`<option value="${r.id}">${esc(r.label)}</option>`).join('');
    return `
    <div class="help-popup-backdrop" id="chatReportPopupBackdrop">
      <div class="help-popup">
        <p class="section-label" style="margin-top:0;">投稿を通報</p>
        <div class="market-popup-row"><span>投稿者</span><span>${nameWithId(popup.authorName, popup.authorId)}</span></div>
        <p class="log-entry" style="margin-top:8px;background:rgba(255,255,255,0.05);padding:8px;">${esc(popup.text)}</p>
        <label style="display:block;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:10px;">通報理由</label>
        <select class="chat-report-reason-select" id="chatReportReasonSelect">${reasonOptionsHtml}</select>
        <label style="display:block;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:8px;">詳細(任意)</label>
        <textarea class="chat-report-reason-text" id="chatReportReasonText" maxlength="500" placeholder="具体的な状況があれば記入してください"></textarea>
        ${popup.error ? `<p class="log-entry danger" style="margin-top:8px;">${esc(popup.error)}</p>` : ''}
        <div class="actions" style="justify-content:flex-end;margin-top:14px;">
          <button id="chatReportPopupCancelBtn" ${popup.submitting?'disabled':''}>キャンセル</button>
          <button class="primary" id="chatReportPopupConfirmBtn" ${popup.submitting?'disabled':''}>${popup.submitting?'送信中……':'通報する'}</button>
        </div>
      </div>
    </div>`;
  }

  function toggleBottomTab(tab){
    if(!state.ui) state.ui = {expandedGroups:[]};
    state.ui.bottomTab = tab;
    saveGame(); render();
    if(tab === 'chat') refreshChatDOM();
    if(tab === 'market') refreshMarketNotifications();
  }

  /* ポーリングではなく、Supabase Realtimeで新着メッセージをプッシュ受信する。
   * ページを開いた時に1回だけ購読を開始し、以降は通信を発生させずに
   * 新着があった時だけイベントが飛んでくる。 */
  function startChatPolling(){
    if(chatChannel) return;
    chatChannel = sb.channel('public:chat_messages')
      .on('postgres_changes', {event:'INSERT', schema:'public', table:'chat_messages'}, (payload)=>{
        const m = payload.new;
        if(m.channel !== activeChatChannel) return;
        chatCache.push({ name: m.player_name, id: m.player_id, messageId: m.id, text: m.body, ts: new Date(m.created_at).getTime() });
        if(chatCache.length > 100) chatCache.shift();
        if(state && state.ui && state.ui.bottomTab === 'chat'){
          const el = document.getElementById('chatLog');
          if(el){ el.innerHTML = renderChatMessages(); el.scrollTop = el.scrollHeight; }
        }
      })
      .subscribe();
  }

  function renderBottomPanel(){
    if(historyLogHeightPx <= 0){
      return `<div class="panel history-panel" style="padding:10px 14px;">
        <button id="showHistoryPanelBtn" style="width:100%;padding:6px 14px;font-size:12px;">▲ 冒険の記録・チャットを表示</button>
      </div>`;
    }

    const tab = (state.ui && state.ui.bottomTab) || 'log';
    const logActive = tab === 'log';
    const marketActive = tab === 'market';
    const channelTabsHtml = CHAT_CHANNEL_DEFS.map(c=>
      `<button data-chat-channel="${c.id}" class="${(!logActive && !marketActive && activeChatChannel===c.id)?'primary':''}" style="padding:6px 14px;font-size:12px;">${esc(c.name)}</button>`
    ).join('');
    const heightOptions = HISTORY_LOG_PRESETS.map(o=>
      `<option value="${o.px}" ${historyLogHeightPx===o.px?'selected':''}>${esc(o.label)}</option>`
    ).join('');
    const tabsHtml = `
      <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center;">
        <button data-bottom-tab="log" class="${logActive?'primary':''}" style="padding:6px 14px;font-size:12px;">冒険の記録</button>
        <button data-bottom-tab="market" class="${marketActive?'primary':''}" style="padding:6px 14px;font-size:12px;">マーケット${marketUnseenCount > 0 ? `<span class="notify-badge">${marketUnseenCount}</span>` : ''}</button>
        ${channelTabsHtml}
        <select id="historyLogHeightSelect" title="この欄の表示行数(この端末だけの設定)" style="margin-left:auto;font-size:11px;padding:4px 6px;background:var(--win-bg-1);color:var(--text-primary);border:1px solid var(--win-border);">${heightOptions}</select>
      </div>`;
    let body;
    if(logActive){
      const rows = (state.history||[]).map(l=>`<p class="${l.cls}">${esc(l.text)}</p>`).join('')
        || '<p style="color:var(--text-muted);">まだ記録はない。</p>';
      body = `<div class="scrollbox history-log" id="historyLog">${rows}</div>`;
    } else if(marketActive){
      const rows = (!marketNotifications || marketNotifications.loading)
        ? '<p style="color:var(--text-muted);">読み込み中……</p>'
        : marketNotifications.items.length
          ? marketNotifications.items.map(n=>`<p class="${marketNotificationLogClass(n)}">${formatNotificationDateTime(n.created_at)} ${esc(marketNotificationText(n))}</p>`).join('')
          : '<p style="color:var(--text-muted);">まだ売却の記録は無い。</p>';
      body = `<div class="scrollbox history-log" id="marketNotificationLog">${rows}</div>`;
    } else {
      const activeChannelDef = CHAT_CHANNEL_DEFS.find(c=>c.id === activeChatChannel) || CHAT_CHANNEL_DEFS[0];
      body = `
        <div class="scrollbox history-log" id="chatLog">${renderChatMessages()}</div>
        <div class="actions" style="margin-top:10px;flex-wrap:nowrap;">
          <input id="chatInput" class="name-input" style="flex:1;margin:0;" type="text" maxlength="200" placeholder="${esc(activeChannelDef.name)}に発言(他の全ユーザーに公開されます)">
          <button class="primary" id="sendChatBtn">送信</button>
        </div>`;
    }
    return `<div class="panel history-panel">${tabsHtml}${body}</div>`;
  }

  /* 次元断層ポモ・ドーロが進行中/受け取り待ちの間は、state.screenが何で
   * あろうと関係なく、この専用画面だけを強制表示する。画面遷移・チャット
   * 閲覧も含め、通常のヘッダーやレイアウトを一切描画しないことで
   * 「ロック」を実現している。 */
  function renderRiftLockScreen(){
    const participantsHtml = state.rift.partyIds.map(id=>liverDef(id)).filter(Boolean).map(def=>`
        <div class="inv-item" style="border-left-color:${def.color};">
          <span style="width:10px;height:10px;background:${def.color};display:inline-block;margin-right:8px;"></span>
          <span class="inv-item-name">${esc(def.name)}</span>
        </div>`).join('');

    if(state.rift.result){
      const r = state.rift.result;
      const levelUpHtml = r.levelUps.length
        ? r.levelUps.map(lu=>`<p class="log-entry reward" style="margin:2px 0;color:var(--gold);">${esc(lu.name)}のレベルが ${lu.level} に上がった！</p>`).join('')
        : '';
      return `
        <div class="create-box" style="text-align:center;">
          <h1>${GAME_TITLE_HTML}</h1>
          <p class="subtitle">${GAME_SUBTITLE}</p>
          <h2 style="margin-top:24px;">次元断層ポモ・ドーロ ― 探索結果</h2>
          <p class="log-entry system" style="font-size:15px;color:#000;">パーティが無事に帰還した。</p>
          <div class="section-block" style="text-align:left;max-width:360px;margin:16px auto;">
            <div class="inv-item"><span class="inv-item-name">ゴールド</span><span class="inv-item-actions" style="color:var(--gold);">+${r.gold}G</span></div>
            <div class="inv-item"><span class="inv-item-name">経験値</span><span class="inv-item-actions">+${r.exp}</span></div>
            ${r.itemName ? `<div class="inv-item"><span class="inv-item-name">獲得アイテム</span><span class="inv-item-actions">${esc(r.itemName)}</span></div>` : ''}
          </div>
          ${levelUpHtml}
          <div class="actions" style="justify-content:center;margin-top:16px;"><button class="primary" id="riftCloseResultBtn">閉じる</button></div>
          <p class="section-label" style="margin-top:20px;color:var(--text-primary);text-shadow:1px 1px 0 var(--field-ground-dark);">挑んでいた仲間</p>
          <div style="max-width:360px;margin:0 auto;">${participantsHtml}</div>
        </div>
      `;
    }

    const ready = riftReady();
    const remainMs = riftRemainMs();
    const mins = Math.floor(remainMs/60000);
    const secs = Math.floor((remainMs%60000)/1000);

    return `
      <div class="create-box" style="text-align:center;">
        <h1>${GAME_TITLE_HTML}</h1>
        <p class="subtitle">${GAME_SUBTITLE}</p>
        <h2 style="margin-top:24px;">次元断層ポモ・ドーロ</h2>
        ${ready
          ? `<p class="log-entry reward" style="font-size:16px;color:var(--gold);">探索が完了した。仲間たちが戻ってくる……</p>
             <div class="actions" style="justify-content:center;"><button class="primary" id="riftClaimBtn">結果を受け取る</button></div>`
          : `<p class="log-entry system" style="font-size:16px;color:#000;">次元の狭間に挑んでいる……</p>
             <p style="font-family:var(--font-mono);font-size:28px;color:var(--gold);margin:16px 0;">${mins}:${String(secs).padStart(2,'0')}</p>
             <p style="color:var(--text-primary);text-shadow:1px 1px 0 var(--field-ground-dark);font-size:12px;">この間、画面遷移やチャットを含め他の操作は一切行えません。</p>
             <div class="actions" style="justify-content:center;margin-top:12px;"><button class="danger" id="riftRetreatBtn">撤退する</button></div>`
        }
        <p class="section-label" style="margin-top:20px;color:var(--text-primary);text-shadow:1px 1px 0 var(--field-ground-dark);">挑んでいる仲間</p>
        <div style="max-width:360px;margin:0 auto;">${participantsHtml}</div>
      </div>
    `;
  }

  /* render()はapp.innerHTMLを毎回まるごと作り直すため、何もしないと
   * ボタンを押すたびにスクロール位置が消えて先頭に戻ってしまう
   * (PC版はメインウィンドウ(.scene)内部のスクロール、それ以外は
   * ウィンドウ全体のスクロールが対象)。同じ画面内での再描画(アイテム
   * 使用・購入・強化などのアクション後)ではスクロール位置を復元し、
   * 別の画面へ実際に遷移した時だけ先頭に戻す。 */
  function render(){
    if(!state){ document.body.classList.remove('playing'); renderCreate(); return; }
    recomputeStamina();
    if(state.rift){
      document.body.classList.remove('playing');
      app.innerHTML = renderRiftLockScreen();
      bindEvents();
      return;
    }

    const keepScroll = state.screen === lastRenderedScreen;
    const prevSceneEl = document.querySelector('.layout > div > .scene');
    const prevSceneScrollTop = keepScroll && prevSceneEl ? prevSceneEl.scrollTop : 0;
    const prevWindowScrollY = keepScroll ? window.scrollY : 0;
    lastRenderedScreen = state.screen;

    document.body.classList.add('playing');
    app.innerHTML = `
      <header>
        <div>
          <h1>${GAME_TITLE_HTML}</h1>
          <p class="subtitle">${GAME_SUBTITLE}</p>
        </div>
        <div class="depth-badge-slot">${renderHeaderBadge()}</div>
      </header>
      <div class="layout${state.screen === 'market' ? ' layout-full' : ''}">
        <div>${renderMainArea()}</div>
        <div>${renderCharacterLane()}</div>
        <div>${renderInventoryLane()}</div>
      </div>
      ${renderBottomPanel()}
      ${renderHelpPopup()}
      ${renderStaminaPopup()}
      ${renderMarketPopup()}
      ${renderChatReportPopup()}
      ${renderChatUserMenu()}
      ${renderProfileReportPopup()}
    `;
    bindEvents();
    const historyEl = document.getElementById('historyLog');
    if(historyEl) historyEl.scrollTop = historyEl.scrollHeight;
    const chatEl = document.getElementById('chatLog');
    if(chatEl) chatEl.scrollTop = chatEl.scrollHeight;

    const newSceneEl = document.querySelector('.layout > div > .scene');
    if(newSceneEl) newSceneEl.scrollTop = prevSceneScrollTop;
    window.scrollTo(0, prevWindowScrollY);
    historyBatchOpen = false; // 次のpushLogから新しいひとまとまりとして扱う
  }

  /* ---------------- Init / セーブのマイグレーション ---------------- */

  /* 利用規約同意・BAN確認をクリアした後の本来の起動処理。
   * 規約同意直後、および通常起動の両方から呼ばれる。 */
  async function proceedToGame(){
    const loaded = await loadGame();
    if(loaded){
      state = loaded;
      // 念のための軽い安全確認(想定外のDB状態に対する保険)
      state.party = (state.party||[]).filter(id=>state.roster[id] && state.roster[id].unlocked).slice(0, PARTY_MAX);
      if(state.ui.equipPickerSlot && !state.roster[state.ui.equipPickerSlot.liverId]) state.ui.equipPickerSlot = null;
      // チュートリアル追加前からの既存セーブは、いきなり強制送りにしないようクリア済み扱いにする
      if(state.tutorialDone === undefined) state.tutorialDone = true;
    }
    render();
    startChatPolling();
    refreshAnnouncementUnreadCount();
    refreshMarketUnseenCount();
    setInterval(()=>{
      if(!state) return;
      let needsRender = recomputeStamina();
      if(state.screen === 'colosseum' && !inCombat){
        const remain = COLOSSEUM_COOLDOWN_MS - (Date.now() - (state.colosseum.lastChallengeAt||0));
        if(remain > 0) needsRender = true;
      }
      if(state.rift){
        needsRender = true;
      }
      if(needsRender) render();
    }, 5000);
  }

  function renderBanScreen(reason){
    app.innerHTML = `
      <div class="create-box">
        <h1>${GAME_TITLE_HTML}</h1>
        <p class="subtitle">${GAME_SUBTITLE}</p>
        <p style="color:var(--danger);font-weight:700;margin-top:24px;">このアカウントは利用規約違反により、利用を停止しています。</p>
        ${reason ? `<p style="color:#000;font-size:12px;">理由: ${esc(reason)}</p>` : ''}
      </div>
    `;
  }

  function formatPenaltyUntil(iso){
    const d = new Date(iso);
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  function renderPenaltyScreen(until, reason){
    app.innerHTML = `
      <div class="create-box">
        <h1>${GAME_TITLE_HTML}</h1>
        <p class="subtitle">${GAME_SUBTITLE}</p>
        <p style="color:var(--danger);font-weight:700;margin-top:24px;">このアカウントは利用規約違反により、一時的に利用を制限しています。</p>
        <p style="color:#000;font-size:12px;">解除予定: ${esc(formatPenaltyUntil(until))}</p>
        ${reason ? `<p style="color:#000;font-size:12px;">理由: ${esc(reason)}</p>` : ''}
      </div>
    `;
  }

  async function handleAgreeTos(){
    const btn = document.getElementById('agreeTosBtn');
    if(btn) btn.disabled = true;
    try{
      const { error } = await sb.rpc('agree_to_tos', { p_version: CURRENT_TOS_VERSION });
      if(error) throw error;
      // まだplayers行が無い(=これからキャラ作成する)場合、agree_to_tosのUPDATEは
      // 実質何もしない。キャラ作成前に再読み込みされてもゲートを出し直さないよう、
      // ブラウザ側にも同意済みを控えておく(キャラ作成完了時にサーバー側へ再送する)。
      localStorage.setItem('tosAgreedLocal', String(CURRENT_TOS_VERSION));
      app.innerHTML = `<p style="text-align:center;color:#000;margin-top:80px;font-family:var(--font-mono);">呼び起こしている……</p>`;
      await proceedToGame();
    }catch(e){
      console.error('agree_to_tos failed', e);
      if(btn) btn.disabled = false;
      alert('同意の送信に失敗した。通信状況を確認してもう一度試してほしい。');
    }
  }

  function renderTosGateScreen(){
    app.innerHTML = `
      <div class="create-box">
        <h1>${GAME_TITLE_HTML}</h1>
        <p class="subtitle">${GAME_SUBTITLE}</p>
        <p class="section-label" style="text-align:left;margin-top:20px;color:#000;">利用規約</p>
        <div class="panel tos-panel scrollbox" style="max-height:320px;font-size:12px;">
          ${TOS_TEXT_HTML}
        </div>
        <p style="font-size:11px;color:var(--text-primary);text-shadow:1px 1px 0 #2c5c2c;margin-top:10px;">「同意して始める」を押すと、上記の利用規約に同意したものとみなします。</p>
        <div class="actions" style="justify-content:center;margin-top:10px;">
          <button class="primary" id="agreeTosBtn">同意して始める</button>
        </div>
      </div>
    `;
    const btn = document.getElementById('agreeTosBtn');
    if(btn) btn.addEventListener('click', handleAgreeTos);
  }

  (async function init(){
    app.innerHTML = `<p style="text-align:center;color:var(--text-muted);margin-top:80px;font-family:var(--font-mono);">呼び起こしている……</p>`;
    try{
      const uid = await ensureAuth();
      const { data: gateRow, error } = await sb.from('players')
        .select('tos_agreed_version, banned_at, ban_reason, penalty_until, penalty_reason').eq('id', uid).maybeSingle();
      if(error) throw error;

      if(gateRow && gateRow.banned_at){
        renderBanScreen(gateRow.ban_reason);
        return;
      }
      if(gateRow && gateRow.penalty_until && new Date(gateRow.penalty_until).getTime() > Date.now()){
        renderPenaltyScreen(gateRow.penalty_until, gateRow.penalty_reason);
        return;
      }
      // players行がまだ無い(=キャラ作成前)場合は、agree_to_tosのUPDATEが
      // 何も更新できないため、ブラウザ側に控えた同意記録を代わりに参照する
      // (キャラ作成完了時にサーバー側へ改めて同意を記録する)。
      const agreedVersion = gateRow
        ? (gateRow.tos_agreed_version || 0)
        : parseInt(localStorage.getItem('tosAgreedLocal') || '0', 10);
      if(agreedVersion < CURRENT_TOS_VERSION){
        renderTosGateScreen();
        return;
      }
    }catch(e){
      // 規約確認自体の通信に失敗した場合は、プレイ不能にはせず通常フローに進む
      // (実際の書き込みは各RPC側のBANチェックで最終的に守られているため)
      console.error('tos/ban check failed', e);
    }
    await proceedToGame();
  })();

})();
</script>
</body>
</html>
