  const CP_OTHER_JOB_WEIGHT = { hp:0.3, atk:1.0, def:1.0, mp:0.15 };

  function jobStatPotential(jobId, level){
    return {
      hp: jobMaxHp(jobId, level),
      atk: jobBaseAtk(jobId, level),
      def: jobBaseDef(jobId, level),
      mp: jobMaxMp(jobId, level)
    };
  }
  function weightedStatSum(stat, weight){
    return stat.hp*weight.hp + stat.atk*weight.atk + stat.def*weight.def + stat.mp*weight.mp;
  }

  function combatPower(liverId){
    const ls = liverState(liverId);
    if(!ls) return 0;
    const activeJob = ls.job;
    const activeLevel = (ls.jobProgress[activeJob] || {}).level || 1;

    const mainStat = jobStatPotential(activeJob, activeLevel);
    mainStat.atk += ls.equipped.weapon ? itemEffectiveValue(ls.equipped.weapon) : 0;
    mainStat.def += ls.equipped.armor ? itemEffectiveValue(ls.equipped.armor) : 0;
    const accEff = liverAccessoryEffects(liverId);
    mainStat.hp  = Math.round(mainStat.hp  * (1 + (accEff.hpPct ||0)/100));
    mainStat.mp  = Math.round(mainStat.mp  * (1 + (accEff.mpPct ||0)/100));
    mainStat.atk = Math.round(mainStat.atk * (1 + (accEff.atkPct||0)/100));
    mainStat.def = Math.round(mainStat.def * (1 + (accEff.defPct||0)/100));

    let total = weightedStatSum(mainStat, CP_MAIN_WEIGHT);
    Object.keys(JOB_DEFS).forEach(jobId=>{
      if(jobId === activeJob) return;
      const level = (ls.jobProgress[jobId] || {}).level || 1;
      total += weightedStatSum(jobStatPotential(jobId, level), CP_OTHER_JOB_WEIGHT);
    });
    return Math.round(total);
  }

  /* 常時発動系パッシブ(kind:'statMult')による倍率。対象外なら1を返す。 */
  function passiveStatMult(liverId, stat){
    const p = equippedPassive(liverId);
    if(!p) return 1;
    if(p.kind==='statMult' && p.stat===stat) return p.mult;
    if(p.kind==='partySizeStatMult' && (p.stats||[]).includes(stat)){
      const partySize = (state && state.party) ? state.party.length : 1;
      const extraMembers = Math.max(0, partySize - 1);
      return 1 + extraMembers * (p.perMember||0);
    }
    return 1;
  }

  function unlockedSkillsFor(jobId, level){
    return JOB_DEFS[jobId].skills.filter(s=>level >= (s.unlockLevel||1));
  }

  function defaultLoadout(jobId, level){
    const enabled = unlockedSkillsFor(jobId, level||1).slice(0, SKILL_LOADOUT_MAX).map(s=>s.key);
    return { enabled };
  }

  /* 通常攻撃の発動率(必ず50%以上)と、有効化された各スキルの実発動率を算出。
   * 各スキルの発動率はJOB_DEFS側で固定(baseRate)されており、プレイヤーが
   * 変えられるのは「有効にするかどうか」のみ。有効なスキルのbaseRate合計が
   * 50%を超える場合は、50%に収まるよう全スキルを一律に按分縮小し、
   * 通常攻撃はぴったり50%になる。合計が50%以下ならそのままの値が使われ、
   * 通常攻撃は残り全てを引き受ける。 */
  function computeActionRates(liverId){
    const ls = liverState(liverId);
    const job = JOB_DEFS[ls.job];
    const jp = jobProgressFor(liverId);
    const loadout = jp.loadout;
    const enabledSkills = job.skills.filter(s=>loadout.enabled.includes(s.key) && jp.level >= (s.unlockLevel||1));
    const rawSum = enabledSkills.reduce((sum,s)=>sum + (s.baseRate||0), 0);
    let atkRate, scale;
    if(rawSum <= (100-ATK_MIN_RATE)){
      atkRate = 100 - rawSum;
      scale = 1;
    } else {
      atkRate = ATK_MIN_RATE;
      scale = rawSum > 0 ? (100-ATK_MIN_RATE) / rawSum : 1;
    }
    const actions = enabledSkills.map(s=>({skill:s, rate:(s.baseRate||0)*scale}));
    return { atkRate, actions };
  }

  function toggleSkillEnabled(liverId, skillKey){
    const ls = liverState(liverId);
    if(!ls.unlocked) return;
    const jp = jobProgressFor(liverId);
    const loadout = jp.loadout;
    const idx = loadout.enabled.indexOf(skillKey);
    if(idx >= 0){
      loadout.enabled.splice(idx,1);
    } else {
      const skillDef = JOB_DEFS[ls.job].skills.find(s=>s.key===skillKey);
      if(!skillDef || jp.level < (skillDef.unlockLevel||1)){
        pushLog('まだ習得していないスキルです。', 'system');
        render();
        return;
      }
      if(loadout.enabled.length >= SKILL_LOADOUT_MAX){
        pushLog(`有効にできるスキルは最大${SKILL_LOADOUT_MAX}つまで。`, 'system');
        render();
        return;
      }
      loadout.enabled.push(skillKey);
    }
    saveGame(); render();
  }

  function recomputeLiverMaxStats(id, fullRestore){
    const ls = liverState(id);
    const jp = jobProgressFor(id);
    const accEff = liverAccessoryEffects(id);
    const newMaxHp = Math.round(jobMaxHp(ls.job, jp.level) * passiveStatMult(id, 'hp') * (1 + (accEff.hpPct||0)/100));
    const newMaxMp = Math.round(jobMaxMp(ls.job, jp.level) * passiveStatMult(id, 'mp') * (1 + (accEff.mpPct||0)/100));
    ls.maxHp = newMaxHp;
    ls.maxMp = newMaxMp;
    if(fullRestore){
      ls.hp = newMaxHp;
      ls.mp = newMaxMp;
    } else {
      ls.hp = Math.min(ls.hp, newMaxHp);
      ls.mp = Math.min(ls.mp, newMaxMp);
    }
  }

  /* ジョブごとにレベル・EXP・スキル編成を個別管理する(ジョブを切り替えても
   * 他のジョブの成長は失われず、戻ってくればそのまま続きから)。 */
  function newJobProgress(jobId){
    return { level:1, exp:0, loadout: defaultLoadout(jobId, 1) };
  }

  function newLiverProgress(liverDefObj){
    const job = liverDefObj.job;
    const maxHp = Math.round(jobMaxHp(job, 1) * passiveStatMult(liverDefObj.id, 'hp'));
    const maxMp = Math.round(jobMaxMp(job, 1) * passiveStatMult(liverDefObj.id, 'mp'));
    const jobProgress = {};
    Object.keys(JOB_DEFS).forEach(jobId=>{ jobProgress[jobId] = newJobProgress(jobId); });
    const defaultCostume = defaultCostumeKeyFor(liverDefObj.id);
    return {
      job, jobProgress,
      hp:maxHp, maxHp, mp:maxMp, maxMp,
      equipped: {weapon:null, armor:null, accessory:null},
      unlocked: !!liverDefObj.startUnlocked,
      unlockedAt: liverDefObj.startUnlocked ? Date.now() : null,
      costume: defaultCostume,
      unlockedCostumes: defaultCostume ? [defaultCostume] : [],
      dialogues: {} // 台詞設定。{victory,itemGet,death,critDeal,critTaken,skills:{skillKey:{text,freq}}}
    };
  }

  function newCharacter(name, starterLiverId, playerId){
    const roster = {};
    LIVER_DEFS.forEach(def=>{ roster[def.id] = newLiverProgress(def); });
    if(starterLiverId && roster[starterLiverId]){
      roster[starterLiverId].unlocked = true;
      roster[starterLiverId].unlockedAt = Date.now();
    }
    const party = (starterLiverId && roster[starterLiverId]) ? [starterLiverId] : [];
    return {
      name, gold:0,
      playerId,
      roster, party,
      inventory: [],
      log: [],
      history: [],
      screen: 'dungeon',
      activeDungeonId: 'tutorial',
      tutorialDone: false,
      home: { furniture: [] },
      ui: { expandedGroups: [], bottomTab: 'log', equipPickerSlot: null, inventoryTab: 'equip', helpTopicKey: null,
        marketTab: 'buy', marketBuySubTab: 'stack', marketSellSubTab: 'stack', marketStackBookOpen: false,
        marketSelectedStackKey: null, marketEquipSort: 'rarity_desc', marketPopup: null,
        rosterDetailId: null, rosterDetailFrom: 'roster', liverDetailTab: 'detail', dialogueSubTab: 'common',
        profileViewId: null, profileFrom: 'town', profileLiverId: null,
        profileLiverFrom: 'profile', profileCommentEditing: false, crystalPickerSlot: null,
        staminaPopupOpen: false },
      pendingDefeatGoldLoss: 0,
      dungeons: [...DUNGEON_DEFS, ...LIVER_DUNGEON_STAGES].reduce((acc,d)=>{ acc[d.id]=newDungeonProgress(); return acc; }, {}),
      colosseum: { floorRight: 1, medals: 0, lastChallengeAt: 0 },
      destinyTickets: 0, guaranteedTickets: 0,
      orbs: {}, // レアリティ(common/uncommon/rare/epic)ごとの所持数。合成で消費する
      materials: {}, // 素材キーごとの所持数。錬金で消費する
      tools: {}, // 道具キーごとの所持数。所持品から直接使用する
      stamina: STAMINA_MAX, staminaUpdatedAt: Date.now(),
      rift: null, // { startedAt, partyIds } / 非アクティブならnull
      towerRun: null, // { towerId, floor } / 非アクティブならnull
      towerBestFloor: {}, // 塔ごとの過去最高到達フロア(他の塔の解放条件に使う)
      lastTowerResult: null, // リザルト画面表示用。永続化はしない
      prismRun: null, // { floorId } / 非アクティブならnull(リロード時の再開判定に使う)
      lastPrismResult: null, // リザルト画面表示用。永続化はしない
      lastLiverDungeonResult: null // リザルト画面表示用。永続化はしない
    };
  }

  function liverAtk(id){
    const ls = liverState(id);
    const w = ls.equipped.weapon;
    const atk = jobBaseAtk(ls.job, jobProgressFor(id).level) + (w ? itemEffectiveValue(w) : 0);
    const atkPct = liverAccessoryEffects(id).atkPct || 0;
    return Math.round(atk * passiveStatMult(id, 'atk') * (1 + atkPct/100));
  }
  function liverDefStat(id){
    const ls = liverState(id);
    const a = ls.equipped.armor;
    const def = jobBaseDef(ls.job, jobProgressFor(id).level) + (a ? itemEffectiveValue(a) : 0);
    const statusMult = statusStatMult(playerStatusEffects[id], 'defBuff', 'defDebuff');
    const defPct = liverAccessoryEffects(id).defPct || 0;
    return Math.max(1, Math.round(def * passiveStatMult(id, 'def') * statusMult * (1 + defPct/100)));
  }

  /* 条件付きパッシブによる「戦闘中のみ」の与ダメージ倍率。
   * lowEnemyHpBoost/allyDownRageはliverAtk自体には織り込まない
   * (liverAtkはパーティ画面のステータス表示等、戦闘外でも使われるため)。
   * 条件をまたいだ瞬間にのみpushLogで発動を知らせ、以後は同じ戦闘中は
   * 再通知しない。 */
  function activeCombatAtkMult(id){
    const p = equippedPassive(id);
    if(!p) return 1;
    if(!combatPassiveFlags[id]) combatPassiveFlags[id] = {};
    const flags = combatPassiveFlags[id];
    if(p.kind === 'allyDownRage'){
      return flags.rageActive ? p.mult : 1;
    }
    if(p.kind === 'lowEnemyHpBoost' && combatEnemy && combatEnemy._maxHp > 0){
      const ratio = Math.max(0, combatEnemyHp) / combatEnemy._maxHp;
      const active = ratio <= p.threshold;
      if(active && !flags.lowEnemyLogged){
        flags.lowEnemyLogged = true;
        pushLog(`${liverDef(id).name}のパッシブ「${p.name}」が発動！ ${combatEnemy.name}の弱った隙を突き、火力が上がった！`, 'system', true);
      }
      if(!active) flags.lowEnemyLogged = false;
      return active ? p.mult : 1;
    }
    if(p.kind === 'lowHpAtkBoost'){
      const ls = liverState(id);
      const ratio = ls.maxHp > 0 ? ls.hp / ls.maxHp : 1;
      const active = ratio <= p.threshold;
      if(active && !flags.lowHpAtkLogged){
        flags.lowHpAtkLogged = true;
        pushLog(`${liverDef(id).name}のパッシブ「${p.name}」が発動！ 火事場の力で攻撃力が上昇した！`, 'system', true);
      }
      if(!active) flags.lowHpAtkLogged = false;
      return active ? p.mult : 1;
    }
    if(p.kind === 'allyActionStack'){
      const stacks = flags.stacks || 0;
      return 1 + stacks * (p.perStack || 0);
    }
    return 1;
  }
  function combatAtk(id){
    const statusMult = statusStatMult(playerStatusEffects[id], 'atkBuff', 'atkDebuff');
    return Math.max(1, Math.round(liverAtk(id) * activeCombatAtkMult(id) * partyBuffAtkMult() * statusMult));
  }

  /* 戦闘開始直後のNターンだけパーティ全体にかかる攻撃力バフ倍率(樋口楓)。 */
  function partyBuffAtkMult(){
    let mult = 1;
    state.party.forEach(id=>{
      const p = equippedPassive(id);
      if(p && p.kind==='battleStartPartyBuff' && combatEnemy && (combatEnemy.turnCount||0) < (p.turns||0)){
        mult *= p.mult;
      }
    });
    return mult;
  }

  /* 装備武器の属性付与(rollWeaponAffixのkind:'element')による与ダメージ倍率。
   * 敵の弱点属性と一致した時だけ効果があり、一致しなければ1のまま
   * (魔導師本人の属性スキルとは別枠。属性スキル自体には重ねて適用しない)。 */
  function weaponAffixDamageMult(liverId){
    const w = liverState(liverId).equipped.weapon;
    if(!w || !w.affix || w.affix.kind !== 'element') return 1;
    if(!combatEnemy || combatEnemy.weakness !== w.affix.element) return 1;
    return w.affix.mult || 1;
  }

  /* ダンジョンのアイテムドロップ率・ゴールド獲得量にかかる倍率(加賀美ハヤト)。 */
  function partyLootMult(){
    let dropMult = 1, goldMult = 1;
    state.party.forEach(id=>{
      const p = equippedPassive(id);
      if(p && p.kind==='lootBonus'){
        dropMult *= (p.dropRateMult || 1);
        goldMult *= (p.goldMult || 1);
      }
      const dropPct = liverAccessoryEffects(id).dropRate || 0;
      if(dropPct) dropMult *= (1 + dropPct/100);
    });
    return { dropMult, goldMult };
  }

  /* パーティ全員のスキルMP消費にかかる倍率(弦月藤士郎)。 */
  function partyMpCostMult(){
    let mult = 1;
    state.party.forEach(id=>{
      const p = equippedPassive(id);
      if(p && p.kind==='partyMpCostReduce') mult *= (p.mult || 1);
    });
    return mult;
  }

  /* 攻撃命中時、与ダメージの一部をMPとして吸収する(魔界ノりりむ)。
   * 戻り値は実際に回復したMP量(戦闘ログへの追記に使う)。 */
  function applyOnHitMpDrain(liverId, dmg){
    const ls = liverState(liverId);
    const p = equippedPassive(liverId);
    if(!p || p.kind !== 'onHitMpDrain' || dmg <= 0) return 0;
    const before = ls.mp;
    ls.mp = Math.min(ls.maxMp, ls.mp + Math.max(1, Math.round(dmg * p.ratio)));
    return ls.mp - before;
  }

  /* 毎ラウンド低確率で発動する妖精の加護(先斗寧)。ラウンド開始時に1回だけ判定する。 */
  function maybeTriggerFairyBoon(){
    const holderId = state.party.find(id=>{
      const p = equippedPassive(id);
      return p && p.kind==='randomAllyBoon' && liverState(id) && liverState(id).hp > 0;
    });
    if(!holderId) return;
    const p = equippedPassive(holderId);
    if(Math.random() >= (p.chance||0)) return;
    const alive = alivePartyIds();
    if(!alive.length) return;
    const targetId = alive[Math.floor(Math.random()*alive.length)];
    const ls = liverState(targetId);
    const before = ls.hp;
    ls.hp = Math.min(ls.maxHp, ls.hp + Math.round(ls.maxHp * (p.healRatio||0)));
    const healed = ls.hp - before;
    if(healed <= 0) return;
    pushLog(`${liverDef(holderId).name}のパッシブ「${p.name}」が発動！ ${liverDef(targetId).name}のHPが${healed}回復した！`, 'system', true);
  }

  /* 仲間が行動するたびに攻撃力が蓄積していくパッシブの通知用(風楽奏斗)。
   * 行動した本人以外で、このパッシブを持つ生存中の味方のスタックを進める。 */
  function notifyAllyActed(actorId){
    state.party.forEach(id=>{
      if(id === actorId) return;
      const ls = liverState(id);
      if(!ls || ls.hp <= 0) return;
      const p = equippedPassive(id);
      if(!p || p.kind !== 'allyActionStack') return;
      if(!combatPassiveFlags[id]) combatPassiveFlags[id] = {};
      const cur = combatPassiveFlags[id].stacks || 0;
      combatPassiveFlags[id].stacks = Math.min(p.maxStacks||99, cur+1);
    });
  }

  /* 敵の攻撃対象を、かばう役がいれば入れ替える(栞葉るり)。 */
  function applyCoverRedirect(targetId){
    if(!targetId) return targetId;
    const targetLs = liverState(targetId);
    if(!targetLs || targetLs.maxHp <= 0) return targetId;
    const coverId = state.party.find(id=>{
      if(id === targetId) return false;
      const ls = liverState(id);
      if(!ls || ls.hp <= 0) return false;
      const p = equippedPassive(id);
      return p && p.kind === 'coverAlly';
    });
    if(!coverId) return targetId;
    const p = equippedPassive(coverId);
    if((targetLs.hp/targetLs.maxHp) > (p.threshold||0)) return targetId;
    pushLog(`${liverDef(coverId).name}のパッシブ「${p.name}」が発動！ ${liverDef(targetId).name}をかばった！`, 'system', true);
    return coverId;
  }

  /* ライバーの属性耐性。レベルアップでは伸びず、装備(・将来的にはスキル等の
   * 一時効果)によってのみ変動する。数値1につき被ダメージ±3%。 */
  const ACCESSORY_RESIST_ELEMENT = { fireResist:'fire', iceResist:'ice', thunderResist:'thunder' };
  function liverResistances(id){
    const ls = liverState(id);
    const res = {};
    Object.keys(ELEMENT_LABELS).forEach(el=>{ res[el] = 0; });
    [ls.equipped.weapon, ls.equipped.armor].forEach(item=>{
      if(item && item.resist && res.hasOwnProperty(item.resist.element)){
        res[item.resist.element] += item.resist.value;
      }
    });
    const accEff = liverAccessoryEffects(id);
    Object.keys(ACCESSORY_RESIST_ELEMENT).forEach(effType=>{
      if(accEff[effType]) res[ACCESSORY_RESIST_ELEMENT[effType]] += accEff[effType];
    });
    return res;
  }
  function liverElementalMultiplier(id, element){
    if(!element) return 1;
    const value = liverResistances(id)[element] || 0;
    return Math.max(0.1, 1 - value*0.03);
  }

  /* ---------------------------------------------------------------
   * マイページ(他プレイヤーの公開プロフィール)閲覧用。
   * combatPower/liverAtk/liverDefStat/liverResistances/computeActionRates/
   * equippedPassiveの「他プレイヤーの読み取り専用スナップショット
   * (player_public_profile.roster内の1要素、liverStateと近い形だが
   * equipped.weapon/armorではなくequippedWeapon/equippedArmorという
   * フラットなキー名を持つ)に対して同じ計算式を適用する」ための専用版。
   * state.roster / state.party を一切参照しない(呼び出し元は
   * 本人のstateを一切汚さない)。元の計算式(combatPower等)を変更した
   * 場合、こちらも合わせて更新すること。
   * --------------------------------------------------------------- */
  function foreignEquippedPassive(liverId, snap){
    const costumeKey = snap.costume || defaultCostumeKeyFor(liverId);
    const def = costumeDefFor(liverId, costumeKey) || costumeDefsFor(liverId)[0];
    return def ? def.passive : null;
  }
  function foreignPassiveStatMult(liverId, snap, partySize, stat){
    const p = foreignEquippedPassive(liverId, snap);
    if(!p) return 1;
    if(p.kind==='statMult' && p.stat===stat) return p.mult;
    if(p.kind==='partySizeStatMult' && (p.stats||[]).includes(stat)){
      const extraMembers = Math.max(0, (partySize||1) - 1);
      return 1 + extraMembers * (p.perMember||0);
    }
    return 1;
  }
  function foreignCombatPower(snap){
    const activeJob = snap.job;
    const activeLevel = (snap.jobProgress[activeJob] || {}).level || 1;
    const mainStat = jobStatPotential(activeJob, activeLevel);
    mainStat.atk += snap.equippedWeapon ? itemEffectiveValue(snap.equippedWeapon) : 0;
    mainStat.def += snap.equippedArmor ? itemEffectiveValue(snap.equippedArmor) : 0;
    const accEff = foreignAccessoryEffects(snap);
    mainStat.hp  = Math.round(mainStat.hp  * (1 + (accEff.hpPct ||0)/100));
    mainStat.mp  = Math.round(mainStat.mp  * (1 + (accEff.mpPct ||0)/100));
    mainStat.atk = Math.round(mainStat.atk * (1 + (accEff.atkPct||0)/100));
    mainStat.def = Math.round(mainStat.def * (1 + (accEff.defPct||0)/100));
    let total = weightedStatSum(mainStat, CP_MAIN_WEIGHT);
    Object.keys(JOB_DEFS).forEach(jobId=>{
      if(jobId === activeJob) return;
      const level = (snap.jobProgress[jobId] || {}).level || 1;
      total += weightedStatSum(jobStatPotential(jobId, level), CP_OTHER_JOB_WEIGHT);
    });
    return Math.round(total);
  }
  function foreignLiverAtk(liverId, snap, partySize){
    const level = (snap.jobProgress[snap.job] || {}).level || 1;
    const atk = jobBaseAtk(snap.job, level) + (snap.equippedWeapon ? itemEffectiveValue(snap.equippedWeapon) : 0);
    const atkPct = foreignAccessoryEffects(snap).atkPct || 0;
    return Math.round(atk * foreignPassiveStatMult(liverId, snap, partySize, 'atk') * (1 + atkPct/100));
  }
  function foreignLiverDefStat(liverId, snap, partySize){
    const level = (snap.jobProgress[snap.job] || {}).level || 1;
    const def = jobBaseDef(snap.job, level) + (snap.equippedArmor ? itemEffectiveValue(snap.equippedArmor) : 0);
    const defPct = foreignAccessoryEffects(snap).defPct || 0;
    return Math.max(1, Math.round(def * foreignPassiveStatMult(liverId, snap, partySize, 'def') * (1 + defPct/100)));
  }
  function foreignLiverResistances(snap){
    const res = {};
    Object.keys(ELEMENT_LABELS).forEach(el=>{ res[el] = 0; });
    [snap.equippedWeapon, snap.equippedArmor].forEach(item=>{
      if(item && item.resist && res.hasOwnProperty(item.resist.element)){
        res[item.resist.element] += item.resist.value;
      }
    });
    const accEff = foreignAccessoryEffects(snap);
    Object.keys(ACCESSORY_RESIST_ELEMENT).forEach(effType=>{
      if(accEff[effType]) res[ACCESSORY_RESIST_ELEMENT[effType]] += accEff[effType];
    });
    return res;
  }
  function foreignAllowedWeaponTypes(liverId, snap){
    const jobTypes = (JOB_DEFS[snap.job] && JOB_DEFS[snap.job].weaponTypes) || [];
    const liverTypes = liverDef(liverId).weaponAptitude || [];
    return new Set([...jobTypes, ...liverTypes]);
  }
  function foreignComputeActionRates(snap){
    const job = JOB_DEFS[snap.job];
    const jp = snap.jobProgress[snap.job] || newJobProgress(snap.job);
    const loadout = jp.loadout || {enabled:[]};
    const enabledSkills = job.skills.filter(s=>(loadout.enabled||[]).includes(s.key) && jp.level >= (s.unlockLevel||1));
    const rawSum = enabledSkills.reduce((sum,s)=>sum + (s.baseRate||0), 0);
    let atkRate, scale;
    if(rawSum <= (100-ATK_MIN_RATE)){
      atkRate = 100 - rawSum;
      scale = 1;
    } else {
      atkRate = ATK_MIN_RATE;
      scale = rawSum > 0 ? (100-ATK_MIN_RATE) / rawSum : 1;
    }
    const actions = enabledSkills.map(s=>({skill:s, rate:(s.baseRate||0)*scale}));
    return { atkRate, actions };
  }

  /* ジョブごとにレベル・EXP・スキル編成を個別管理しているため、切り替えは
   * 現在のジョブを差し替えるだけでよい(以前そのジョブで積んだ成長は
   * jobProgressにそのまま残っており、戻ってくれば続きから)。 */
  function switchLiverJob(id, jobId){
    const ls = liverState(id);
    if(!JOB_DEFS[jobId] || ls.job === jobId || !ls.unlocked) return;
    const weapon = ls.equipped.weapon;
    let willUnequip = false;
    if(weapon){
      const currentlyAllowed = allowedWeaponTypes(id);
      const def = liverDef(id);
      const futureAllowed = new Set([...(JOB_DEFS[jobId].weaponTypes||[]), ...(def.weaponAptitude||[])]);
      if(currentlyAllowed.has(weapon.weaponType) && !futureAllowed.has(weapon.weaponType)){
        const ok = confirm(`ジョブを「${JOB_DEFS[jobId].name}」に変更すると、装備中の武器「${weapon.name}」(${WEAPON_TYPES[weapon.weaponType].name})が装備条件を満たさなくなるため、自動的に外れます。変更しますか？`);
        if(!ok) return;
        willUnequip = true;
      }
    }
    if(!ls.jobProgress[jobId]) ls.jobProgress[jobId] = newJobProgress(jobId);
    ls.job = jobId;
    if(willUnequip){
      ls.equipped.weapon = null;
      state.inventory.push(weapon);
    }
    recomputeLiverMaxStats(id, true);
    pushLog(`${liverDef(id).name}のジョブを「${JOB_DEFS[jobId].name}」に切り替えた。${willUnequip ? `「${weapon.name}」が外れた。` : ''}`, 'system');
    saveGame(); render();
  }

  /* 現在の編成(パーティ)の平均レベル。敵の強さ調整に使う。 */
  function partyLevel(){
    const members = state.party.filter(id=>liverState(id));
    if(!members.length) return 1;
    const sum = members.reduce((s,id)=>s+jobProgressFor(id).level, 0);
    return Math.max(1, Math.round(sum/members.length));
  }

  function togglePartyMember(id){
    const idx = state.party.indexOf(id);
    if(idx>=0){
      state.party.splice(idx,1);
    } else {
      if(!liverState(id).unlocked) return;
      if(state.party.length >= PARTY_MAX){
        pushLog(`パーティは最大${PARTY_MAX}人まで。`, 'system');
        render();
        return;
      }
      state.party.push(id);
    }

    saveGame(); render();
  }

  function unlockLiver(id){
    const ls = state.roster[id];
    if(!ls || ls.unlocked) return;
    ls.unlocked = true;
    ls.unlockedAt = Date.now();
    pushLog(`新たな仲間「${liverDef(id).name}」が加わった！`, 'reward');
    if(state.party.length < PARTY_MAX) state.party.push(id);
  }

  /* ---------------- 召喚: 運命のチケット・ガチャ ----------------
   * 未解放ライバーの中からランダムに1名を選ぶ「運命のチケット」ガチャと、
   * 5枚のチケットと交換できる「確約されし運命のチケット」(指名して確実に
   * 仲間にできる)の2本立て。
   * pendingGachaは戦闘中のcombatEnemy等と同様、セーブ不要な一時状態として
   * モジュールスコープの変数で保持する(結果確定前にリロードされた場合、
   * 消費したチケットは戻らない点は割り切りとする)。 */
  const DESTINY_EXCHANGE_COST = 5;
  const DESTINY_MAX_REROLLS = 3;
  let pendingGacha = null; // { candidateId, rerollsUsed, rolling }
  let staminaAdWatching = false; // スタミナ回復ポップアップの「広告視聴」演出中フラグ

  function unclaimedLiverDefs(){ return LIVER_DEFS_BY_DEBUT.filter(d=>!liverState(d.id).unlocked); }

  function drawDestinyCandidate(){
    const pool = unclaimedLiverDefs();
    if(!pool.length) return null;
    return pool[Math.floor(Math.random()*pool.length)].id;
  }

  function pullDestinyTicket(){
    if(inCombat || pendingGacha) return;
    if(state.destinyTickets <= 0) return;
    const candidate = drawDestinyCandidate();
    if(!candidate){
      pushLog('すでに全員のライバーと出会っている。', 'system');
      render();
      return;
    }
    state.destinyTickets -= 1;
    pendingGacha = { candidateId: candidate, rerollsUsed: 0, rolling: false };
    saveGame(); render();
  }

  /* 広告視聴による引き直し。現時点では実際の広告SDKが未導入のため、
   * 数秒待たせる疑似演出で代用している。広告SDK導入時はここを差し替える。 */
  async function rerollDestinyGacha(){
    if(!pendingGacha || pendingGacha.rolling) return;
    if(pendingGacha.rerollsUsed >= DESTINY_MAX_REROLLS) return;
    if(unclaimedLiverDefs().length <= 1) return; // 候補が1人以下なら引き直す意味がない
    pendingGacha.rolling = true;
    render();
    await sleep(2000);
    pendingGacha.candidateId = drawDestinyCandidate() || pendingGacha.candidateId;
    pendingGacha.rerollsUsed += 1;
    pendingGacha.rolling = false;
    render();
  }

  function acceptDestinyGacha(){
    if(!pendingGacha || pendingGacha.rolling) return;
    unlockLiver(pendingGacha.candidateId);
    pendingGacha = null;
    saveGame(); render();
  }

  function exchangeForGuaranteedTicket(){
    if(inCombat || pendingGacha) return;
    if(state.destinyTickets < DESTINY_EXCHANGE_COST) return;
    state.destinyTickets -= DESTINY_EXCHANGE_COST;
    state.guaranteedTickets += 1;
    pushLog(`運命のチケットを${DESTINY_EXCHANGE_COST}枚使い、「確約されし運命のチケット」と交換した。`, 'reward');
    saveGame(); render();
  }

  function useGuaranteedTicket(liverId){
    if(inCombat || pendingGacha) return;
    if(state.guaranteedTickets <= 0) return;
    const ls = liverState(liverId);
    if(!ls || ls.unlocked) return;
    state.guaranteedTickets -= 1;
    unlockLiver(liverId);
    saveGame(); render();
  }

  /* ---------------------------------------------------------------
   * 戦闘力ランキング
   * 数値自体はSupabase側(sync_combat_power RPC)がplayer_roster/
   * player_inventoryの保存済みデータから権威を持って再計算するため、
   * クライアントは表示専用。rankingListPreview/rankingBoardは戦闘中の
   * combatEnemy等と同様、セーブ不要な一時状態としてモジュールスコープの
   * 変数で保持する。
   * 「総合」は1プレイヤーにつき一番強いライバー1体だけがエントリーする
   * (liver_power_overall_rankingビュー側でplayer_idごとに絞り込み済み)。
   * --------------------------------------------------------------- */
  let rankingListPreview = null; // { loading, top:[...] } | null
  let rankingBoard = null;       // { key, loading, top:[...], myRank:{rank, entry}|null, error } | null

  function rankingBoardName(key){
    if(key === 'overall') return '総合ランキング';
    const def = liverDef(key);
    return def ? def.name : key;
  }

  async function openRankingList(){
    if(inCombat) return;
    state.screen = 'rankings';
    rankingListPreview = { loading:true, top:[] };
    render();
    try{
      const { data, error } = await sb.from('liver_power_overall_ranking').select('*')
        .order('combat_power', {ascending:false}).order('achieved_at', {ascending:true}).limit(5);
      if(error) throw error;
      rankingListPreview = { loading:false, top: data || [] };
    }catch(e){
      console.error('ranking preview fetch failed', e);
      rankingListPreview = { loading:false, top:[] };
    }
    render();
  }

  /* boardKeyは'overall'、またはライバーID(個別ランキング)。 */
  async function openRankingDetail(boardKey){
    if(inCombat) return;
    state.screen = 'rankingDetail';
    if(!state.ui) state.ui = {};
    state.ui.rankingSelected = boardKey;
    rankingBoard = { key: boardKey, loading:true, top:[], myRank:null, error:false };
    render();
    try{
      const uid = await ensureAuth();
      const table = boardKey === 'overall' ? 'liver_power_overall_ranking' : 'liver_power_rankings';

      let topQuery = sb.from(table).select('*')
        .order('combat_power', {ascending:false}).order('achieved_at', {ascending:true}).limit(100);
      if(boardKey !== 'overall') topQuery = topQuery.eq('liver_id', boardKey);
      const { data: topData, error: topError } = await topQuery;
      if(topError) throw topError;

      let myEntryQuery = sb.from(table).select('*').eq('player_id', uid);
      if(boardKey !== 'overall') myEntryQuery = myEntryQuery.eq('liver_id', boardKey);
      const { data: myEntry } = await myEntryQuery.maybeSingle();

      let myRank = null;
      if(myEntry){
        let higherQuery = sb.from(table).select('*', {count:'exact', head:true}).gt('combat_power', myEntry.combat_power);
        let tieQuery = sb.from(table).select('*', {count:'exact', head:true}).eq('combat_power', myEntry.combat_power).lt('achieved_at', myEntry.achieved_at);
        if(boardKey !== 'overall'){
          higherQuery = higherQuery.eq('liver_id', boardKey);
          tieQuery = tieQuery.eq('liver_id', boardKey);
        }
        const [{count:higherCount}, {count:tieCount}] = await Promise.all([higherQuery, tieQuery]);
        myRank = { rank: (higherCount||0) + (tieCount||0) + 1, entry: myEntry };
      }

      rankingBoard = { key: boardKey, loading:false, top: topData || [], myRank, error:false };
    }catch(e){
      console.error('ranking detail fetch failed', e);
      rankingBoard = { key: boardKey, loading:false, top:[], myRank:null, error:true };
    }
    render();
  }

  /* ---------------------------------------------------------------
   * お知らせ: announcements(管理者がSQL Editorから直接書き込む想定、
   * 管理画面は用意しない)+ player_announcement_reads(既読管理)。
   * ランキング機能と同様、表示専用データなのでモジュールスコープの
   * 一時変数で保持する。
   * --------------------------------------------------------------- */
  let announcementList = null;      // { loading, items:[...] } | null
  let announcementReadIds = new Set();
  let announcementUnreadCount = 0;  // 町のボタンに出すバッジ用
  let announcementTab = 'global';   // 'global' | 'personal' — お知らせ一覧のサブタブ

  function formatAnnouncementDate(iso){
    const d = new Date(iso);
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
  }

  /* 町の画面を開くたびに毎回問い合わせるのは無駄なので、ログイン直後に
   * 1度だけ取得してバッジ件数をキャッシュしておく(お知らせ一覧を開いた
   * 際は改めて最新状態を取得し直す)。 */
  async function refreshAnnouncementUnreadCount(){
    try{
      const uid = await ensureAuth();
      const [{ data: items, error: e1 }, { data: reads, error: e2 }] = await Promise.all([
        sb.from('announcements').select('id'),
        sb.from('player_announcement_reads').select('announcement_id').eq('player_id', uid)
      ]);
      if(e1) throw e1;
      if(e2) throw e2;
      const readSet = new Set((reads||[]).map(r=>r.announcement_id));
      announcementUnreadCount = (items||[]).filter(a=>!readSet.has(a.id)).length;
      render();
    }catch(e){
      console.error('unread announcement count fetch failed', e);
    }
  }

  async function openAnnouncementList(){
    if(inCombat) return;
    state.screen = 'announcements';
    announcementTab = 'global';
    announcementList = { loading:true, items:[] };
    render();
    try{
      const uid = await ensureAuth();
      const [{ data: items, error: e1 }, { data: reads, error: e2 }] = await Promise.all([
        sb.from('announcements').select('*').order('published_at', {ascending:false}).limit(50),
        sb.from('player_announcement_reads').select('announcement_id').eq('player_id', uid)
      ]);
      if(e1) throw e1;
      if(e2) throw e2;
      announcementReadIds = new Set((reads||[]).map(r=>r.announcement_id));
      announcementList = { loading:false, items: items || [] };
      announcementUnreadCount = announcementList.items.filter(a=>!announcementReadIds.has(a.id)).length;
    }catch(e){
      console.error('announcement list fetch failed', e);
      announcementList = { loading:false, items:[] };
    }
    render();
  }

  async function openAnnouncementDetail(id){
    if(inCombat) return;
    state.screen = 'announcementDetail';
    if(!state.ui) state.ui = {};
    state.ui.announcementSelected = id;

    if(!announcementReadIds.has(id)){
      announcementReadIds.add(id);
      announcementUnreadCount = Math.max(0, announcementUnreadCount - 1);
      render();
      try{
        const uid = await ensureAuth();
        const { error } = await sb.from('player_announcement_reads')
          .insert({ player_id: uid, announcement_id: id });
        // 23505 = 既に既読(重複挿入)は無視して良い
        if(error && error.code !== '23505') throw error;
      }catch(e){
        console.error('mark announcement read failed', e);
      }
    } else {
      render();
    }
  }

  /* ---------------- Persistence(Supabase) ---------------- */

  /* stateオブジェクトの形は今まで通り保ったまま、読み書きの中身だけを
   * Supabaseのテーブルに向ける。ゲームロジック側(戦闘・探索など)は
   * 一切変更していない。 */

  async function saveGame(){
    if(!state || !state.playerId) return;
    try{
      const rosterRows = LIVER_DEFS.map(def=>{
        const r = state.roster[def.id];
        const jp = r.jobProgress[r.job];
        return {
          liver_id: def.id, job: r.job, level: jp.level, exp: jp.exp,
          hp: r.hp, max_hp: r.maxHp, mp: r.mp, max_mp: r.maxMp,
          equipped_weapon_id: r.equipped.weapon ? r.equipped.weapon.id : null,
          equipped_armor_id: r.equipped.armor ? r.equipped.armor.id : null,
          equipped_accessory_id: r.equipped.accessory ? r.equipped.accessory.id : null,
          loadout: jp.loadout.enabled, unlocked: !!r.unlocked,
          job_progress: r.jobProgress,
          costume: r.costume || defaultCostumeKeyFor(def.id),
          unlocked_costumes: r.unlockedCostumes || [defaultCostumeKeyFor(def.id)],
          dialogues: r.dialogues || {}
        };
      });

      /* アクセサリーに装備したクリスタルは、アクセサリー本体とは別行として
       * 保存する(socketed_intoで親アクセサリーのidを持つ)。所持品リスト・
       * 装備中のアクセサリーの両方について、装備されているクリスタルを
       * 再帰的に取り出す。 */
      const inventoryRows = [];
      const pushInventoryRow = (item, socketedInto) => {
        if(!item) return;
        inventoryRows.push({
          id: item.id, item_type: item.type, name: item.name, rarity: item.rarity,
          value: item.value || 0,
          resist_element: item.resist ? item.resist.element : null,
          resist_value: item.resist ? item.resist.value : null,
          weapon_type: item.weaponType || null,
          affix: item.affix || null,
          enhance_level: item.enhanceLevel || 0,
          effect_type: item.mainEffect ? item.mainEffect.type : (item.effect ? item.effect.type : null),
          effect_value: item.mainEffect ? item.mainEffect.value : (item.effect ? item.effect.value : null),
          slot_count: item.type === 'accessory' ? (item.slotCount||0) : null,
          slot_cost: item.type === 'crystal' ? (item.slotCost||1) : null,
          socketed_into: socketedInto || null,
          unique_for_liver_id: item.uniqueFor || null
        });
        if(item.type === 'accessory' && Array.isArray(item.crystals)){
          item.crystals.forEach(c => pushInventoryRow(c, item.id));
        }
      };
      state.inventory.forEach(item => pushInventoryRow(item, null));
      LIVER_DEFS.forEach(def=>{
        const r = state.roster[def.id];
        pushInventoryRow(r.equipped.weapon, null);
        pushInventoryRow(r.equipped.armor, null);
        pushInventoryRow(r.equipped.accessory, null);
      });

      const dungeonRows = [...DUNGEON_DEFS, ...LIVER_DUNGEON_STAGES].map(d=>{
        const ds = state.dungeons[d.id];
        return {
          dungeon_id: d.id, depth: ds.depth, progress: ds.progress,
          cleared: !!ds.cleared, boss_kill_count: ds.bossKillCount || 0
        };
      });

      const { error } = await sb.rpc('save_full_state', {
        p_name: state.name,
        p_gold: state.gold,
        p_party: state.party,
        p_home_furniture: state.home.furniture,
        p_colosseum_floor_right: state.colosseum.floorRight,
        p_colosseum_medals: state.colosseum.medals,
        p_colosseum_last_challenge_at: state.colosseum.lastChallengeAt ? new Date(state.colosseum.lastChallengeAt).toISOString() : null,
        p_roster: rosterRows,
        p_inventory: inventoryRows,
        p_dungeons: dungeonRows,
        p_destiny_tickets: state.destinyTickets,
        p_guaranteed_tickets: state.guaranteedTickets,
        p_rift_state: state.rift ? { startedAt: state.rift.startedAt, partyIds: state.rift.partyIds, result: state.rift.result || null } : null,
        p_tutorial_done: !!state.tutorialDone,
        p_orbs: state.orbs || {},
        p_materials: state.materials || {},
        p_stamina: state.stamina,
        p_stamina_updated_at: new Date(state.staminaUpdatedAt).toISOString(),
        p_tools: state.tools || {},
        p_tower_run: state.towerRun || null,
        p_tower_best_floor: state.towerBestFloor || {},
        p_prism_run: state.prismRun || null
      });
      if(error) console.error('save_full_state failed', error);

      // 戦闘力ランキング反映。サーバー側で保存済みのroster/inventoryから
      // 権威ある値を再計算するため、失敗してもメインの保存自体は成功扱いにする。
      const { error: cpError } = await sb.rpc('sync_combat_power');
      if(cpError) console.error('sync_combat_power failed', cpError);

      // マイページ(公開プロフィール)の反映。こちらも表示専用データの
      // 再計算なので、失敗してもメインの保存自体は成功扱いにする。
      const { error: profileError } = await sb.rpc('sync_public_profile');
      if(profileError) console.error('sync_public_profile failed', profileError);
    }catch(e){ console.error('save failed', e); }
  }

  async function loadGame(){
    try{
      const uid = await ensureAuth();
      const { data: playerRow, error } = await sb.from('players').select('*').eq('id', uid).maybeSingle();
      if(error) throw error;
      if(!playerRow) return null; // 新規プレイヤー(キャラ作成画面へ)

      const [rosterRes, invRes, dungeonRes] = await Promise.all([
        sb.from('player_roster').select('*').eq('player_id', uid),
        sb.from('player_inventory').select('*').eq('player_id', uid),
        sb.from('player_dungeon_progress').select('*').eq('player_id', uid)
      ]);
      const rosterRows = rosterRes.data || [];
      const invRows = invRes.data || [];
      const dungeonRows = dungeonRes.data || [];

      const itemById = {};
      const inventory = [];
      invRows.forEach(i=>{
        const item = {
          id: i.id, type: i.item_type, name: i.name,
          rarity: i.rarity, rarityLabel: i.rarity, value: i.value,
          resist: i.resist_element ? { element: i.resist_element, value: i.resist_value } : null,
          weaponType: i.weapon_type || null,
          affix: i.affix || null,
          enhanceLevel: i.enhance_level || 0,
          uniqueFor: i.unique_for_liver_id || null
        };
        if(i.item_type === 'accessory'){
          item.mainEffect = i.effect_type ? { type: i.effect_type, value: i.effect_value } : null;
          item.slotCount = i.slot_count || 0;
          item.crystals = [];
        } else if(i.item_type === 'crystal'){
          item.effect = i.effect_type ? { type: i.effect_type, value: i.effect_value } : null;
          item.slotCost = i.slot_cost || 1;
        }
        itemById[i.id] = item;
        inventory.push(item);
      });
      // アクセサリーに装備されているクリスタルを、親アクセサリーのcrystals配列へ
      // 埋め込み、所持品リストからは外す(装備中のアイテムと同じ扱い)。
      invRows.forEach(i=>{
        if(i.item_type === 'crystal' && i.socketed_into){
          const parent = itemById[i.socketed_into];
          const crystal = itemById[i.id];
          if(parent && parent.type === 'accessory' && crystal){
            parent.crystals.push(crystal);
            const idx = inventory.findIndex(x=>x.id===crystal.id);
            if(idx>=0) inventory.splice(idx,1);
          }
        }
      });

      const roster = {};
      LIVER_DEFS.forEach(def=>{ roster[def.id] = newLiverProgress(def); });
      rosterRows.forEach(r=>{
        // job_progressが無い旧データ(ジョブ別レベル制導入前)は、各ジョブを
        // Lv.1から作った上で、当時就いていたジョブの分だけ既存の
        // level/exp/loadout列から復元する(データを失わないための互換処理)。
        let jobProgress;
        if(r.job_progress && typeof r.job_progress === 'object'){
          jobProgress = {};
          Object.keys(JOB_DEFS).forEach(jobId=>{
            const saved = r.job_progress[jobId];
            jobProgress[jobId] = saved
              ? { level: saved.level, exp: saved.exp, loadout: { enabled: Array.isArray(saved.loadout && saved.loadout.enabled) ? saved.loadout.enabled : [] } }
              : newJobProgress(jobId);
          });
        } else {
          jobProgress = {};
          Object.keys(JOB_DEFS).forEach(jobId=>{ jobProgress[jobId] = newJobProgress(jobId); });
          jobProgress[r.job] = { level: r.level, exp: r.exp, loadout: { enabled: Array.isArray(r.loadout) ? r.loadout : [] } };
        }
        roster[r.liver_id] = {
          job: r.job, jobProgress,
          hp: r.hp, maxHp: r.max_hp, mp: r.mp, maxMp: r.max_mp,
          equipped: {
            weapon: r.equipped_weapon_id ? (itemById[r.equipped_weapon_id]||null) : null,
            armor: r.equipped_armor_id ? (itemById[r.equipped_armor_id]||null) : null,
            accessory: r.equipped_accessory_id ? (itemById[r.equipped_accessory_id]||null) : null
          },
          unlocked: r.unlocked,
          costume: r.costume || defaultCostumeKeyFor(r.liver_id),
          unlockedCostumes: (Array.isArray(r.unlocked_costumes) && r.unlocked_costumes.length)
            ? r.unlocked_costumes
            : [defaultCostumeKeyFor(r.liver_id)],
          dialogues: (r.dialogues && typeof r.dialogues === 'object') ? r.dialogues : {}
        };
      });
      // 装備中のアイテムは所持品リストからは除外する(以前のwindow.storage版と同じ表現)
      Object.values(roster).forEach(r=>{
        [r.equipped.weapon, r.equipped.armor, r.equipped.accessory].forEach(item=>{
          if(!item) return;
          const idx = inventory.findIndex(x=>x.id===item.id);
          if(idx>=0) inventory.splice(idx,1);
        });
      });

      const dungeons = {};
      [...DUNGEON_DEFS, ...LIVER_DUNGEON_STAGES].forEach(d=>{ dungeons[d.id] = newDungeonProgress(); });
      dungeonRows.forEach(d=>{
        dungeons[d.dungeon_id] = {
          depth: d.depth, progress: d.progress, cleared: d.cleared,
          bossKillCount: d.boss_kill_count || 0
        };
      });

      // tutorial_done未完了のうちは、リロードのたびにtown/nullへ戻さず
      // チュートリアル専用ダンジョンへ強制的に再ルーティングする
      // (screen/activeDungeonId自体は永続化していないため、ここで代わりに判定する)。
      const tutorialDone = playerRow.tutorial_done !== false;
      const towerRun = (playerRow.tower_run && playerRow.tower_run.towerId) ? playerRow.tower_run : null;
      const prismRun = (playerRow.prism_run && playerRow.prism_run.floorId) ? playerRow.prism_run : null;

      return {
        name: playerRow.name, gold: playerRow.gold,
        playerId: uid,
        roster, party: Array.isArray(playerRow.party) ? playerRow.party : [],
        inventory,
        log: [], history: [],
        screen: prismRun ? 'dungeon' : (towerRun ? 'towerRun' : (tutorialDone ? 'town' : 'dungeon')),
        activeDungeonId: prismRun ? prismRun.floorId : (tutorialDone ? null : 'tutorial'),
        tutorialDone,
        home: { furniture: playerRow.home_furniture || [] },
        ui: { expandedGroups: [], bottomTab: 'log', equipPickerSlot: null, inventoryTab: 'equip', helpTopicKey: null,
        marketTab: 'buy', marketBuySubTab: 'stack', marketSellSubTab: 'stack', marketStackBookOpen: false,
        marketSelectedStackKey: null, marketEquipSort: 'rarity_desc', marketPopup: null,
        rosterDetailId: null, rosterDetailFrom: 'roster', liverDetailTab: 'detail', dialogueSubTab: 'common',
        profileViewId: null, profileFrom: 'town', profileLiverId: null,
        profileLiverFrom: 'profile', profileCommentEditing: false, crystalPickerSlot: null,
        staminaPopupOpen: false },
        pendingDefeatGoldLoss: 0,
        dungeons,
        colosseum: {
          floorRight: playerRow.colosseum_floor_right,
          medals: playerRow.colosseum_medals,
          lastChallengeAt: playerRow.colosseum_last_challenge_at ? new Date(playerRow.colosseum_last_challenge_at).getTime() : 0
        },
        destinyTickets: playerRow.destiny_tickets || 0,
        guaranteedTickets: playerRow.guaranteed_tickets || 0,
        orbs: (playerRow.orbs && typeof playerRow.orbs === 'object') ? playerRow.orbs : {},
        materials: (playerRow.materials && typeof playerRow.materials === 'object') ? playerRow.materials : {},
        stamina: (typeof playerRow.stamina === 'number') ? playerRow.stamina : STAMINA_MAX,
        staminaUpdatedAt: playerRow.stamina_updated_at ? new Date(playerRow.stamina_updated_at).getTime() : Date.now(),
        tools: (playerRow.tools && typeof playerRow.tools === 'object') ? playerRow.tools : {},
        rift: (playerRow.rift_state && playerRow.rift_state.startedAt)
          ? { startedAt: playerRow.rift_state.startedAt, partyIds: playerRow.rift_state.partyIds || [], result: playerRow.rift_state.result || null }
          : null,
        towerRun: towerRun ? { towerId: towerRun.towerId, floor: towerRun.floor || 0 } : null,
        towerBestFloor: (playerRow.tower_best_floor && typeof playerRow.tower_best_floor === 'object') ? playerRow.tower_best_floor : {},
        lastTowerResult: null,
        prismRun: prismRun ? { floorId: prismRun.floorId } : null,
        lastPrismResult: null,
        lastLiverDungeonResult: null
      };
    }catch(e){
      console.error('load failed', e);
      return null;
    }
  }

  /* デバッグ用: セーブデータを完全に削除して、キャラ作成画面からやり直す。
   * 取り消せない操作なので、必ず確認ダイアログを挟む。 */
  async function resetGameData(){
    const ok = confirm('セーブデータを完全に削除して、最初からやり直します。この操作は取り消せません。よろしいですか？');
    if(!ok) return;
    try{
      const uid = await ensureAuth();
      // 子テーブルはON DELETE CASCADEで自動的に消えるため、playersの行を消すだけでよい
      await sb.from('players').delete().eq('id', uid);
    }catch(e){ console.error('reset failed', e); }
    state = null;
    inCombat = false; combatPhase = null; combatEnemy = null; combatEnemyHp = 0; pendingDefBuffs = {}; playerStatusEffects = {};
    pendingGacha = null;
    createSelectedLiver = null; createNameDraft = '';
    colosseumView = { loading: true, floor: 1, record: null, isDummy: true };
    render();
  }

  /* デバッグ用: クリスタルは本来「特殊なダンジョン」(未実装)限定のドロップ
   * だが、アクセサリーへの着脱・同種ボーナスなどの動作確認ができるよう、
   * 実装までの繋ぎとしてランダムなクリスタルを直接付与する機能を用意する。 */
  function debugGrantCrystals(){
    for(let i=0;i<3;i++) addItemToInventory(makeCrystal());
    pushLog('デバッグ: テスト用クリスタルを3個入手した。', 'reward');
    saveGame(); render();
  }

  /* ---------------- コロシアムタワー: Supabase I/O ---------------- */
  async function loadColosseumRecord(floor){
    try{
      const { data, error } = await sb.from('colosseum_floors').select('*').eq('floor', floor).maybeSingle();
      if(error || !data || !data.holder_id) return null; // holder不在 = まだ誰も登録していない(ダミー扱い)
      return {
        holderId: data.holder_id, holderName: data.holder_name,
        snapshot: data.snapshot || [], hpPool: data.hp_pool, maxHpPool: data.max_hp_pool,
        wins: data.wins || 0
      };
    }catch(e){ return null; }
  }

  /* 自分宛てに溜まっているメダルを受け取り、自分の所持数に加算する。
   * サーバー側のRPCが加算・ゼロリセットを1トランザクションで行う。 */
  async function claimOwnMailbox(){
    if(!state || !state.playerId) return;
    try{
      const { data, error } = await sb.rpc('claim_colosseum_mailbox');
      if(error){ console.error('claim mailbox failed', error); return; }
      const medals = data || 0;
      if(medals > 0){
        state.colosseum.medals += medals;
        pushLog(`コロシアムの防衛報酬として、メダルを${medals}枚受け取った。`, 'reward');
      }
    }catch(e){ console.error('claim mailbox failed', e); }
  }

  /* ---------------- Logging ----------------
   * skipMain=trueの場合、攻撃・ダメージ・回復量などの「バトルログ」を
   * メインウィンドウ(state.log)には出さず、画面下部の「冒険の記録」
   * (state.history、全件保持)にのみ残す。敵の出現/撃破やキャラの
   * 戦闘不能などの「ステップの変化」はメインウィンドウにも出したいため
   * skipMainを付けない。 */
  /* モバイル表示の「1まとまり」の判定用。render()が呼ばれるたびに区切りを
   * 閉じるので、1回のアクション(例:戦闘勝利時の撃破・経験値・ドロップの
   * 一連のpushLog)はrender()を挟まない限り同じbatchになる。 */
  let historyBatchSeq = 0;
  let historyBatchOpen = false;
  function pushLog(text, cls, skipMain){
    if(!historyBatchOpen){ historyBatchSeq++; historyBatchOpen = true; }
    const entry = {text, cls: cls||'', batch: historyBatchSeq};
    if(!skipMain){
      state.log.push(entry);
      if(state.log.length > 6) state.log = state.log.slice(-6);
    }

    if(!state.history) state.history = [];
    state.history.push(entry);
    if(state.history.length > 100) state.history = state.history.slice(-100);
  }

  /* ---------------- 台詞システム ----------------
   * ライバーごとに設定された任意の台詞を、条件を満たした時にpushLogで
   * 先に流してから、本来のアクションのログを続ける演出。設定していない
   * 項目は何も表示しない(デフォルト未設定)。
   * 発動頻度は台詞ごとにfreq('once'=1戦闘につき1回 / 'always'=毎回)を
   * 持ち、'once'の場合のみfiredMapで戦闘(またはダンジョン探索)単位の
   * 重複発火を防ぐ。敵側(通常の敵・コロシアムタワーの相手など)の行動には
   * 一切紐付けない(常に自分が操作するパーティの行動時にのみ発生する)。 */
  let combatDialogueFired = {}; // startCombat()で戦闘ごとにリセット
  let dungeonItemDialogueFired = {}; // enterDungeon()でダンジョン再突入ごとにリセット
  let lastDamagerId = null; // 直近で敵にダメージを与えた自パーティのliverId(勝利台詞の話者決定に使う)

  function liverDialogues(id){
    const ls = liverState(id);
    return (ls && ls.dialogues) || {};
  }
  function liverDialogueSlot(id, triggerKey){
    const dlgs = liverDialogues(id);
    const slot = triggerKey.startsWith('skill:')
      ? (dlgs.skills && dlgs.skills[triggerKey.slice(6)])
      : dlgs[triggerKey];
    return (slot && slot.text) ? slot : null;
  }
  function playLiverDialogue(id, triggerKey, firedMap){
    if(!id) return;
    const slot = liverDialogueSlot(id, triggerKey);
    if(!slot) return;
    const fireKey = `${id}:${triggerKey}`;
    if(slot.freq !== 'always' && firedMap[fireKey]) return;
    firedMap[fireKey] = true;
    pushLog(`${liverDef(id).name}「${slot.text}」`, 'dialogue');
  }
  /* 台詞タブは「共通」「ジョブ別スキル」をサブタブで切り替える構成の
   * ため、DOM上には常に1サブタブ分の入力欄しか存在しない。サブタブを
   * 切り替える直前と保存ボタン押下時にこの関数を呼び、画面上の行
   * (data-dialogue-row)だけをls.dialoguesへ書き戻す(他のサブタブ分の
   * データは触らないので消えない)。空文字にした行はその項目を削除し、
   * 未設定表示に戻せるようにする。 */
  function commitVisibleDialogueRowsToMemory(){
    const id = state.ui.rosterDetailId;
    const ls = id && liverState(id);
    if(!ls) return;
    if(!ls.dialogues || typeof ls.dialogues !== 'object') ls.dialogues = {};
    if(!ls.dialogues.skills || typeof ls.dialogues.skills !== 'object') ls.dialogues.skills = {};
    document.querySelectorAll('[data-dialogue-row]').forEach(rowEl=>{
      const triggerKey = rowEl.getAttribute('data-dialogue-row');
      const select = rowEl.querySelector('.dialogue-freq-select');
      const freq = (select && select.value === 'always') ? 'always' : 'once';
      const input = rowEl.querySelector('.dialogue-text-input');
      const text = (input ? input.value : '').trim().slice(0, 30);
      const isSkill = triggerKey.startsWith('skill:');
      const bucket = isSkill ? ls.dialogues.skills : ls.dialogues;
      const key = isSkill ? triggerKey.slice(6) : triggerKey;
      if(text){
        bucket[key] = { text, freq };
      } else {
        delete bucket[key];
      }
    });
  }
  /* 台詞タブの保存ボタン。保存後は一時的にstate.ui.dialogueSaveFlashを
   * 立てて「保存しました」を表示し、少し経ったら消す。 */
  function saveLiverDialogues(){
    const id = state.ui.rosterDetailId;
    const ls = id && liverState(id);
    if(!ls) return;
    commitVisibleDialogueRowsToMemory();
    pushLog('台詞設定を保存した。', 'system');
    state.ui.dialogueSaveFlash = true;
    saveGame(); render();
    setTimeout(()=>{ state.ui.dialogueSaveFlash = false; render(); }, 1800);
  }
  /* 台詞タブの「表示頻度を一括変更」。サブタブをまたいだ全トリガー
   * (共通5種+全ジョブの全スキル)のうち、台詞テキストが設定済みの
   * ものだけ頻度を一括で書き換える(未設定の項目には頻度の概念自体が
   * 無いので触らない)。まず画面に見えている行を書き戻してから処理
   * することで、他のサブタブへの切り替えなしに一括変更できる。 */
  function bulkSetDialogueFreq(target){
    const id = state.ui.rosterDetailId;
    const ls = id && liverState(id);
    if(!ls) return;
    commitVisibleDialogueRowsToMemory();
    const freq = target === 'always' ? 'always' : 'once';
    const dlgs = ls.dialogues || {};
    ['victory','itemGet','death','critDeal','critTaken'].forEach(key=>{
      if(dlgs[key] && dlgs[key].text) dlgs[key].freq = freq;
    });
    if(dlgs.skills){
      Object.keys(dlgs.skills).forEach(key=>{
        if(dlgs.skills[key] && dlgs.skills[key].text) dlgs.skills[key].freq = freq;
      });
    }
    pushLog(`台詞の表示頻度を全て「${freq==='always'?'毎回':'1回のみ'}」に変更した。`, 'system');
    state.ui.dialogueSaveFlash = true;
    saveGame(); render();
    setTimeout(()=>{ state.ui.dialogueSaveFlash = false; render(); }, 1800);
  }

  /* ---------------- Core actions ---------------- */
  /* 経験値は「現在就いているジョブ」のレベルにのみ加算される
   * (ジョブごとに個別成長するため)。 */
  function grantExpToParty(amount){
    state.party.forEach(id=>{
      const ls = liverState(id);
      if(ls.hp <= 0) return; // 戦闘不能中のメンバーは経験値を得ない
      const jp = jobProgressFor(id);
      jp.exp += amount;
      while(jp.exp >= expToNext(jp.level)){
        jp.exp -= expToNext(jp.level);
        jp.level += 1;
        recomputeLiverMaxStats(id, true);
        pushLog(`${liverDef(id).name}のレベルが ${jp.level} に上がった。傷が癒えていく。`, 'reward');
        const newSkill = JOB_DEFS[ls.job].skills.find(s=>s.unlockLevel === jp.level);
        if(newSkill){
          pushLog(`${liverDef(id).name}は新しいスキル「${newSkill.name}」を習得した!`, 'reward');
          // 有効スキル枠にまだ空きがあれば、習得したスキルは自動的に有効化する。
          if(jp.loadout.enabled.length < SKILL_LOADOUT_MAX){
            jp.loadout.enabled.push(newSkill.key);
          }
        }
      }
    });
    pushLog(`パーティは経験値を ${amount} 獲得した。`, 'reward');
  }

  function addItemToInventory(item){
    state.inventory.push(item);
    return true;
  }

  /* 戻り値: 実際にアイテム(武器/防具)を入手できた場合はそのitem、
   * それ以外(未ドロップ、ゴールドのみ)はnull。呼び出し側で「アイテムを
   * 手に入れた」ログと台詞(アイテム獲得時)の順序をコントロールするため、
   * アイテム発見時のpushLog自体は呼び出し側の責務とする(ゴールドは
   * 台詞の対象外なのでここで即pushLogして問題ない)。 */
  function maybeDropItem(depth){
    const { dropMult, goldMult } = partyLootMult();
    const dungeonLevel = currentDungeonDef().level;
    let droppedItem = null;
    if(Math.random() < 0.42 * dropMult){
      const type = Math.random() < 0.5 ? 'weapon' : 'armor';
      const item = makeItem(type, dungeonLevel, depth);
      if(addItemToInventory(item)){
        droppedItem = item;
      }
    }
    if(Math.random() < 0.3){
      const g = Math.round((4 + depth*1.5 + Math.random()*6) * goldMult);
      state.gold += g;
      pushLog(`${g}ゴールド手に入れた。`, 'reward');
    }
    return droppedItem;
  }

  function startCombat(enemy){
    inCombat = true;
    combatPhase = 'choice';
    combatEnemy = enemy;
    combatEnemyHp = enemy.hp;
    combatEnemy._maxHp = enemy.maxHp;
    combatEnemy._atk = enemy.atk;
    combatEnemy._def = enemy.def;
    combatEnemy.turnCount = 0;
    combatEnemy.charging = null;
    combatEnemy.statusEffects = {};
    pendingDefBuffs = {};
    playerStatusEffects = {};
    combatPassiveFlags = {};
    combatDialogueFired = {};
    lastDamagerId = null;
    pushLog(`Lv.${enemy.level} ${enemy.name}${enemy.boss?'が行く手を阻んだ！':'が現れた。'}`, 'danger');
    state.party.forEach(id=>{
      const p = equippedPassive(id);
      if(p && p.kind==='battleStartPartyBuff'){
        pushLog(`${liverDef(id).name}のパッシブ「${p.name}」が発動！ パーティ全体の士気が高まった！`, 'system', true);
      }
    });
    render();
  }

  function alivePartyIds(){
    return state.party.filter(id=>liverState(id) && liverState(id).hp > 0);
  }
  function isPartyWiped(){
    return alivePartyIds().length === 0;
  }
  function pickRandomAliveTarget(){
    const alive = alivePartyIds();
    if(!alive.length) return null;
    return alive[Math.floor(Math.random()*alive.length)];
  }

  function chooseFight(){
    if(!inCombat || combatPhase !== 'choice') return;
    combatPhase = 'auto';
    render();
    runAutoBattle();
  }

  /* プレイヤーのターン処理。
   * 有効化されたスキル(loadout.enabled)と通常攻撃を、computeActionRatesで
   * 算出した実発動率に従って毎ターン抽選する。選ばれたスキルのMPが
   * 足りない場合はその場で候補から除外し、残りで再抽選する。
   * kind: 'trueDamageSpell'(防御無視の攻撃) / 'bonusAttack'(追加攻撃)
   *       'defBuff'(次の被弾を軽減) / 'heal'(自己回復)
   */
  function playerTurnActionInner(liverId, silenced){
    const ls = liverState(liverId);
    const name = liverDef(liverId).name;
    const { atkRate, actions } = computeActionRates(liverId);
    const pool = [{action:null, weight: atkRate}];
    if(!silenced){
      actions.forEach(a=>{
        if(a.rate > 0 && ls.mp >= a.skill.mpCost) pool.push({action:a.skill, weight:a.rate});
      });
    }
    const chosen = weightedPick(pool);

    /* 攻撃命中時、りりむの「ばあっ！」等によるMP吸収をログ末尾に追記するための小ヘルパー */
    const drainSuffix = (dmg) => {
      const drained = applyOnHitMpDrain(liverId, dmg);
      return drained > 0 ? ` (MP+${drained})` : '';
    };

    const affixMult = weaponAffixDamageMult(liverId);

    if(!chosen){
      if(rollCrit(liverId)){
        const dmg = Math.max(1, Math.round(combatAtk(liverId) * CRIT_MULT * affixMult) + rnd(-1,3));
        combatEnemyHp -= dmg;
        lastDamagerId = liverId;
        playLiverDialogue(liverId, 'critDeal', combatDialogueFired);
        pushLog(`${name}の攻撃が会心の一撃となった！ ${combatEnemy.name}に防御を貫く ${dmg} の大ダメージ！${drainSuffix(dmg)}`, 'reward', true);
        return;
      }
      const dmg = Math.max(1, Math.round((combatAtk(liverId) - effectiveEnemyDef()) * affixMult) + rnd(-1,2));
      combatEnemyHp -= dmg;
      lastDamagerId = liverId;
      pushLog(`${name}の攻撃！ ${combatEnemy.name}に ${dmg} のダメージ。${drainSuffix(dmg)}`, 'combat', true);
      return;
    }

    const mpCost = Math.max(0, Math.round(chosen.mpCost * passiveStatMult(liverId,'mpCost') * partyMpCostMult()));
    ls.mp -= mpCost;

    if(chosen.effects){
      // 新方式: 複合効果スキル。効果を順に解決する(旧kind形式との判定は排他)。
      playLiverDialogue(liverId, 'skill:'+chosen.key, combatDialogueFired);
      pushLog(`${name}の「${chosen.name}」！(MP-${mpCost})`, 'combat', true);
      chosen.effects.forEach(effect => resolveEffect(effect, false, liverId));
      return;
    }

    if(chosen.kind === 'trueDamageSpell'){
      const dmg = Math.max(1, Math.round(combatAtk(liverId)*chosen.mult*affixMult) + rnd(-1,3));
      combatEnemyHp -= dmg;
      pushLog(`${name}の「${chosen.name}」！ 防御を貫く ${dmg} のダメージ。(MP-${mpCost})${drainSuffix(dmg)}`, 'combat', true);
      return;
    }
    if(chosen.kind === 'element'){
      const isWeak = combatEnemy.weakness === chosen.element;
      const mult = isWeak ? chosen.weaknessMult : chosen.offMult;
      const dmg = Math.max(1, Math.round((combatAtk(liverId) - effectiveEnemyDef()) * mult) + rnd(-1,2));
      combatEnemyHp -= dmg;
      const elLabel = ELEMENT_LABELS[chosen.element] || '';
      pushLog(
        (isWeak
          ? `${name}の「${chosen.name}」！ 弱点(${elLabel})を突き、${dmg} のダメージ！(MP-${mpCost})`
          : `${name}の「${chosen.name}」！ ${dmg} のダメージ(弱点不一致)。(MP-${mpCost})`) + drainSuffix(dmg),
        isWeak ? 'reward' : 'combat',
        true
      );
      return;
    }
    if(chosen.kind === 'bonusAttack'){
      const dmg1 = Math.max(1, Math.round((combatAtk(liverId) - effectiveEnemyDef()) * affixMult) + rnd(-1,2));
      const dmg2 = Math.max(1, Math.round((Math.round(combatAtk(liverId)*0.6) - Math.round(effectiveEnemyDef()*0.5)) * affixMult) + rnd(-1,2));
      combatEnemyHp -= (dmg1+dmg2);
      pushLog(`${name}の「${chosen.name}」！ ${dmg1}+${dmg2} の連続攻撃。(MP-${mpCost})${drainSuffix(dmg1+dmg2)}`, 'combat', true);
      return;
    }
    if(chosen.kind === 'defBuff'){
      pendingDefBuffs[liverId] = chosen.reduceMult || 0.6;
      const dmg = Math.max(1, Math.round((combatAtk(liverId) - effectiveEnemyDef()) * affixMult) + rnd(-1,2));
      combatEnemyHp -= dmg;
      pushLog(`${name}の「${chosen.name}」！ 身構えながら ${dmg} のダメージ。次の攻撃に備える。(MP-${mpCost})${drainSuffix(dmg)}`, 'combat', true);
      return;
    }
    if(chosen.kind === 'heal'){
      const heal = Math.round(ls.maxHp*chosen.healMult);
      ls.hp = Math.min(ls.maxHp, ls.hp+heal);
      pushLog(`${name}の「${chosen.name}」！ HPが ${heal} 回復した。(MP-${mpCost})`, 'reward', true);
      return;
    }
  }

  function playerTurnAction(liverId){
    const ls = liverState(liverId);
    const name = liverDef(liverId).name;
    const effects = playerStatusEffects[liverId];
    const stunned = !!(effects && effects.stun);
    const silenced = !!(effects && effects.silence);
    if(stunned){
      pushLog(`${name}はまだ動けない！`, 'system', true);
    } else {
      playerTurnActionInner(liverId, silenced);
    }
    tickStatusEffects(effects,
      (type, eff)=>{
        if(type === 'poison'){
          const dmg = Math.max(1, Math.round(ls.maxHp * eff.amount));
          ls.hp = Math.max(0, ls.hp - dmg);
          pushLog(`${name}は毒のダメージを受けた。(-${dmg})`, 'danger', true);
          checkLiverKO(liverId);
        }
      },
      (type)=>{
        pushLog(`${name}の「${statusEffectLabel(type)}」の効果が切れた。`, 'system', true);
      }
    );
  }

  function applyDamageToLiver(liverId, rawDmg, element){
    const ls = liverState(liverId);
    let dmg = rawDmg;
    if(element){
      dmg = Math.max(1, Math.round(dmg * liverElementalMultiplier(liverId, element)));
    }
    const passive = equippedPassive(liverId);
    if(passive && passive.kind === 'lowHpMitigate' && ls.maxHp > 0 && (ls.hp/ls.maxHp) <= passive.threshold){
      dmg = Math.max(1, Math.round(dmg * passive.mult));
      if(!combatPassiveFlags[liverId]) combatPassiveFlags[liverId] = {};
      if(!combatPassiveFlags[liverId].lowHpLogged){
        combatPassiveFlags[liverId].lowHpLogged = true;
        pushLog(`${liverDef(liverId).name}のパッシブ「${passive.name}」が発動！ 傷ついた体に力が漲り、ダメージが軽減された！`, 'system', true);
      }
    }
    if(pendingDefBuffs[liverId]){
      dmg = Math.max(1, Math.round(dmg*pendingDefBuffs[liverId]));
      delete pendingDefBuffs[liverId];
    }
    ls.hp = Math.max(0, ls.hp - dmg);
    return dmg;
  }

  /* 敵のターン処理。
   * 1) 前ターンに「予告」していた大技があれば、ここで確定発動(防御力無視)
   * 2) なければ通常通りターン数を数え、条件に合うスキルを判定
   *    - trueDamage   : このターンに即、防御力無視の大ダメージ
   *    - telegraphed  : このターンは攻撃せず予告のみ。次ターンに(1)で発動
   * 3) どちらでもなければ通常攻撃
   * いずれの被弾もapplyDamageToPlayerを通し、タンクの防御バフ・プレイヤーの
   * 属性耐性(スキルにelementが設定されている場合のみ)を反映する。
   * 通常攻撃には属性を持たせていないため、耐性の影響を受けない。
   */
  /* 敵のターン処理の本体。実際の呼び出しはenemyTurnDamage()経由で、
   * どの分岐を通っても最後に必ず自身の継続効果(自己バフ等)がtickされる。 */
  function enemyTurnDamageInner(){
    combatEnemy.turnCount = (combatEnemy.turnCount||0) + 1;
    let target = pickRandomAliveTarget();
    if(!target) return; // 全滅済み(念のため)
    target = applyCoverRedirect(target);
    const targetName = liverDef(target).name;

    if(combatEnemy.charging){
      const skill = combatEnemy.charging;
      combatEnemy.charging = null;
      const raw = Math.max(1, Math.round(effectiveEnemyAtk() * skill.mult) + rnd(-1,2));
      const dmg = applyDamageToLiver(target, raw, skill.element);
      pushLog(`${(skill.executeText || (combatEnemy.name+'の渾身の一撃！')).replace('{name}', combatEnemy.name)} ${targetName}が ${dmg} のダメージを受けた。`, 'danger', true);
      checkLiverKO(target);
      return;
    }

    const skills = combatEnemy.skills || [];
    const triggered = skills.find(s => s.everyNTurns && combatEnemy.turnCount % s.everyNTurns === 0);
    if(triggered){
      if(triggered.effects){
        // 新方式: 複合効果スキル。このターンは他の行動を取らず、効果を順に解決する。
        pushLog((triggered.announceText || `${combatEnemy.name}の「${triggered.name}」！`).replace('{name}', combatEnemy.name), 'danger', true);
        triggered.effects.forEach(effect => resolveEffect(effect, true));
        return;
      }
      if(triggered.kind === 'telegraphed'){
        combatEnemy.charging = triggered;
        pushLog((triggered.warnText || `${combatEnemy.name}が力を溜めている……`).replace('{name}', combatEnemy.name), 'system');
        return;
      }
      const raw = Math.max(1, Math.round(effectiveEnemyAtk() * triggered.mult) + rnd(-1,2));
      const dmg = applyDamageToLiver(target, raw, triggered.element);
      pushLog(`${combatEnemy.name}の「${triggered.name}」！ ${targetName}が防御を貫く ${dmg} の痛恨の一撃を受けた！`, 'danger', true);
      checkLiverKO(target);
      return;
    }

    if(rollCrit(null)){
      const raw = Math.max(1, Math.round(effectiveEnemyAtk() * CRIT_MULT) + rnd(-1,2));
      const dmg = applyDamageToLiver(target, raw);
      playLiverDialogue(target, 'critTaken', combatDialogueFired);
      pushLog(`${combatEnemy.name}の痛恨の一撃！ ${targetName}が防御を貫く ${dmg} の大ダメージを受けた！`, 'danger', true);
      checkLiverKO(target);
      return;
    }

    const raw = Math.max(1, effectiveEnemyAtk() - liverDefStat(target) + rnd(-1,1));
    const dmg = applyDamageToLiver(target, raw);
    pushLog(`${combatEnemy.name}の反撃、${targetName}が ${dmg} のダメージを受けた。`, 'danger', true);
    checkLiverKO(target);
  }

  function enemyTurnDamage(){
    enemyTurnDamageInner();
    if(!combatEnemy) return; // 反撃等で戦闘が終了した場合は何もしない
    tickStatusEffects(combatEnemy.statusEffects,
      (type, eff)=>{
        if(type === 'regen'){
          const heal = Math.max(1, Math.round(combatEnemy._maxHp * eff.amount));
          combatEnemyHp = Math.min(combatEnemy._maxHp, combatEnemyHp + heal);
          pushLog(`${combatEnemy.name}は自身の傷を癒やした。(+${heal})`, 'system', true);
        }
      },
      (type)=>{
        pushLog(`${combatEnemy.name}の「${statusEffectLabel(type)}」の効果が切れた。`, 'system', true);
      }
    );
  }

  function checkLiverKO(liverId){
    if(liverState(liverId).hp <= 0){
      playLiverDialogue(liverId, 'death', combatDialogueFired);
      pushLog(`${liverDef(liverId).name}が倒れた……！`, 'danger');
      state.party.forEach(otherId=>{
        if(otherId === liverId) return;
        const otherLs = liverState(otherId);
        if(!otherLs || otherLs.hp <= 0) return;
        const passive = equippedPassive(otherId);
        if(!passive || passive.kind !== 'allyDownRage') return;
        if(!combatPassiveFlags[otherId]) combatPassiveFlags[otherId] = {};
        if(!combatPassiveFlags[otherId].rageActive){
          combatPassiveFlags[otherId].rageActive = true;
          pushLog(`${liverDef(otherId).name}のパッシブ「${passive.name}」が発動！ 怒りに燃え、攻撃力が上昇した！`, 'system', true);
        }
      });
    }
  }

  function checkPartyDefeated(){
    if(isPartyWiped()){
      handleDefeat();
      return true;
    }
    return false;
  }

  async function runAutoBattle(){
    while(inCombat && combatPhase === 'auto'){
      await sleep(550);
      if(!inCombat || combatPhase !== 'auto') return;

      maybeTriggerFairyBoon();
      render();

      // パーティ全員が(生存していれば)順番に行動する。1人ずつログを反映してから
      // 少し間を置くことで、誰が何をしたのか追いやすくする。
      for(const id of state.party){
        if(!inCombat || combatPhase !== 'auto') return;
        if(liverState(id).hp <= 0) continue; // 戦闘不能者はスキップ
        playerTurnAction(id);
        notifyAllyActed(id);
        render();
        if(combatEnemyHp <= 0) break;
        if(checkPartyDefeated()) return; // 毒などの継続ダメージで全滅した場合はここで終了
        await sleep(280);
        if(!inCombat || combatPhase !== 'auto') return;
      }

      if(combatEnemyHp <= 0){
        playLiverDialogue(lastDamagerId, 'victory', combatDialogueFired);
        if(combatEnemy.isColosseum){
          await resolveColosseumVictory();
          return;
        }
        if(combatEnemy.isTowerFight){
          pushLog(`${combatEnemy.name}を倒した。`, 'reward');
          state.towerRun.floor += 1;
          inCombat = false; combatPhase = null; combatEnemy = null;
          if(state.towerRun.floor >= TOWER_MAX_FLOOR){
            pushLog(`${currentTowerDef().name}を完全踏破した！`, 'reward');
            resolveTowerRunEnd();
            return;
          }
          saveGame(); render();
          return;
        }
        pushLog(`${combatEnemy.name}を倒した。`, 'reward');
        grantExpToParty(combatEnemy.exp);

        if(combatEnemy.isLiverQuest){
          resolveLiverDungeonVictory(liverDungeonStageById(combatEnemy.liverQuestId));
          return;
        }

        const ds = currentDungeonState();
        const dungeonDefForVictory = currentDungeonDef();

        if(dungeonDefForVictory && dungeonDefForVictory.isPrismTower){
          if(combatEnemy.isPrismBoss){
            resolvePrismBossVictory(dungeonDefForVictory, ds);
            return;
          }
          if(combatEnemy.isMimic){
            const drop = prismRollEquip(['rare','epic'], dungeonDefForVictory.floorNum);
            if(addItemToInventory(drop)) pushLog(`ミミックを退け、「${drop.name}」を手に入れた！`, 'reward');
          } else {
            maybeDropPrismItem(dungeonDefForVictory.floorNum);
          }
          if(combatEnemy.pendingProgressOnWin) addDungeonProgress(PROGRESS_PER_STEP);
          inCombat = false; combatPhase = null; combatEnemy = null;
          saveGame(); render();
          return;
        }

        const wonItem = maybeDropItem(ds.depth);
        if(wonItem) pushLog(`「${wonItem.name}」を手に入れた。`, 'reward');

        if(combatEnemy.isDungeonBoss){
          const dungeonDef = currentDungeonDef();
          if(!ds.cleared){
            ds.cleared = true;
            pushLog(`${dungeonDef.name}を踏破した！`, 'reward');
            const firstItem = firstClearRewardFor(state.activeDungeonId);
            if(addItemToInventory(firstItem)){
              pushLog(`初回撃破報酬として「${firstItem.name}」を手に入れた。`, 'reward');
            }
            state.destinyTickets += 1;
            pushLog(`初回撃破報酬として「運命のチケット」を手に入れた。`, 'reward');
            DUNGEON_DEFS.filter(d=>d.requires===state.activeDungeonId).forEach(d=>{
              pushLog(`新たな地が解放された:「${d.name}」`, 'reward');
            });
          } else {
            pushLog(`${combatEnemy.name}を再び打ち破った。`, 'reward');
          }
          ds.bossKillCount = (ds.bossKillCount||0) + 1;
          ds.progress = 0; // ボス撃破のたびに踏破率はリセットし、また潜り直す必要がある

          if(dungeonDef.id === 'tutorial' && !state.tutorialDone){
            state.tutorialDone = true;
            state.screen = 'town';
            pushLog('見習いの試練を突破した！ 「召喚」で運命のチケットを使ってみよう。', 'reward');
          }
        } else if(combatEnemy.pendingProgressOnWin){
          addDungeonProgress(PROGRESS_PER_STEP);
        }

        inCombat = false; combatPhase = null; combatEnemy = null;
        saveGame(); render();
        return;
      }

      await sleep(550);
      if(!inCombat || combatPhase !== 'auto') return;

      enemyTurnDamage();
      render();
      if(checkPartyDefeated()) return;
      // 注意: ここでは意図的にsaveGame()を呼ばない。ラウンドごとに保存すると
      // 通信回数が戦闘の長さに比例して膨らむため、保存は「戦闘の決着がついた
      // 瞬間(勝利/敗北/撤退)」にまとめて1回だけ行う設計にしている。
      // トレードオフとして、戦闘の途中でブラウザが落ちた場合はそのラウンドの
      // 進行(HP/MPの増減など)が失われる可能性があるが、1戦闘は数秒〜十数秒
      // 程度なのでリスクは小さいと判断している。
    }
  }

  /* ---------------- コロシアムタワー: 画面キャッシュ・入室・挑戦 ---------------- */
  let colosseumView = { loading: true, floor: 1, record: null, isDummy: true };

  async function refreshColosseumView(){
    const floor = state.colosseum.floorRight;
    colosseumView = { loading: true, floor, record: null, isDummy: true };
    render();
    let record = await loadColosseumRecord(floor);
    let isDummy = false;
    if(!record){ record = buildDummyGatekeeper(floor); isDummy = true; }
    colosseumView = { loading: false, floor, record, isDummy };
    render();
  }

  async function gotoColosseum(){
    if(inCombat) return;
    state.screen = 'colosseum';
    saveGame(); render();
    await claimOwnMailbox();
    await refreshColosseumView();
  }

  async function challengeColosseum(){
    if(inCombat) return;
    if(!state.party.length){
      pushLog('パーティが編成されていない。町で編成してから挑もう。', 'system');
      render();
      return;
    }
    const now = Date.now();
    const remain = COLOSSEUM_COOLDOWN_MS - (now - (state.colosseum.lastChallengeAt||0));
    if(remain > 0) return; // ボタン側でも無効化しているが念のため

    // クールタイム表示はすぐに反映するが、実際の保存はresolve_colosseum_battle
    // RPC(戦闘決着時)にまとめて任せる。
    state.colosseum.lastChallengeAt = now;
    render();

    const floor = state.colosseum.floorRight;
    let record = await loadColosseumRecord(floor);
    let isDummy = false;
    if(!record){
      record = buildDummyGatekeeper(floor);
      isDummy = true;
    }
    const agg = aggregateSnapshotStats(record.snapshot);

    // 挑戦者側は毎回全回復した状態で挑む(門番側だけがダメージを引き継ぐ)
    state.party.forEach(id=>{
      const ls = liverState(id);
      ls.hp = ls.maxHp; ls.mp = ls.maxMp;
    });

    const enemy = {
      name: record.holderName || `${floor}Fの門番`,
      level: agg.level,
      hp: record.hpPool, maxHp: record.maxHpPool,
      atk: agg.atk, def: agg.def,
      exp: 0, boss: true,
      skills: [{key:'crit', name:'連携の一撃', everyNTurns:4, kind:'trueDamage', mult:2.0}],
      weakness: null,
      isColosseum: true,
      colosseumFloor: floor,
      colosseumHolderId: isDummy ? null : record.holderId,
      colosseumIsDummy: isDummy,
      colosseumSnapshot: record.snapshot,
      colosseumMaxHpPool: record.maxHpPool,
      colosseumWins: record.wins || 0,
      colosseumStartHp: record.hpPool // 今回の挑戦開始時点でのダメージ計算の基準値
    };
    startCombat(enemy);
  }

  async function resolveColosseumVictory(){
    const floor = combatEnemy.colosseumFloor;
    const enemyName = combatEnemy.name;
    const damageDealt = Math.max(0, combatEnemy.colosseumStartHp - Math.max(0, combatEnemyHp));
    const snapshot = buildPartySnapshot();
    const maxHpPool = snapshot.reduce((s,m)=>s+m.maxHp, 0);

    const { data, error } = await sb.rpc('resolve_colosseum_battle', {
      p_floor: floor, p_damage_dealt: damageDealt, p_won: true,
      p_new_snapshot: snapshot, p_new_max_hp_pool: maxHpPool
    });
    if(error){
      console.error('resolve_colosseum_battle(win) failed', error);
      pushLog('サーバーとの通信に失敗した。もう一度試してほしい。', 'danger');
      inCombat = false; combatPhase = null; combatEnemy = null;
      render();
      return;
    }
    const medals = (data && data.medals_gained) || (floor >= COLOSSEUM_FLOORS ? 50 : 1);
    state.colosseum.medals += medals;
    if(floor < COLOSSEUM_FLOORS){
      state.colosseum.floorRight = floor + 1;
      pushLog(`${enemyName}を打ち破り、コロシアム${floor}Fの門番の座を奪った！(メダル+${medals})`, 'reward');
    } else {
      pushLog(`${enemyName}を打ち破り、コロシアムタワー${COLOSSEUM_FLOORS}Fを制覇した！(メダル+${medals})`, 'reward');
    }

    inCombat = false; combatPhase = null; combatEnemy = null;
    render();
    await refreshColosseumView();
  }

  /* 敗北時は、与えたダメージ(永続)と防衛勝利のカウント、メールボックスへの
   * メダル加算を、すべてサーバー側のRPC(1トランザクション)で処理する。
   * 1F以外での敗北は挑戦権を1Fへ戻す。ダミー相手の敗北は何も永続化しない。 */
  async function resolveColosseumDefeat(ctx){
    const damageDealt = Math.max(0, ctx.startHp - ctx.remainingHp);

    const { error } = await sb.rpc('resolve_colosseum_battle', {
      p_floor: ctx.floor, p_damage_dealt: damageDealt, p_won: false
    });
    if(error) console.error('resolve_colosseum_battle(lose) failed', error);

    if(ctx.floor > 1){
      state.colosseum.floorRight = 1;
      pushLog(`コロシアム${ctx.floor}Fの門番に敗れた。挑戦権が1Fに戻された。`, 'danger');
    } else {
      pushLog(`コロシアム1Fの門番に敗れた。`, 'danger');
    }
    if(!ctx.isDummy && ctx.holderId === state.playerId){
      // 自分自身が持つ記録に挑んで負けた特殊ケース。サーバー側で自分に加算済みなのでローカルにも反映
      state.colosseum.medals += ctx.floor;
    }

    saveGame();
    await refreshColosseumView();
  }

  function fleeCombat(){
    if(!inCombat || combatPhase !== 'choice') return;
    if(Math.random() < 0.6){
      pushLog('なんとか逃げ出した。', 'system');
      inCombat = false; combatPhase = null; combatEnemy = null;
      saveGame(); render();
    }else{
      pushLog('逃げられなかった！', 'danger');
      enemyTurnDamage();
      if(checkPartyDefeated()) return;
      saveGame(); render();
    }
  }

  function handleDefeat(){
    const wasColosseum = combatEnemy && combatEnemy.isColosseum;
    const colosseumCtx = wasColosseum ? {
      floor: combatEnemy.colosseumFloor,
      holderId: combatEnemy.colosseumHolderId,
      holderName: combatEnemy.name,
      isDummy: combatEnemy.colosseumIsDummy,
      snapshot: combatEnemy.colosseumSnapshot,
      maxHpPool: combatEnemy.colosseumMaxHpPool,
      wins: combatEnemy.colosseumWins,
      startHp: combatEnemy.colosseumStartHp,
      remainingHp: Math.max(0, combatEnemyHp)
    } : null;

    inCombat = false; combatPhase = null; combatEnemy = null;
    state.party.forEach(id=>{
      const ls = liverState(id);
      ls.hp = ls.maxHp; // 全滅後、傷は癒えている
      ls.mp = ls.maxMp;
    });

    if(wasColosseum){
      resolveColosseumDefeat(colosseumCtx); // 非同期(fire-and-forget)。結果は再描画時に反映
      render();
      return;
    }

    if(state.towerRun){
      resolveTowerRunEnd(); // 塔は独自の報酬経済を持つため、通常の所持金ロストは発生させない
      return;
    }

    if(state.prismRun){
      // プリズムタワーは救済措置なし(通常の全滅ペナルティをそのまま適用する)。
      // ただし退出時ルールに従い、踏破率・深度だけは必ず0に戻す。
      const ds = currentDungeonState();
      if(ds){ ds.progress = 0; ds.depth = 0; }
      state.prismRun = null;
    }

    if(state.activeDungeonId === 'tutorial' && !state.tutorialDone){
      state.tutorialDone = true;
      state.destinyTickets += 1;
    }

    const lost = Math.round(state.gold * 0.2);
    state.gold -= lost;
    state.pendingDefeatGoldLoss = lost;
    state.screen = 'dead';
    saveGame(); render();
  }

  function returnToTownAfterDeath(){
    state.pendingDefeatGoldLoss = 0;
    state.screen = 'town';
    saveGame(); render();
  }

  function advance(){
    if(inCombat) return;
    const dungeonDef = currentDungeonDef();
    const ds = currentDungeonState();
    if(!dungeonDef || !ds) return;
    if(!alivePartyIds().length) return; // 全員戦闘不能では進めない
    if(dungeonDef.isPrismTower){ prismAdvance(dungeonDef, ds); return; }
    recomputeStamina();
    if(state.stamina < 1){
      pushLog('スタミナが足りない。時間経過で回復するのを待とう。', 'system');
      render();
      return;
    }
    state.stamina -= 1;
    // 踏破率が100%に達したら深度のカウントは止める。これが装備・敵の強さの
    // 上限になる(ボス撃破でprogressは0に戻るが、depthは戻さないので、
    // 一度上限に達したダンジョンはそれ以降ずっと同じ上限のまま)。
    if(ds.progress < 100) ds.depth += 1;
    const roll = Math.random();

    if(roll < 0.70){
      const enemy = spawnEnemy(dungeonDef, ds.depth, false);
      enemy.pendingProgressOnWin = true;
      startCombat(enemy);
    } else if(roll < 0.80){
      let healText = [];
      state.party.forEach(id=>{
        const ls = liverState(id);
        if(ls.hp<=0) return;
        const heal = Math.round(ls.maxHp*0.15);
        const mpHeal = Math.round(ls.maxMp*0.15);
        ls.hp = Math.min(ls.maxHp, ls.hp+heal);
        ls.mp = Math.min(ls.maxMp, ls.mp+mpHeal);
      });
      pushLog(`静かな小部屋で一息ついた。パーティのHP・MPが少し回復した。`, 'system');
      addDungeonProgress(PROGRESS_PER_STEP);
      saveGame(); render();
    } else if(roll < 0.95){
      const foundItem = maybeDropItem(ds.depth);
      if(foundItem && state.party.length){
        const speaker = state.party[Math.floor(Math.random()*state.party.length)];
        playLiverDialogue(speaker, 'itemGet', dungeonItemDialogueFired);
      }
      if(foundItem) pushLog(`「${foundItem.name}」を手に入れた。`, 'reward');
      if(state.log.length===0 || state.log[state.log.length-1].text.indexOf('見つけ')<0){
        pushLog('崩れた棚の奥に何かが残っていた。', 'system');
      }
      addDungeonProgress(PROGRESS_PER_STEP);
      saveGame(); render();
    } else {
      const target = pickRandomAliveTarget();
      if(target){
        const ls = liverState(target);
        /* 罠の威力は周回で際限なく伸びるdepthではなく、そのダンジョンの
         * レベル帯(=同レベル帯の敵の通常攻撃力)を基準にする。これにより
         * 低レベルダンジョンでは弱く、高レベルダンジョンでは強くなる
         * (敵の強さと同じ物差しでスケールする)。振れ幅は乱数で持たせる。 */
        const enemyAtk = statsForLevel(dungeonDef.level).atk;
        const dmg = Math.max(1, Math.round(enemyAtk * (0.4 + Math.random()*0.3)));
        ls.hp = Math.max(1, ls.hp - dmg);
        pushLog(`罠にかかった。${liverDef(target).name}が ${dmg} のダメージ。`, 'danger');
      }
      addDungeonProgress(PROGRESS_PER_STEP);
      saveGame(); render();
    }
  }

  function challengeBoss(){
    if(inCombat || !alivePartyIds().length) return;
    const dungeonDef = currentDungeonDef();
    const ds = currentDungeonState();
    if(!dungeonDef || !ds || ds.progress < 100) return;
    if(dungeonDef.isPrismTower){
      const enemy = spawnEnemy(dungeonDef, ds.depth, true);
      enemy.isPrismBoss = true;
      startCombat(enemy);
      return;
    }
    recomputeStamina();
    if(state.stamina < 1){
      pushLog('スタミナが足りない。時間経過で回復するのを待とう。', 'system');
      render();
      return;
    }
    state.stamina -= 1;
    const enemy = spawnEnemy(dungeonDef, ds.depth, true);
    enemy.isDungeonBoss = true;
    startCombat(enemy);
  }

  /* プリズムタワー内の探索1手。通常ダンジョンのadvance()と違い、
   * スタミナは突入時にまとめて消費済みのためここでは消費しない。
   * イベント確率: 戦闘80%/素材宝箱15%/装備品宝箱4%/ミミック1%。 */
  function prismAdvance(dungeonDef, ds){
    if(ds.progress < 100) ds.depth += 1;
    const roll = Math.random();
    if(roll < 0.80){
      const enemy = spawnEnemy(dungeonDef, ds.depth, false);
      enemy.pendingProgressOnWin = true;
      startCombat(enemy);
    } else if(roll < 0.95){
      grantPrismMaterial(1);
      pushLog(`宝箱から「${MATERIAL_DEFS[PRISM_MATERIAL_KEY].name}」を見つけた！`, 'reward');
      addDungeonProgress(PROGRESS_PER_STEP);
      saveGame(); render();
    } else if(roll < 0.99){
      // この宝箱は「確定ドロップ」というだけで、レア目枠のような偏りの
      // 指定は無いため、通常の(4段階の重み付きに従う)抽選をそのまま使う。
      const item = prismRollEquip(Object.keys(RARITY).filter(k=>k!=='unique'), dungeonDef.floorNum);
      if(addItemToInventory(item)) pushLog(`宝箱から「${item.name}」を見つけた！`, 'reward');
      addDungeonProgress(PROGRESS_PER_STEP);
      saveGame(); render();
    } else {
      const mimic = spawnPrismMimic(dungeonDef);
      mimic.pendingProgressOnWin = true;
      startMimicCombat(mimic);
    }
  }

  /* ミミック: 見た目は宝箱だが、その階のボス級の戦闘力を持つ特殊な敵。
   * 戦闘開始と同時に(プレイヤーが行動する前に)確率無視の状態異常を
   * 1つ確定で刻んでくる。撃破時は必ず高レアリティ枠の装備品を落とす。 */
  function spawnPrismMimic(dungeonDef){
