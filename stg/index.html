          <span class="inv-item-name">${esc(def.name)}${inParty?' <span style="color:var(--gold);font-size:11px;">(編成中)</span>':''} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">Lv.${jp.level} ・ ${esc(job.name)} ・ <span style="color:var(--gold);">戦闘力 ${combatPower(def.id)}</span></span></span>
        </div>`;
    }).join('');

    const sortSelectHtml = `<select id="rosterSortSelect" style="margin-left:auto;min-width:0;flex:0 1 auto;font-size:11px;padding:4px 4px;background:var(--win-bg-1);color:var(--text-primary);border:1px solid var(--win-border);">${ROSTER_SORT_OPTIONS.map(o=>`<option value="${o.value}" ${sortMode===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;

    return `
      <div class="scene-text">
        ${sceneHeadingHtml('ライバー', helpButtonHtml('roster'))}
      </div>
      <div class="actions"><button id="backTownBtn">町に戻る</button>${sortSelectHtml}</div>
      <div class="section-block">
        ${rows}
      </div>
    `;
  }

  /* クリスタルスロットの使用状況を、数字だけでなく一目でわかる四角の
   * 目盛り(ピップ)としても表示する。1マス=スロット1消費分。 */
  function renderSlotPips(total, used){
    if(total <= 0) return `<span style="color:var(--text-muted);font-size:11px;">(スロット無し)</span>`;
    let html = '';
    for(let i=0;i<total;i++){
      const filled = i < used;
      html += `<span style="display:inline-block;width:9px;height:9px;margin-right:2px;border:1px solid var(--win-border);background:${filled?'var(--gold)':'transparent'};vertical-align:middle;"></span>`;
    }
    return html;
  }

  function renderLiverDetailInner(){
    const id = state.ui.rosterDetailId;
    const def = id && liverDef(id);
    if(!def) return renderRosterInner();

    const ls = liverState(id);
    const unlocked = ls.unlocked;
    const jp = jobProgressFor(id);
    const job = JOB_DEFS[ls.job];
    const inParty = state.party.includes(id);
    const weapon = ls.equipped.weapon;
    const armor = ls.equipped.armor;
    const accessory = ls.equipped.accessory;

    const { atkRate, actions } = computeActionRates(id);
    const actualRateOf = key => {
      const found = actions.find(a=>a.skill.key===key);
      return found ? Math.round(found.rate) : 0;
    };

    const jobSwitchHtml = Object.keys(JOB_DEFS).map(jobId=>`
      <button data-switch-liver-job="${id}:${jobId}" ${(ls.job===jobId||!unlocked)?'disabled':''} style="padding:3px 9px;font-size:11px;">${ls.job===jobId?'◆ ':''}${esc(JOB_DEFS[jobId].name)}</button>`).join('');

    const currentCostumeKey = equippedCostumeKey(id);
    const unlockedCostumeKeys = ls.unlockedCostumes || [defaultCostumeKeyFor(id)];
    const costumeSwitchHtml = costumeDefsFor(id).map(c=>{
      const isCurrent = c.key === currentCostumeKey;
      const isCostumeUnlocked = unlockedCostumeKeys.includes(c.key);
      if(!isCostumeUnlocked){
        return `<button disabled style="padding:3px 9px;font-size:11px;opacity:.45;">${uiIcon('lock')} ${esc(c.name)}</button>`;
      }
      return `<button data-switch-liver-costume="${id}:${c.key}" ${(isCurrent||!unlocked)?'disabled':''} style="padding:3px 9px;font-size:11px;">${isCurrent?'◆ ':''}${esc(c.name)}</button>`;
    }).join('');

    const atkRow = `
      <div class="inv-item" style="border-left-color:var(--text-muted);opacity:.85;">
        <span class="inv-item-name">通常攻撃 <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">(常時習得済み・下限50%)</span></span>
        <span class="inv-item-actions">
          <span style="font-family:var(--font-mono);font-size:12px;color:var(--gold);">${Math.round(atkRate)}%</span>
        </span>
      </div>`;

    const passive = equippedPassive(id);
    const passiveRow = passive ? `
      <div class="inv-item" style="border-left-color:${def.color};">
        <span class="inv-item-name">
          ${esc(passive.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">(${passive.always?'常時発動':'条件付き発動'})</span><br>
          <span style="color:var(--text-muted);font-size:11px;">${esc(passive.desc)}</span>
        </span>
      </div>` : '<p class="inv-empty">なし</p>';

    const skillRows = job.skills.map(s=>{
      const skillUnlocked = jp.level >= (s.unlockLevel||1);
      if(!skillUnlocked){
        return `
          <div class="inv-item" style="opacity:.4;">
            <span class="inv-item-name">
              ${uiIcon('lock')} ${esc(s.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">Lv.${s.unlockLevel}で習得</span><br>
              <span style="color:var(--text-muted);font-size:11px;">${esc(s.desc)}</span>
            </span>
          </div>`;
      }
      const enabled = jp.loadout.enabled.includes(s.key);
      return `
        <div class="inv-item" style="${enabled?'':'opacity:.5;'}">
          <span class="inv-item-name">
            ${esc(s.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">(${s.element?`${ELEMENT_LABELS[s.element]}属性 ・ `:''}MP${s.mpCost} ・ 発動率${s.baseRate}%${enabled?` → 実質${actualRateOf(s.key)}%`:''})</span><br>
            <span style="color:var(--text-muted);font-size:11px;">${esc(s.desc)}</span>
          </span>
          ${unlocked ? `<span class="inv-item-actions"><button data-toggle-skill="${id}:${s.key}">${enabled?'無効化':'有効化'}</button></span>` : ''}
        </div>`;
    }).join('');

    /* クリスタルは所持品扱いの独立セクションではなく、装備中のアクセサリー
     * の真下にぶら下がる形で表示する(「アクセサリーに付属するもの」だと
     * 一目でわかるように)。スロット使用量は数字だけでなく目盛り(ピップ)
     * でも表す。 */
    const crystalSocketsHtml = (unlocked && accessory) ? (() => {
      const crystals = accessory.crystals || [];
      const used = crystals.reduce((s,c)=>s+(c.slotCost||0), 0);
      const total = accessory.slotCount || 0;
      const rows = crystals.length ? crystals.map((c,idx)=>`
        <div class="inv-item ${c.rarityLabel}" style="margin-top:4px;" title="${esc(itemDetailText(c))}">
          <span class="inv-item-name">${esc(c.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(itemValueLabel(c))}</span></span>
          <span class="inv-item-actions"><button data-unsocket-crystal="${id}:${idx}">外す</button></span>
        </div>`).join('') : `<p style="color:var(--text-muted);font-size:12px;margin:4px 0 0;">未装備</p>`;
      const addBtn = used < total
        ? `<div style="margin-top:6px;"><button data-open-crystal-picker="${id}" style="padding:4px 10px;font-size:11px;">クリスタルを装備する</button></div>` : '';
      return `
        <div style="margin:0 0 10px 18px;padding:6px 10px 8px;border-left:2px solid var(--win-border-inner);">
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="color:var(--text-muted);font-size:11px;">クリスタル</span>
            ${renderSlotPips(total, used)}
            <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${used}/${total}</span>
          </div>
          ${rows}
          ${addBtn}
        </div>`;
    })() : '';

    const equipHtml = unlocked ? `
      <div class="equip-row">
        <span class="equip-slot">武器</span>
        <span>${weapon ? `${esc(weapon.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(itemValueLabel(weapon))}</span>` : '未装備'}
          ${weapon ? `<button data-unequip="weapon" data-unequip-for="${id}">外す</button>` : ''}
          <button data-open-equip-picker="${id}:weapon">変更</button>
        </span>
      </div>
      <div class="equip-row">
        <span class="equip-slot">防具</span>
        <span>${armor ? `${esc(armor.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(itemValueLabel(armor))}</span>` : '未装備'}
          ${armor ? `<button data-unequip="armor" data-unequip-for="${id}">外す</button>` : ''}
          <button data-open-equip-picker="${id}:armor">変更</button>
        </span>
      </div>
      <div class="equip-row" style="${accessory?'border-bottom:none;':''}">
        <span class="equip-slot">アクセサリー</span>
        <span>${accessory ? `${esc(accessory.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(itemValueLabel(accessory))}</span>` : '未装備'}
          ${accessory ? `<button data-unequip="accessory" data-unequip-for="${id}">外す</button>` : ''}
          <button data-open-equip-picker="${id}:accessory">変更</button>
        </span>
      </div>
      ${crystalSocketsHtml}` : `<p style="color:var(--text-muted);font-size:12px;">仲間になると装備を変更できるようになる。</p>`;

    const lockedBanner = !unlocked ? `<p class="log-entry system" style="margin-top:10px;">${uiIcon('lock')} まだ仲間になっていない。「召喚」で運命のチケットを使うと仲間になる。</p>` : '';

    const allowedWeaponLabel = Array.from(allowedWeaponTypes(id)).map(t=>WEAPON_TYPES[t].name).join('・') || 'なし';

    /* アクセサリー・クリスタルによる上昇分は、ステータス欄では基礎値の
     * 横に小さく「(+N)」として添えるだけにとどめ、基礎値そのものを
     * 書き換えない(あくまで表示上の内訳。実際の計算では既存のliverAtk等が
     * 返す上昇込みの値がそのまま使われ続ける)。 */
    const accEff = liverAccessoryEffects(id);
    const boostSpan = (n) => n > 0 ? ` <span style="color:var(--rare-uncommon);font-size:11px;">(+${n})</span>` : '';
    const baseMaxHp = Math.round(jobMaxHp(ls.job, jp.level) * passiveStatMult(id, 'hp'));
    const hpBoost = ls.maxHp - baseMaxHp;
    const baseMaxMp = Math.round(jobMaxMp(ls.job, jp.level) * passiveStatMult(id, 'mp'));
    const mpBoost = ls.maxMp - baseMaxMp;
    const baseAtk = Math.round((jobBaseAtk(ls.job, jp.level) + (weapon ? itemEffectiveValue(weapon) : 0)) * passiveStatMult(id, 'atk'));
    const atkBoost = liverAtk(id) - baseAtk;
    const baseDef = Math.max(1, Math.round((jobBaseDef(ls.job, jp.level) + (armor ? itemEffectiveValue(armor) : 0)) * passiveStatMult(id, 'def') * statusStatMult(playerStatusEffects[id], 'defBuff', 'defDebuff')));
    const defBoost = liverDefStat(id) - baseDef;

    const resistances = liverResistances(id);
    const resistanceTilesHtml = Object.keys(ELEMENT_LABELS).map(el=>{
      const value = resistances[el] || 0;
      const boostKey = Object.keys(ACCESSORY_RESIST_ELEMENT).find(k=>ACCESSORY_RESIST_ELEMENT[k]===el);
      const boostPct = ((boostKey && accEff[boostKey]) || 0) * 3;
      const pct = value * 3;
      const basePct = pct - boostPct;
      const pctLabel = basePct === 0 ? '±0%' : (basePct > 0 ? `+${basePct}%` : `-${Math.abs(basePct)}%`);
      const color = value > 0 ? 'var(--rare-uncommon)' : (value < 0 ? 'var(--danger)' : 'var(--text-primary)');
      return `
        <div class="stat-tile">
          <span class="stat-tile-label">${ELEMENT_LABELS[el]}属性耐性</span>
          <span class="stat-tile-value" style="color:${color};">${pctLabel}${boostPct>0?` <span style="color:var(--rare-uncommon);font-size:11px;">(+${boostPct}%)</span>`:''}</span>
        </div>`;
    }).join('');
    const headlineTile = (label, value) => `
        <div class="stat-tile" style="background:rgba(255,216,99,0.08);"><span class="stat-tile-label">${label}</span><span class="stat-tile-value" style="font-size:20px;color:var(--gold);">${value}</span></div>`;
    const statTilesHtml = `
      <div class="stat-tile-grid">
        ${headlineTile('レベル', jp.level)}
        <div class="stat-tile"><span class="stat-tile-label">HP</span><span class="stat-tile-value">${ls.hp}<span style="color:var(--text-muted);font-size:12px;">/${baseMaxHp}</span>${boostSpan(hpBoost)}</span></div>
        <div class="stat-tile"><span class="stat-tile-label">MP</span><span class="stat-tile-value">${ls.mp}<span style="color:var(--text-muted);font-size:12px;">/${baseMaxMp}</span>${boostSpan(mpBoost)}</span></div>
        <div class="stat-tile"><span class="stat-tile-label">攻撃力</span><span class="stat-tile-value">${baseAtk}${boostSpan(atkBoost)}</span></div>
        <div class="stat-tile"><span class="stat-tile-label">防御力</span><span class="stat-tile-value">${baseDef}${boostSpan(defBoost)}</span></div>
        ${headlineTile('戦闘力', combatPower(id))}
        ${resistanceTilesHtml}
        <div class="stat-tile"><span class="stat-tile-label">EXP</span><span class="stat-tile-value">${jp.exp}<span style="color:var(--text-muted);font-size:12px;">/${expToNext(jp.level)}</span></span></div>
      </div>`;

    const headingHtml = `<p class="scene-heading"><span>${esc(def.name)}${inParty ? ' <span style="color:var(--gold);font-weight:400;">(編成中)</span>' : ''}</span>${helpButtonHtml('roster')}</p>`;
    const liverDungeonBtnHtml = (unlocked && liverHasDungeonLines(id))
      ? `<button data-open-liver-dungeon="${id}">ライバーダンジョンへ</button>` : '';

    const detailTab = state.ui.liverDetailTab === 'dialogue' ? 'dialogue' : 'detail';
    const tabSwitcherHtml = `
      <div class="tab-strip">
        <button data-liver-detail-tab="detail" class="${detailTab==='detail'?'active':''}">詳細</button>
        <button data-liver-detail-tab="dialogue" class="${detailTab==='dialogue'?'active':''}">台詞</button>
      </div>`;

    if(detailTab === 'dialogue'){
      return `
        <div class="scene-text">
          ${headingHtml}
          ${lockedBanner}
        </div>
        <div class="actions">
          <button id="backFromLiverDetailBtn">${state.ui.rosterDetailFrom === 'party' ? '編成画面に戻る' : 'ライバー一覧に戻る'}</button>
          ${liverDungeonBtnHtml}
        </div>
        ${tabSwitcherHtml}
        ${renderLiverDialogueInner(id, unlocked)}
      `;
    }

    return `
      <div class="scene-text">
        ${headingHtml}
        ${lockedBanner}
      </div>
      <div class="actions">
        <button id="backFromLiverDetailBtn">${state.ui.rosterDetailFrom === 'party' ? '編成画面に戻る' : 'ライバー一覧に戻る'}</button>
        ${liverDungeonBtnHtml}
      </div>
      ${tabSwitcherHtml}
      <div class="section-block">
        <p class="section-label">ステータス</p>
        ${statTilesHtml}
        <p style="color:var(--text-muted);font-size:11px;margin:8px 0 0;">属性耐性はレベルアップでは変化しません。装備品(主に防具)に付く耐性値によってのみ増減します。</p>
      </div>
      <div class="section-block">
        <p class="section-label">装備</p>
        <p style="color:var(--text-muted);font-size:11px;margin:0 0 8px;">装備可能な武器種: ${esc(allowedWeaponLabel)}</p>
        ${equipHtml}
      </div>
      <div class="section-block">
        <p class="section-label">衣装</p>
        <div class="actions" style="margin-top:0;">${costumeSwitchHtml}</div>
      </div>
      <div class="section-block">
        <p class="section-label">パッシブスキル</p>
        ${passiveRow}
      </div>
      <div class="section-block">
        <p class="section-label">ジョブ</p>
        <div class="actions" style="margin-top:0;">${jobSwitchHtml}</div>
      </div>
      <div class="section-block">
        <p class="section-label">スキル</p>
        ${atkRow}
        ${skillRows}
        <p style="color:var(--text-muted);font-size:11px;margin:4px 0 0;">有効スキルは最大${SKILL_LOADOUT_MAX}つまで。希望発動率の合計が50%を超える分は自動的に按分されます。</p>
      </div>
    `;
  }

  /* 台詞タブ: 各トリガーごとに設定できる台詞と頻度(1戦闘/1回の探索に
   * つき1回 or 毎回)を編集する画面。
   *
   * 「共通」(勝利時などの固定5種)と「ジョブごと」(スキル使用時)を
   * サブタブで切り替える構成のため、DOM上には常に1つのサブタブ分の
   * 入力欄しか存在しない。そのため以下の方針を取る:
   *   ・テキスト入力・頻度セレクトは、サブタブ切り替え時と保存時に
   *     commitVisibleDialogueRowsToMemory()でls.dialoguesへ書き戻す
   *     (画面に無い他のサブタブ分のデータを消さないため)。
   *   ・保存ボタンはこの書き戻し関数を呼んだ上でsaveGame()する。
   * 頻度はボタンではなくselectで選ばせ、保存後は一時的な
   * state.ui.dialogueSaveFlash フラグで「保存しました」表示を出す。 */
  function renderLiverDialogueInner(id, unlocked){
    const dlgs = liverDialogues(id);
    const rowDomId = triggerKey => `dlgText_${triggerKey.replace(/[^a-zA-Z0-9]/g,'_')}`;
    const jobIds = Object.keys(JOB_DEFS);
    const subTab = (state.ui.dialogueSubTab === 'common' || jobIds.includes(state.ui.dialogueSubTab))
      ? state.ui.dialogueSubTab : 'common';

    const row = (triggerKey, label, freqUnit) => {
      const slot = (triggerKey.startsWith('skill:')
        ? (dlgs.skills && dlgs.skills[triggerKey.slice(6)])
        : dlgs[triggerKey]) || {};
      const freq = slot.freq === 'always' ? 'always' : 'once';
      const text = slot.text || '';
      return `
        <div class="inv-item" data-dialogue-row="${triggerKey}">
          <span class="inv-item-name">
            ${esc(label)}<br>
            <input class="name-input dialogue-text-input" id="${rowDomId(triggerKey)}" type="text" maxlength="30" placeholder="未設定(表示しない)" value="${esc(text)}" ${unlocked?'':'disabled'} style="margin-top:4px;">
          </span>
          <span class="inv-item-actions">
            <select class="dialogue-freq-select" ${unlocked?'':'disabled'} style="background:var(--win-bg-1);color:var(--text-primary);border:1px solid var(--win-border);font-size:11px;padding:4px;">
              <option value="once" ${freq!=='always'?'selected':''}>${esc(freqUnit)}に1回</option>
              <option value="always" ${freq==='always'?'selected':''}>毎回</option>
            </select>
          </span>
        </div>`;
    };

    const subTabDefs = [{ key: 'common', label: '共通' }, ...jobIds.map(jobId=>({ key: jobId, label: JOB_DEFS[jobId].name }))];
    const subTabBarHtml = `
      <div class="tab-strip sub">
        ${subTabDefs.map(t=>`<button data-dialogue-subtab="${t.key}" class="${subTab===t.key?'active':''}">${esc(t.label)}</button>`).join('')}
      </div>`;

    let contentHtml, noteHtml;
    if(subTab === 'common'){
      contentHtml = [
        row('victory', '勝利時(最後にダメージを与えたライバーの台詞が表示される)', '1戦闘'),
        row('itemGet', 'アイテム発見時(戦闘中のドロップは対象外。編成中からランダムで1名)', '1回の探索'),
        row('death', '戦闘不能になった時', '1戦闘'),
        row('critDeal', 'クリティカルを与えた時', '1戦闘'),
        row('critTaken', 'クリティカルを受けた時', '1戦闘'),
      ].join('');
      noteHtml = '';
    } else {
      const jobDef = JOB_DEFS[subTab];
      contentHtml = jobDef.skills.map(s=>row('skill:'+s.key, `「${s.name}」使用時`, '1戦闘')).join('');
      noteHtml = `<p style="color:var(--text-muted);font-size:11px;margin:0 0 8px;">現在有効化しているスキルのみ実際にログへ表示される(無効なスキル分もあらかじめ設定しておくことは可能)。</p>`;
    }

    const saveBarHtml = unlocked ? `
      <div class="actions" style="margin-top:10px;align-items:center;gap:10px;">
        <button class="primary" data-save-dialogues>保存する</button>
        <span class="save-flash" style="${state.ui.dialogueSaveFlash ? '' : 'visibility:hidden;'}">✓ 保存しました</span>
      </div>` : '';

    const bulkFreqHtml = unlocked ? `
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;margin:0 0 14px;background:var(--win-bg-2);border:1px solid var(--win-border-inner);">
        <span style="color:var(--text-muted);font-size:11px;">表示頻度を一括変更(設定済みの台詞すべてに適用)</span>
        <span style="display:flex;gap:8px;margin-left:auto;">
          <button data-dialogue-bulk-freq="always" style="padding:5px 12px;font-size:11px;">すべて「毎回」にする</button>
          <button data-dialogue-bulk-freq="once" style="padding:5px 12px;font-size:11px;">すべて「1回」にする</button>
        </span>
      </div>` : '';

    return `
      <div class="section-block">
        <p class="section-label">台詞設定</p>
        <p style="color:var(--text-muted);font-size:11px;margin:0 0 8px;">条件を満たした時、ここで設定した台詞がログに「${esc(liverDef(id).name)}「台詞」」の形式で流れる。未設定の項目は何も表示されない。コロシアムタワーの防衛時は台詞は表示されない。全角30文字まで。</p>
        ${bulkFreqHtml}
        ${saveBarHtml}
        ${subTabBarHtml}
        <div style="margin-top:10px;">
          ${noteHtml}
          ${contentHtml}
        </div>
        ${saveBarHtml}
      </div>
    `;
  }

  /* 装備ピッカー: 「変更」ボタンから開く、メインウィンドウ上の所持品
   * 選択画面。サイドパネルまでスクロールせずに装備を選べるようにする
   * のが目的(特にモバイル)。 */
  function renderEquipPickerInner(){
    const { liverId, slot } = state.ui.equipPickerSlot;
    if(!liverState(liverId)){
      state.ui.equipPickerSlot = null;
      return state.screen === 'liverDetail' ? renderLiverDetailInner() : renderPartyInner();
    }
    const def = liverDef(liverId);
    const ls = liverState(liverId);
    const current = ls.equipped[slot];
    const slotLabel = EQUIP_SLOT_LABELS[slot] || slot;

    const candidates = state.inventory.filter(i=>i.type===slot);
    const itemsHtml = candidates.length ? candidates.map(i=>{
      const equippable = canEquipItem(liverId, i);
      return `
        <div class="inv-item ${i.rarityLabel}" title="${esc(itemDetailText(i))}">
          <span class="inv-item-name">${esc(i.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(itemValueLabel(i))}</span></span>
          <span class="inv-item-actions">
            <button data-equip-for="${liverId}:${i.id}" ${equippable?'':'disabled title="このライバーは装備できない武器種"'}>装備</button>
          </span>
        </div>`;
    }).join('') : `<p class="inv-empty">${slotLabel}として装備できる所持品がない。</p>`;

    const currentHtml = current
      ? `<div class="inv-item ${current.rarityLabel}" title="${esc(itemDetailText(current))}">
          <span class="inv-item-name">${esc(current.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(itemValueLabel(current))}</span></span>
        </div>`
      : `<p class="log-entry system">未装備</p>`;

    return `
      <div class="scene-text">
        ${sceneHeadingHtml(`${esc(def.name)}の${slotLabel}を選ぶ`)}
      </div>
      <div class="section-block" style="margin-top:0;">
        <p class="section-label">現在の${slotLabel}</p>
        ${currentHtml}
      </div>
      <div class="actions">
        ${current ? `<button data-unequip="${slot}" data-unequip-for="${liverId}">外す</button>` : ''}
        <button id="closeEquipPickerBtn">戻る</button>
      </div>
      <div class="section-block">
        <p class="section-label">所持品から選ぶ</p>
        <div class="scrollbox equip-picker-scroll">${itemsHtml}</div>
      </div>
    `;
  }

  /* クリスタルの着脱ピッカー。装備ピッカーと同じくメインウィンドウを
   * 差し替える形式(state.ui.crystalPickerSlot = {liverId})で開く。
   * 装備できるのは「残りスロット数に収まる消費スロット数」のクリスタルのみ。 */
  function renderCrystalPickerInner(){
    const { liverId } = state.ui.crystalPickerSlot;
    const ls = liverState(liverId);
    const accessory = ls && ls.equipped.accessory;
    if(!ls || !accessory){
      state.ui.crystalPickerSlot = null;
      return renderLiverDetailInner();
    }
    const def = liverDef(liverId);
    const used = (accessory.crystals||[]).reduce((s,c)=>s+(c.slotCost||0), 0);
    const remaining = (accessory.slotCount||0) - used;

    const candidates = state.inventory.filter(i=>i.type==='crystal');
    const itemsHtml = candidates.length ? candidates.map(c=>{
      const fits = c.slotCost <= remaining;
      return `
        <div class="inv-item ${c.rarityLabel}" title="${esc(itemDetailText(c))}">
          <span class="inv-item-name">${esc(c.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(itemValueLabel(c))}</span></span>
          <span class="inv-item-actions">
            <button data-socket-crystal="${liverId}:${c.id}" ${fits?'':'disabled title="スロットが足りない"'}>装備する</button>
          </span>
        </div>`;
    }).join('') : `<p class="inv-empty">クリスタルを所持していない。</p>`;

    return `
      <div class="scene-text">
        ${sceneHeadingHtml(`${esc(def.name)}のクリスタルを選ぶ`)}
      </div>
      <div class="section-block" style="margin-top:0;">
        <p class="section-label">「${esc(accessory.name)}」のスロット</p>
        <p style="display:flex;align-items:center;gap:8px;color:var(--text-muted);font-size:12px;margin:0 0 8px;">
          ${renderSlotPips(accessory.slotCount||0, used)}
          <span style="font-family:var(--font-mono);">${used}/${accessory.slotCount||0}(残り${remaining})</span>
        </p>
      </div>
      <div class="actions">
        <button id="closeCrystalPickerBtn">戻る</button>
      </div>
      <div class="section-block">
        <p class="section-label">所持品から選ぶ</p>
        <div class="scrollbox equip-picker-scroll">${itemsHtml}</div>
      </div>
    `;
  }

  function renderPartyInner(){
    const unlockedDefs = LIVER_DEFS_BY_DEBUT.filter(d=>liverState(d.id).unlocked);
    const inPartyDefs = unlockedDefs.filter(d=>state.party.includes(d.id));
    const benchedDefs = unlockedDefs.filter(d=>!state.party.includes(d.id));
    const lockedDefs = LIVER_DEFS_BY_DEBUT.filter(d=>!liverState(d.id).unlocked);

    const partyRows = inPartyDefs.length
      ? inPartyDefs.map(renderPartyMemberRow).join('')
      : `<p class="inv-empty">まだ誰も編成されていない。下の「待機中」から選ぼう。</p>`;

    const benchRows = benchedDefs.length
      ? benchedDefs.map(renderPartyMemberRow).join('')
      : `<p class="inv-empty">${unlockedDefs.length ? '仲間は全員編成済み。' : 'まだ仲間がいない。'}</p>`;

    const lockedRows = lockedDefs.map(def=>{
      const hint = '「召喚」で運命のチケットを使うと仲間になる';
      return `
        <div class="inv-item" style="opacity:.5;">
          <span class="inv-item-name">${uiIcon('lock')} ${esc(def.name)}<br><span style="color:var(--text-muted);font-size:11px;">${esc(hint)}</span></span>
        </div>`;
    }).join('');

    const fullNotice = (state.party.length>=PARTY_MAX && benchedDefs.length)
      ? `<p style="color:var(--text-muted);font-size:11px;margin:6px 0 0;">編成は満員。待機中の仲間を入れるには、まず誰かを外そう。</p>`
      : '';

    return `
      <div class="scene-text">
        ${sceneHeadingHtml('パーティ編成', helpButtonHtml('party'))}
        <p class="log-entry" style="font-family:var(--font-mono);font-size:12px;color:var(--gold);">現在の編成: ${state.party.length}/${PARTY_MAX} ・ 仲間の総数: ${unlockedDefs.length}</p>
      </div>
      <div class="actions"><button id="backTownBtn">町に戻る</button></div>
      <div class="section-block">
        <p class="section-label">編成中</p>
        ${partyRows}
      </div>
      <div class="section-block">
        <p class="section-label">待機中</p>
        ${benchRows}
        ${fullNotice}
      </div>
      ${lockedDefs.length ? `
      <div class="section-block">
        <p class="section-label">未解放</p>
        ${lockedRows}
      </div>` : ''}
    `;
  }

  function renderInnInner(){
    const line = INNKEEPER_LINES[Math.floor(Math.random()*INNKEEPER_LINES.length)];
    const cost = innStayCost();
    const full = isPartyFull();
    const partyStatusHtml = state.party.map(id=>{
      const ls = liverState(id);
      return `<p class="log-entry" style="font-size:12px;">${esc(liverDef(id).name)}: HP ${ls.hp}/${ls.maxHp} ・ MP ${ls.mp}/${ls.maxMp}</p>`;
    }).join('') || `<p class="log-entry system">パーティが編成されていない。</p>`;
    return `
      <div class="scene-text">
        ${sceneHeadingHtml('宿屋', helpButtonHtml('inn'))}
        <p class="log-entry system">宿屋の女将マーレ:「${esc(line)}」</p>
        ${partyStatusHtml}
      </div>
      <div class="actions">
        <button class="primary" id="stayBtn" ${(full||state.gold<cost||!state.party.length)?'disabled':''}>パーティ全員で泊まる (${cost}G)</button>
        <button id="backTownBtn">町に戻る</button>
      </div>
    `;
  }

  function renderShopInner(){
    const buyActive = ((state.ui && state.ui.shopTab) || 'buy') === 'buy';
    const equipActive = ((state.ui && state.ui.shopItemTab) || 'equip') === 'equip';

    let bodyHtml;
    if(buyActive){
      const toolKeys = Object.keys(TOOL_DEFS).filter(k=>TOOL_DEFS[k].purchasable);
      const toolsHtml = toolKeys.length ? toolKeys.map(key=>{
        const def = TOOL_DEFS[key];
        return `
          <div class="inv-item" title="${esc(def.desc)}">
            <span class="inv-item-name">${esc(def.name)}</span>
            <span class="inv-item-actions">
              <button data-buy-tool="${key}" ${(state.gold<def.price)?'disabled':''}>${def.price}G 購入</button>
            </span>
          </div>`;
      }).join('') : `<p class="inv-empty">購入できるアイテムが無い。</p>`;
      const accessoriesHtml = ACCESSORY_SHOP_DEFS.map(def=>`
        <div class="inv-item" title="固定効果のアクセサリー(効果は控えめ)">
          <span class="inv-item-name">${esc(def.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">[${esc(accessoryEffectLabel({type:def.effectType, value:def.value}))}] スロット${def.slotCount}</span></span>
          <span class="inv-item-actions">
            <button data-buy-accessory="${def.key}" ${(state.gold<def.price)?'disabled':''}>${def.price}G 購入</button>
          </span>
        </div>`).join('');
      bodyHtml = `${toolsHtml}<p class="section-label" style="margin:14px 0 8px;">アクセサリー</p>${accessoriesHtml}`;
    } else if(equipActive){
      const equipSort = (state.ui && state.ui.equipSort) || INVENTORY_SORT_DEFAULT;
      const sellList = applyInventorySort(state.inventory.filter(i=>i.rarity!=='unique'), equipSort, i => RARITY_SORT_ORDER[i.rarity] || 0);
      bodyHtml = sellList.length ? sellList.map(item=>`
        <div class="inv-item ${item.rarityLabel}" title="${esc(itemDetailText(item))}">
          <span class="inv-item-name">${esc(item.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(itemValueLabel(item))}</span></span>
          <span class="inv-item-actions">
            <button data-sell="${item.id}">${itemSellPrice(item)}G で売る</button>
          </span>
        </div>`).join('') : `<p class="inv-empty">売れる装備が無い。</p>`;
    } else {
      const itemSort = (state.ui && state.ui.itemSort) || INVENTORY_SORT_DEFAULT;
      const keysBase = Object.keys(TOOL_DEFS).filter(k=>toolCount(k) > 0);
      const keys = applyInventorySort(keysBase, itemSort, () => -1);
      bodyHtml = keys.length ? keys.map(key=>{
        const def = TOOL_DEFS[key];
        return `
          <div class="inv-item" title="${esc(def.desc)}">
            <span class="inv-item-name">${esc(def.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">所持: ${toolCount(key)}</span></span>
            <span class="inv-item-actions">
              <button data-sell-tool="${key}">${toolSellPrice(key)}G で売る</button>
            </span>
          </div>`;
      }).join('') : `<p class="inv-empty">売れるアイテムが無い。</p>`;
    }

    return `
      <div class="scene-text">
        ${sceneHeadingHtml('商店')}
      </div>
      <div class="actions"><button id="backTownBtn">町に戻る</button></div>
      <div class="tab-strip">
        <button data-shop-tab="buy" class="${buyActive?'active':''}">買う</button>
        <button data-shop-tab="sell" class="${!buyActive?'active':''}">売る</button>
      </div>
      ${buyActive ? '' : `
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px;">
        <div class="tab-strip sub" style="margin-top:0;">
          <button data-shop-item-tab="equip" class="${equipActive?'active':''}">装備</button>
          <button data-shop-item-tab="item" class="${!equipActive?'active':''}">アイテム</button>
        </div>
        ${renderSortSelect('shopSortSelect', (state.ui && (equipActive ? state.ui.equipSort : state.ui.itemSort)) || INVENTORY_SORT_DEFAULT)}
      </div>`}
      <div class="section-block">
        ${bodyHtml}
      </div>
    `;
  }

  function renderHomeInner(){
    const ownedHtml = state.home.furniture.length
      ? state.home.furniture.map(id=>{
          const f = FURNITURE_CATALOG.find(x=>x.id===id);
          return `<div class="inv-item uncommon"><span>${esc(f.name)}<br><span style="color:var(--text-muted);font-size:11px;">${esc(f.flavor)}</span></span></div>`;
        }).join('')
      : `<p class="inv-empty">まだ何も置かれていない。</p>`;

    const catalogHtml = FURNITURE_CATALOG.filter(f=>!state.home.furniture.includes(f.id)).map(f=>`
      <div class="inv-item">
        <span class="inv-item-name">${esc(f.name)} <span style="color:var(--gold);font-family:var(--font-mono);font-size:11px;">${f.price}G</span></span>
        <span class="inv-item-actions">
          <button data-buy-furniture="${f.id}" ${state.gold<f.price?'disabled':''}>設置</button>
        </span>
      </div>`).join('');

    return `
      <div class="scene-text">
        ${sceneHeadingHtml('マイホーム', helpButtonHtml('home'))}
        <p class="log-entry" style="margin-top:10px;">現在の名前: <strong>${esc(state.name)}</strong></p>
        <input id="nameEditInput" class="name-input" type="text" maxlength="12" placeholder="新しい名前">
      </div>
      <div class="actions">
        <button id="renameBtn">名前を変更</button>
        <button id="backTownBtn">町に戻る</button>
      </div>
      <div class="section-block">
        <p class="section-label">設置済みの家具</p>
        ${ownedHtml}
      </div>
      <div class="section-block">
        <p class="section-label">家具カタログ</p>
        ${catalogHtml || '<p class="inv-empty">すべて設置済み。</p>'}
      </div>
      <div class="section-block">
        <p class="section-label">デバッグ</p>
        <p style="color:var(--text-muted);font-size:11px;margin:0 0 8px;">セーブデータを完全に削除し、キャラ作成からやり直す。動作確認用の機能。</p>
        <button class="danger" id="resetGameBtn">セーブデータをリセット</button>
        <p style="color:var(--text-muted);font-size:11px;margin:14px 0 8px;">クリスタルは現在、特殊ダンジョン(未実装)でのみ入手できる。実装までの動作確認用に、ランダムなクリスタルを3個手に入れる。</p>
        <button id="debugGrantCrystalsBtn">テスト用クリスタルを3個入手</button>
      </div>
    `;
  }

  /* ---------------------------------------------------------------
   * マイページ(公開プロフィール)。ランキング・チャットのユーザー名から
   * 他プレイヤーのマイページへ飛べる。表示専用データなので、戦闘中の
   * combatEnemy等と同様にセーブ不要な一時状態としてモジュールスコープの
   * 変数(profileViewCache)で保持する。自分自身のプロフィールを開いた
   * 場合のみ、ひとことコメントの編集欄を表示する。
   * --------------------------------------------------------------- */
  let profileViewCache = null;    // { playerId, loading, data, error, fallbackName } | null
  let profileFetchInFlight = null; // 現在取得中のplayerId(重複fetch防止)
  let profileCommentStatus = null; // { ok, text } | null

  /* player_public_profile.roster内の1要素(DBのsnake_case)を、
   * foreignCombatPower等が期待する形(既存のstate.roster[id]に近い
   * camelCaseのキー)へ変換する。 */
  function normalizeProfileLiverSnap(raw){
    return {
      job: raw.job,
      jobProgress: raw.job_progress || {},
      hp: raw.hp, maxHp: raw.max_hp, mp: raw.mp, maxMp: raw.max_mp,
      costume: raw.costume,
      unlockedCostumes: raw.unlocked_costumes || [],
      equippedWeapon: raw.equipped_weapon || null,
      equippedArmor: raw.equipped_armor || null,
      equippedAccessory: raw.equipped_accessory || null
    };
  }

  /* 呼び出し元(openProfile)が先にprofileViewCacheをloading状態にして
   * render()した後にこれを呼ぶ想定(render()の最中にrender()を再帰的に
   * 呼び出さないようにするため、ここではrender()を呼ばない)。 */
  async function fetchProfile(playerId, fallbackName){
    if(profileFetchInFlight === playerId) return;
    profileFetchInFlight = playerId;
    try{
      const { data, error } = await sb.from('player_public_profile').select('*').eq('player_id', playerId).maybeSingle();
      if(error) throw error;
      profileViewCache = { playerId, loading:false, data: data||null, error:false, fallbackName: fallbackName||null };
    }catch(e){
      console.error('profile fetch failed', e);
      profileViewCache = { playerId, loading:false, data:null, error:true, fallbackName: fallbackName||null };
    }
    profileFetchInFlight = null;
    render();
  }

  function openProfile(playerId, from, fallbackName){
    if(inCombat || !playerId) return;
    if(!state.ui) state.ui = {};
    state.ui.profileViewId = playerId;
    state.ui.profileFrom = from || 'town';
    state.screen = 'profile';
    profileCommentStatus = null;
    state.ui.profileCommentEditing = false;
    profileViewCache = { playerId, loading:true, data:null, error:false, fallbackName: fallbackName||null };
    saveGame(); render();
    fetchProfile(playerId, fallbackName);
  }

  function backFromProfile(){
    const from = state.ui.profileFrom;
    gotoScreen(from === 'rankings' || from === 'rankingDetail' ? from : 'town');
  }

  /* マイページの保有ライバー一覧から個別のキャラ詳細を開く場合。
   * 戻る先は常にマイページ(profileLiverFrom:'profile')。 */
  function openProfileLiverDetail(liverId){
    if(!state.ui) state.ui = {};
    state.ui.profileLiverId = liverId;
    state.ui.profileLiverFrom = 'profile';
    state.screen = 'profileLiverDetail';
    saveGame(); render();
  }

  /* ランキングの行を押した場合は、マイページを経由せず直接そのキャラの
   * 詳細画面へ遷移する(profileLiverFrom:'ranking')。詳細画面側で
   * 「マイページを見る」「ランキングに戻る」の2つの選択肢を出す。 */
  function openProfileLiverFromRanking(playerId, liverId, from, fallbackName){
    if(inCombat || !playerId || !liverId) return;
    if(!state.ui) state.ui = {};
    state.ui.profileViewId = playerId;
    state.ui.profileFrom = (from === 'rankings' || from === 'rankingDetail') ? from : 'rankings';
    state.ui.profileLiverId = liverId;
    state.ui.profileLiverFrom = 'ranking';
    state.screen = 'profileLiverDetail';
    profileCommentStatus = null;
    state.ui.profileCommentEditing = false;
    profileViewCache = { playerId, loading:true, data:null, error:false, fallbackName: fallbackName||null };
    saveGame(); render();
    fetchProfile(playerId, fallbackName);
  }

  function backFromProfileLiverDetail(){
    state.screen = 'profile';
    saveGame(); render();
  }

  function viewProfileFromLiverDetail(){
    state.screen = 'profile';
    saveGame(); render();
  }

  function backToRankingFromLiverDetail(){
    gotoScreen(state.ui.profileFrom === 'rankingDetail' ? 'rankingDetail' : 'rankings');
  }

  async function saveProfileComment(){
    const input = document.getElementById('profileCommentInput');
    if(!input) return;
    const btn = document.getElementById('saveProfileCommentBtn');
    if(btn) btn.disabled = true;
    try{
      const { error } = await sb.rpc('set_profile_comment', { p_comment: input.value });
      if(error) throw error;
      profileCommentStatus = { ok:true, text:'コメントを保存しました。' };
      if(!state.ui) state.ui = {};
      state.ui.profileCommentEditing = false;
      await fetchProfile(state.playerId);
    }catch(e){
      console.error('save profile comment failed', e);
      profileCommentStatus = {
        ok:false,
        text: /comment too long/.test(e.message) ? '60文字以内で入力してください。' : 'コメントの保存に失敗しました。'
      };
      render();
    }
  }

  function openProfileReportPopup(targetId, targetName){
    if(!state.ui) state.ui = {};
    state.ui.profileReportPopup = { targetId, targetName, submitting:false, error:'' };
    render();
  }
  function closeProfileReportPopup(){
    if(!state.ui) return;
    state.ui.profileReportPopup = null;
    render();
  }
  async function submitProfileReport(){
    const popup = state.ui && state.ui.profileReportPopup;
    if(!popup || popup.submitting) return;
    const reasonSelect = document.getElementById('profileReportReasonSelect');
    const reasonText = document.getElementById('profileReportReasonText');
    const category = reasonSelect ? reasonSelect.value : 'other';
    const detail = reasonText ? reasonText.value.trim().slice(0,500) : '';
    popup.submitting = true;
    popup.error = '';
    render();
    try{
      const { error } = await sb.rpc('submit_user_report', {
        p_reported_player_id: popup.targetId, p_reason_category: category, p_reason_text: detail || null
      });
      if(error) throw error;
      state.ui.profileReportPopup = null;
      pushLog('通報を受け付けました。運営にて内容を確認いたします。', 'system');
      render();
    }catch(e){
      console.error('submit user report failed', e);
      popup.submitting = false;
      popup.error = /already reported/.test(e.message) ? 'このユーザーはすでに通報済みです(対応完了までお待ちください)。'
        : /cannot report yourself/.test(e.message) ? '自分自身は通報できません。'
        : '通報の送信に失敗しました。通信状況をご確認ください。';
      render();
    }
  }

  function renderProfileReportPopup(){
    const popup = state.ui && state.ui.profileReportPopup;
    if(!popup) return '';
    const reasonOptionsHtml = CHAT_REPORT_REASONS.map(r=>`<option value="${r.id}">${esc(r.label)}</option>`).join('');
    return `
    <div class="help-popup-backdrop" id="profileReportPopupBackdrop">
      <div class="help-popup">
        <p class="section-label" style="margin-top:0;">ユーザーを通報</p>
        <div class="market-popup-row"><span>対象</span><span>${esc(popup.targetName)}</span></div>
        <label style="display:block;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:10px;">通報理由</label>
        <select class="chat-report-reason-select" id="profileReportReasonSelect">${reasonOptionsHtml}</select>
        <label style="display:block;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:8px;">詳細(任意)</label>
        <textarea class="chat-report-reason-text" id="profileReportReasonText" maxlength="500" placeholder="具体的な状況があれば記入してください"></textarea>
        ${popup.error ? `<p class="log-entry danger" style="margin-top:8px;">${esc(popup.error)}</p>` : ''}
        <div class="actions" style="justify-content:flex-end;margin-top:14px;">
          <button id="profileReportPopupCancelBtn" ${popup.submitting?'disabled':''}>キャンセル</button>
          <button class="primary" id="profileReportPopupConfirmBtn" ${popup.submitting?'disabled':''}>${popup.submitting?'送信中……':'通報する'}</button>
        </div>
      </div>
    </div>`;
  }

  /* チャット欄のユーザー名クリック時に「マイページ/通報」を選ぶ小さなメニュー。
   * 自分自身の発言の場合は通報を出さない。 */
  function openChatUserMenu(playerId, playerName, isOwn, messageId){
    if(!state.ui) state.ui = {};
    state.ui.chatUserMenu = { playerId, playerName, isOwn, messageId };
    render();
  }
  function closeChatUserMenu(){
    if(!state.ui) return;
    state.ui.chatUserMenu = null;
    render();
  }
  function renderChatUserMenu(){
    const menu = state.ui && state.ui.chatUserMenu;
    if(!menu) return '';
    return `
    <div class="help-popup-backdrop" id="chatUserMenuBackdrop">
      <div class="help-popup" style="max-width:280px;">
        <p class="section-label" style="margin-top:0;">${esc(menu.playerName)}</p>
        <div class="actions" style="flex-direction:column;align-items:stretch;">
          <button id="chatUserMenuProfileBtn">詳細を見る</button>
          ${(!menu.isOwn && menu.messageId != null) ? `<button id="chatUserMenuReportBtn">この投稿を通報する</button>` : ''}
          <button id="chatUserMenuCancelBtn">閉じる</button>
        </div>
      </div>
    </div>`;
  }

  function renderProfileInner(){
    const targetId = state.ui.profileViewId || state.playerId;
    const isSelf = targetId === state.playerId;
    const backBtnHtml = `<div class="actions"><button id="backFromProfileBtn">戻る</button></div>`;
    const cache = profileViewCache;

    if(!cache || cache.playerId !== targetId){
      // 通常はopenProfile()が先にloading状態をセットしてから遷移するため
      // ここには来ない想定だが、リロード直後など想定外の経路に備えて
      // フォールバック表示だけ用意しておく(ランキング画面と同じ割り切り)。
      return `
        <div class="scene-text">${sceneHeadingHtml('マイページ')}</div>
        ${backBtnHtml}
        <p class="log-entry system">読み込み中……</p>
      `;
    }
    if(cache.loading){
      return `
        <div class="scene-text">${sceneHeadingHtml(cache.fallbackName || 'マイページ')}</div>
        ${backBtnHtml}
        <p class="log-entry system">読み込み中……</p>
      `;
    }
    if(cache.error){
      return `
        <div class="scene-text">${sceneHeadingHtml('マイページ')}</div>
        ${backBtnHtml}
        <p class="log-entry danger">読み込みに失敗した。時間をおいて開き直してみてほしい。</p>
      `;
    }
    const p = cache.data;
    if(!p){
      return `
        <div class="scene-text">${sceneHeadingHtml(cache.fallbackName || 'マイページ')}</div>
        ${backBtnHtml}
        <p class="inv-empty">まだ記録がありません(保存が反映されるとここに表示されます)。</p>
      `;
    }

    const roster = Array.isArray(p.roster) ? p.roster : [];
    const rosterRowsHtml = roster.length
      ? roster.map(r=>{
          const def = liverDef(r.liver_id);
          if(!def) return '';
          const snap = normalizeProfileLiverSnap(r);
          const level = (snap.jobProgress[snap.job]||{}).level || 1;
          const jobName = (JOB_DEFS[snap.job] && JOB_DEFS[snap.job].name) || snap.job;
          return `
            <div class="inv-item" style="cursor:pointer;" data-open-profile-liver="${r.liver_id}">
              <span style="width:10px;height:10px;background:${def.color};display:inline-block;margin-right:8px;"></span>
              <span class="inv-item-name">${esc(def.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">Lv.${level} ・ ${esc(jobName)} ・ <span style="color:var(--gold);">戦闘力 ${foreignCombatPower(snap)}</span></span></span>
            </div>`;
        }).join('')
      : '<p class="inv-empty">まだ仲間になったライバーがいません。</p>';

    const commentEditing = !!(state.ui && state.ui.profileCommentEditing);
    const commentHtml = isSelf
      ? (commentEditing
          ? `
            <textarea id="profileCommentInput" maxlength="60" placeholder="ひとことコメント(60文字まで)" style="width:100%;min-height:54px;font-family:var(--font-display);font-size:13px;background:var(--win-bg-2);color:var(--text-primary);border:1px solid var(--win-border);padding:8px;box-sizing:border-box;">${esc(p.comment || '')}</textarea>
            <div class="actions" style="margin-top:6px;">
              <button class="primary" id="saveProfileCommentBtn">保存</button>
              <button id="cancelProfileCommentEditBtn">キャンセル</button>
            </div>
            ${profileCommentStatus ? `<p class="log-entry ${profileCommentStatus.ok?'system':'danger'}" style="margin-top:4px;">${esc(profileCommentStatus.text)}</p>` : ''}
          `
          : `
            ${p.comment
              ? `<p class="log-entry" style="background:rgba(255,255,255,0.05);padding:8px;">${esc(p.comment)}</p>`
              : `<p class="inv-empty">コメントはまだありません。</p>`}
            ${profileCommentStatus ? `<p class="log-entry ${profileCommentStatus.ok?'system':'danger'}" style="margin-top:4px;">${esc(profileCommentStatus.text)}</p>` : ''}
          `)
      : (p.comment
          ? `<p class="log-entry" style="background:rgba(255,255,255,0.05);padding:8px;">${esc(p.comment)}</p>`
          : `<p class="inv-empty">コメントはまだありません。</p>`);

    const commentHeaderHtml = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;">
        <p class="section-label" style="margin:0;">ひとことコメント</p>
        ${(isSelf && !commentEditing) ? `<button id="editProfileCommentBtn" style="padding:3px 10px;font-size:11px;">編集</button>` : ''}
      </div>`;

    return `
      <div class="scene-text">
        ${sceneHeadingHtml(`${p.player_name}${isSelf ? '(あなた)' : ''}`)}
        ${p.title ? `<p class="log-entry" style="font-family:var(--font-mono);font-size:12px;color:var(--gold);">称号: ${esc(p.title)}</p>` : ''}
      </div>
      <div class="actions">
        <button id="backFromProfileBtn">戻る</button>
        ${!isSelf ? `<button data-open-profile-report="${targetId}" data-target-name="${esc(p.player_name)}" style="margin-left:auto;">このユーザーを通報</button>` : ''}
      </div>
      <div class="section-block">
        <p class="section-label">プロフィール</p>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
          <div class="stat-tile"><span class="stat-tile-label">所持ライバー数</span><span class="stat-tile-value">${p.character_count}</span></div>
          <div class="stat-tile"><span class="stat-tile-label">クリアステージ数</span><span class="stat-tile-value">${p.cleared_stage_count}</span></div>
          <div class="stat-tile"><span class="stat-tile-label">コロシアム最高到達</span><span class="stat-tile-value">${p.colosseum_best_floor}F</span></div>
        </div>
      </div>
      <div class="section-block">
        ${commentHeaderHtml}
        ${commentHtml}
      </div>
      <div class="section-block">
        <p class="section-label">保有ライバー</p>
        ${rosterRowsHtml}
      </div>
    `;
  }

  function renderProfileLiverDetailInner(){
    const targetId = state.ui.profileViewId || state.playerId;
    const cache = profileViewCache;
    const liverId = state.ui.profileLiverId;
    const def = liverId && liverDef(liverId);
    if(!cache || cache.playerId !== targetId || !cache.data || !def) return renderProfileInner();
    const raw = (cache.data.roster || []).find(r=>r.liver_id === liverId);
    if(!raw) return renderProfileInner();

    const snap = normalizeProfileLiverSnap(raw);
    const partySize = cache.data.party_size || 0;
    const job = JOB_DEFS[snap.job];
    const jp = snap.jobProgress[snap.job] || newJobProgress(snap.job);
    const { atkRate, actions } = foreignComputeActionRates(snap);
    const actualRateOf = key => {
      const found = actions.find(a=>a.skill.key===key);
      return found ? Math.round(found.rate) : 0;
    };

    const currentCostumeKey = snap.costume || defaultCostumeKeyFor(liverId);
    const costumeDef = costumeDefFor(liverId, currentCostumeKey) || costumeDefsFor(liverId)[0];

    const atkRow = `
      <div class="inv-item" style="border-left-color:var(--text-muted);opacity:.85;">
        <span class="inv-item-name">通常攻撃 <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">(常時習得済み・下限50%)</span></span>
        <span class="inv-item-actions">
          <span style="font-family:var(--font-mono);font-size:12px;color:var(--gold);">${Math.round(atkRate)}%</span>
        </span>
      </div>`;

    const passive = foreignEquippedPassive(liverId, snap);
    const passiveRow = passive ? `
      <div class="inv-item" style="border-left-color:${def.color};">
        <span class="inv-item-name">
          ${esc(passive.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">(${passive.always?'常時発動':'条件付き発動'})</span><br>
          <span style="color:var(--text-muted);font-size:11px;">${esc(passive.desc)}</span>
        </span>
      </div>` : '<p class="inv-empty">なし</p>';

    const skillRows = job.skills.map(s=>{
      const skillUnlocked = jp.level >= (s.unlockLevel||1);
      if(!skillUnlocked){
        return `
          <div class="inv-item" style="opacity:.4;">
            <span class="inv-item-name">
              ${uiIcon('lock')} ${esc(s.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">Lv.${s.unlockLevel}で習得</span><br>
              <span style="color:var(--text-muted);font-size:11px;">${esc(s.desc)}</span>
            </span>
          </div>`;
      }
      const enabled = (jp.loadout && jp.loadout.enabled || []).includes(s.key);
      return `
        <div class="inv-item" style="${enabled?'':'opacity:.5;'}">
          <span class="inv-item-name">
            ${esc(s.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">(${s.element?`${ELEMENT_LABELS[s.element]}属性 ・ `:''}MP${s.mpCost} ・ 発動率${s.baseRate}%${enabled?` → 実質${actualRateOf(s.key)}%`:''})</span><br>
            <span style="color:var(--text-muted);font-size:11px;">${esc(s.desc)}</span>
          </span>
        </div>`;
    }).join('');

    const equipHtml = `
      <div class="equip-row">
        <span class="equip-slot">武器</span>
        <span>${snap.equippedWeapon ? `${esc(snap.equippedWeapon.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(itemValueLabel(snap.equippedWeapon))}</span>` : '未装備'}</span>
      </div>
      <div class="equip-row">
        <span class="equip-slot">防具</span>
        <span>${snap.equippedArmor ? `${esc(snap.equippedArmor.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(itemValueLabel(snap.equippedArmor))}</span>` : '未装備'}</span>
      </div>
      <div class="equip-row">
        <span class="equip-slot">アクセサリー</span>
        <span>${snap.equippedAccessory ? `${esc(snap.equippedAccessory.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(itemValueLabel(snap.equippedAccessory))}</span>` : '未装備'}</span>
      </div>`;

    const allowedWeaponLabel = Array.from(foreignAllowedWeaponTypes(liverId, snap)).map(t=>WEAPON_TYPES[t].name).join('・') || 'なし';

    const resistances = foreignLiverResistances(snap);
    const resistanceTilesHtml = Object.keys(ELEMENT_LABELS).map(el=>{
      const value = resistances[el] || 0;
      const pct = value * 3;
      const pctLabel = pct === 0 ? '±0%' : (pct > 0 ? `+${pct}%` : `-${Math.abs(pct)}%`);
      const color = value > 0 ? 'var(--rare-uncommon)' : (value < 0 ? 'var(--danger)' : 'var(--text-primary)');
      return `
        <div class="stat-tile">
          <span class="stat-tile-label">${ELEMENT_LABELS[el]}属性耐性</span>
          <span class="stat-tile-value" style="color:${color};">${pctLabel}</span>
        </div>`;
    }).join('');
    const headlineTile = (label, value) => `
        <div class="stat-tile" style="background:rgba(255,216,99,0.08);"><span class="stat-tile-label">${label}</span><span class="stat-tile-value" style="font-size:20px;color:var(--gold);">${value}</span></div>`;
    const statTilesHtml = `
      <div class="stat-tile-grid">
        ${headlineTile('レベル', jp.level)}
        <div class="stat-tile"><span class="stat-tile-label">HP</span><span class="stat-tile-value">${snap.hp}<span style="color:var(--text-muted);font-size:12px;">/${snap.maxHp}</span></span></div>
        <div class="stat-tile"><span class="stat-tile-label">MP</span><span class="stat-tile-value">${snap.mp}<span style="color:var(--text-muted);font-size:12px;">/${snap.maxMp}</span></span></div>
        <div class="stat-tile"><span class="stat-tile-label">攻撃力</span><span class="stat-tile-value">${foreignLiverAtk(liverId, snap, partySize)}</span></div>
        <div class="stat-tile"><span class="stat-tile-label">防御力</span><span class="stat-tile-value">${foreignLiverDefStat(liverId, snap, partySize)}</span></div>
        ${headlineTile('戦闘力', foreignCombatPower(snap))}
        ${resistanceTilesHtml}
        <div class="stat-tile"><span class="stat-tile-label">EXP</span><span class="stat-tile-value">${jp.exp}<span style="color:var(--text-muted);font-size:12px;">/${expToNext(jp.level)}</span></span></div>
      </div>`;

    const liverFrom = state.ui.profileLiverFrom;
    const actionsHtml = liverFrom === 'ranking'
      ? `<div class="actions">
          <button id="viewProfileFromLiverBtn">${esc(cache.data.player_name)}のマイページを見る</button>
          <button id="backToRankingFromLiverBtn">ランキングに戻る</button>
        </div>`
      : `<div class="actions">
          <button id="backFromProfileLiverDetailBtn">マイページに戻る</button>
        </div>`;

    return `
      <div class="scene-text">
        ${sceneHeadingHtml(def.name)}
      </div>
      ${actionsHtml}
      <div class="section-block">
        <p class="section-label">ステータス</p>
        ${statTilesHtml}
        <p style="color:var(--text-muted);font-size:11px;margin:8px 0 0;">属性耐性はレベルアップでは変化しません。装備品(主に防具)に付く耐性値によってのみ増減します。</p>
      </div>
      <div class="section-block">
        <p class="section-label">装備</p>
        <p style="color:var(--text-muted);font-size:11px;margin:0 0 8px;">装備可能な武器種: ${esc(allowedWeaponLabel)}</p>
        ${equipHtml}
      </div>
      <div class="section-block">
        <p class="section-label">衣装</p>
        <p class="log-entry" style="margin:0;">${costumeDef ? esc(costumeDef.name) : '(未設定)'}</p>
      </div>
      <div class="section-block">
        <p class="section-label">パッシブスキル</p>
        ${passiveRow}
      </div>
      <div class="section-block">
        <p class="section-label">ジョブ</p>
        <p class="log-entry" style="margin:0;">${esc(job.name)}</p>
      </div>
      <div class="section-block">
        <p class="section-label">スキル</p>
        ${atkRow}
        ${skillRows}
      </div>
    `;
  }

  function renderDeadInner(){
    const lost = state.pendingDefeatGoldLoss || 0;
    const wasTutorial = state.activeDungeonId === 'tutorial';
    return `
      <div class="scene-text" style="text-align:center;padding:24px 0 8px;">
        <p style="font-family:var(--font-display);font-weight:700;font-size:30px;color:var(--danger);text-shadow:2px 2px 0 #2c5c2c;margin:0 0 16px;">力尽きた……</p>
        <p class="log-entry system">意識が遠のく中、誰かに担がれて街まで運ばれたようだ。</p>
        ${lost>0 ? `<p class="log-entry danger">所持金を ${lost} 枚落としてしまった。</p>` : ''}
        ${wasTutorial ? `<p class="log-entry reward">この経験から「運命のチケット」を1枚手に入れた。街の「召喚」で使ってみよう。</p>` : ''}
      </div>
      <div class="actions" style="justify-content:center;">
        <button class="primary" id="returnTownBtn">街に戻る</button>
      </div>
    `;
  }

  function renderMainArea(){
    let inner;
    if(state.ui.equipPickerSlot) inner = renderEquipPickerInner();
    else if(state.ui.crystalPickerSlot) inner = renderCrystalPickerInner();
    else if(state.screen === 'dungeon') inner = renderDungeonInner();
    else if(state.screen === 'party') inner = renderPartyInner();
    else if(state.screen === 'roster') inner = renderRosterInner();
    else if(state.screen === 'liverDetail') inner = renderLiverDetailInner();
    else if(state.screen === 'colosseum') inner = renderColosseumInner();
    else if(state.screen === 'inn') inner = renderInnInner();
    else if(state.screen === 'shop') inner = renderShopInner();
    else if(state.screen === 'summon') inner = renderSummonInner();
    else if(state.screen === 'exchange') inner = renderExchangeInner();
    else if(state.screen === 'enhance') inner = renderEnhanceInner();
    else if(state.screen === 'alchemy') inner = renderAlchemyInner();
    else if(state.screen === 'rift') inner = renderRiftInner();
    else if(state.screen === 'towerSelect') inner = renderTowerSelectInner();
    else if(state.screen === 'towerRun') inner = renderTowerRunInner();
    else if(state.screen === 'towerResult') inner = renderTowerResultInner();
    else if(state.screen === 'materialDungeons') inner = renderMaterialDungeonsInner();
    else if(state.screen === 'liverQuestSelect') inner = renderLiverQuestSelectInner();
    else if(state.screen === 'liverQuests') inner = renderLiverQuestsInner();
    else if(state.screen === 'liverQuestResult') inner = renderLiverQuestResultInner();
    else if(state.screen === 'prismResult') inner = renderPrismResultInner();
    else if(state.screen === 'home') inner = renderHomeInner();
    else if(state.screen === 'market') inner = renderMarketInner();
    else if(state.screen === 'rankings') inner = renderRankingsInner();
    else if(state.screen === 'rankingDetail') inner = renderRankingDetailInner();
    else if(state.screen === 'profile') inner = renderProfileInner();
    else if(state.screen === 'profileLiverDetail') inner = renderProfileLiverDetailInner();
    else if(state.screen === 'announcements') inner = renderAnnouncementsInner();
    else if(state.screen === 'announcementDetail') inner = renderAnnouncementDetailInner();
    else if(state.screen === 'dead') inner = renderDeadInner();
    else inner = renderTownInner();
    return `<div class="scene">${inner}</div>`;
  }

  /* 見出し(sceneHeadingHtml)の右側に添えて使う、ダンジョン専用の踏破率
   * ゲージ。見出しと同じ行(同じ<p>要素内)に収めることで、高さのズレを
   * 気にせず自然に揃い、色も見出しからそのまま継承される。 */
  function renderSceneProgressBadge(){
    const ds = currentDungeonState();
    if(!ds) return '';
    const { pct, label } = dungeonProgressLabelAndPct(ds);
    return `
      <span class="scene-heading-progress">
        踏破率
        <span class="badge-progress-track"><span class="badge-progress-fill" style="width:${pct}%;"></span></span>
        ${label}
      </span>`;
  }

  function renderPartyCompactRows(){
    return state.party.map(id=>{
      const ls = liverState(id);
      const def = liverDef(id);
      const hpPct = ls.maxHp>0 ? Math.round(ls.hp/ls.maxHp*100) : 0;
      const mpPct = ls.maxMp>0 ? Math.round(ls.mp/ls.maxMp*100) : 0;
      return `
        <div class="party-compact-row${ls.hp<=0?' ko':''}">
          <span class="party-compact-chip" style="background:${def.color};"></span>
          <span class="party-compact-name">${esc(def.name)}<span class="party-compact-lv">Lv.${jobProgressFor(id).level}</span></span>
          <span class="party-compact-bars">
            <span class="mini-bar-track"><span class="mini-bar-fill hp" style="width:${hpPct}%;"></span></span>
            <span class="mini-bar-track"><span class="mini-bar-fill mp" style="width:${mpPct}%;"></span></span>
            ${renderStatusEffectChips(playerStatusEffects[id])}
          </span>
          <span class="party-compact-hp">${ls.hp<=0?'戦闘不能':`${ls.hp}/${ls.maxHp}`}</span>
        </div>`;
    }).join('');
  }

  function renderColosseumInner(){
    if(inCombat && combatEnemy && combatEnemy.isColosseum){
      const hpPct = Math.max(0, Math.round(combatEnemyHp/combatEnemy._maxHp*100));
      const actionsHtml = combatPhase === 'choice'
        ? `
          <div class="actions">
            <button class="primary" id="fightBtn">戦う</button>
            <button class="danger" id="fleeBtn">逃げる</button>
          </div>`
        : `<div class="actions"><button disabled>戦闘中…</button></div>`;
      return `
        <div class="scene-text">
          ${sceneHeadingHtml(`コロシアムタワー ${combatEnemy.colosseumFloor}F`)}
          ${actionsHtml}
          <p class="log-entry" style="font-family:var(--font-mono);font-size:13px;color:var(--text-muted);margin-top:16px;">
            Lv.${combatEnemy.level} ${nameWithId(combatEnemy.name, combatEnemy.colosseumHolderId)} — HP ${Math.max(0,combatEnemyHp)}/${combatEnemy._maxHp}
          </p>
          <div class="bar-track" style="margin-bottom:6px;"><div class="bar-fill" style="width:${hpPct}%;background:linear-gradient(90deg,#7a2fc6,#b06bff);height:100%;"></div></div>
          <div style="margin-bottom:14px;">${renderStatusEffectChips(combatEnemy.statusEffects)}</div>
          ${renderLog()}
        </div>`;
    }

    const cs = state.colosseum;
    const now = Date.now();
    const cooldownLeft = Math.max(0, COLOSSEUM_COOLDOWN_MS - (now - (cs.lastChallengeAt||0)));
    const canChallenge = cooldownLeft <= 0 && state.party.length > 0;

    let gatekeeperHtml = '<p class="log-entry system">門番の情報を読み込み中……</p>';

  function toggleInventoryTab(tab){

  /* kind: 'equip'|'item'。所持品パネルと商店の「売る」は同じ装備・アイテム
   * 一覧を見ているため、ソート設定(state.ui.equipSort/itemSort)を共有する。 */
  function setSortMode(kind, mode){
    if(!state.ui) state.ui = {expandedGroups:[]};
    state.ui[kind === 'item' ? 'itemSort' : 'equipSort'] = mode;
    render();
  }

  const RARITY_SORT_ORDER = {common:0, uncommon:1, rare:2, epic:3, unique:4};
  const INVENTORY_SORT_DEFAULT = 'new_asc';
  const INVENTORY_SORT_OPTIONS = [
    { value:'new_asc',     label:'新着順(昇順)' },
    { value:'new_desc',    label:'新着順(降順)' },
    { value:'rarity_asc',  label:'レアリティ順(昇順)' },
    { value:'rarity_desc', label:'レアリティ順(降順)' },
  ];

  /* mode: 'new_asc'|'new_desc'|'rarity_asc'|'rarity_desc'。新着順は登録順
   * (配列の並び=古いものが上)を基準に、必要なら反転するだけ。
   * rarityOfはリストの各要素からレアリティの序列値を取り出す関数
   * (レアリティの概念が無い素材は-1を返し、昇順では先頭・降順では末尾に来る)。 */
  function applyInventorySort(list, mode, rarityOf){
    if(mode === 'new_desc') return [...list].reverse();
    if(mode === 'rarity_asc') return [...list].sort((a,b)=> rarityOf(a) - rarityOf(b));
    if(mode === 'rarity_desc') return [...list].sort((a,b)=> rarityOf(b) - rarityOf(a));
    return list; // new_asc
  }

  function renderItemStackRow(name, count, rarityLabel, actionHtml, desc){
    return `
      <div class="inv-item ${rarityLabel||''}" ${desc?`title="${esc(desc)}"`:''}>
        <span class="inv-item-name">${esc(name)}</span>
        <span class="inv-item-actions">
          <span style="color:var(--gold);font-family:var(--font-mono);">${count}</span>
          ${actionHtml||''}
        </span>
      </div>`;
  }

  function renderSortSelect(id, currentSort){
    const options = INVENTORY_SORT_OPTIONS.map(o=>
      `<option value="${o.value}" ${currentSort===o.value?'selected':''}>${esc(o.label)}</option>`
    ).join('');
    return `<select id="${id}" style="margin-left:auto;min-width:0;flex:0 1 auto;font-size:11px;padding:4px 4px;background:var(--win-bg-1);color:var(--text-primary);border:1px solid var(--win-border);">${options}</select>`;
  }

  /* 装備の変更は「ライバー」の詳細画面から行うため、このサイドパネルは
   * 所持品の一覧確認と破棄だけを担う。装備(武器・防具、個体ごとに
   * 別枠で保持)とアイテム(オーブ・素材、種類ごとにスタックして個数だけ
   * 保持)はデータの持ち方が違うため、タブで切り替えて表示する。
   * ソート順(新着順/レアリティ順 × 昇順/降順)は装備・アイテムそれぞれ
   * 別に保持する。 */
  function renderInventoryLane(){
    const tab = (state.ui && state.ui.inventoryTab) || 'equip';
    const equipActive = tab === 'equip';
    const equipSort = (state.ui && state.ui.equipSort) || INVENTORY_SORT_DEFAULT;
    const itemSort = (state.ui && state.ui.itemSort) || INVENTORY_SORT_DEFAULT;

    const equipList = applyInventorySort(state.inventory, equipSort, i => RARITY_SORT_ORDER[i.rarity] || 0);
    const equipHtml = equipList.length
      ? equipList.map(i=>`
          <div class="inv-item ${i.rarityLabel}" title="${esc(itemDetailText(i))}">
            <span class="inv-item-name">${esc(i.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(itemValueLabel(i))}</span></span>
            <span class="inv-item-actions">
              <button data-discard="${i.id}">破棄</button>
            </span>
          </div>`).join('')
      : `<p class="inv-empty">所持している装備はまだない。</p>`;

    const orbStacks = Object.keys(RARITY)
      .filter(key => ((state.orbs && state.orbs[key]) || 0) > 0)
      .map(key => ({ name:`${RARITY[key].label}のオーブ`, count: state.orbs[key], rarity: key }));
    const materialStacks = Object.keys(MATERIAL_DEFS)
      .filter(key => materialCount(key) > 0)
      .map(key => ({ name: MATERIAL_DEFS[key].name, count: materialCount(key), rarity: null }));
    const toolStacks = Object.keys(TOOL_DEFS)
      .filter(key => toolCount(key) > 0)
      .map(key => {
        const def = TOOL_DEFS[key];
        const usable = !def.canUse || def.canUse();
        return {
          name: def.name, count: toolCount(key), rarity: null, desc: def.desc,
          actionHtml: usable ? `<button data-use-tool="${key}">使用</button>` : ''
        };
      });
    const itemStacksBase = [...orbStacks, ...materialStacks, ...toolStacks]; // 新着順の代わり(取得順の記録が無いため、オーブ→素材→道具の固定順)
    const itemStacks = applyInventorySort(itemStacksBase, itemSort, s => s.rarity ? RARITY_SORT_ORDER[s.rarity] : -1);
    const itemHtml = itemStacks.length
      ? itemStacks.map(s=>renderItemStackRow(s.name, s.count, s.rarity, s.actionHtml, s.desc)).join('')
      : `<p class="inv-empty">アイテムはまだない。</p>`;

    return `
      <div class="panel">
        <h2>所持品</h2>
        <div style="display:flex;flex-wrap:nowrap;gap:8px;align-items:center;margin-bottom:10px;">
          <div class="tab-strip sub" style="margin-top:0;flex:0 0 auto;">
            <button data-inventory-tab="equip" class="${equipActive?'active':''}">装備</button>
            <button data-inventory-tab="item" class="${!equipActive?'active':''}">アイテム</button>
          </div>
          ${renderSortSelect('inventorySortSelect', equipActive ? equipSort : itemSort)}
        </div>
        <div class="scrollbox inventory-scroll">${equipActive ? equipHtml : itemHtml}</div>
      </div>
    `;
  }
