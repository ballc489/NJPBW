<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七彩の塔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    /* 大地(背景) */
    --field-sky:#8fcbe8;
    --field-ground:#3f7d3f;
    --field-ground-dark:#2c5c2c;

    /* ウィンドウ(定番RPGの紺ウィンドウ) */
    --win-bg-1:#1c2e6e;
    --win-bg-2:#0e1a45;
    --win-border:#f3ecd2;
    --win-border-inner:#0a1230;

    --text-primary:#f5f1de;
    --text-muted:#a9b6dd;
    --gold:#ffd863;
    --hp-red:#ef5a5a;
    --danger:#ff8a6a;
    --rare-uncommon:#8fe08f;
    --rare-rare:#ffd863;
    --rare-epic:#ff9f5a;
    --rare-unique:#ff6fd8;
    --buff:#5eea87;
    --debuff:#ffb347;
    --ailment:#e08bff;

    --font-display:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic","Meiryo",sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic","Meiryo",sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(180deg, var(--field-sky) 0%, var(--field-sky) 18%, var(--field-ground) 42%, var(--field-ground-dark) 100%);
    color:var(--text-primary);
    font-family:var(--font-body);
    min-height:100vh;
    padding:24px clamp(16px,3vw,56px) 60px;
  }
  .wrap{max-width:1680px;margin:0 auto;}

  header{
    display:flex;justify-content:space-between;align-items:flex-end;
    padding-bottom:14px;margin-bottom:20px;
    flex-wrap:wrap;gap:10px;
  }
  h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(24px,4vw,32px);
    margin:0;
    letter-spacing:0.02em;
    color:#fff;
    text-shadow:2px 2px 0 #2c5c2c, 0 0 10px rgba(0,0,0,0.35);
  }
  h1 span{color:var(--gold);}
  .subtitle{font-family:var(--font-mono);font-size:12px;color:#eef3ff;letter-spacing:0.08em;margin-top:4px;text-shadow:1px 1px 0 #2c5c2c;}
  .depth-badge{
    font-family:var(--font-mono);
    font-size:12px;color:var(--gold);
    border:2px solid var(--win-border);
    box-shadow:inset 0 0 0 2px var(--win-border-inner);
    padding:8px 14px;border-radius:0;
    background:linear-gradient(180deg,var(--win-bg-1),var(--win-bg-2));
    white-space:nowrap;
    display:flex;flex-direction:column;gap:5px;min-width:150px;
  }
  .badge-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .badge-location{color:#eef3ff;font-size:11px;letter-spacing:0.03em;justify-content:flex-start;}
  .badge-progress-track{flex:1 1 auto;height:6px;background:#0a1230;border:1px solid var(--win-border-inner);}
  .badge-progress-fill{display:block;height:100%;background:linear-gradient(90deg,#3a7a3a,var(--rare-uncommon));}
  .badge-resources{display:flex;align-items:center;gap:12px;}
  .badge-resource{color:var(--gold);font-size:14px;font-weight:700;white-space:nowrap;}

  /* 合成画面のオーブ所持数チップ。装備一覧のレアリティ色(border-left)と
   * 揃え、名前と数字の役割を色で分離する。 */
  .orb-chip-row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;}
  .orb-chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 10px;font-size:12px;white-space:nowrap;
    background:var(--win-bg-2);border:1px solid var(--win-border-inner);
    border-left:3px solid var(--text-muted);
  }
  .orb-chip.uncommon{border-left-color:var(--rare-uncommon);}
  .orb-chip.rare{border-left-color:var(--rare-rare);}
  .orb-chip.epic{border-left-color:var(--rare-epic);}
  .orb-chip-label{color:var(--text-muted);}
  .orb-chip-count{color:var(--gold);font-family:var(--font-mono);font-weight:700;}

  .layout{display:grid;grid-template-columns:minmax(0,1fr) 300px 300px;gap:22px;align-items:start;}
  @media (max-width:1180px){.layout{grid-template-columns:minmax(0,1fr) 250px 250px;gap:16px;}}
  @media (max-width:900px){.layout{grid-template-columns:1fr;}}
  /* マーケット画面: 商品を一覧しやすいよう、右2枠(パーティ/所持品)を
   * 隠して全幅表示にする。 */
  .layout.layout-full{grid-template-columns:minmax(0,1fr);}
  .layout.layout-full > div:nth-child(2),
  .layout.layout-full > div:nth-child(3){display:none;}

  /* モバイルでは冒険の記録が画面下部に固定されないため、バトルログを
   * 含む詳細ログをメインウィンドウ内にも出す(PCでは逆に隠す)。 */
  .log-mobile-only{display:none;}
  @media (max-width:900px){
    .log-desktop-only{display:none;}
    .log-mobile-only{display:block;}
  }

  /* --- PC(901px以上)でプレイ中の画面のみ: 冒険の記録/チャット欄を画面
   * 最下部に固定し、メイン画面・パーティ・所持品はその上の残り高さに
   * 収める。戦闘中にログの行数が変わってもウィンドウ全体の高さや
   * スクロール位置が動かないようにするための構成(body.playingは
   * render()内でのみ付与される。キャラ作成・次元断層ロック画面は対象外)。 */
  @media (min-width:901px){
    body.playing{
      height:100vh;
      overflow-y:auto;
      padding:10px clamp(16px,3vw,56px) 10px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }
    body.playing .wrap{
      width:100%;
      flex:1 1 auto;
      min-height:0;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    /* メインウィンドウの高さを少しでも稼ぐため、プレイ中のヘッダー
     * (タイトル・右上のリソース表示)は詰めて表示する。 */
    body.playing header{flex:0 0 auto;padding-bottom:6px;margin-bottom:8px;}
    body.playing h1{font-size:clamp(18px,2.2vw,22px);}
    body.playing .subtitle{margin-top:1px;font-size:10px;}
    body.playing .depth-badge{padding:5px 10px;gap:3px;min-width:120px;}
    body.playing .badge-resource{font-size:12px;}
    body.playing .layout{flex:1 1 auto;min-height:0;align-items:stretch;}
    body.playing .layout > div{display:flex;flex-direction:column;min-height:0;}
    body.playing .layout > div > .scene{flex:1 1 auto;min-height:0;overflow-y:auto;}
    body.playing .layout > div > .panel{
      flex:1 1 auto;min-height:0;margin-bottom:0;
      display:flex;flex-direction:column;overflow:hidden;
    }
    body.playing .layout > div > .panel .inventory-scroll{flex:1 1 auto;min-height:0;max-height:none;}
    body.playing .history-panel{flex:0 0 auto;margin-top:16px;}
  }

  /* --- 共通スクロールボックス --- */
  .scrollbox{overflow-y:auto;padding-right:6px;}
  .scrollbox::-webkit-scrollbar{width:6px;}
  .scrollbox::-webkit-scrollbar-thumb{background:var(--win-border);}

  /* --- Scene viewport: classic RPG window --- */
  .scene{
    position:relative;
    background:linear-gradient(180deg,var(--win-bg-1),var(--win-bg-2));
    border:2px solid var(--win-border);
    box-shadow:inset 0 0 0 2px var(--win-border-inner);
    border-radius:0;
    padding:26px 28px;
    min-height:260px;
    display:block;
  }

  .scene-heading-progress{
    display:inline-flex;align-items:center;gap:8px;
    flex:0 0 auto;
    white-space:nowrap;
  }
  .scene-heading-progress .badge-progress-track{width:70px;flex:0 0 auto;}

  .scene-text{
    font-size:16px;line-height:1.8;
    min-height:32px;
  }
  .scene-text .log-entry{margin:0 0 6px;}
  .scene-text .log-entry.combat{color:#ffd0b0;}
  .scene-text .log-entry.reward{color:var(--gold);}
  .scene-text .log-entry.danger{color:var(--danger);}
  .scene-text .log-entry.system{color:var(--text-muted);}
  .scene-text .log-entry.dialogue{color:#c9b8ff;font-style:italic;}

  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}

  /* タブ切り替え用のUI。ボタン群(.actions)とは見た目を分け、下線で
   * 現在位置を示す形にする(詳細/台詞の切り替え、台詞タブ内の
   * 共通/ジョブ別の切り替えで使用)。 */
  .tab-strip{display:flex;gap:2px;margin-top:16px;border-bottom:2px solid var(--win-border-inner);flex-wrap:wrap;}
  .tab-strip button{
    background:none;border:none;box-shadow:none;border-radius:0;
    padding:8px 16px;margin-bottom:-2px;
    border-bottom:3px solid transparent;
    color:var(--text-muted);font-weight:400;
    transition:color .1s, border-color .1s;
  }
  .tab-strip button:hover:not(:disabled):not(.active){color:var(--text-primary);background:none;padding-left:16px;}
  .tab-strip button.active{color:var(--gold);border-bottom-color:var(--gold);font-weight:600;}
  .tab-strip button:disabled{opacity:.4;cursor:not-allowed;}
  .tab-strip.sub{border-bottom:1px solid var(--win-border-inner);margin-top:12px;}
  .tab-strip.sub button{padding:6px 12px;font-size:12px;}
  .save-flash{color:var(--buff);font-size:12px;font-weight:600;}
  button{
    font-family:var(--font-body);font-size:14px;
    background:linear-gradient(180deg,var(--win-bg-1),var(--win-bg-2));
    color:var(--text-primary);
    border:2px solid var(--win-border);
    box-shadow:inset 0 0 0 1px var(--win-border-inner);
    padding:10px 18px;border-radius:0;
    cursor:pointer;
    transition:border-color .1s, background .1s, padding-left .1s;
  }
  button:hover:not(:disabled){border-color:var(--gold);background:linear-gradient(180deg,#28398a,#152252);padding-left:22px;}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  button:disabled{opacity:0.4;cursor:not-allowed;}
  button.primary{border-color:var(--gold);color:#fff;font-weight:600;}
  button.primary:hover:not(:disabled){background:linear-gradient(180deg,#2d4099,#17245c);}
  button.danger{border-color:var(--danger);}
  button.danger:hover:not(:disabled){background:linear-gradient(180deg,#5a2a2a,#3a1717);}

  .section-label{
    font-family:var(--font-mono);font-size:11px;color:var(--gold);
    letter-spacing:.08em;margin:0 0 8px;text-transform:uppercase;
  }
  .section-block{margin-top:18px;}
  .name-input{
    width:100%;padding:10px;font-family:var(--font-body);font-size:14px;
    background:#0e1a45;border:2px solid var(--win-border);color:var(--text-primary);
    border-radius:0;margin-top:8px;
  }

  /* --- Sidebar: character sheet --- */
  .panel{
    background:linear-gradient(180deg,var(--win-bg-1),var(--win-bg-2));
    border:2px solid var(--win-border);
    box-shadow:inset 0 0 0 2px var(--win-border-inner);
    border-radius:0;
    padding:16px;
    margin-bottom:16px;
  }
  .panel h2{
    font-family:var(--font-mono);
    font-size:11px;letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 12px;
    border-bottom:1px solid rgba(255,255,255,0.25);
    padding-bottom:8px;
  }
  .scene-heading{
    font-family:var(--font-mono);
    font-size:11px;letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 14px;
    border-bottom:1px solid rgba(255,255,255,0.25);
    padding-bottom:8px;
    display:flex;justify-content:space-between;align-items:center;gap:14px;
  }
  .history-panel{margin-top:16px;}
  .history-log{
    max-height:var(--history-log-height, 170px);
    font-family:var(--font-mono);font-size:12px;line-height:1.65;
  }
  .history-log p{margin:0 0 4px;}
  .history-log .combat{color:#ffd0b0;}
  .history-log .reward{color:var(--gold);}
  .history-log .danger{color:var(--danger);}
  .history-log .system{color:var(--text-muted);}
  .history-log .dialogue{color:#c9b8ff;font-style:italic;}

  .inventory-scroll{max-height:280px;}
  .equip-picker-scroll{max-height:min(50vh, 420px);}
  .char-name{font-family:var(--font-display);font-size:19px;font-weight:700;margin:0 0 2px;color:#fff;}
  .char-level{font-family:var(--font-mono);font-size:12px;color:var(--gold);margin:0 0 14px;}

  .bar-row{margin-bottom:10px;}
  .bar-label{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-bottom:3px;}
  .bar-track{height:10px;background:#0a1230;border-radius:0;overflow:hidden;border:1px solid var(--win-border);}
  .bar-fill{height:100%;transition:width .3s ease;}
  .bar-fill.hp{background:linear-gradient(90deg,#c62f2f,var(--hp-red));}
  .bar-fill.mp{background:linear-gradient(90deg,#2a5ec9,#5a9bf0);}
  .bar-fill.exp{background:linear-gradient(90deg,#c99a1e,var(--gold));}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-family:var(--font-mono);font-size:13px;margin-top:12px;}
  .stat-grid div{color:var(--text-muted);}
  .stat-grid strong{color:var(--text-primary);font-weight:600;}

  .equip-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,0.2);}
  .equip-row:last-child{border-bottom:none;}
  .equip-slot{color:var(--text-muted);font-family:var(--font-mono);font-size:11px;}
  .equip-row button{padding:3px 9px;font-size:11px;margin-left:8px;}

  /* ライバー詳細画面などのステータス欄。項目ごとに小さなタイルで区切る
   * (単なる横並びテキストや、端から端まで伸びるバー状の行より
   * 「項目感」が出るデザインとして採用)。 */
  .stat-tile-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,auto);grid-auto-flow:column;gap:8px;}
  .stat-tile{background:rgba(255,255,255,0.05);border-left:3px solid var(--gold);padding:7px 10px;}
  .stat-tile .stat-tile-label{display:block;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:.04em;}
  .stat-tile .stat-tile-value{display:block;font-family:var(--font-mono);font-size:16px;color:var(--text-primary);margin-top:2px;}

  .inv-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:7px 8px;margin-bottom:6px;
    background:rgba(255,255,255,0.06);border-radius:0;font-size:13px;
    border-left:4px solid var(--text-muted);
    cursor:default;
  }
  .inv-item.common{border-left-color:var(--text-muted);}
  .inv-item.uncommon{border-left-color:var(--rare-uncommon);}
  .inv-item.rare{border-left-color:var(--rare-rare);}
  .inv-item.epic{border-left-color:var(--rare-epic);}
  .inv-item.unique{border-left-color:var(--rare-unique);box-shadow:inset 0 0 10px rgba(255,111,216,0.18);}
  .inv-item button{padding:4px 10px;font-size:11px;}
  .inv-item-name{flex:1 1 auto;min-width:0;margin-right:8px;overflow-wrap:break-word;}
  .inv-item-actions{flex:0 0 auto;display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .inv-empty{color:var(--text-muted);font-size:12px;font-style:italic;}

  .gold-line{font-family:var(--font-mono);font-size:13px;color:var(--gold);margin-top:6px;}

  .party-compact-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,0.15);}
  .party-compact-row:last-of-type{border-bottom:none;}
  .party-compact-row.ko{opacity:.5;}
  .party-compact-chip{width:9px;height:9px;flex:0 0 auto;display:inline-block;}
  .party-compact-name{font-family:var(--font-mono);font-size:12px;width:82px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .party-compact-lv{display:block;color:var(--text-muted);font-size:10px;}
  .party-compact-bars{flex:1 1 auto;display:flex;flex-direction:column;gap:3px;}
  .mini-bar-track{display:block;height:5px;background:#0a1230;border:1px solid var(--win-border-inner);}
  .mini-bar-fill{display:block;height:100%;}
  .mini-bar-fill.hp{background:linear-gradient(90deg,#c62f2f,var(--hp-red));}
  .mini-bar-fill.mp{background:linear-gradient(90deg,#2a5ec9,#5a9bf0);}
  .party-compact-hp{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);width:60px;flex:0 0 auto;text-align:right;}

  /* バフ/デバフ/状態異常アイコン(絵文字は使わず自作のインラインSVG) */
  .icon-row{display:flex;gap:6px;margin-top:3px;flex-wrap:wrap;}
  .icon-chip{
    position:relative;
    width:18px;height:18px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    border:1.5px solid currentColor;
    cursor:default;
  }
  .icon-chip svg{width:12px;height:12px;display:block;}
  .icon-chip.buff{color:var(--buff);background:rgba(94,234,135,0.22);}
  .icon-chip.debuff{color:var(--debuff);background:rgba(255,179,71,0.22);}
  .icon-chip.ailment{color:var(--ailment);background:rgba(224,139,255,0.22);}
  .icon-chip .turns{
    position:absolute;right:-4px;bottom:-5px;
    font-family:var(--font-mono);font-size:8px;font-weight:700;line-height:1;
    color:#0a1230;padding:1px 2.5px;border-radius:5px;
  }
  .icon-chip.buff .turns{background:var(--buff);}
  .icon-chip.debuff .turns{background:var(--debuff);}
  .icon-chip.ailment .turns{background:var(--ailment);}
  .icon-chip[title]:hover{outline:1px solid var(--gold);outline-offset:1px;}

  /* UI全体の小アイコン(絵文字は使わず自作のインラインSVG) */
  .ui-icon{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;margin-right:2px;flex:0 0 auto;}

  /* 見出し横のヘルプボタンと、そのコンテンツ説明のポップアップ。
   * アイコン自体(uiIcon('help'))が既に丸+「?」の形をしているため、
   * ボタン側は枠・背景・角丸を持たない「文字だけ押せる」形にする
   * (通常のbuttonにあるホバー時のpadding-left拡張アニメーションも
   * このボタンだけは無効化し、カーソルを合わせても動かないようにする)。 */
  .help-btn{
    padding:0;width:auto;height:auto;min-width:0;
    background:none;border:none;box-shadow:none;
    flex:0 0 auto;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    color:var(--gold);
  }
  .help-btn:hover:not(:disabled){
    background:none;border:none;padding:0;padding-left:0;color:#fff;
  }
  .help-btn .ui-icon{width:16px;height:16px;margin:0;}
  .help-popup-backdrop{
    position:fixed;inset:0;background:rgba(10,18,48,0.72);
    display:flex;align-items:center;justify-content:center;
    padding:24px;z-index:100;
  }
  .help-popup{
    background:linear-gradient(180deg,var(--win-bg-1),var(--win-bg-2));
    border:2px solid var(--win-border);
    box-shadow:inset 0 0 0 2px var(--win-border-inner);
    padding:22px;max-width:440px;width:100%;
  }
  .help-popup .log-entry{font-size:14px;line-height:1.8;}
  .market-popup-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,0.2);}
  .market-qty-input{
    width:100%;background:#0e1a45;border:1.6px solid var(--win-border);color:var(--text-primary);
    font-family:var(--font-mono);font-size:14px;padding:7px 9px;text-align:right;margin-top:4px;
  }

  /* お知らせのタグ・未読バッジ */
  .tag-chip{
    display:inline-block;
    font-family:var(--font-mono);font-size:10px;
    color:var(--gold);border:1px solid var(--gold);
    padding:1px 6px;margin:0 4px 4px 0;
  }
  .notify-badge{
    display:inline-block;
    font-family:var(--font-mono);font-size:10px;font-weight:700;
    background:var(--gold);color:#1c2e6e;
    border-radius:8px;padding:1px 6px;margin-left:6px;
    vertical-align:middle;
  }

  /* チャット各投稿の通報トリガー。目立たせすぎず、気付いた人だけが
   * 押せる程度の視認性にとどめる(絵文字ではなくU+22EEを使用)。 */
  .chat-report-trigger{

  .tos-panel p{color:var(--text-primary);text-align:left;}
  .tos-panel strong{color:#fff;}
  .create-liver-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px;}
  .create-liver-card{
    display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;

  /* depthに応じて「プレイヤーlevelとの差」の出やすさを変える重み表 */
  function pickLevelOffset(depth){
    const tiers = depth <= 5
      ? [[-1,20],[0,55],[1,20],[2,5]]
      : depth <= 15
        ? [[-1,5],[0,30],[1,35],[2,22],[3,8]]
        : [[0,10],[1,25],[2,30],[3,25],[4,10]];
    const total = tiers.reduce((s,t)=>s+t[1],0);
    let r = Math.random()*total;
    for(const [off,w] of tiers){ if(r < w) return off; r -= w; }
    return 0;
  }

  /* パーティ人数が多いほど1ラウンドの総火力が上がるため、敵HPを人数に応じて
   * 底上げする(4人編成が既定の想定バランス値=1.0倍)。人数は編成に合わせて
   * 増減可能なので、少人数パーティでは相対的に敵が弱く感じられる想定。
   * 実際のバランスは今後の調整用に係数だけ切り出してある。 */
  function partySizeHpMult(){
    const n = Math.max(1, state.party.length);
    return 0.4 + n*0.6; // 1人:1.0 / 2人:1.6 / 3人:2.2 / 4人:2.8
  }

  const BOSS_LEVEL_PREMIUM = 4; // ボスは「そのダンジョンのレベル+この値」で固定(パーティの強さは見ない)

  function spawnEnemy(dungeonDef, depth, isBoss){
    if(isBoss){
      const b = dungeonDef.boss;
      const level = Math.max(1, dungeonDef.level + BOSS_LEVEL_PREMIUM);
      const base = statsForLevel(level);
      const hp  = Math.max(5, Math.round(base.hp  * b.hpMult * partySizeHpMult()));
      const atk = Math.max(1, Math.round(base.atk * b.atkMult));
      const def = Math.max(0, Math.round(base.def * b.defMult));
      const exp = Math.round(base.exp * 1.6);
      return {name:b.name, level, hp, maxHp:hp, atk, def, exp, boss:true, skills:b.skills||[], weakness:b.weakness||null};
    }
    const pool = ENEMY_POOLS[dungeonDef.pool] || ENEMY_POOLS.ashen;
    const type = pool[Math.floor(Math.random()*pool.length)];
    /* 敵の強さはパーティの強さではなく、そのダンジョン固有のレベルを基準にする。
     * こうすることで、育った仲間を連れて序盤のダンジョンへ新キャラを鍛えに
     * 戻っても、敵の強さは変わらず安全に育成できる(意図的な設計)。
     * チュートリアル専用ダンジョンだけは、深度が進んでも雑魚が強くならない
     * よう常にLv.1固定にする(Lv.1・1人パーティを想定した唯一のダンジョンのため)。 */
    const level = dungeonDef.id === 'tutorial' ? 1 : Math.max(1, dungeonDef.level + pickLevelOffset(depth));
    const base = statsForLevel(level);
    const hp  = Math.max(5, Math.round(base.hp  * type.hpMult * partySizeHpMult()));
    const atk = Math.max(1, Math.round(base.atk * type.atkMult));
    const def = Math.max(0, Math.round(base.def * type.defMult));
    const exp = Math.round(base.exp);
    return {name:type.name, level, hp, maxHp:hp, atk, def, exp, boss:false, skills:type.skills||[], weakness:type.weakness||null};
  }

  /* 武器種カタログ。ジョブごとの装備可否はJOB_DEFS[job].weaponTypesで、
   * ライバー個人の追加適正はLIVER_DEFS[id].weaponAptitudeで管理する
   * (装備可否 = job.weaponTypes ∪ liver.weaponAptitude)。 */
  const WEAPON_TYPES = {
    sword:      { name:'剣',     base:'鋼の剣' },
    greatsword: { name:'大剣',   base:'鋼の大剣' },
    axe:        { name:'斧',     base:'鋼の斧' },
    spear:      { name:'槍',     base:'鋼の槍' },
    dagger:     { name:'短剣',   base:'鋼の短剣' },
    bow:        { name:'弓',     base:'木の弓' },
    staff:      { name:'杖',     base:'白木の杖' },
    grimoire:   { name:'魔導書', base:'古びた魔導書' },
  };
  const ARMOR_BASES = ['鉄の鎧','革の外套','木の盾','鎖帷子','古代の護符'];

  /* unique(固有装備専用のレアリティ)はweight:0とし、rollRarity()の
   * 通常抽選には一切乗らない(常に専用の生成関数から直接作られる)。
   * 抽選プール以外でObject.keys(RARITY)を使っている箇所(素材ダンジョンの
   * 宝箱抽選プール・所持品/合成画面のオーブ内訳など)は、'unique'を
   * 明示的に除外して扱うこと。 */
  const RARITY = {
    common:   {label:'コモン',   cls:'common',   mult:1.0, weight:60},
    uncommon: {label:'アンコモン',cls:'uncommon', mult:1.5, weight:25},
    rare:     {label:'レア',     cls:'rare',     mult:2.2, weight:12},
    epic:     {label:'エピック', cls:'epic',     mult:3.2, weight:3},
    unique:   {label:'ユニーク', cls:'unique',   mult:4.0, weight:0},
  };

  /* ---------------------------------------------------------------
   * アクセサリー・クリスタル
   * 武器・防具とは別枠の装備(1人1個まで)。アクセサリー本体は「主効果」
   * 1つと「クリスタルスロット」(0〜5)を持ち、スロットには「消費スロット数」
   * (1〜3)を持つクリスタルを、合計消費が枠を超えない範囲で何個でも装備できる。
   * 主効果と同じ種類の効果を持つクリスタルを装備すると、その主効果自体・
   * 該当クリスタル自体、それぞれの数値が同種ボーナス倍率だけ上乗せされる
   * (計算はcomputeAccessoryEffects()に集約)。
   *
   * 効果の種類は、ステータス系(HP/MP/攻撃力/防御力の%上昇)・属性耐性系
   * (既存の武器防具と同じ+N方式)・特殊系(ドロップ率/クリティカル率/
   * 状態異常耐性)の10種。数値の振れ幅は種類ごとに固定(レアリティでは
   * 変えない。レアリティが効くのはアクセサリーのスロット数だけ)。
   * --------------------------------------------------------------- */
  const SAME_EFFECT_BONUS_MULT = 1.1;
  const ACCESSORY_EFFECT_DEFS = {
    hpPct:         { label:'HP',           unit:'%', min:1, max:3 },
    mpPct:         { label:'MP',           unit:'%', min:1, max:3 },
    atkPct:        { label:'攻撃力',       unit:'%', min:1, max:3 },
    defPct:        { label:'防御力',       unit:'%', min:1, max:3 },
    fireResist:    { label:'火属性耐性',   unit:'',  min:1, max:10 },
    iceResist:     { label:'氷属性耐性',   unit:'',  min:1, max:10 },
    thunderResist: { label:'雷属性耐性',   unit:'',  min:1, max:10 },
    dropRate:      { label:'ドロップ率',   unit:'%', min:1, max:3 },
    critChance:    { label:'クリティカル率', unit:'%', min:1, max:3 },
    ailmentResist: { label:'状態異常耐性', unit:'%', min:1, max:10 },
  };
  /* アクセサリー名は、にじさんじの配信システムにある「アクセサリー」機能
   * (配信者が顔周りに着ける装飾)のイメージに倣った名称プール。 */
  const ACCESSORY_NAME_POOL = [
    'うさ耳','王冠','集中線','天使の輪','悪魔の角','猫耳','星のかんむり',
    'リボン','ヘッドセット','眼鏡','蝶リボン','花冠','ちょうちょ髪飾り'
  ];
  const CRYSTAL_NAME_BY_EFFECT = {
    hpPct:'生命のクリスタル', mpPct:'精神のクリスタル',
    atkPct:'剛力のクリスタル', defPct:'守護のクリスタル',
    fireResist:'紅蓮のクリスタル', iceResist:'氷結のクリスタル', thunderResist:'雷光のクリスタル',
    dropRate:'強奪のクリスタル', critChance:'会心のクリスタル', ailmentResist:'加護のクリスタル'
  };
  function pickAccessoryEffectType(){
    const keys = Object.keys(ACCESSORY_EFFECT_DEFS);
    return keys[Math.floor(Math.random()*keys.length)];
  }
  /* valueMultは通常1(補正無し)。プリズムタワー産のみ、到達階に応じて
   * ここに1より大きい値を渡し、レアリティ表記(=市場価値の指標)には
   * 一切触れずに数値だけを底上げする(階層が上がるほど「同じレアリティ
   * でもより強い個体が出やすい」を実現するための唯一の掛かり所)。 */
  function rollAccessoryEffectValue(effectType, valueMult){
    const def = ACCESSORY_EFFECT_DEFS[effectType];
    if(!def) return 1;
    const base = rnd(def.min, def.max);
    return valueMult ? Math.max(def.min, Math.round(base * valueMult)) : base;
  }
  const ACCESSORY_SLOT_COUNT_RANGE = { common:[0,1], uncommon:[1,2], rare:[2,4], epic:[3,5] };
  function makeAccessory(rarityKey, valueMult){
    rarityKey = rarityKey || rollRarity();
    const rarity = RARITY[rarityKey];
    const effectType = pickAccessoryEffectType();
    const range = ACCESSORY_SLOT_COUNT_RANGE[rarityKey] || [0,1];
    return {
      id: 'itm_'+Math.random().toString(36).slice(2,9),
      type:'accessory', rarity:rarityKey, rarityLabel:rarity.cls,
      name: ACCESSORY_NAME_POOL[Math.floor(Math.random()*ACCESSORY_NAME_POOL.length)],
      mainEffect: { type: effectType, value: rollAccessoryEffectValue(effectType, valueMult) },
      slotCount: rnd(range[0], range[1]),
      crystals: []
    };
  }
  function makeCrystal(rarityKey, valueMult){
    rarityKey = rarityKey || rollRarity();
    const rarity = RARITY[rarityKey];
    const effectType = pickAccessoryEffectType();
    return {
      id: 'itm_'+Math.random().toString(36).slice(2,9),
      type:'crystal', rarity:rarityKey, rarityLabel:rarity.cls,
      name: CRYSTAL_NAME_BY_EFFECT[effectType] || 'クリスタル',
      effect: { type: effectType, value: rollAccessoryEffectValue(effectType, valueMult) },
      slotCost: rnd(1,3)
    };
  }
  function accessoryEffectLabel(effect){
    const def = effect && ACCESSORY_EFFECT_DEFS[effect.type];
    if(!def) return '';
    const sign = effect.value > 0 ? '+' : '';
    return `${def.label}${sign}${effect.value}${def.unit}`;
  }
  /* アクセサリー本体の装備効果を集計する。同種ボーナス(主効果と同じ種類の
   * クリスタルが装備されている場合、主効果・該当クリスタルの両方に効く)は
   * ここに集約する。他プレイヤーのプロフィール閲覧(foreignAccessoryEffects)
   * でも同じロジックを使う。 */
  function computeAccessoryEffects(accessory){
    const totals = {};
    if(!accessory || !accessory.mainEffect) return totals;
    const crystals = accessory.crystals || [];
    const hasMatch = crystals.some(c=>c.effect && c.effect.type === accessory.mainEffect.type);
    const mainValue = accessory.mainEffect.value * (hasMatch ? SAME_EFFECT_BONUS_MULT : 1);
    totals[accessory.mainEffect.type] = (totals[accessory.mainEffect.type]||0) + mainValue;
    crystals.forEach(c=>{
      if(!c.effect) return;
      const matches = c.effect.type === accessory.mainEffect.type;
      const value = c.effect.value * (matches ? SAME_EFFECT_BONUS_MULT : 1);
      totals[c.effect.type] = (totals[c.effect.type]||0) + value;
    });
    return totals;
  }
  function liverAccessoryEffects(id){
    const ls = liverState(id);
    return computeAccessoryEffects(ls && ls.equipped && ls.equipped.accessory);
  }
  function foreignAccessoryEffects(snap){
    return computeAccessoryEffects(snap && snap.equippedAccessory);
  }

  /* ---------------------------------------------------------------
   * プリズムタワー(素材ダンジョン)
   * 1〜10階の各階が独立したDUNGEON_DEFSエントリ(isPrismTower:true)。
   * 中身の探索ループ自体は通常ダンジョンのadvance()/challengeBoss()を
   * 流用しつつ、以下の点だけ差し替える:
   *   ・イベント確率(戦闘80%/素材宝箱15%/装備品宝箱4%/ミミック1%)
   *   ・ドロップ内容(武器防具は出ず、専用素材・アクセサリー・クリスタルのみ)
   *   ・突入時にスタミナを(階数×10)まとめて消費し、以降は探索中無消費
   *   ・踏破率は勝敗撤退を問わずダンジョンを出るたびに必ず0へ戻す
   *   ・ボス撃破後は七彩の塔と同様、リザルト画面を挟んで町へ強制送還
   * レアリティ自体は通常通りランダム(rollRarity())のままにし、階層による
   * 底上げは「同じレアリティの中での数値の強さ」だけに掛ける
   * (rollAccessoryEffectValueのvalueMult引数)。これによりレアリティは
   * 引き続き「相対的な希少さ」を表す指標として市場価値と直結したまま、
   * 「上の階ほど数字が伸びやすい」という報酬感を両立させる狙い。
   * --------------------------------------------------------------- */
  const PRISM_FLOOR_COUNT = 10;
  const PRISM_MATERIAL_KEY = 'prism_shard';
  function prismValueMult(floorNum){ return 1 + (floorNum-1) * 0.1; } // 1F:1.0倍 〜 10F:1.9倍
  function prismFloorDef(id){ return dungeonDefById(id); }

  /* tierPool: ['common','uncommon'](普遍的枠) または ['rare','epic'](レア目枠)。
   * アクセサリーとクリスタルは五分五分で抽選する。 */
  /* tierPool内のレア度を、均等ではなく通常のRARITY.weightに従って重み付き
   * 抽選する(均等抽選だとエピックがレアと同じ確率で出てしまい、「レア目枠」
   * のはずが実質エピック確定枠のようになってしまうため)。 */
  function prismPickRarityFromPool(tierPool){
    const total = tierPool.reduce((s,k)=>s+(RARITY[k].weight||0), 0);
    let r = Math.random()*total;
    for(const k of tierPool){
      if(r < RARITY[k].weight) return k;
      r -= RARITY[k].weight;
    }
    return tierPool[0];
  }
  function prismRollEquip(tierPool, floorNum){
    const rarityKey = prismPickRarityFromPool(tierPool);
    const valueMult = prismValueMult(floorNum);
    return Math.random() < 0.5 ? makeAccessory(rarityKey, valueMult) : makeCrystal(rarityKey, valueMult);
  }
  function grantPrismMaterial(qty){
    state.materials[PRISM_MATERIAL_KEY] = materialCount(PRISM_MATERIAL_KEY) + qty;
  }
  /* 通常戦闘・ボス戦、両方のドロップ抽選をここに集約する。
   * 通常戦闘(80%枠)勝利時: 全体10%(素材5%/普遍的枠3%/レア目枠2%)、
   * 外れの90%は何も出ない。
   * ボス撃破時: 全体10%(普遍的枠6%/レア目枠4%、素材無し)だが、外れの
   * 90%は「何も出ない」代わりに専用素材を3個渡す(ボス戦でハズレだけは
   * 味気ないため、通常戦闘とは違いここだけ救済する)。 */
  function rollPrismDrop(floorNum, isBoss){
    const roll = Math.random();
    if(isBoss){
      if(roll < 0.06) return { equip: prismRollEquip(['common','uncommon'], floorNum), materialQty: 0 };
      if(roll < 0.10) return { equip: prismRollEquip(['rare','epic'], floorNum), materialQty: 0 };
      return { equip: null, materialQty: 3 };
    }
    if(roll < 0.05) return { equip: null, materialQty: 1 };
    if(roll < 0.08) return { equip: prismRollEquip(['common','uncommon'], floorNum), materialQty: 0 };
    if(roll < 0.10) return { equip: prismRollEquip(['rare','epic'], floorNum), materialQty: 0 };
    return { equip: null, materialQty: 0 }; // 通常戦闘の外れ(90%)は何もドロップしない(ボス戦のみ素材で救済する)
  }
  function maybeDropPrismItem(floorNum){
    const drop = rollPrismDrop(floorNum, false);
    if(drop.equip){
      if(addItemToInventory(drop.equip)) pushLog(`「${drop.equip.name}」を手に入れた。`, 'reward');
    } else if(drop.materialQty > 0){
      grantPrismMaterial(drop.materialQty);
      pushLog(`「${MATERIAL_DEFS[PRISM_MATERIAL_KEY].name}」を${drop.materialQty}個手に入れた。`, 'reward');
    }
  }

  /* 合成(装備強化)。強化値+1ごとに基礎値の5%を加算(5%分が1未満なら
   * 最低+1を保証)。最大+10まで(基礎値が十分大きい装備ではおよそ+50%)。 */
  const ENHANCE_MAX_LEVEL = 10;
  function itemEnhanceIncrement(baseValue){
    return Math.max(1, Math.round(baseValue * 0.05));
  }
  function itemEffectiveValue(item){
    const level = item.enhanceLevel || 0;
    if(level <= 0) return item.value;
    return item.value + itemEnhanceIncrement(item.value) * level;
  }

  /* 錬金の大成功: 出来上がったアイテムが装備(武器・防具)の時だけ判定する。
   * 素材・道具など強化値の概念が無いものには適用しない。 */
  function rollAlchemyGrade(){
    const r = Math.random() * 100;
    if(r < 2) return 3;
    if(r < 5) return 2;
    if(r < 10) return 1;
    return 0;
  }

  const ALCHEMY_RECIPES = [
    {
      id:'refine_iron_ore', category:'素材',
      name:'上質な鉄鉱石',
      materials:[{key:'iron_ore', qty:5}],

    },
    {

        id:'itm_'+Math.random().toString(36).slice(2,9),

  /* カーソルを合わせた時に表示する、錬成結果アイテムの説明。装備は
   * itemDetailText()と同じ体裁(レアリティ・種別・効果値)、素材・オーブは
   * それぞれの説明文を表示する。 */
  function recipeOutputDetailText(recipe){
    const out = recipe.output;
    if(out.type === 'material'){
      const def = MATERIAL_DEFS[out.key];
      return `${def.name}: ${def.desc}`;
    }
    if(out.type === 'orb'){
      return `${RARITY[out.key].label}のオーブ: 合成で装備の強化値を上げるのに使う。`;
    }
    return itemDetailText(out.make());
  }

  function materialCount(key){
    return (state.materials && state.materials[key]) || 0;
  }
  function canAffordRecipe(recipe){
    return recipe.materials.every(m => materialCount(m.key) >= m.qty);
  }

  function craftRecipe(recipeId){
    if(!canManageEquipment()) return;
    const recipe = ALCHEMY_RECIPES.find(r=>r.id===recipeId);
    if(!recipe) return;
    if(!canAffordRecipe(recipe)) return;

    if(!state.materials) state.materials = {};
    recipe.materials.forEach(m=>{ state.materials[m.key] = materialCount(m.key) - m.qty; });

    if(recipe.output.type === 'material'){
      const key = recipe.output.key;
      state.materials[key] = materialCount(key) + recipe.output.qty;
      pushLog(`錬金に成功し、「${MATERIAL_DEFS[key].name}」を${recipe.output.qty}個手に入れた。`, 'reward');
    } else if(recipe.output.type === 'orb'){
      const key = recipe.output.key;
      if(!state.orbs) state.orbs = {};
      state.orbs[key] = (state.orbs[key]||0) + recipe.output.qty;
      pushLog(`錬金に成功し、「${RARITY[key].label}のオーブ」を${recipe.output.qty}個手に入れた。`, 'reward');
    } else if(recipe.output.type === 'item'){
      const item = recipe.output.make();
      let gradeLabel = '';
      if(item.type === 'weapon' || item.type === 'armor'){
        const grade = rollAlchemyGrade();
        if(grade > 0){ item.enhanceLevel = grade; gradeLabel = ` 大成功！(強化値+${grade})`; }
      }
      addItemToInventory(item);
      pushLog(`錬金に成功し、「${item.name}」を手に入れた。${gradeLabel}`, 'reward');
    }

    saveGame(); render();
  }

  function rollRarity(){
    const total = Object.values(RARITY).reduce((s,r)=>s+r.weight,0);
    let roll = Math.random()*total;
    for(const key in RARITY){
      if(roll < RARITY[key].weight) return key;
      roll -= RARITY[key].weight;
    }
    return 'common';
  }

  /* 防具にのみ、一定確率で属性耐性の付与(まれにマイナス=弱点化も)が付く。
   * レアリティが高いほど数値が大きくなりやすい。 */
  function rollResistAffix(rarityKey){
    if(Math.random() > 0.35) return null;
    const elements = Object.keys(ELEMENT_LABELS);
    const element = elements[Math.floor(Math.random()*elements.length)];
    const magnitudeByRarity = {common:1, uncommon:1, rare:2, epic:3};
    let value = magnitudeByRarity[rarityKey] || 1;
    if(Math.random() < 0.2) value = -Math.max(1, Math.round(value*0.7)); // まれに弱点化する「訳あり」装備
    return { element, value };
  }

  /* 武器の特殊接頭辞。レア以上でのみ抽選され、通常ドロップ(コモン/アンコモン)は
   * 素の名称のまま。kind:'element'は攻撃(通常攻撃・防御無視の一撃・連撃・
   * 身構えながらの一撃)に武器属性を乗せ、敵の弱点と一致した時だけ追加ダメージが
   * 入る。kind:'atkBonus'は単純にvalue(攻撃力)へ加算される。 */
  const WEAPON_AFFIXES = [
    { name:'凍てつく', kind:'element', element:'ice' },
    { name:'灼熱の',   kind:'element', element:'fire' },
    { name:'雷光の',   kind:'element', element:'thunder' },
    { name:'巨大な',   kind:'atkBonus' },
    { name:'鋭利な',   kind:'atkBonus' },
  ];
  function rollWeaponAffix(rarityKey){
    if(rarityKey !== 'rare' && rarityKey !== 'epic') return null;
    const tmpl = WEAPON_AFFIXES[Math.floor(Math.random()*WEAPON_AFFIXES.length)];
    if(tmpl.kind === 'atkBonus'){
      return { name: tmpl.name, kind:'atkBonus', bonus: rarityKey==='epic' ? rnd(16,24) : rnd(8,14) };
    }
    return { name: tmpl.name, kind:'element', element: tmpl.element, mult: rarityKey==='epic' ? 1.5 : 1.3 };
  }

  /* 装備の数値は「ダンジョンレベル+踏破深度」を土台にする(武器・防具共通)。
   * levelはそのダンジュンの固定値(DUNGEON_DEFS[].level)、depthは踏破深度
   * だが、advance()側でprogressが100%に達した時点でカウントを止めているため、
   * 実質「そのダンジョンで出る装備の上限」として機能する。レアリティによる
   * 上振れ(倍率)だけが、その上限の中でのブレ幅になる。 */
  function makeItem(type, level, depth){
    const rarityKey = rollRarity();
    const rarity = RARITY[rarityKey];
    if(type === 'weapon'){
      const typeKeys = Object.keys(WEAPON_TYPES);
      const weaponType = typeKeys[Math.floor(Math.random()*typeKeys.length)];
      const affix = rollWeaponAffix(rarityKey);
      let value = Math.round((level + depth) * 0.6 * rarity.mult);
      if(affix && affix.kind==='atkBonus') value += affix.bonus;
      return {
        id: 'itm_'+Math.random().toString(36).slice(2,9),
        type, rarity:rarityKey, rarityLabel:rarity.cls,
        weaponType,
        name: (affix ? affix.name : '') + WEAPON_TYPES[weaponType].base,
        value,
        affix: (affix && affix.kind==='element') ? affix : null,
        resist: null
      };
    }
    const base = ARMOR_BASES[Math.floor(Math.random()*ARMOR_BASES.length)];
    const value = Math.round((level + depth) * 0.6 * rarity.mult);
    const prefix = rarityKey==='common' ? '' : (rarityKey==='uncommon' ? '頑丈な' : rarityKey==='rare' ? '精霊の' : '深淵の');
    return {
      id: 'itm_'+Math.random().toString(36).slice(2,9),
      type, rarity:rarityKey, rarityLabel:rarity.cls,
      name: prefix + base,
      value,
      resist: rollResistAffix(rarityKey)
    };
  }

  function itemValueLabel(item){
    if(item.type === 'accessory'){
      const used = (item.crystals||[]).reduce((s,c)=>s+(c.slotCost||0), 0);
      return `[${accessoryEffectLabel(item.mainEffect)}] スロット${used}/${item.slotCount||0}`;
    }
    if(item.type === 'crystal'){
      return `[${accessoryEffectLabel(item.effect)}] 消費${item.slotCost}`;
    }
    let s = `(+${itemEffectiveValue(item)})`;
    if(item.enhanceLevel) s += ` [強化+${item.enhanceLevel}]`;
    if(item.weaponType) s += ` [${WEAPON_TYPES[item.weaponType].name}]`;
    if(item.affix && item.affix.kind==='element'){
      s += ` ${ELEMENT_LABELS[item.affix.element]}属性付与`;
    }
    if(item.resist){
      const sign = item.resist.value > 0 ? '+' : '';
      s += ` ${ELEMENT_LABELS[item.resist.element]}耐性${sign}${item.resist.value}`;
    }
    return s;
  }

  function itemDetailText(item){
    if(item.type === 'accessory'){
      const rarityLabel = (RARITY[item.rarity] && RARITY[item.rarity].label) || '';
      const used = (item.crystals||[]).reduce((s,c)=>s+(c.slotCost||0), 0);
      let text = `${item.name} / ${rarityLabel} / アクセサリー / 主効果 ${accessoryEffectLabel(item.mainEffect)} / クリスタルスロット ${used}/${item.slotCount||0}`;
      if((item.crystals||[]).length){
        text += ` / 装着中: ${item.crystals.map(c=>`${c.name}(${accessoryEffectLabel(c.effect)})`).join('・')}`;
      }
      if(item.uniqueFor){
        text += ` / (${liverDef(item.uniqueFor).name}専用)`;
      }
      return text;
    }
    if(item.type === 'crystal'){
      const rarityLabel = (RARITY[item.rarity] && RARITY[item.rarity].label) || '';
      return `${item.name} / ${rarityLabel} / クリスタル / 効果 ${accessoryEffectLabel(item.effect)} / 消費スロット${item.slotCost}`;
    }
    const typeLabel = item.weaponType ? WEAPON_TYPES[item.weaponType].name : (item.type==='weapon' ? '武器' : '防具');
    const rarityLabel = (RARITY[item.rarity] && RARITY[item.rarity].label) || '';
    let text = `${item.name} / ${rarityLabel} / ${typeLabel} / 効果値 +${itemEffectiveValue(item)}`;
    if(item.enhanceLevel){
      text += ` (基礎値+${item.value} / 強化値+${item.enhanceLevel})`;
    }
    if(item.affix && item.affix.kind==='element'){
      text += ` / ${ELEMENT_LABELS[item.affix.element]}属性付与(弱点の敵に追加ダメージ)`;
    }
    if(item.resist){
      const sign = item.resist.value > 0 ? '+' : '';
      text += ` / ${ELEMENT_LABELS[item.resist.element]}耐性${sign}${item.resist.value}`;
    }
    if(item.uniqueFor){
      text += ` / (${liverDef(item.uniqueFor).name}専用)`;
    }
    return text;
  }

  function rnd(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
  function weightedPick(items){
    // items: [{action, weight}] を重みに従って1つ選ぶ
    const total = items.reduce((s,i)=>s+Math.max(0,i.weight), 0);
    if(total <= 0) return items[0] ? items[0].action : null;
    let r = Math.random()*total;
    for(const it of items){
      const w = Math.max(0,it.weight);
      if(r < w) return it.action;
      r -= w;
    }
    return items[items.length-1].action;
  }

  /* ---------------------------------------------------------------

  ];
  const LIVER_DUNGEON_STAGE_COUNT = 5;
  function liverDungeonStageId(liverId, slot, depth){ return `liverdg_${liverId}_${slot}_${depth}`; }
  /* 段階ごとのエントリをまとめて生成しておく(state.dungeonsの初期化・
   * 保存・読み込みや、idからの逆引きに使う)。 */
  const LIVER_DUNGEON_STAGES = LIVER_DUNGEON_LINES.flatMap(line=>{
    const stages = [];
    for(let depth=1; depth<=LIVER_DUNGEON_STAGE_COUNT; depth++){
      const curve = LIVER_DUNGEON_STAGE_CURVE[depth];
      stages.push({
        id: liverDungeonStageId(line.liverId, line.slot, depth),
        liverId: line.liverId, slot: line.slot, depth, line,
        requiredCP: LIVER_DUNGEON_STAGE_CP[depth],
        bossLevel: curve.bossLevel, hpMult: curve.hpMult, atkMult: curve.atkMult, defMult: curve.defMult,
        materialQty: curve.materialQty
      });
    }
    return stages;
  });
  function liverDungeonStageById(id){ return LIVER_DUNGEON_STAGES.find(s=>s.id===id); }
  function liverDungeonLinesForLiver(liverId){ return LIVER_DUNGEON_LINES.filter(l=>l.liverId===liverId); }
  function liverDungeonStagesFor(liverId, slot){ return LIVER_DUNGEON_STAGES.filter(s=>s.liverId===liverId && s.slot===slot); }
  function liverHasDungeonLines(liverId){ return LIVER_DUNGEON_LINES.some(l=>l.liverId===liverId); }
  function liverDungeonClearedCount(liverId){
    return LIVER_DUNGEON_STAGES.filter(s=>s.liverId===liverId && state.dungeons[s.id] && state.dungeons[s.id].cleared).length;
  }
  function liverDungeonTotalCount(liverId){
    return LIVER_DUNGEON_STAGES.filter(s=>s.liverId===liverId).length;
  }
  /* 段階の挑戦条件: 対象ライバーが編成に入っており、かつその戦闘力
   * (combatPower)が段階ごとの閾値以上であること。 */
  function isLiverDungeonStageChallengeable(stage){
    if(!state.party.includes(stage.liverId)) return false;
    return combatPower(stage.liverId) >= stage.requiredCP;
  }
  function spawnLiverDungeonBoss(stage){
    const level = stage.bossLevel;
    const base = statsForLevel(level);
    const hp  = Math.max(5, Math.round(base.hp  * stage.hpMult * partySizeHpMult()));
    const atk = Math.max(1, Math.round(base.atk * stage.atkMult));
    const def = Math.max(0, Math.round(base.def * stage.defMult));
    const exp = Math.round(base.exp * 1.6);
    return {
      name:stage.line.bossName, level, hp, maxHp:hp, atk, def, exp, boss:true,
      skills:[], weakness:stage.line.weakness||null,
      isLiverQuest:true, liverQuestId:stage.id
    };
  }
  function challengeLiverDungeonStage(id){
    if(inCombat) return;
    const stage = liverDungeonStageById(id);
    if(!stage || !isLiverDungeonStageChallengeable(stage)) return;
    recomputeStamina();
    if(state.stamina < 1){
      pushLog('スタミナが足りない。少し休もう。', 'system');
      render();
      return;
    }
    state.stamina -= 1;
    saveGame();
    startCombat(spawnLiverDungeonBoss(stage));
  }
  /* ライバー選択画面・ライバー詳細画面のどちらからでも、指定ライバーの
   * ダンジョン画面(武器タブ)へ直接遷移する。 */
  function openLiverDungeon(liverId){
    if(inCombat || !liverHasDungeonLines(liverId)) return;
    const ls = liverState(liverId);
    if(!ls || !ls.unlocked) return;
    if(!state.ui) state.ui = {expandedGroups:[]};
    state.ui.liverDungeonLiverId = liverId;
    state.ui.liverDungeonSlotTab = 'weapon';
    state.screen = 'liverQuests';
    saveGame(); render();
  }
  function switchLiverDungeonSlotTab(slot){
    if(!['weapon','armor','accessory'].includes(slot)) return;
    state.ui.liverDungeonSlotTab = slot;
    render();
  }
  /* 固有装備(レアリティ「ユニーク」)の生成。対象ライバー専用(uniqueFor)
   * として作られ、他のライバーは装備できず、売却・マーケット出品・
   * 破棄・合成強化のいずれもできない(専用の完成品として固定)。 */
  function makeUniqueItem(line){
    const r = line.equipReward;
    const base = {
      id: 'itm_'+Math.random().toString(36).slice(2,9),
      type: line.slot, rarity:'unique', rarityLabel:'unique',
      name: r.name, uniqueFor: line.liverId
    };
    if(line.slot === 'weapon'){
      return { ...base, weaponType: r.weaponType, value: r.value, affix: r.affix||null, resist: null };
    }
    if(line.slot === 'armor'){
      return { ...base, value: r.value, resist: r.resist||null, affix: null };
    }
    return { ...base, mainEffect: r.mainEffect, slotCount: r.slotCount||0, crystals:[] };
  }
  function grantMaterial(key, qty){
    state.materials[key] = materialCount(key) + qty;
  }
  /* ボス撃破後: 素材ダンジョン(プリズムタワー)と同様、リザルト画面を
   * 挟んでからその段階の一覧画面に戻す。1段階目は初回クリア時のみ固有
   * 装備そのものを、2〜5段階目は毎回(周回可能)強化素材を渡す。 */
  function resolveLiverDungeonVictory(stage){
    const qs = state.dungeons[stage.id];
    const firstClear = !qs.cleared;
    qs.cleared = true;
    qs.bossKillCount = (qs.bossKillCount||0) + 1;

    let result;
    if(stage.depth === 1){
      let reward = null;
      if(firstClear){
        reward = makeUniqueItem(stage.line);
        addItemToInventory(reward);
      }
      result = { lineName: stage.line.lineName, depth: stage.depth, firstClear, equipReward: reward, materialQty: 0 };
    } else {
      const qty = stage.materialQty;
      if(qty > 0) grantMaterial(stage.line.materialKey, qty);
      result = { lineName: stage.line.lineName, depth: stage.depth, firstClear, materialName: MATERIAL_DEFS[stage.line.materialKey].name, materialQty: qty };
    }

    state.lastLiverDungeonResult = result;
    state.ui.liverDungeonLiverId = stage.liverId;
    state.ui.liverDungeonSlotTab = stage.slot;
    state.screen = 'liverQuestResult';
    inCombat = false; combatPhase = null; combatEnemy = null;
    saveGame(); render();
  }
  function closeLiverQuestResult(){
    state.lastLiverDungeonResult = null;
    state.screen = 'liverQuests';
    saveGame(); render();
  }

  /* ---------------------------------------------------------------
   * コロシアムタワー(PvP、Supabase共有テーブル方式)
   * 各フロアの「門番」は、そのフロアを最後に突破したプレイヤーの
   * パーティのスナップショット。門番のHPプールは共有テーブルで
   * 管理し、挑戦者が与えたダメージは勝敗にかかわらず永続する
   * (回復しない)。挑戦者側のパーティは毎回全回復した状態で挑む。
   * --------------------------------------------------------------- */
  const COLOSSEUM_FLOORS = 10;
  const COLOSSEUM_COOLDOWN_MS = 500 * 1000;

  /* ---------------------------------------------------------------
   * 次元断層ポモ・ドーロ: ダンジョン・コロシアムとは別枠の放置系コンテンツ。
   * 突入すると規定時間ゲーム全体がロックされ(render()側で強制的に専用
   * 画面だけを表示する)、経過後に結果を受け取れる。ポモドーロ限定アイテムは
   * 設けず、通常のドロップ抽選(makeItem)を使い回す。
   * --------------------------------------------------------------- */
  const RIFT_DURATION_MS = 25 * 60 * 1000;
  function riftEndTime(){ return state.rift ? state.rift.startedAt + RIFT_DURATION_MS : 0; }
  function riftRemainMs(){ return Math.max(0, riftEndTime() - Date.now()); }
  function riftReady(){ return !!state.rift && Date.now() >= riftEndTime(); }

  /* ---------------------------------------------------------------
   * スタミナ: ダンジョン探索に必要な、ライバー単位ではなくプレイヤー
   * (アカウント)単位のリソース。上限100固定、1分に1回復。時間経過以外にも、
   * 回復薬の使用・広告視聴(ヘッダーの+ボタンから)でも回復できる。
   *
   * 他の資源(ゴールド・チケットなど)と同じ信頼モデルで、サーバー側の
   * 厳密な検証はせず、state.stamina/staminaUpdatedAtをクライアント側で
   * 計算してそのまま保存する。staminaUpdatedAtは「最後に回復を計算した
   * 時刻」で、上限に達している間は常に現在時刻に合わせておく(上限中に
   * 経過した分を後で一気に回収できてしまうのを防ぐため)。
   * --------------------------------------------------------------- */
  const STAMINA_MAX = 100;
  const STAMINA_REGEN_MS = 60 * 1000;
  const RIFT_STAMINA_COST = 25;

  function recomputeStamina(){
    if(!state) return false;
    const now = Date.now();
    if(state.stamina >= STAMINA_MAX){
      state.staminaUpdatedAt = now;
      return false;
    }
    const elapsedMs = now - (state.staminaUpdatedAt || now);
    const ticks = Math.floor(elapsedMs / STAMINA_REGEN_MS);
    if(ticks <= 0) return false;
    state.stamina = Math.min(STAMINA_MAX, state.stamina + ticks);
    state.staminaUpdatedAt += ticks * STAMINA_REGEN_MS;
    return true;
  }

  /* ---------------------------------------------------------------
   * 道具: オーブ・素材と同じくスタック管理(state.tools、キー→所持数)
   * だが、合成・錬金の材料ではなく「所持品から直接使用する」消費アイテム。
   * purchasable: trueの道具だけが商店の「買う」に並ぶ(将来、錬金でしか
   * 作れない道具を追加する余地を残すため)。
   * canUse()が無い、またはtrueを返す時だけ所持品側に「使用」ボタンが出る。
   * --------------------------------------------------------------- */
  const TOOL_DEFS = {
    stamina_potion_10: {
      name:'スタミナ10回復薬',
      desc:'使うとスタミナを10回復する。',
      price: 500,
      purchasable: true,
      canUse: () => state.stamina < STAMINA_MAX,
      use: () => {
        recomputeStamina();
        state.stamina = Math.min(STAMINA_MAX, state.stamina + 10);
      }
    },
  };

  function toolCount(key){
    return (state.tools && state.tools[key]) || 0;
  }

  function useToolItem(key){
    const def = TOOL_DEFS[key];
    if(!def || toolCount(key) < 1) return;
    if(def.canUse && !def.canUse()) return;
    def.use();
    state.tools[key] = toolCount(key) - 1;
    pushLog(`「${def.name}」を使った。`, 'reward');
    saveGame(); render();
  }

  /* ---------------- スタミナ回復ポップアップ ----------------
   * ヘッダーの+ボタンから開く。回復薬の消費(既存のuseToolItemをそのまま
   * 使う)と、広告視聴による回復の2手段を1箇所にまとめる。 */
  const STAMINA_AD_RECOVER_AMOUNT = 50;
  function openStaminaPopup(){
    if(!state || !state.ui) return;
    recomputeStamina();
    state.ui.staminaPopupOpen = true;
    render();
  }
  function closeStaminaPopup(){
    if(!state || !state.ui) return;
    state.ui.staminaPopupOpen = false;
    render();
  }
  /* 広告視聴によるスタミナ回復。現時点では実際の広告SDKが未導入のため、
   * 引き直しガチャの広告演出と同様、数秒待たせる疑似演出で代用している。
   * 広告SDK導入時はここを差し替える。 */
  async function watchAdForStamina(){
    if(staminaAdWatching) return;
    recomputeStamina();
    if(state.stamina >= STAMINA_MAX) return;
    staminaAdWatching = true;
    render();
    await sleep(2000);
    state.stamina = Math.min(STAMINA_MAX, state.stamina + STAMINA_AD_RECOVER_AMOUNT);
    staminaAdWatching = false;
    pushLog(`広告視聴でスタミナを${STAMINA_AD_RECOVER_AMOUNT}回復した。`, 'reward');
    saveGame(); render();
  }

  /* ---------------------------------------------------------------
   * マーケット: どの装備・素材・道具が出品可能かはすべてクライアント側の
   * 定義のみで決める(DB側は所有権・個数の整合性だけを見る)。
   * 装備は一定レアリティ以上、素材・道具はレアリティの概念が無いため
   * 個別の許可リストで管理する。
   * --------------------------------------------------------------- */
  const MARKET_LISTING_SLOTS = 3;
  const MARKET_MIN_PRICE = 10; // これ未満の単価では出品不可(サーバー側のRPCでも同じ下限を強制する)
  const MARKET_MIN_EQUIP_RARITY_RANK = 2; // 0:common 1:uncommon 2:rare 3:epic (レア未満は出品不可)
  const MARKET_EXCLUDED_EQUIPMENT_NAMES = new Set(); // 個別除外(将来の調整用、現状は無し)
  const MARKET_TRADABLE_MATERIALS = ['fine_iron_ore', 'crimson_ember', 'crimson_crystal', 'azure_frost', 'azure_crystal'];
  const MARKET_TRADABLE_TOOLS = Object.keys(TOOL_DEFS);
  const MARKET_EQUIP_RARITY_RANK = { common:0, uncommon:1, rare:2, epic:3 };

  function marketEquipEligible(item){
    if(!item) return false;
    if(MARKET_EXCLUDED_EQUIPMENT_NAMES.has(item.name)) return false;
    // クリスタルが挿さったままのアクセサリーは出品不可(先に外してもらう)。
    // 装着中のクリスタル自体はstate.inventoryに現れないので、ここでの
    // クリスタル側のガードは実質不要だが念のため明示しておく。
    if(item.type === 'accessory' && (item.crystals||[]).length > 0) return false;
    return (MARKET_EQUIP_RARITY_RANK[item.rarity] || 0) >= MARKET_MIN_EQUIP_RARITY_RANK;
  }
  function marketStackDefFor(bucket, key){
    return bucket === 'tools' ? TOOL_DEFS[key] : MATERIAL_DEFS[key];
  }
  function marketStackName(bucket, key){
    const def = marketStackDefFor(bucket, key);
    return def ? def.name : key;
  }
  function marketTradableStacks(){
    // { bucket, key, name, owned } の配列。所持数が0でも出品タブの選択肢としては出さない。
    const list = [];
    MARKET_TRADABLE_MATERIALS.forEach(key=>{
      if(materialCount(key) > 0) list.push({ bucket:'materials', key, name: marketStackName('materials', key), owned: materialCount(key) });
    });
    MARKET_TRADABLE_TOOLS.forEach(key=>{
      if(toolCount(key) > 0) list.push({ bucket:'tools', key, name: marketStackName('tools', key), owned: toolCount(key) });
    });
    return list;
  }

  /* マーケット上の装備の性能表記だけ、通常のitemValueLabel(所持品一覧・
   * 強化画面などで共通利用)と表記順を変える。強化値・属性付与・耐性を
   * 優先して左側に、装備種別(武器種別)は最右に置く。他画面の表記には
   * 影響させないよう、あえて別関数として持つ。 */
  function marketEquipMetaLabel(item){
    if(item.type === 'accessory' || item.type === 'crystal') return itemValueLabel(item);
    let s = `効果値 +${itemEffectiveValue(item)}`;
    if(item.enhanceLevel) s += ` [強化+${item.enhanceLevel}]`;
    if(item.affix && item.affix.kind==='element'){
      s += ` ${ELEMENT_LABELS[item.affix.element]}属性付与`;
    }
    if(item.resist){
      const sign = item.resist.value > 0 ? '+' : '';
      s += ` ${ELEMENT_LABELS[item.resist.element]}耐性${sign}${item.resist.value}`;
    }
    const typeLabel = item.weaponType ? WEAPON_TYPES[item.weaponType].name : '防具';
    s += ` [${typeLabel}]`;
    return s;
  }

  /* 突入・受け取り・撤退・結果を閉じる、いずれの直後も必ずDBへの保存が
   * 完了してからロック画面/通常画面へ切り替える(saveGameをawaitする)。
   * 先に画面だけ切り替えてしまうと、保存が終わる前にページを更新された
   * 場合にサーバー側は古い状態しか持っておらず、更新するだけで状態を
   * 巻き戻せてしまうため。 */
  async function startRift(){
    if(inCombat || state.rift) return;
    if(!state.party.length){
      pushLog('パーティが編成されていない。町で編成してから挑もう。', 'system');
      render();
      return;
    }
    recomputeStamina();
    if(state.stamina < RIFT_STAMINA_COST){
      pushLog(`スタミナが足りない(必要: ${RIFT_STAMINA_COST})。時間経過で回復するのを待とう。`, 'system');
      render();
      return;
    }
    state.stamina -= RIFT_STAMINA_COST;
    state.rift = { startedAt: Date.now(), partyIds: state.party.slice(), result: null };
    pushLog('次元断層ポモ・ドーロへ突入した。探索を終えるまで、他の行動は取れない。', 'system');
    await saveGame();
    render();
  }

  /* 探索を中断して町へ戻る。報酬は一切得られない。 */
  async function retreatFromRift(){
    if(!state.rift || state.rift.result) return;
    const ok = confirm('探索を中断して撤退します。この場合、報酬は一切手に入りません。よろしいですか？');
    if(!ok) return;
    state.rift = null;
    pushLog('次元断層ポモ・ドーロから撤退した。', 'system');
    await saveGame();
    render();
  }

  /* 結果を確定させる(まだ画面は閉じない。手に入ったものを表示したまま
   * 「閉じる」が押されるまで、この結果画面自体もロック状態を継続する)。 */
  async function claimRiftReward(){
    if(!state.rift || !riftReady() || state.rift.result) return;
    const size = Math.max(1, state.rift.partyIds.length);
    const lv = partyLevel();
    const gold = Math.round((30 + lv*10) * size);
    const exp = Math.round((10 + lv*5) * size);
    state.gold += gold;
    pushLog(`次元断層ポモ・ドーロから帰還した。ゴールド ${gold} を手に入れた。`, 'reward');

    const levelsBefore = {};
    state.party.forEach(id=>{ levelsBefore[id] = jobProgressFor(id).level; });
    grantExpToParty(exp);
    const levelUps = state.party
      .filter(id=>jobProgressFor(id).level > levelsBefore[id])
      .map(id=>({ name: liverDef(id).name, level: jobProgressFor(id).level }));

    let itemName = null;
    if(Math.random() < 0.35){
      const type = Math.random() < 0.5 ? 'weapon' : 'armor';
      const item = makeItem(type, lv, 0);
      if(addItemToInventory(item)){
        itemName = item.name;
        pushLog(`探索の途中で「${item.name}」を見つけた。`, 'reward');
      }
    }

    state.rift.result = { gold, exp, levelUps, itemName };
    await saveGame();
    render();
  }

  /* 結果表示を閉じて、ここで初めて町へ戻る。 */
  async function closeRiftResult(){
    if(!state.rift || !state.rift.result) return;
    state.rift = null;
    await saveGame();
    render();
  }

  /* まだ誰も登録していないフロアで戦うダミーの門番。フロアが上がるほど
   * 強くなる。倒しても永続記録は作られず、初めて実プレイヤーがここで
   * 勝った時にそのプレイヤーが初代の門番として登録される。 */
  function buildDummyGatekeeper(floor){
    const level = Math.max(1, floor*2 + 1);
    const base = statsForLevel(level);
    const roleMults = [
      {label:'影武者・壱', hpMult:1.3, atkMult:0.9, defMult:1.3},
      {label:'影武者・弐', hpMult:0.9, atkMult:1.3, defMult:0.9},
      {label:'影武者・参', hpMult:0.85, atkMult:1.15, defMult:0.85},
      {label:'影武者・四', hpMult:0.95, atkMult:1.1, defMult:0.95},
    ];
    const snapshot = roleMults.map(r=>({
      name: `コロシアムの${r.label}`, color:'#8a8fa3', job:'dps', level,
      maxHp: Math.max(5, Math.round(base.hp*r.hpMult)),
      atk: Math.max(1, Math.round(base.atk*r.atkMult)),
      def: Math.max(0, Math.round(base.def*r.defMult))
    }));
    const maxHpPool = snapshot.reduce((s,m)=>s+m.maxHp, 0);
    return { holderId:null, holderName:`${floor}Fの見習い門番`, snapshot, hpPool:maxHpPool, maxHpPool, wins:0, isDummy:true };
  }

  /* 門番スナップショット(複数人)を、既存の単体ボス戦エンジンに乗せるための
   * 集約値。細かい個々のステータスよりも「平均的な強さ」を反映する。 */
  function aggregateSnapshotStats(snapshot){
    const n = snapshot.length || 1;
    return {
      atk: Math.round(snapshot.reduce((s,m)=>s+m.atk,0)/n),
      def: Math.round(snapshot.reduce((s,m)=>s+m.def,0)/n),
      level: Math.max(1, Math.round(snapshot.reduce((s,m)=>s+m.level,0)/n))
    };
  }

  /* 現在の生きたパーティのステータスを、門番登録用に切り出す。 */
  function buildPartySnapshot(){
    return state.party.map(id=>{
      const ls = liverState(id);
      const def = liverDef(id);
      return { name: def.name, color: def.color, job: ls.job, level: jobProgressFor(id).level, maxHp: ls.maxHp, atk: liverAtk(id), def: liverDefStat(id) };
    });
  }

  function dungeonDefById(id){ return DUNGEON_DEFS.find(d=>d.id===id); }
  function isDungeonUnlocked(id){
    const def = dungeonDefById(id);
    if(!def.requires) return true;
    const req = state.dungeons[def.requires];
    return !!(req && req.cleared);
  }
  /* ダンジョン一覧に出す範囲。解放済みのものに加えて、次に解放される
   * 1個先のダンジョンまでを含め、それより先はまだ見せない
   * (DUNGEON_DEFSは一本道のrequiresチェーンなので、配列順に見ていって
   * 最初の未解放エントリだけを含めれば良い)。 */
  function visibleDungeonDefs(){
    const visible = [];
    let shownLocked = false;
    for(const def of DUNGEON_DEFS){
      if(def.hidden || def.isPrismTower) continue; // チュートリアル専用/プリズムタワーは通常の一覧に出さない
      if(isDungeonUnlocked(def.id)){
        visible.push(def);
      } else if(!shownLocked){
        visible.push(def);
        shownLocked = true;
      } else {
        break;
      }
    }
    return visible;
  }
  /* プリズムタワー専用の一覧。通常ダンジョンと同じ「解放済み+次の1個先まで」
   * のルールだが、解放済みの階は(通常ダンジョンと違い)何度でも自由に
   * 選び直して周回できる(visiblePrismDefs自体はそのための表示範囲のみ担当)。 */
  function visiblePrismDefs(){
    const visible = [];
    let shownLocked = false;
    for(const def of DUNGEON_DEFS){
      if(!def.isPrismTower) continue;
      if(isDungeonUnlocked(def.id)){
        visible.push(def);
      } else if(!shownLocked){
        visible.push(def);
        shownLocked = true;
      } else {
        break;
      }
    }
    return visible;
  }
  function newDungeonProgress(){ return {progress:0, cleared:false, bossKillCount:0, depth:0}; }
  function currentDungeonState(){ return state.dungeons[state.activeDungeonId]; }
  function currentDungeonDef(){ return dungeonDefById(state.activeDungeonId); }

  function addDungeonProgress(amount){
    const ds = currentDungeonState();
    if(!ds) return;
    ds.progress = Math.min(100, ds.progress + amount);
  }

  function firstClearRewardFor(dungeonId){
    const def = dungeonDefById(dungeonId);
    const tmpl = def.firstClearReward || {name:'名もなき勲章', type:'armor'};
    const mult = def.rewardMult || 1;
    return {
      id: 'itm_'+Math.random().toString(36).slice(2,9),
      type: tmpl.type,
      rarity:'epic', rarityLabel:'epic',
      name: tmpl.name,
      value: Math.round((8 + partyLevel()*2) * mult)
    };
  }

  /* ---------------------------------------------------------------
   * 七彩の塔(エンドコンテンツ)
   * 通常のダンジョンとは別枠の高難度コンテンツ。突入時にスタミナを
   * 固定消費し、あとは何階でも追加消費なしで進める。「進む」は必ず
   * 戦闘になり、勝利するたびにフロアが1進む(踏破率ではなくフロア数
   * そのものがカウンター)。10階ごとに中ボスが出現し、50階・100階は
   * さらに格上げした大ボスにする。街に戻る(自主撤退)・全滅のどちらも
   * 「リタイア」として扱い、その時点の到達フロアに応じた報酬抽選を
   * 行う(どこで辞めても到達フロア分は必ず報われる設計)。
   *
   * 塔ごとに敵の弱点属性を固定することで、塔をまたぐたびに装備・
   * 編成を変えたくなるようにしている(紅蓮の塔の敵は氷に弱く、
   * 紺碧の塔の敵は火に弱い、など)。
   * --------------------------------------------------------------- */
  const TOWER_MAX_FLOOR = 100;
  const TOWER_ENTRY_STAMINA_COST = 50;
  const TOWER_BOSS_LEVEL_PREMIUM = 4;                         // 通常の10階ごとの中ボス
  const TOWER_MILESTONE_LEVEL_PREMIUM = { 50:10, 100:16 };    // 50F・100Fの大ボスはさらに格上げ
  /* 七彩の塔そのものの解放条件。チュートリアルを除いた「大枠としての
   * ダンジョン」5個目(灰燼→尖塔→樹海→墓所→蒼氷、の5番目=蒼氷の霊峰)の
   * 最上階をクリアすると全体が解放される(複数フロアあるダンジョンは
   * まとめて1個としてカウント)。 */
  const TOWER_UNLOCK_DUNGEON_ID = 'icepeak_f6';

  /* 報酬装備セット(全武器種8+防具1=9点)。防具は種類による効果差が
   * 無いため1種類に絞り、武器はジョブ間の有利不利が出ないよう全種用意する。
   * 武器には塔属性のダメージ付与、防具には塔属性の耐性を固定で持たせる
   * (ランダム抽選ではなく常に同じ効果を持つ「銘品」という扱い)。 */
  function towerEquipTemplates(prefix, element){
    const dmgAffix = { kind:'element', element, mult:1.6 };
    const resistAffix = { element, value:4 };
    return [
      { type:'weapon', weaponType:'sword',      name:`${prefix}の剣`,     value:150, affix:dmgAffix },
      { type:'weapon', weaponType:'greatsword', name:`${prefix}の大剣`,   value:150, affix:dmgAffix },
      { type:'weapon', weaponType:'axe',        name:`${prefix}の斧`,     value:150, affix:dmgAffix },
      { type:'weapon', weaponType:'spear',      name:`${prefix}の槍`,     value:150, affix:dmgAffix },
      { type:'weapon', weaponType:'dagger',     name:`${prefix}の短剣`,   value:150, affix:dmgAffix },
      { type:'weapon', weaponType:'bow',        name:`${prefix}の弓`,     value:150, affix:dmgAffix },
      { type:'weapon', weaponType:'staff',      name:`${prefix}の杖`,     value:150, affix:dmgAffix },
      { type:'weapon', weaponType:'grimoire',   name:`${prefix}の魔導書`, value:150, affix:dmgAffix },
      { type:'armor',  name:`${prefix}の鎧`, value:150, resist:resistAffix },
    ];
  }

  const TOWER_DEFS = [
    {
      id:'crimson_tower', name:'紅蓮の塔', color:'赤', element:'fire', requires:null,
      enemyWeakness:'ice',
      crystalKey:'crimson_crystal', exclusiveMaterialKey:'crimson_ember',
      equipmentSet: towerEquipTemplates('紅蓮', 'fire'),
      enemies: [
        { key:'ember_servant', name:'灼熱の従者', hpMult:0.90, atkMult:1.10, defMult:0.85 },
        { key:'blaze_beast',   name:'業火の獣',   hpMult:1.10, atkMult:1.15, defMult:0.90,
          skills:[{key:'flare', name:'火柱', everyNTurns:4, kind:'trueDamage', mult:2.6, element:'fire'}] },
        { key:'molten_golem',  name:'溶岩の巨兵', hpMult:1.40, atkMult:0.90, defMult:1.30 },
        { key:'crimson_witch', name:'紅蓮の魔女', hpMult:0.85, atkMult:1.05, defMult:0.85,
          skills:[{key:'firestorm', name:'火の嵐', everyNTurns:3, kind:'telegraphed', mult:3.0, element:'fire',

  /* 七彩の塔全体の解放判定(チュートリアルを除く5番目のダンジョン=
   * 蒼氷の霊峰の最上階クリア)。個別の塔はさらにdef.requiresで、
   * 他の塔の到達フロアを条件にできる(紺碧の塔は紅蓮の塔50F踏破が必要)。 */
  function towersGloballyUnlocked(){
    const ds = state.dungeons[TOWER_UNLOCK_DUNGEON_ID];
    return !!(ds && ds.cleared);
  }
  function towerBestFloor(towerId){
    return (state.towerBestFloor && state.towerBestFloor[towerId]) || 0;
  }
  function isTowerAccessible(def){
    if(!towersGloballyUnlocked()) return false;
    if(!def.requires) return true;
    return towerBestFloor(def.requires.towerId) >= def.requires.floor;
  }

  /* フロアを実効レベルに変換する。既存のstatsForLevel()カーブをそのまま
   * 延長して使うことで、既存ダンジョンの敵と地続きの強さになるようにする
   * (Lv30ダンジョンの少し上から始まり、100階でおよそ3倍程度まで伸びる)。 */
  function towerEffectiveLevel(floor){ return 30 + floor*0.6; }
  function isTowerBossFloor(floor){ return floor>0 && floor%10===0; }

  function spawnTowerEnemy(towerDef, floor){
    if(isTowerBossFloor(floor)){
      const isMilestone = !!TOWER_MILESTONE_LEVEL_PREMIUM[floor];
      const premium = TOWER_MILESTONE_LEVEL_PREMIUM[floor] || TOWER_BOSS_LEVEL_PREMIUM;
      const level = Math.max(1, Math.round(towerEffectiveLevel(floor) + premium));
      const base = statsForLevel(level);
      const hpMult = (isMilestone ? 2.2 : 1.7) * partySizeHpMult();
      const atkMult = isMilestone ? 1.3 : 1.15;
      const defMult = isMilestone ? 1.45 : 1.3;
      const hp = Math.max(5, Math.round(base.hp * hpMult));
      const atk = Math.max(1, Math.round(base.atk * atkMult));
      const def = Math.max(0, Math.round(base.def * defMult));
      const exp = Math.round(base.exp * (isMilestone ? 2.2 : 1.6));
      const name = isMilestone ? towerDef.milestoneBossNames[floor] : towerDef.bossName;
      const skills = isMilestone
        ? [{key:'milestone_nova', name:`${towerDef.element==='fire'?'業火':'氷結'}の断罪`, everyNTurns:3, kind:'telegraphed', mult:3.4, element:towerDef.element,
            warnText:'{name}が力を極限まで練り上げていく……', executeText:'凄まじい一撃が突き刺さった！'}]
        : [];
      return {name, level, hp, maxHp:hp, atk, def, exp, boss:true, skills, weakness:towerDef.enemyWeakness};
    }
    const pool = towerDef.enemies;
    const type = pool[Math.floor(Math.random()*pool.length)];
    const level = Math.max(1, Math.round(towerEffectiveLevel(floor)));
    const base = statsForLevel(level);
    const hp = Math.max(5, Math.round(base.hp * type.hpMult * partySizeHpMult()));
    const atk = Math.max(1, Math.round(base.atk * type.atkMult));
    const def = Math.max(0, Math.round(base.def * type.defMult));
    const exp = Math.round(base.exp);
    return {name:type.name, level, hp, maxHp:hp, atk, def, exp, boss:false, skills:type.skills||[], weakness:towerDef.enemyWeakness};
  }

  function enterTower(id){

      render();
      return;

    recomputeStamina();

      pushLog(`スタミナが足りない(必要: ${TOWER_ENTRY_STAMINA_COST})。時間経過で回復するのを待とう。`, 'system');
      render();
      return;
    }
    state.stamina -= TOWER_ENTRY_STAMINA_COST;
    state.towerRun = { towerId:id, floor:0 };
    state.screen = 'towerRun';
    state.log = [];
    pushLog(`${def.name}に突入した。`, 'system');

    const def = currentTowerDef();
    const nextFloor = state.towerRun.floor + 1;
    const enemy = spawnTowerEnemy(def, nextFloor);
    enemy.isTowerFight = true;
    enemy.isTowerBoss = isTowerBossFloor(nextFloor);
    startCombat(enemy);

  function retreatFromTower(){
    if(inCombat || !state.towerRun) return;

    return {

      type: tmpl.type, rarity:'epic', rarityLabel:'epic',
      name: tmpl.name, value: tmpl.value,

    };

  /* ラン終了時の報酬抽選。
   * ①限定装備: 到達フロアに応じた確率(floor×0.2%+50F/100Fで各+5%)で
   *   1回抽選。当選したら武器70%/防具30%のサブ抽選で1点確定。
   * ②限定素材: ①と同じ確率式で3回抽選。当たった回数分だけ獲得。
   * ③汎用結晶: 到達フロア数がそのまま確定個数になる(参加賞)。
   * 結果はstate.lastTowerResultに積んでリザルト画面で表示する。 */
  function resolveTowerRunEnd(reason){
    const def = currentTowerDef();
    const floor = state.towerRun.floor;
    const endReason = floor >= TOWER_MAX_FLOOR ? 'clear' : (reason || 'defeat');
    const chance = Math.min(100, floor*0.2 + (floor>=50?5:0) + (floor>=100?5:0));

    if(!state.towerBestFloor) state.towerBestFloor = {};
    state.towerBestFloor[def.id] = Math.max(towerBestFloor(def.id), floor);

    const rewards = { equipment:null, exclusiveMaterialCount:0, crystalCount:floor };

    if(Math.random()*100 < chance){
      if(Math.random() < 0.7){
        const weaponTmpls = def.equipmentSet.filter(t=>t.type==='weapon');
        rewards.equipment = makeTowerEquipmentItem(weaponTmpls[Math.floor(Math.random()*weaponTmpls.length)]);
      } else {
        rewards.equipment = makeTowerEquipmentItem(def.equipmentSet.find(t=>t.type==='armor'));
      }
    }
    for(let i=0;i<3;i++){
      if(Math.random()*100 < chance) rewards.exclusiveMaterialCount++;
    }

    if(rewards.equipment) addItemToInventory(rewards.equipment);
    if(rewards.exclusiveMaterialCount>0){
      state.materials[def.exclusiveMaterialKey] = materialCount(def.exclusiveMaterialKey) + rewards.exclusiveMaterialCount;
    }
    if(rewards.crystalCount>0){
      state.materials[def.crystalKey] = materialCount(def.crystalKey) + rewards.crystalCount;
    }

    state.lastTowerResult = { towerId: def.id, towerName: def.name, floor, reason: endReason, rewards };
    state.towerRun = null;
    state.screen = 'towerResult';
    saveGame(); render();
  }

  /* ---------------------------------------------------------------
   * 敵スキル: 汎用効果システム
   * スキルは effects:[{type, target, amount, duration, ignoreDef, element,
   * drainRatio}, ...] という「効果の配列」として定義できる(従来の
   * kind:'trueDamage'/'telegraphed' 形式も引き続きサポートし、共存する)。
   * 将来的にプレイヤー側スキルにも同じ仕組みを使う想定のため、
   * targetは発動者からの相対関係で指定する:
   *   self / allyRandom / allyAll / enemyRandom / enemyAll
   * 今は敵が常に1体という前提のため、ally系は発動者自身を指す。
   *
   * 同じ効果タイプが同一対象に重ねてかかった場合:
   *   ・効果量が大きい方だけが有効(丸ごと上書き)
   *   ・効果量が同じなら、継続ターン数が延長される場合のみ残りターンを上書き
   *   ・効果量が小さい方は無視される(既存の効果がそのまま継続)
   * 重複を許したい場合は、別の効果タイプ名(例: atkBuff2)として
   * 新設すれば独立して共存できる。
   *
   * 継続効果は「行動後」にtickする。ただし発動者が自分自身にかけた効果は、
   * 付与された直後の巡だけtickをスキップする(付与ターンではなく、次の
   * 自分の行動から確実に効くようにするため)。他者にかけた効果は、その
   * 対象の次の行動から自然に通常通りtickされる(巡が異なるため特別扱い不要)。
   * --------------------------------------------------------------- */
  function applyStatusEffect(effectsMap, type, amount, duration, isSelfGrant){
    const current = effectsMap[type];
    if(!current){
      effectsMap[type] = {amount, turnsLeft:duration, freshlyGranted: !!isSelfGrant};
      return true;
    }
    if(amount > current.amount){
      effectsMap[type] = {amount, turnsLeft:duration, freshlyGranted: !!isSelfGrant};
      return true;
    }
    if(amount === current.amount && duration > current.turnsLeft){
      current.turnsLeft = duration;
      if(isSelfGrant) current.freshlyGranted = true;
      return true;
    }
    return false;
  }

  /* onTick(type, eff): 継続ダメージ/継続回復など、tickのたびに起こる処理。
   * onExpire(type): 残りターンが0になり消滅した時の処理(ログ出しなど)。 */
  function tickStatusEffects(effectsMap, onTick, onExpire){
    if(!effectsMap) return;
    Object.keys(effectsMap).forEach(type=>{
      const eff = effectsMap[type];
      if(eff.freshlyGranted){
        eff.freshlyGranted = false;
        return;
      }
      if(onTick) onTick(type, eff);
      eff.turnsLeft -= 1;
      if(eff.turnsLeft <= 0){
        delete effectsMap[type];
        if(onExpire) onExpire(type);
      }
    });
  }

  function statusStatMult(effectsMap, buffType, debuffType){
    let mult = 1;
    if(effectsMap && effectsMap[buffType]) mult *= (1 + effectsMap[buffType].amount);
    if(effectsMap && effectsMap[debuffType]) mult *= (1 - effectsMap[debuffType].amount);
    return mult;
  }

  /* 継続効果を反映した敵の実効ATK/DEF。最終的な実数値は1を下回らない
   * (倍率自体には下限を設けない)。 */
  function effectiveEnemyAtk(){
    const mult = statusStatMult(combatEnemy.statusEffects, 'atkBuff', 'atkDebuff');
    return Math.max(1, Math.round(combatEnemy._atk * mult));
  }
  function effectiveEnemyDef(){
    const mult = statusStatMult(combatEnemy.statusEffects, 'defBuff', 'defDebuff');
    return Math.max(1, Math.round(combatEnemy._def * mult));
  }

  /* effect.target を発動者から見た相対関係で解決する。戻り値は対象のliverId
   * の配列、または敵自身を表す'enemy'を含む配列。今は敵が常に1体のため
   * ally系は発動者自身になる(複数体対応は将来の拡張点)。 */
  function resolveEffectTargets(effect, casterIsEnemy, casterId){
    switch(effect.target){
      case 'self':
        return casterIsEnemy ? ['enemy'] : (casterId ? [casterId] : []);
      case 'allyRandom': {
        if(casterIsEnemy) return ['enemy'];
        const alive = alivePartyIds();
        return alive.length ? [alive[Math.floor(Math.random()*alive.length)]] : [];
      }
      case 'allyAll':
        return casterIsEnemy ? ['enemy'] : alivePartyIds();
      case 'enemyRandom': {
        if(casterIsEnemy){
          const t = applyCoverRedirect(pickRandomAliveTarget());
          return t ? [t] : [];
        }
        return ['enemy'];
      }
      case 'enemyAll':
        return casterIsEnemy ? alivePartyIds() : ['enemy'];
      default:
        return [];
    }
  }

  function statusEffectsMapFor(target){
    if(target === 'enemy') return combatEnemy.statusEffects || (combatEnemy.statusEffects={});
    if(!playerStatusEffects[target]) playerStatusEffects[target] = {};
    return playerStatusEffects[target];
  }

  /* 効果1つを、解決済みの対象1体に適用する。ダメージ・回復は即時、
   * バフ/デバフ・状態異常はplayerStatusEffects/combatEnemy.statusEffectsに
   * 登録するだけで、実際の反映はtickStatusEffectsや実効ATK/DEF計算側で行う。
   * casterId: プレイヤー側スキルの発動者liverId(敵の場合はnull)。 */
  function applyEffectToTarget(effect, target, casterIsEnemy, casterId){
    const isSelfGrant = casterIsEnemy ? (target === 'enemy') : (target === casterId);
    const targetName = target === 'enemy' ? combatEnemy.name : liverDef(target).name;

    if(effect.type === 'damage'){
      let raw;
      if(casterIsEnemy){
        const atk = effectiveEnemyAtk();
        const isCrit = rollCrit(null);
        raw = (effect.ignoreDef || isCrit)
          ? Math.max(1, Math.round(atk * effect.amount * (isCrit?CRIT_MULT:1)) + rnd(-1,2))
          : Math.max(1, Math.round(atk * effect.amount) - liverDefStat(target) + rnd(-1,1));
        const dmg = applyDamageToLiver(target, raw, effect.element);
        if(isCrit) playLiverDialogue(target, 'critTaken', combatDialogueFired);
        pushLog(`${isCrit?'痛恨の一撃！ ':''}${combatEnemy.name}の攻撃！ ${targetName}が ${dmg} のダメージを受けた。`, 'danger', true);
        if(effect.drainRatio){
          const healed = Math.max(0, Math.round(dmg * effect.drainRatio));
          if(healed > 0){
            combatEnemyHp = Math.min(combatEnemy._maxHp, combatEnemyHp + healed);
            pushLog(`${combatEnemy.name}はダメージの一部を吸収して回復した。(+${healed})`, 'system', true);
          }
        }
        checkLiverKO(target);
      } else {
        // プレイヤー(casterId)から敵への攻撃効果。仲間への攻撃効果は現状想定していない。
        const casterName = liverDef(casterId).name;
        const atk = combatAtk(casterId);
        const affixMult = weaponAffixDamageMult(casterId);
        const isCrit = rollCrit(casterId);
        let mult = effect.amount;
        let isWeak = null;
        if(effect.weaknessMult != null){
          isWeak = (combatEnemy.weakness === effect.element);
          mult = isWeak ? effect.weaknessMult : effect.offMult;
        }
        if(effect.ignoreDef || isCrit){
          raw = Math.max(1, Math.round(atk * mult * affixMult * (isCrit?CRIT_MULT:1)) + rnd(-1,3));
        } else {
          const def = effectiveEnemyDef() * (effect.defMult != null ? effect.defMult : 1);
          raw = Math.max(1, Math.round((atk - def) * mult * affixMult) + rnd(-1,2));
        }
        combatEnemyHp -= raw;
        lastDamagerId = casterId;
        if(isCrit) playLiverDialogue(casterId, 'critDeal', combatDialogueFired);
        const drained = applyOnHitMpDrain(casterId, raw);
        const drainSuffix = drained > 0 ? ` (MP+${drained})` : '';
        const critPrefix = isCrit ? '会心の一撃！ ' : '';
        let line;
        if(isWeak === true){
          const elLabel = ELEMENT_LABELS[effect.element] || '';
          line = `${critPrefix}${casterName}の攻撃！ 弱点(${elLabel})を突き、${raw} のダメージ！`;
        } else if(isWeak === false){
          line = `${critPrefix}${casterName}の攻撃！ ${raw} のダメージ(弱点不一致)。`;
        } else if(effect.ignoreDef || isCrit){
          line = `${critPrefix}${casterName}の攻撃！ 防御を貫く ${raw} のダメージ。`;
        } else {
          line = `${casterName}の攻撃！ ${combatEnemy.name}に ${raw} のダメージ。`;
        }
        pushLog(line + drainSuffix, isWeak ? 'reward' : 'combat', true);
      }
      return;
    }

    if(effect.type === 'heal'){
      if(target === 'enemy'){
        const heal = Math.max(1, Math.round(combatEnemy._maxHp * effect.amount));
        combatEnemyHp = Math.min(combatEnemy._maxHp, combatEnemyHp + heal);
        pushLog(`${combatEnemy.name}はHPを ${heal} 回復した。`, 'system', true);
      } else {
        const ls = liverState(target);
        const heal = Math.max(1, Math.round(ls.maxHp * effect.amount));
        ls.hp = Math.min(ls.maxHp, ls.hp + heal);
        pushLog(`${targetName}のHPが ${heal} 回復した。`, 'reward', true);
      }
      return;
    }

    // 状態異常耐性: 敵からプレイヤーへの状態異常付与(毒/行動不能/沈黙)だけを
    // 対象に、一定確率で付与そのものを防ぐ(すでに付いている効果を弱める
    // 「軽減」とは別の仕組み。軽減は今後実装する場合、別の効果名で区別する)。
    if(casterIsEnemy && target !== 'enemy'
      && STATUS_EFFECT_ICONS[effect.type] && STATUS_EFFECT_ICONS[effect.type].category === 'ailment'){
      const resist = (liverAccessoryEffects(target).ailmentResist||0)/100;
      if(resist > 0 && Math.random() < resist){
        pushLog(`${targetName}は「${statusEffectLabel(effect.type)}」の付与を防いだ！`, 'system', true);
        return;
      }
    }

    // バフ/デバフ・状態異常はここでまとめて登録するだけ
    const effectsMap = statusEffectsMapFor(target);
    const applied = applyStatusEffect(effectsMap, effect.type, effect.amount, effect.duration, isSelfGrant);
    if(applied){
      pushLog(`${targetName}に「${statusEffectLabel(effect.type)}」の効果が付与された。`, 'system', true);
    }
  }

  function resolveEffect(effect, casterIsEnemy, casterId){
    resolveEffectTargets(effect, casterIsEnemy, casterId).forEach(t=>applyEffectToTarget(effect, t, casterIsEnemy, casterId));
  }

  function expToNext(level){ return Math.floor(20 * Math.pow(level, 1.5)); }
  function maxHpFor(level){ return 30 + level*8; }
  function baseAtkFor(level){ return 5 + level*2; }
  function baseDefFor(level){ return 2 + level; }
  function baseMpFor(level){ return 10 + level*4; }

   * passive: 衣装装備中の常時能力。本人の実際の言動・設定を根拠に選定
   *   (ジョブは後からユーザーが自由に付け替えられるものなので、キャラ
   *   付けの根拠には使っていない)。alwaysがtrueの間は常時発動系なので
   *   ログを出さず、falseの間は条件付き発動につき発動時にログを出す。
   *   kind:'statMult'          常時、指定statに倍率をかける(ログなし)
   *   kind:'partySizeStatMult' 常時、編成人数に応じて指定statに倍率をかける(ログなし)

        passive:{name:'幸せになろうとする権利は全員に平等にあるから。', kind:'battleStartPartyBuff', mult:1.15, turns:2, always:false,
          desc:'戦闘開始直後の2ターンの間、パーティ全体の攻撃力が15%上昇する。'}},
      {key:'common', name:'共通衣装',
        passive:{name:'共通衣装スキル(仮)', kind:'allyActionStack', perStack:0.05, maxStacks:6, always:true,
          desc:'(仮設定・後日差し替え予定) 常時、仲間が行動するたびに攻撃力が少しずつ上昇していく(戦闘終了でリセット、最大+30%)。'}}
    ],
    liver_82: [
      {key:'default', name:'通常衣装(白雪巴専用)',
        passive:{name:'国民とペットのためなら地に頭付けるわよ、私', kind:'coverAlly', threshold:0.3, always:false,
          desc:'味方のHPが30%以下の時、その味方への攻撃を代わりに引き受ける。'}},
      {key:'common', name:'共通衣装',
        passive:{name:'共通衣装スキル(仮)', kind:'lowHpMitigate', threshold:0.3, mult:0.8, always:false,
          desc:'(仮設定・後日差し替え予定) 自身のHPが30%以下のとき、被ダメージが20%軽減される。'}}
    ],
    liver_83: [
      {key:'default', name:'通常衣装(来栖夏芽専用)',
        passive:{name:'コミュニケーションは受け手が全て', kind:'randomAllyBoon', chance:0.18, healRatio:0.15, always:false,
          desc:'戦闘中、毎ラウンド18%の確率で味方の誰かのHPが15%回復する。'}},
      {key:'common', name:'共通衣装',
        passive:{name:'共通衣装スキル(仮)', kind:'partyMpCostReduce', mult:0.9, always:true,
          desc:'(仮設定・後日差し替え予定) 常時、パーティ全員のスキルMP消費が10%軽減される。'}}
    ],
  };
  function costumeDefsFor(liverId){ return COSTUME_DEFS[liverId] || []; }
  function defaultCostumeKeyFor(liverId){ const list = costumeDefsFor(liverId); return list.length ? list[0].key : null; }
  function costumeDefFor(liverId, costumeKey){ return costumeDefsFor(liverId).find(c=>c.key===costumeKey); }
  /* 現在装備中の衣装key。state.roster[id]がまだ存在しない場面
   * (キャラ作成前のプレビュー・newLiverProgress構築中など)でも
   * 安全にデフォルト衣装へフォールバックする。 */
  function equippedCostumeKey(liverId){
    const ls = state && state.roster && state.roster[liverId];
    return (ls && ls.costume) || defaultCostumeKeyFor(liverId);
  }
  function equippedCostumeDef(liverId){
    return costumeDefFor(liverId, equippedCostumeKey(liverId)) || costumeDefsFor(liverId)[0];
  }
  /* 旧LIVER_DEFS[id].passiveの代わりに、これで「今装備中の衣装のパッシブ」を取る。 */
  function equippedPassive(liverId){
    const def = equippedCostumeDef(liverId);
    return def ? def.passive : null;
  }
  /* 将来の衣装解放手段(通常ドロップは使わない想定)から呼ぶための汎用関数。
   * 呼び出し側でsaveGame()/render()を行うこと(unlockLiver()と同じ流儀)。 */
  function unlockCostume(liverId, costumeKey){
    const ls = liverState(liverId);
    const def = costumeDefFor(liverId, costumeKey);
    if(!ls || !def) return;
    if(!ls.unlockedCostumes) ls.unlockedCostumes = [];
    if(ls.unlockedCostumes.includes(costumeKey)) return;
    ls.unlockedCostumes.push(costumeKey);
    pushLog(`${liverDef(liverId).name}の新しい衣装「${def.name}」が解放された！`, 'reward');
  }
  function switchLiverCostume(liverId, costumeKey){
    const ls = liverState(liverId);
    const def = costumeDefFor(liverId, costumeKey);
    if(!ls || !def || !ls.unlocked) return;
    if(!(ls.unlockedCostumes||[]).includes(costumeKey)) return;
    if(ls.costume === costumeKey) return;
    ls.costume = costumeKey;
    recomputeLiverMaxStats(liverId, true);
    pushLog(`${liverDef(liverId).name}の衣装を「${def.name}」に着替えた。`, 'system');
    saveGame(); render();
  }
  const PARTY_MAX = 4; // 編成上限は4のまま。ライバーが5人以上に増えても「誰を連れて行くか」の選択が生まれる設計にする
  function liverDef(id){ return LIVER_DEFS.find(d=>d.id===id); }
  function liverState(id){ return state.roster[id]; }
  function liverJobDef(id){ return JOB_DEFS[liverState(id).job]; }
  /* 現在就いているジョブでのレベル・EXP・スキル編成(ジョブごとに個別管理)。 */
  function jobProgressFor(id){ const ls = liverState(id); return ls.jobProgress[ls.job]; }

  function jobMaxHp(jobId, level){ return Math.round(maxHpFor(level) * JOB_DEFS[jobId].hpMult); }
  function jobBaseAtk(jobId, level){ return Math.round(baseAtkFor(level) * JOB_DEFS[jobId].atkMult); }
  function jobBaseDef(jobId, level){ return Math.round(baseDefFor(level) * JOB_DEFS[jobId].defMult); }
  function jobMaxMp(jobId, level){ return Math.round(baseMpFor(level) * JOB_DEFS[jobId].mpMult); }

  /* ---------------------------------------------------------------
   * 戦闘力
   * あえてパッシブは一切加味しない(ライバーによって自身のステータスに
   * 乗らない系統のパッシブもあり、育成状況が同じなのに数値差が開いて
   * しまうのを避けるため)。スキル編成の中身(何を有効化しているか)も
   * 見ない(戦術的に一部だけ有効化する選択を不利にしたくないため)。
   *
   * 現在のジョブ(装備込み)のステータスを主体としつつ、他の2ジョブの
   * 育成状況(そのジョブでのレベル分のステータス「素質」、装備ボーナスは
   * 乗らない)も控えめな重みで加算する。これにより、同じレベルでも
   * 他ジョブを育てている人の方が戦闘力で優位に立てる。
   * --------------------------------------------------------------- */
  const CP_MAIN_WEIGHT = { hp:1.0, atk:3.5, def:3.5, mp:0.5 };
