<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七彩の塔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    /* 大地(背景) */
    --field-sky:#8fcbe8;
    --field-ground:#3f7d3f;
    --field-ground-dark:#2c5c2c;

    /* ウィンドウ(定番RPGの紺ウィンドウ) */
    --win-bg-1:#1c2e6e;
    --win-bg-2:#0e1a45;
    --win-border:#f3ecd2;
    --win-border-inner:#0a1230;

    --text-primary:#f5f1de;
    --text-muted:#a9b6dd;
    --gold:#ffd863;
    --hp-red:#ef5a5a;
    --danger:#ff8a6a;
    --rare-uncommon:#8fe08f;
    --rare-rare:#ffd863;
    --rare-epic:#ff9f5a;
    --buff:#5eea87;
    --debuff:#ffb347;
    --ailment:#e08bff;

    --font-display:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic","Meiryo",sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic","Meiryo",sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(180deg, var(--field-sky) 0%, var(--field-sky) 18%, var(--field-ground) 42%, var(--field-ground-dark) 100%);
    color:var(--text-primary);
    font-family:var(--font-body);
    min-height:100vh;
    padding:24px clamp(16px,3vw,56px) 60px;
  }
  .wrap{max-width:1680px;margin:0 auto;}

  header{
    display:flex;justify-content:space-between;align-items:flex-end;
    padding-bottom:14px;margin-bottom:20px;
    flex-wrap:wrap;gap:10px;
  }
  h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(24px,4vw,32px);
    margin:0;
    letter-spacing:0.02em;
    color:#fff;
    text-shadow:2px 2px 0 #2c5c2c, 0 0 10px rgba(0,0,0,0.35);
  }
  h1 span{color:var(--gold);}
  .subtitle{font-family:var(--font-mono);font-size:12px;color:#eef3ff;letter-spacing:0.08em;margin-top:4px;text-shadow:1px 1px 0 #2c5c2c;}
  .depth-badge{
    font-family:var(--font-mono);
    font-size:12px;color:var(--gold);
    border:2px solid var(--win-border);
    box-shadow:inset 0 0 0 2px var(--win-border-inner);
    padding:8px 14px;border-radius:0;
    background:linear-gradient(180deg,var(--win-bg-1),var(--win-bg-2));
    white-space:nowrap;
    display:flex;flex-direction:column;gap:5px;min-width:150px;
  }
  .badge-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .badge-location{color:#eef3ff;font-size:11px;letter-spacing:0.03em;justify-content:flex-start;}
  .badge-progress-track{flex:1 1 auto;height:6px;background:#0a1230;border:1px solid var(--win-border-inner);}
  .badge-progress-fill{display:block;height:100%;background:linear-gradient(90deg,#3a7a3a,var(--rare-uncommon));}
  .badge-resources{display:flex;align-items:center;gap:12px;}
  .badge-resource{color:var(--gold);font-size:14px;font-weight:700;white-space:nowrap;}

  .layout{display:grid;grid-template-columns:minmax(0,1fr) 300px 300px;gap:22px;align-items:start;}
  @media (max-width:1180px){.layout{grid-template-columns:minmax(0,1fr) 250px 250px;gap:16px;}}
  @media (max-width:900px){.layout{grid-template-columns:1fr;}}

  /* モバイルでは冒険の記録が画面下部に固定されないため、バトルログを
   * 含む詳細ログをメインウィンドウ内にも出す(PCでは逆に隠す)。 */
  .log-mobile-only{display:none;}
  @media (max-width:900px){
    .log-desktop-only{display:none;}
    .log-mobile-only{display:block;}
  }

  /* --- PC(901px以上)でプレイ中の画面のみ: 冒険の記録/チャット欄を画面
   * 最下部に固定し、メイン画面・パーティ・所持品はその上の残り高さに
   * 収める。戦闘中にログの行数が変わってもウィンドウ全体の高さや
   * スクロール位置が動かないようにするための構成(body.playingは
   * render()内でのみ付与される。キャラ作成・次元断層ロック画面は対象外)。 */
  @media (min-width:901px){
    body.playing{
      height:100vh;
      overflow-y:auto;
      padding:10px clamp(16px,3vw,56px) 10px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }
    body.playing .wrap{
      width:100%;
      flex:1 1 auto;
      min-height:0;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    /* メインウィンドウの高さを少しでも稼ぐため、プレイ中のヘッダー
     * (タイトル・右上のリソース表示)は詰めて表示する。 */
    body.playing header{flex:0 0 auto;padding-bottom:6px;margin-bottom:8px;}
    body.playing h1{font-size:clamp(18px,2.2vw,22px);}
    body.playing .subtitle{margin-top:1px;font-size:10px;}
    body.playing .depth-badge{padding:5px 10px;gap:3px;min-width:120px;}
    body.playing .badge-resource{font-size:12px;}
    body.playing .layout{flex:1 1 auto;min-height:0;align-items:stretch;}
    body.playing .layout > div{display:flex;flex-direction:column;min-height:0;}
    body.playing .layout > div > .scene{flex:1 1 auto;min-height:0;overflow-y:auto;}
    body.playing .layout > div > .panel{
      flex:1 1 auto;min-height:0;margin-bottom:0;
      display:flex;flex-direction:column;overflow:hidden;
    }
    body.playing .layout > div > .panel .inventory-scroll{flex:1 1 auto;min-height:0;max-height:none;}
    body.playing .history-panel{flex:0 0 auto;margin-top:16px;}
  }

  /* --- 共通スクロールボックス --- */
  .scrollbox{overflow-y:auto;padding-right:6px;}
  .scrollbox::-webkit-scrollbar{width:6px;}
  .scrollbox::-webkit-scrollbar-thumb{background:var(--win-border);}

  /* --- Scene viewport: classic RPG window --- */
  .scene{
    position:relative;
    background:linear-gradient(180deg,var(--win-bg-1),var(--win-bg-2));
    border:2px solid var(--win-border);
    box-shadow:inset 0 0 0 2px var(--win-border-inner);
    border-radius:0;
    padding:26px 28px;
    min-height:260px;
    display:block;
  }

  .scene-heading-progress{
    display:inline-flex;align-items:center;gap:8px;
    flex:0 0 auto;
    white-space:nowrap;
  }
  .scene-heading-progress .badge-progress-track{width:70px;flex:0 0 auto;}

  .scene-text{
    font-size:16px;line-height:1.8;
    min-height:32px;
  }
  .scene-text .log-entry{margin:0 0 6px;}
  .scene-text .log-entry.combat{color:#ffd0b0;}
  .scene-text .log-entry.reward{color:var(--gold);}
  .scene-text .log-entry.danger{color:var(--danger);}
  .scene-text .log-entry.system{color:var(--text-muted);}

  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
  button{
    font-family:var(--font-body);font-size:14px;
    background:linear-gradient(180deg,var(--win-bg-1),var(--win-bg-2));
    color:var(--text-primary);
    border:2px solid var(--win-border);
    box-shadow:inset 0 0 0 1px var(--win-border-inner);
    padding:10px 18px;border-radius:0;
    cursor:pointer;
    transition:border-color .1s, background .1s, padding-left .1s;
  }
  button:hover:not(:disabled){border-color:var(--gold);background:linear-gradient(180deg,#28398a,#152252);padding-left:22px;}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  button:disabled{opacity:0.4;cursor:not-allowed;}
  button.primary{border-color:var(--gold);color:#fff;font-weight:600;}
  button.primary:hover:not(:disabled){background:linear-gradient(180deg,#2d4099,#17245c);}
  button.danger{border-color:var(--danger);}
  button.danger:hover:not(:disabled){background:linear-gradient(180deg,#5a2a2a,#3a1717);}

  .section-label{
    font-family:var(--font-mono);font-size:11px;color:var(--gold);
    letter-spacing:.08em;margin:0 0 8px;text-transform:uppercase;
  }
  .section-block{margin-top:18px;}
  .name-input{
    width:100%;padding:10px;font-family:var(--font-body);font-size:14px;
    background:#0e1a45;border:2px solid var(--win-border);color:var(--text-primary);
    border-radius:0;margin-top:8px;
  }

  /* --- Sidebar: character sheet --- */
  .panel{
    background:linear-gradient(180deg,var(--win-bg-1),var(--win-bg-2));
    border:2px solid var(--win-border);
    box-shadow:inset 0 0 0 2px var(--win-border-inner);
    border-radius:0;
    padding:16px;
    margin-bottom:16px;
  }
  .panel h2{
    font-family:var(--font-mono);
    font-size:11px;letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 12px;
    border-bottom:1px solid rgba(255,255,255,0.25);
    padding-bottom:8px;
  }
  .scene-heading{
    font-family:var(--font-mono);
    font-size:11px;letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 14px;
    border-bottom:1px solid rgba(255,255,255,0.25);
    padding-bottom:8px;
    display:flex;justify-content:space-between;align-items:center;gap:14px;
  }
  .history-panel{margin-top:16px;}
  .history-log{
    max-height:var(--history-log-height, 170px);
    font-family:var(--font-mono);font-size:12px;line-height:1.65;
  }
  .history-log p{margin:0 0 4px;}
  .history-log .combat{color:#ffd0b0;}
  .history-log .reward{color:var(--gold);}
  .history-log .danger{color:var(--danger);}
  .history-log .system{color:var(--text-muted);}

  .inventory-scroll{max-height:280px;}
  .equip-picker-scroll{max-height:min(50vh, 420px);}
  .char-name{font-family:var(--font-display);font-size:19px;font-weight:700;margin:0 0 2px;color:#fff;}
  .char-level{font-family:var(--font-mono);font-size:12px;color:var(--gold);margin:0 0 14px;}

  .bar-row{margin-bottom:10px;}
  .bar-label{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-bottom:3px;}
  .bar-track{height:10px;background:#0a1230;border-radius:0;overflow:hidden;border:1px solid var(--win-border);}
  .bar-fill{height:100%;transition:width .3s ease;}
  .bar-fill.hp{background:linear-gradient(90deg,#c62f2f,var(--hp-red));}
  .bar-fill.mp{background:linear-gradient(90deg,#2a5ec9,#5a9bf0);}
  .bar-fill.exp{background:linear-gradient(90deg,#c99a1e,var(--gold));}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-family:var(--font-mono);font-size:13px;margin-top:12px;}
  .stat-grid div{color:var(--text-muted);}
  .stat-grid strong{color:var(--text-primary);font-weight:600;}

  .equip-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,0.2);}
  .equip-row:last-child{border-bottom:none;}
  .equip-slot{color:var(--text-muted);font-family:var(--font-mono);font-size:11px;}
  .equip-row button{padding:3px 9px;font-size:11px;margin-left:8px;}

  .inv-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:7px 8px;margin-bottom:6px;
    background:rgba(255,255,255,0.06);border-radius:0;font-size:13px;
    border-left:4px solid var(--text-muted);
    cursor:default;
  }
  .inv-item.common{border-left-color:var(--text-muted);}
  .inv-item.uncommon{border-left-color:var(--rare-uncommon);}
  .inv-item.rare{border-left-color:var(--rare-rare);}
  .inv-item.epic{border-left-color:var(--rare-epic);}
  .inv-item button{padding:4px 10px;font-size:11px;}
  .inv-item-name{flex:1 1 auto;min-width:0;margin-right:8px;overflow-wrap:break-word;}
  .inv-item-actions{flex:0 0 auto;display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .inv-empty{color:var(--text-muted);font-size:12px;font-style:italic;}

  .gold-line{font-family:var(--font-mono);font-size:13px;color:var(--gold);margin-top:6px;}

  .party-compact-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,0.15);}
  .party-compact-row:last-of-type{border-bottom:none;}
  .party-compact-row.ko{opacity:.5;}
  .party-compact-chip{width:9px;height:9px;flex:0 0 auto;display:inline-block;}
  .party-compact-name{font-family:var(--font-mono);font-size:12px;width:82px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .party-compact-lv{display:block;color:var(--text-muted);font-size:10px;}
  .party-compact-bars{flex:1 1 auto;display:flex;flex-direction:column;gap:3px;}
  .mini-bar-track{display:block;height:5px;background:#0a1230;border:1px solid var(--win-border-inner);}
  .mini-bar-fill{display:block;height:100%;}
  .mini-bar-fill.hp{background:linear-gradient(90deg,#c62f2f,var(--hp-red));}
  .mini-bar-fill.mp{background:linear-gradient(90deg,#2a5ec9,#5a9bf0);}
  .party-compact-hp{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);width:60px;flex:0 0 auto;text-align:right;}

  /* バフ/デバフ/状態異常アイコン(絵文字は使わず自作のインラインSVG) */
  .icon-row{display:flex;gap:6px;margin-top:3px;flex-wrap:wrap;}
  .icon-chip{
    position:relative;
    width:18px;height:18px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    border:1.5px solid currentColor;
    cursor:default;
  }
  .icon-chip svg{width:12px;height:12px;display:block;}
  .icon-chip.buff{color:var(--buff);background:rgba(94,234,135,0.22);}
  .icon-chip.debuff{color:var(--debuff);background:rgba(255,179,71,0.22);}
  .icon-chip.ailment{color:var(--ailment);background:rgba(224,139,255,0.22);}
  .icon-chip .turns{
    position:absolute;right:-4px;bottom:-5px;
    font-family:var(--font-mono);font-size:8px;font-weight:700;line-height:1;
    color:#0a1230;padding:1px 2.5px;border-radius:5px;
  }
  .icon-chip.buff .turns{background:var(--buff);}
  .icon-chip.debuff .turns{background:var(--debuff);}
  .icon-chip.ailment .turns{background:var(--ailment);}
  .icon-chip[title]:hover{outline:1px solid var(--gold);outline-offset:1px;}

  /* お知らせのタグ・未読バッジ */
  .tag-chip{
    display:inline-block;
    font-family:var(--font-mono);font-size:10px;
    color:var(--gold);border:1px solid var(--gold);
    padding:1px 6px;margin:0 4px 4px 0;
  }
  .notify-badge{
    display:inline-block;
    font-family:var(--font-mono);font-size:10px;font-weight:700;
    background:var(--gold);color:#1c2e6e;
    border-radius:8px;padding:1px 6px;margin-left:6px;
    vertical-align:middle;
  }

  /* character creation */
  .create-box{max-width:440px;margin:60px auto;text-align:center;}
  .create-box input{
    width:100%;padding:12px;font-family:var(--font-body);font-size:16px;
    background:#0e1a45;border:2px solid var(--win-border);color:var(--text-primary);
    border-radius:0;margin:14px 0;
  }
  .create-box p{color:var(--text-muted);line-height:1.7;font-size:14px;}
  /* 利用規約本文: 板(.panel)の中は.create-box pの薄灰色より読みやすい
   * text-primaryを優先させたいので、.create-box pと同specificityのまま
   * 後勝ちさせるためここで再宣言する。 */
  .tos-panel p{color:var(--text-primary);text-align:left;}
  .tos-panel strong{color:#fff;}
  .create-liver-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px;}
  .create-liver-card{
    display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;
    background:linear-gradient(180deg,var(--win-bg-1),var(--win-bg-2));
    border:2px solid var(--win-border);cursor:pointer;color:var(--text-primary);
  }
  .create-liver-card:hover{border-color:var(--gold);}
  .create-liver-card.selected{box-shadow:0 0 0 2px var(--gold) inset;}
  .create-liver-chip{width:16px;height:16px;border-radius:50%;}
  .create-liver-name{font-family:var(--font-mono);font-size:13px;}
  .create-liver-title{font-size:11px;color:var(--text-muted);}
</style>
</head>

<div style="background:#ff5b35;color:#fff;text-align:center;padding:8px 12px;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic Medium','Yu Gothic','Meiryo',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.05em;">STG環境(テスト用・本番ではありません)</div>
<div class="wrap" id="app"></div>

<script>
(function(){
  "use strict";

  const GAME_TITLE_HTML = '<span>七彩</span>の塔';
  const GAME_SUBTITLE = 'TOWER OF SEVENS';

  /* ---------------------------------------------------------------
   * 利用規約
   * 法的な完全性を目指したものではなく、(1)不正行為に対して利用停止
   * (BAN)を行う正当な根拠を示すこと、(2)非公式の二次創作であることの
   * 理解、(3)広告収益が運営コスト相当に充てられることの理解、を得る
   * ためのもの。内容を変更した場合はCURRENT_TOS_VERSIONを上げること。
   * バージョンが上がると、既に同意済みのプレイヤーにも次回起動時に
   * 再同意ダイアログが表示される(agree_to_tos RPC・players.tos_agreed_version)。
   * --------------------------------------------------------------- */
  const CURRENT_TOS_VERSION = 1;
  const TOS_TEXT_HTML = `
    <p><strong>第1条(本サービスについて)</strong><br>
    「七彩の塔」(以下「本サービス」)は、個人が制作・運営する非公式の二次創作プロジェクトです。VTuberグループ「にじさんじ」の運営元である株式会社ANYCOLORとは一切関係が無く、公式のコンテンツやサービスではありません。本サービスは、ANYCOLOR株式会社が定める二次創作に関するガイドラインの範囲内で運営されます。</p>
    <p><strong>第2条(収益について)</strong><br>
    本サービスに広告等が表示される場合、その収益はサーバーの維持費など、本サービスの運営に必要なコストを賄う範囲にとどめるものとし、大規模な商業利用は行いません。</p>
    <p><strong>第3条(アカウント)</strong><br>
    本サービスは匿名の認証情報をもとにプレイデータを保存します。アカウント情報(ブラウザに保存される認証情報等)の管理はユーザー自身の責任で行うものとし、これに起因する不利益について運営者は責任を負いません。</p>
    <p><strong>第4条(禁止事項)</strong><br>
    本サービスの利用にあたり、次の行為を禁止します。</p>
    <p style="padding-left:1em;">
    ・通信内容の改ざん、非公開のAPIへの不正なアクセスその他の手段による、意図しないデータの取得・変更・詐称行為(いわゆるチート行為)<br>
    ・他のユーザーへのなりすまし、誹謗中傷、迷惑行為<br>
    ・複数アカウントを用いた不正な利益の取得<br>
    ・本サービスの運営を妨害する行為<br>
    ・その他、法令または公序良俗に反する行為
    </p>
    <p><strong>第5条(利用停止)</strong><br>
    運営者は、ユーザーが前条の禁止事項に該当する、またはそのおそれがあると判断した場合、事前の通知なくそのアカウントによる本サービスの利用を停止(BAN)できるものとします。</p>
    <p><strong>第6条(免責事項)</strong><br>
    本サービスは現状有姿で提供されます。運営者は、本サービスの内容を予告なく変更・中断・終了することがあります。本サービスの利用により生じた損害について、運営者は法令上許容される範囲で責任を負わないものとします。</p>
    <p><strong>第7条(規約の変更)</strong><br>
    運営者は、本規約の内容を変更することがあります。内容を変更した場合、変更後の規約への同意を改めて求めることがあります。</p>
  `;

  /* ---------------------------------------------------------------
   * Supabase接続設定

  /* depthに応じて「プレイヤーlevelとの差」の出やすさを変える重み表 */
  function pickLevelOffset(depth){
    const tiers = depth <= 5
      ? [[-1,20],[0,55],[1,20],[2,5]]
      : depth <= 15
        ? [[-1,5],[0,30],[1,35],[2,22],[3,8]]
        : [[0,10],[1,25],[2,30],[3,25],[4,10]];
    const total = tiers.reduce((s,t)=>s+t[1],0);
    let r = Math.random()*total;
    for(const [off,w] of tiers){ if(r < w) return off; r -= w; }
    return 0;
  }

  /* パーティ人数が多いほど1ラウンドの総火力が上がるため、敵HPを人数に応じて
   * 底上げする(4人編成が既定の想定バランス値=1.0倍)。人数は編成に合わせて
   * 増減可能なので、少人数パーティでは相対的に敵が弱く感じられる想定。
   * 実際のバランスは今後の調整用に係数だけ切り出してある。 */
  function partySizeHpMult(){
    const n = Math.max(1, state.party.length);
    return 0.4 + n*0.6; // 1人:1.0 / 2人:1.6 / 3人:2.2 / 4人:2.8
  }

  const BOSS_LEVEL_PREMIUM = 4; // ボスは「そのダンジョンのレベル+この値」で固定(パーティの強さは見ない)

  function spawnEnemy(dungeonDef, depth, isBoss){
    if(isBoss){
      const b = dungeonDef.boss;
      const level = Math.max(1, dungeonDef.level + BOSS_LEVEL_PREMIUM);
      const base = statsForLevel(level);
      const hp  = Math.max(5, Math.round(base.hp  * b.hpMult * partySizeHpMult()));
      const atk = Math.max(1, Math.round(base.atk * b.atkMult));
      const def = Math.max(0, Math.round(base.def * b.defMult));
      const exp = Math.round(base.exp * 1.6);
      return {name:b.name, level, hp, maxHp:hp, atk, def, exp, boss:true, skills:b.skills||[], weakness:b.weakness||null};
    }
    const pool = ENEMY_POOLS[dungeonDef.pool] || ENEMY_POOLS.ashen;
    const type = pool[Math.floor(Math.random()*pool.length)];
    /* 敵の強さはパーティの強さではなく、そのダンジョン固有のレベルを基準にする。
     * こうすることで、育った仲間を連れて序盤のダンジョンへ新キャラを鍛えに
     * 戻っても、敵の強さは変わらず安全に育成できる(意図的な設計)。
     * チュートリアル専用ダンジョンだけは、深度が進んでも雑魚が強くならない
     * よう常にLv.1固定にする(Lv.1・1人パーティを想定した唯一のダンジョンのため)。 */
    const level = dungeonDef.id === 'tutorial' ? 1 : Math.max(1, dungeonDef.level + pickLevelOffset(depth));
    const base = statsForLevel(level);
    const hp  = Math.max(5, Math.round(base.hp  * type.hpMult * partySizeHpMult()));
    const atk = Math.max(1, Math.round(base.atk * type.atkMult));
    const def = Math.max(0, Math.round(base.def * type.defMult));
    const exp = Math.round(base.exp);
    return {name:type.name, level, hp, maxHp:hp, atk, def, exp, boss:false, skills:type.skills||[], weakness:type.weakness||null};
  }

   * 最低+1を保証)。最大+10まで(基礎値が十分大きい装備ではおよそ+50%)。 */
  const ENHANCE_MAX_LEVEL = 10;
  function itemEnhanceIncrement(baseValue){

  /* カーソルを合わせた時に表示する、錬成結果アイテムの説明。装備は
   * itemDetailText()と同じ体裁(レアリティ・種別・効果値)、素材・オーブは
   * それぞれの説明文を表示する。 */
  function recipeOutputDetailText(recipe){
    const out = recipe.output;
    if(out.type === 'material'){
      const def = MATERIAL_DEFS[out.key];
      return `${def.name}: ${def.desc}`;
    }
    if(out.type === 'orb'){
      return `${RARITY[out.key].label}のオーブ: 合成で装備の強化値を上げるのに使う。`;
    }
    return itemDetailText(out.make());
  }

  function materialCount(key){
    return (state.materials && state.materials[key]) || 0;
  }
  function canAffordRecipe(recipe){
    return recipe.materials.every(m => materialCount(m.key) >= m.qty);
  }

  function craftRecipe(recipeId){
    if(!canManageEquipment()) return;
    const recipe = ALCHEMY_RECIPES.find(r=>r.id===recipeId);
    if(!recipe) return;
    if(!canAffordRecipe(recipe)) return;

    if(!state.materials) state.materials = {};
    recipe.materials.forEach(m=>{ state.materials[m.key] = materialCount(m.key) - m.qty; });

    if(recipe.output.type === 'material'){
      const key = recipe.output.key;
      state.materials[key] = materialCount(key) + recipe.output.qty;
      pushLog(`錬金に成功し、「${MATERIAL_DEFS[key].name}」を${recipe.output.qty}個手に入れた。`, 'reward');
    } else if(recipe.output.type === 'orb'){
      const key = recipe.output.key;
      if(!state.orbs) state.orbs = {};
      state.orbs[key] = (state.orbs[key]||0) + recipe.output.qty;
      pushLog(`錬金に成功し、「${RARITY[key].label}のオーブ」を${recipe.output.qty}個手に入れた。`, 'reward');
    } else if(recipe.output.type === 'item'){
      const item = recipe.output.make();
      const grade = rollAlchemyGrade();
      if(grade > 0) item.enhanceLevel = grade;
      addItemToInventory(item);
      const gradeLabel = grade > 0 ? ` 大成功！(強化値+${grade})` : '';
      pushLog(`錬金に成功し、「${item.name}」を手に入れた。${gradeLabel}`, 'reward');
    }

    saveGame(); render();
  }

  function rollRarity(){
    const total = Object.values(RARITY).reduce((s,r)=>s+r.weight,0);
    let roll = Math.random()*total;
    for(const key in RARITY){
      if(roll < RARITY[key].weight) return key;
      roll -= RARITY[key].weight;
    }
    return 'common';
  }

  /* 防具にのみ、一定確率で属性耐性の付与(まれにマイナス=弱点化も)が付く。
   * レアリティが高いほど数値が大きくなりやすい。 */
  function rollResistAffix(rarityKey){
    if(Math.random() > 0.35) return null;
    const elements = Object.keys(ELEMENT_LABELS);
    const element = elements[Math.floor(Math.random()*elements.length)];
    const magnitudeByRarity = {common:1, uncommon:1, rare:2, epic:3};
    let value = magnitudeByRarity[rarityKey] || 1;
    if(Math.random() < 0.2) value = -Math.max(1, Math.round(value*0.7)); // まれに弱点化する「訳あり」装備
    return { element, value };
  }

  /* 武器の特殊接頭辞。レア以上でのみ抽選され、通常ドロップ(コモン/アンコモン)は
   * 素の名称のまま。kind:'element'は攻撃(通常攻撃・防御無視の一撃・連撃・
   * 身構えながらの一撃)に武器属性を乗せ、敵の弱点と一致した時だけ追加ダメージが
   * 入る。kind:'atkBonus'は単純にvalue(攻撃力)へ加算される。 */
  const WEAPON_AFFIXES = [
    { name:'凍てつく', kind:'element', element:'ice' },
    { name:'灼熱の',   kind:'element', element:'fire' },
    { name:'雷光の',   kind:'element', element:'thunder' },
    { name:'巨大な',   kind:'atkBonus' },
    { name:'鋭利な',   kind:'atkBonus' },
  ];
  function rollWeaponAffix(rarityKey){
    if(rarityKey !== 'rare' && rarityKey !== 'epic') return null;
    const tmpl = WEAPON_AFFIXES[Math.floor(Math.random()*WEAPON_AFFIXES.length)];
    if(tmpl.kind === 'atkBonus'){
      return { name: tmpl.name, kind:'atkBonus', bonus: rarityKey==='epic' ? rnd(16,24) : rnd(8,14) };
    }
    return { name: tmpl.name, kind:'element', element: tmpl.element, mult: rarityKey==='epic' ? 1.5 : 1.3 };
  }

  /* 装備の数値は「ダンジョンレベル+踏破深度」を土台にする(武器・防具共通)。
   * levelはそのダンジュンの固定値(DUNGEON_DEFS[].level)、depthは踏破深度
   * だが、advance()側でprogressが100%に達した時点でカウントを止めているため、
   * 実質「そのダンジョンで出る装備の上限」として機能する。レアリティによる
   * 上振れ(倍率)だけが、その上限の中でのブレ幅になる。 */
  function makeItem(type, level, depth){
    const rarityKey = rollRarity();
    const rarity = RARITY[rarityKey];
    if(type === 'weapon'){
      const typeKeys = Object.keys(WEAPON_TYPES);
      const weaponType = typeKeys[Math.floor(Math.random()*typeKeys.length)];
      const affix = rollWeaponAffix(rarityKey);
      let value = Math.round((level + depth) * 0.6 * rarity.mult);
      if(affix && affix.kind==='atkBonus') value += affix.bonus;
      return {
        id: 'itm_'+Math.random().toString(36).slice(2,9),
        type, rarity:rarityKey, rarityLabel:rarity.cls,
        weaponType,
        name: (affix ? affix.name : '') + WEAPON_TYPES[weaponType].base,
        value,
        affix: (affix && affix.kind==='element') ? affix : null,
        resist: null
      };
    }
    const base = ARMOR_BASES[Math.floor(Math.random()*ARMOR_BASES.length)];
    const value = Math.round((level + depth) * 0.6 * rarity.mult);
    const prefix = rarityKey==='common' ? '' : (rarityKey==='uncommon' ? '頑丈な' : rarityKey==='rare' ? '精霊の' : '深淵の');
    return {
      id: 'itm_'+Math.random().toString(36).slice(2,9),
      type, rarity:rarityKey, rarityLabel:rarity.cls,
      name: prefix + base,
      value,
      resist: rollResistAffix(rarityKey)
    };
  }

  function itemValueLabel(item){
    let s = `(+${itemEffectiveValue(item)})`;
    if(item.enhanceLevel) s += ` [強化+${item.enhanceLevel}]`;
    if(item.weaponType) s += ` [${WEAPON_TYPES[item.weaponType].name}]`;
    if(item.affix && item.affix.kind==='element'){
      s += ` ${ELEMENT_LABELS[item.affix.element]}属性付与`;
    }
    if(item.resist){
      const sign = item.resist.value > 0 ? '+' : '';
      s += ` ${ELEMENT_LABELS[item.resist.element]}耐性${sign}${item.resist.value}`;
    }
    return s;
  }

  function itemDetailText(item){
    const typeLabel = item.weaponType ? WEAPON_TYPES[item.weaponType].name : (item.type==='weapon' ? '武器' : '防具');
    const rarityLabel = (RARITY[item.rarity] && RARITY[item.rarity].label) || '';
    let text = `${item.name} / ${rarityLabel} / ${typeLabel} / 効果値 +${itemEffectiveValue(item)}`;
    if(item.enhanceLevel){
      text += ` (基礎値+${item.value} / 強化値+${item.enhanceLevel})`;
    }
    if(item.affix && item.affix.kind==='element'){
      text += ` / ${ELEMENT_LABELS[item.affix.element]}属性付与(弱点の敵に追加ダメージ)`;
    }
    if(item.resist){
      const sign = item.resist.value > 0 ? '+' : '';
      text += ` / ${ELEMENT_LABELS[item.resist.element]}耐性${sign}${item.resist.value}`;
    }
    return text;
  }

  function rnd(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
  function weightedPick(items){
    // items: [{action, weight}] を重みに従って1つ選ぶ
    const total = items.reduce((s,i)=>s+Math.max(0,i.weight), 0);
    if(total <= 0) return items[0] ? items[0].action : null;
    let r = Math.random()*total;
    for(const it of items){
      const w = Math.max(0,it.weight);
      if(r < w) return it.action;
      r -= w;
    }
    return items[items.length-1].action;
  }

  const PROGRESS_PER_STEP = 9; // 1回の成功した行動あたりの踏破率上昇(%)

  /* ---------------------------------------------------------------
   * コロシアムタワー(PvP、Supabase共有テーブル方式)
   * 各フロアの「門番」は、そのフロアを最後に突破したプレイヤーの
   * パーティのスナップショット。門番のHPプールは共有テーブルで
   * 管理し、挑戦者が与えたダメージは勝敗にかかわらず永続する
   * (回復しない)。挑戦者側のパーティは毎回全回復した状態で挑む。
   * --------------------------------------------------------------- */
  const COLOSSEUM_FLOORS = 10;
  const COLOSSEUM_COOLDOWN_MS = 500 * 1000;

  /* ---------------------------------------------------------------
   * 次元断層ポモ・ドーロ: ダンジョン・コロシアムとは別枠の放置系コンテンツ。
   * 突入すると規定時間ゲーム全体がロックされ(render()側で強制的に専用
   * 画面だけを表示する)、経過後に結果を受け取れる。ポモドーロ限定アイテムは
   * 設けず、通常のドロップ抽選(makeItem)を使い回す。
   * --------------------------------------------------------------- */
  const RIFT_DURATION_MS = 25 * 60 * 1000;
  function riftEndTime(){ return state.rift ? state.rift.startedAt + RIFT_DURATION_MS : 0; }
  function riftRemainMs(){ return Math.max(0, riftEndTime() - Date.now()); }
  function riftReady(){ return !!state.rift && Date.now() >= riftEndTime(); }

  /* ---------------------------------------------------------------
   * スタミナ: ダンジョン探索に必要な、ライバー単位ではなくプレイヤー
   * (アカウント)単位のリソース。上限100固定、1分に1回復。時間経過以外の
   * 回復手段(アイテム消費・広告視聴など)は今のところ設けない。
   *
   * 他の資源(ゴールド・チケットなど)と同じ信頼モデルで、サーバー側の
   * 厳密な検証はせず、state.stamina/staminaUpdatedAtをクライアント側で
   * 計算してそのまま保存する。staminaUpdatedAtは「最後に回復を計算した
   * 時刻」で、上限に達している間は常に現在時刻に合わせておく(上限中に
   * 経過した分を後で一気に回収できてしまうのを防ぐため)。
   * --------------------------------------------------------------- */
  const STAMINA_MAX = 100;
  const STAMINA_REGEN_MS = 60 * 1000;
  const RIFT_STAMINA_COST = 25;

  function recomputeStamina(){
    if(!state) return false;
    const now = Date.now();
    if(state.stamina >= STAMINA_MAX){
      state.staminaUpdatedAt = now;
      return false;
    }
    const elapsedMs = now - (state.staminaUpdatedAt || now);
    const ticks = Math.floor(elapsedMs / STAMINA_REGEN_MS);
    if(ticks <= 0) return false;
    state.stamina = Math.min(STAMINA_MAX, state.stamina + ticks);
    state.staminaUpdatedAt += ticks * STAMINA_REGEN_MS;
    return true;
  }

  /* ---------------------------------------------------------------
   * 道具: オーブ・素材と同じくスタック管理(state.tools、キー→所持数)
   * だが、合成・錬金の材料ではなく「所持品から直接使用する」消費アイテム。
   * purchasable: trueの道具だけが商店の「買う」に並ぶ(将来、錬金でしか
   * 作れない道具を追加する余地を残すため)。
   * canUse()が無い、またはtrueを返す時だけ所持品側に「使用」ボタンが出る。
   * --------------------------------------------------------------- */
  const TOOL_DEFS = {
    stamina_potion_10: {
      name:'スタミナ10回復薬',
      desc:'使うとスタミナを10回復する。',
      price: 500,
      purchasable: true,
      canUse: () => state.stamina < STAMINA_MAX,
      use: () => {
        recomputeStamina();
        state.stamina = Math.min(STAMINA_MAX, state.stamina + 10);
      }
    },
  };

  function toolCount(key){
    return (state.tools && state.tools[key]) || 0;
  }

  function useToolItem(key){
    const def = TOOL_DEFS[key];
    if(!def || toolCount(key) < 1) return;
    if(def.canUse && !def.canUse()) return;
    def.use();
    state.tools[key] = toolCount(key) - 1;
    pushLog(`「${def.name}」を使った。`, 'reward');
    saveGame(); render();
  }

  /* 突入・受け取り・撤退・結果を閉じる、いずれの直後も必ずDBへの保存が
   * 完了してからロック画面/通常画面へ切り替える(saveGameをawaitする)。
   * 先に画面だけ切り替えてしまうと、保存が終わる前にページを更新された
   * 場合にサーバー側は古い状態しか持っておらず、更新するだけで状態を
   * 巻き戻せてしまうため。 */
  async function startRift(){
    if(inCombat || state.rift) return;
    if(!state.party.length){
      pushLog('パーティが編成されていない。町で編成してから挑もう。', 'system');
      render();
      return;
    }
    recomputeStamina();
    if(state.stamina < RIFT_STAMINA_COST){
      pushLog(`スタミナが足りない(必要: ${RIFT_STAMINA_COST})。時間経過で回復するのを待とう。`, 'system');
      render();
      return;
    }
    state.stamina -= RIFT_STAMINA_COST;
    state.rift = { startedAt: Date.now(), partyIds: state.party.slice(), result: null };
    pushLog('次元断層ポモ・ドーロへ突入した。探索を終えるまで、他の行動は取れない。', 'system');
    await saveGame();
    render();
  }

  /* 探索を中断して町へ戻る。報酬は一切得られない。 */
  async function retreatFromRift(){
    if(!state.rift || state.rift.result) return;
    const ok = confirm('探索を中断して撤退します。この場合、報酬は一切手に入りません。よろしいですか？');
    if(!ok) return;
    state.rift = null;
    pushLog('次元断層ポモ・ドーロから撤退した。', 'system');
    await saveGame();
    render();
  }

  /* 結果を確定させる(まだ画面は閉じない。手に入ったものを表示したまま
   * 「閉じる」が押されるまで、この結果画面自体もロック状態を継続する)。 */
  async function claimRiftReward(){
    if(!state.rift || !riftReady() || state.rift.result) return;
    const size = Math.max(1, state.rift.partyIds.length);
    const lv = partyLevel();
    const gold = Math.round((30 + lv*10) * size);
    const exp = Math.round((10 + lv*5) * size);
    state.gold += gold;
    pushLog(`次元断層ポモ・ドーロから帰還した。ゴールド ${gold} を手に入れた。`, 'reward');

    const levelsBefore = {};
    state.party.forEach(id=>{ levelsBefore[id] = jobProgressFor(id).level; });
    grantExpToParty(exp);
    const levelUps = state.party
      .filter(id=>jobProgressFor(id).level > levelsBefore[id])
      .map(id=>({ name: liverDef(id).name, level: jobProgressFor(id).level }));

    let itemName = null;
    if(Math.random() < 0.35){
      const type = Math.random() < 0.5 ? 'weapon' : 'armor';
      const item = makeItem(type, lv, 0);
      if(addItemToInventory(item)){
        itemName = item.name;
        pushLog(`探索の途中で「${item.name}」を見つけた。`, 'reward');
      }
    }

    state.rift.result = { gold, exp, levelUps, itemName };
    await saveGame();
    render();
  }

  /* 結果表示を閉じて、ここで初めて町へ戻る。 */
  async function closeRiftResult(){
    if(!state.rift || !state.rift.result) return;
    state.rift = null;
    await saveGame();
    render();
  }

  /* まだ誰も登録していないフロアで戦うダミーの門番。フロアが上がるほど
   * 強くなる。倒しても永続記録は作られず、初めて実プレイヤーがここで
   * 勝った時にそのプレイヤーが初代の門番として登録される。 */
  function buildDummyGatekeeper(floor){
    const level = Math.max(1, floor*2 + 1);
    const base = statsForLevel(level);
    const roleMults = [
      {label:'影武者・壱', hpMult:1.3, atkMult:0.9, defMult:1.3},
      {label:'影武者・弐', hpMult:0.9, atkMult:1.3, defMult:0.9},
      {label:'影武者・参', hpMult:0.85, atkMult:1.15, defMult:0.85},
      {label:'影武者・四', hpMult:0.95, atkMult:1.1, defMult:0.95},
    ];
    const snapshot = roleMults.map(r=>({
      name: `コロシアムの${r.label}`, color:'#8a8fa3', job:'dps', level,
      maxHp: Math.max(5, Math.round(base.hp*r.hpMult)),
      atk: Math.max(1, Math.round(base.atk*r.atkMult)),
      def: Math.max(0, Math.round(base.def*r.defMult))
    }));
    const maxHpPool = snapshot.reduce((s,m)=>s+m.maxHp, 0);
    return { holderId:null, holderName:`${floor}Fの見習い門番`, snapshot, hpPool:maxHpPool, maxHpPool, wins:0, isDummy:true };
  }

  /* 門番スナップショット(複数人)を、既存の単体ボス戦エンジンに乗せるための
   * 集約値。細かい個々のステータスよりも「平均的な強さ」を反映する。 */
  function aggregateSnapshotStats(snapshot){
    const n = snapshot.length || 1;
    return {
      atk: Math.round(snapshot.reduce((s,m)=>s+m.atk,0)/n),
      def: Math.round(snapshot.reduce((s,m)=>s+m.def,0)/n),
      level: Math.max(1, Math.round(snapshot.reduce((s,m)=>s+m.level,0)/n))
    };
  }

  /* 現在の生きたパーティのステータスを、門番登録用に切り出す。 */
  function buildPartySnapshot(){
    return state.party.map(id=>{
      const ls = liverState(id);
      const def = liverDef(id);
      return { name: def.name, color: def.color, job: ls.job, level: jobProgressFor(id).level, maxHp: ls.maxHp, atk: liverAtk(id), def: liverDefStat(id) };
    });
  }

  function dungeonDefById(id){ return DUNGEON_DEFS.find(d=>d.id===id); }
  function isDungeonUnlocked(id){
    const def = dungeonDefById(id);
    if(!def.requires) return true;
    const req = state.dungeons[def.requires];
    return !!(req && req.cleared);
  }
  /* ダンジョン一覧に出す範囲。解放済みのものに加えて、次に解放される
   * 1個先のダンジョンまでを含め、それより先はまだ見せない
   * (DUNGEON_DEFSは一本道のrequiresチェーンなので、配列順に見ていって
   * 最初の未解放エントリだけを含めれば良い)。 */
  function visibleDungeonDefs(){
    const visible = [];
    let shownLocked = false;
    for(const def of DUNGEON_DEFS){
      if(def.hidden) continue; // チュートリアル専用ダンジョン等、一覧に一切出さないもの
      if(isDungeonUnlocked(def.id)){
        visible.push(def);
      } else if(!shownLocked){
        visible.push(def);
        shownLocked = true;
      } else {
        break;
      }
    }
    return visible;
  }
  function newDungeonProgress(){ return {progress:0, cleared:false, bossKillCount:0, depth:0}; }
  function currentDungeonState(){ return state.dungeons[state.activeDungeonId]; }
  function currentDungeonDef(){ return dungeonDefById(state.activeDungeonId); }

  function addDungeonProgress(amount){
    const ds = currentDungeonState();
    if(!ds) return;
    ds.progress = Math.min(100, ds.progress + amount);
  }

  function firstClearRewardFor(dungeonId){
    const def = dungeonDefById(dungeonId);
    const tmpl = def.firstClearReward || {name:'名もなき勲章', type:'armor'};
    const mult = def.rewardMult || 1;
    return {
      id: 'itm_'+Math.random().toString(36).slice(2,9),
      type: tmpl.type,
      rarity:'epic', rarityLabel:'epic',
      name: tmpl.name,
      value: Math.round((8 + partyLevel()*2) * mult)
    };
  }

  /* ---------------------------------------------------------------

  /* effectsMapからバフ/デバフ/状態異常アイコンの行HTMLを組み立てる。
   * 何も付与されていなければ空文字(既存レイアウトに一切影響しない)。 */
  function renderStatusEffectChips(effectsMap){
    if(!effectsMap) return '';

    if(!keys.length) return '';

  /* ---------------------------------------------------------------
   * 敵スキル: 汎用効果システム
   * スキルは effects:[{type, target, amount, duration, ignoreDef, element,
   * drainRatio}, ...] という「効果の配列」として定義できる(従来の
   * kind:'trueDamage'/'telegraphed' 形式も引き続きサポートし、共存する)。
   * 将来的にプレイヤー側スキルにも同じ仕組みを使う想定のため、
   * targetは発動者からの相対関係で指定する:
   *   self / allyRandom / allyAll / enemyRandom / enemyAll
   * 今は敵が常に1体という前提のため、ally系は発動者自身を指す。
   *
   * 同じ効果タイプが同一対象に重ねてかかった場合:
   *   ・効果量が大きい方だけが有効(丸ごと上書き)
   *   ・効果量が同じなら、継続ターン数が延長される場合のみ残りターンを上書き
   *   ・効果量が小さい方は無視される(既存の効果がそのまま継続)
   * 重複を許したい場合は、別の効果タイプ名(例: atkBuff2)として
   * 新設すれば独立して共存できる。
   *
   * 継続効果は「行動後」にtickする。ただし発動者が自分自身にかけた効果は、
   * 付与された直後の巡だけtickをスキップする(付与ターンではなく、次の
   * 自分の行動から確実に効くようにするため)。他者にかけた効果は、その
   * 対象の次の行動から自然に通常通りtickされる(巡が異なるため特別扱い不要)。
   * --------------------------------------------------------------- */
  function applyStatusEffect(effectsMap, type, amount, duration, isSelfGrant){
    const current = effectsMap[type];
    if(!current){
      effectsMap[type] = {amount, turnsLeft:duration, freshlyGranted: !!isSelfGrant};
      return true;
    }
    if(amount > current.amount){
      effectsMap[type] = {amount, turnsLeft:duration, freshlyGranted: !!isSelfGrant};
      return true;
    }
    if(amount === current.amount && duration > current.turnsLeft){
      current.turnsLeft = duration;
      if(isSelfGrant) current.freshlyGranted = true;
      return true;
    }
    return false;
  }

  /* onTick(type, eff): 継続ダメージ/継続回復など、tickのたびに起こる処理。
   * onExpire(type): 残りターンが0になり消滅した時の処理(ログ出しなど)。 */
  function tickStatusEffects(effectsMap, onTick, onExpire){
    if(!effectsMap) return;
    Object.keys(effectsMap).forEach(type=>{
      const eff = effectsMap[type];
      if(eff.freshlyGranted){
        eff.freshlyGranted = false;
        return;
      }
      if(onTick) onTick(type, eff);
      eff.turnsLeft -= 1;
      if(eff.turnsLeft <= 0){
        delete effectsMap[type];
        if(onExpire) onExpire(type);
      }
    });
  }

  function statusStatMult(effectsMap, buffType, debuffType){
    let mult = 1;
    if(effectsMap && effectsMap[buffType]) mult *= (1 + effectsMap[buffType].amount);
    if(effectsMap && effectsMap[debuffType]) mult *= (1 - effectsMap[debuffType].amount);
    return mult;
  }

  /* 継続効果を反映した敵の実効ATK/DEF。最終的な実数値は1を下回らない
   * (倍率自体には下限を設けない)。 */
  function effectiveEnemyAtk(){
    const mult = statusStatMult(combatEnemy.statusEffects, 'atkBuff', 'atkDebuff');
    return Math.max(1, Math.round(combatEnemy._atk * mult));
  }
  function effectiveEnemyDef(){
    const mult = statusStatMult(combatEnemy.statusEffects, 'defBuff', 'defDebuff');
    return Math.max(1, Math.round(combatEnemy._def * mult));
  }

  /* effect.target を発動者から見た相対関係で解決する。戻り値は対象のliverId
   * の配列、または敵自身を表す'enemy'を含む配列。今は敵が常に1体のため
   * ally系は発動者自身になる(複数体対応は将来の拡張点)。 */
  function resolveEffectTargets(effect, casterIsEnemy, casterId){
    switch(effect.target){
      case 'self':
        return casterIsEnemy ? ['enemy'] : (casterId ? [casterId] : []);
      case 'allyRandom': {
        if(casterIsEnemy) return ['enemy'];
        const alive = alivePartyIds();
        return alive.length ? [alive[Math.floor(Math.random()*alive.length)]] : [];
      }
      case 'allyAll':
        return casterIsEnemy ? ['enemy'] : alivePartyIds();
      case 'enemyRandom': {
        if(casterIsEnemy){
          const t = applyCoverRedirect(pickRandomAliveTarget());
          return t ? [t] : [];
        }
        return ['enemy'];
      }
      case 'enemyAll':
        return casterIsEnemy ? alivePartyIds() : ['enemy'];
      default:
        return [];
    }
  }

  function statusEffectsMapFor(target){
    if(target === 'enemy') return combatEnemy.statusEffects || (combatEnemy.statusEffects={});
    if(!playerStatusEffects[target]) playerStatusEffects[target] = {};
    return playerStatusEffects[target];
  }

  /* 効果1つを、解決済みの対象1体に適用する。ダメージ・回復は即時、
   * バフ/デバフ・状態異常はplayerStatusEffects/combatEnemy.statusEffectsに
   * 登録するだけで、実際の反映はtickStatusEffectsや実効ATK/DEF計算側で行う。
   * casterId: プレイヤー側スキルの発動者liverId(敵の場合はnull)。 */
  function applyEffectToTarget(effect, target, casterIsEnemy, casterId){
    const isSelfGrant = casterIsEnemy ? (target === 'enemy') : (target === casterId);
    const targetName = target === 'enemy' ? combatEnemy.name : liverDef(target).name;

    if(effect.type === 'damage'){
      let raw;
      if(casterIsEnemy){
        const atk = effectiveEnemyAtk();
        raw = effect.ignoreDef
          ? Math.max(1, Math.round(atk * effect.amount) + rnd(-1,2))
          : Math.max(1, Math.round(atk * effect.amount) - liverDefStat(target) + rnd(-1,1));
        const dmg = applyDamageToLiver(target, raw, effect.element);
        pushLog(`${combatEnemy.name}の攻撃！ ${targetName}が ${dmg} のダメージを受けた。`, 'danger', true);
        if(effect.drainRatio){
          const healed = Math.max(0, Math.round(dmg * effect.drainRatio));
          if(healed > 0){
            combatEnemyHp = Math.min(combatEnemy._maxHp, combatEnemyHp + healed);
            pushLog(`${combatEnemy.name}はダメージの一部を吸収して回復した。(+${healed})`, 'system', true);
          }
        }
        checkLiverKO(target);
      } else {
        // プレイヤー(casterId)から敵への攻撃効果。仲間への攻撃効果は現状想定していない。
        const casterName = liverDef(casterId).name;
        const atk = combatAtk(casterId);
        const affixMult = weaponAffixDamageMult(casterId);
        let mult = effect.amount;
        let isWeak = null;
        if(effect.weaknessMult != null){
          isWeak = (combatEnemy.weakness === effect.element);
          mult = isWeak ? effect.weaknessMult : effect.offMult;
        }
        if(effect.ignoreDef){
          raw = Math.max(1, Math.round(atk * mult * affixMult) + rnd(-1,3));
        } else {
          const def = effectiveEnemyDef() * (effect.defMult != null ? effect.defMult : 1);
          raw = Math.max(1, Math.round((atk - def) * mult * affixMult) + rnd(-1,2));
        }
        combatEnemyHp -= raw;
        const drained = applyOnHitMpDrain(casterId, raw);
        const drainSuffix = drained > 0 ? ` (MP+${drained})` : '';
        let line;
        if(isWeak === true){
          const elLabel = ELEMENT_LABELS[effect.element] || '';
          line = `${casterName}の攻撃！ 弱点(${elLabel})を突き、${raw} のダメージ！`;
        } else if(isWeak === false){
          line = `${casterName}の攻撃！ ${raw} のダメージ(弱点不一致)。`;
        } else if(effect.ignoreDef){
          line = `${casterName}の攻撃！ 防御を貫く ${raw} のダメージ。`;
        } else {
          line = `${casterName}の攻撃！ ${combatEnemy.name}に ${raw} のダメージ。`;
        }
        pushLog(line + drainSuffix, isWeak ? 'reward' : 'combat', true);
      }
      return;
    }

    if(effect.type === 'heal'){
      if(target === 'enemy'){
        const heal = Math.max(1, Math.round(combatEnemy._maxHp * effect.amount));
        combatEnemyHp = Math.min(combatEnemy._maxHp, combatEnemyHp + heal);
        pushLog(`${combatEnemy.name}はHPを ${heal} 回復した。`, 'system', true);
      } else {
        const ls = liverState(target);
        const heal = Math.max(1, Math.round(ls.maxHp * effect.amount));
        ls.hp = Math.min(ls.maxHp, ls.hp + heal);
        pushLog(`${targetName}のHPが ${heal} 回復した。`, 'reward', true);
      }
      return;
    }

    // バフ/デバフ・状態異常はここでまとめて登録するだけ
    const effectsMap = statusEffectsMapFor(target);
    const applied = applyStatusEffect(effectsMap, effect.type, effect.amount, effect.duration, isSelfGrant);
    if(applied){
      pushLog(`${targetName}に「${statusEffectLabel(effect.type)}」の効果が付与された。`, 'system', true);
    }
  }

  function resolveEffect(effect, casterIsEnemy, casterId){
    resolveEffectTargets(effect, casterIsEnemy, casterId).forEach(t=>applyEffectToTarget(effect, t, casterIsEnemy, casterId));
  }

  function costumeDefsFor(liverId){ return COSTUME_DEFS[liverId] || []; }
  function defaultCostumeKeyFor(liverId){ const list = costumeDefsFor(liverId); return list.length ? list[0].key : null; }
  function costumeDefFor(liverId, costumeKey){ return costumeDefsFor(liverId).find(c=>c.key===costumeKey); }
  /* 現在装備中の衣装key。state.roster[id]がまだ存在しない場面
   * (キャラ作成前のプレビュー・newLiverProgress構築中など)でも
   * 安全にデフォルト衣装へフォールバックする。 */
  function equippedCostumeKey(liverId){
    const ls = state && state.roster && state.roster[liverId];
    return (ls && ls.costume) || defaultCostumeKeyFor(liverId);
  }
  function equippedCostumeDef(liverId){
    return costumeDefFor(liverId, equippedCostumeKey(liverId)) || costumeDefsFor(liverId)[0];
  }
  /* 旧LIVER_DEFS[id].passiveの代わりに、これで「今装備中の衣装のパッシブ」を取る。 */
  function equippedPassive(liverId){
    const def = equippedCostumeDef(liverId);
    return def ? def.passive : null;
  }
  /* 将来の衣装解放手段(通常ドロップは使わない想定)から呼ぶための汎用関数。
   * 呼び出し側でsaveGame()/render()を行うこと(unlockLiver()と同じ流儀)。 */
  function unlockCostume(liverId, costumeKey){
    const ls = liverState(liverId);
    const def = costumeDefFor(liverId, costumeKey);
    if(!ls || !def) return;
    if(!ls.unlockedCostumes) ls.unlockedCostumes = [];
    if(ls.unlockedCostumes.includes(costumeKey)) return;
    ls.unlockedCostumes.push(costumeKey);
    pushLog(`${liverDef(liverId).name}の新しい衣装「${def.name}」が解放された！`, 'reward');
  }
  function switchLiverCostume(liverId, costumeKey){
    const ls = liverState(liverId);
    const def = costumeDefFor(liverId, costumeKey);
    if(!ls || !def) return;
    if(!(ls.unlockedCostumes||[]).includes(costumeKey)) return;
    if(ls.costume === costumeKey) return;
    ls.costume = costumeKey;
    recomputeLiverMaxStats(liverId, true);
    pushLog(`${liverDef(liverId).name}の衣装を「${def.name}」に着替えた。`, 'system');
    saveGame(); render();
  }

  function jobBaseDef(jobId, level){ return Math.round(baseDefFor(level) * JOB_DEFS[jobId].defMult); }

   * 乗らない系統のパッシブもあり、育成状況が同じなのに数値差が開いて

   * 見ない(戦術的に一部だけ有効化する選択を不利にしたくないため)。
   *
   * 現在のジョブ(装備込み)のステータスを主体としつつ、他の2ジョブの
   * 育成状況(そのジョブでのレベル分のステータス「素質」、装備ボーナスは
   * 乗らない)も控えめな重みで加算する。これにより、同じレベルでも
   * 他ジョブを育てている人の方が戦闘力で優位に立てる。
   * --------------------------------------------------------------- */
  const CP_MAIN_WEIGHT = { hp:1.0, atk:3.5, def:3.5, mp:0.5 };
  const CP_OTHER_JOB_WEIGHT = { hp:0.3, atk:1.0, def:1.0, mp:0.15 };

  function jobStatPotential(jobId, level){
    return {
      hp: jobMaxHp(jobId, level),
      atk: jobBaseAtk(jobId, level),
      def: jobBaseDef(jobId, level),
      mp: jobMaxMp(jobId, level)
    };
  }
  function weightedStatSum(stat, weight){
    return stat.hp*weight.hp + stat.atk*weight.atk + stat.def*weight.def + stat.mp*weight.mp;
  }

  function combatPower(liverId){
    const ls = liverState(liverId);
    if(!ls) return 0;
    const activeJob = ls.job;
    const activeLevel = (ls.jobProgress[activeJob] || {}).level || 1;

    const mainStat = jobStatPotential(activeJob, activeLevel);
    mainStat.atk += ls.equipped.weapon ? itemEffectiveValue(ls.equipped.weapon) : 0;
    mainStat.def += ls.equipped.armor ? itemEffectiveValue(ls.equipped.armor) : 0;

    let total = weightedStatSum(mainStat, CP_MAIN_WEIGHT);
    Object.keys(JOB_DEFS).forEach(jobId=>{
      if(jobId === activeJob) return;
      const level = (ls.jobProgress[jobId] || {}).level || 1;
      total += weightedStatSum(jobStatPotential(jobId, level), CP_OTHER_JOB_WEIGHT);
    });
    return Math.round(total);
  }

  /* 常時発動系パッシブ(kind:'statMult')による倍率。対象外なら1を返す。 */
  function passiveStatMult(liverId, stat){
    const p = equippedPassive(liverId);
    if(!p) return 1;
    if(p.kind==='statMult' && p.stat===stat) return p.mult;
    if(p.kind==='partySizeStatMult' && (p.stats||[]).includes(stat)){
      const partySize = (state && state.party) ? state.party.length : 1;
      const extraMembers = Math.max(0, partySize - 1);
      return 1 + extraMembers * (p.perMember||0);
    }
    return 1;
  }

  function unlockedSkillsFor(jobId, level){
    return JOB_DEFS[jobId].skills.filter(s=>level >= (s.unlockLevel||1));
  }

  function defaultLoadout(jobId, level){
    const enabled = unlockedSkillsFor(jobId, level||1).slice(0, SKILL_LOADOUT_MAX).map(s=>s.key);
    return { enabled };
  }

  /* 通常攻撃の発動率(必ず50%以上)と、有効化された各スキルの実発動率を算出。
   * 各スキルの発動率はJOB_DEFS側で固定(baseRate)されており、プレイヤーが
   * 変えられるのは「有効にするかどうか」のみ。有効なスキルのbaseRate合計が
   * 50%を超える場合は、50%に収まるよう全スキルを一律に按分縮小し、
   * 通常攻撃はぴったり50%になる。合計が50%以下ならそのままの値が使われ、
   * 通常攻撃は残り全てを引き受ける。 */
  function computeActionRates(liverId){
    const ls = liverState(liverId);
    const job = JOB_DEFS[ls.job];
    const jp = jobProgressFor(liverId);
    const loadout = jp.loadout;
    const enabledSkills = job.skills.filter(s=>loadout.enabled.includes(s.key) && jp.level >= (s.unlockLevel||1));
    const rawSum = enabledSkills.reduce((sum,s)=>sum + (s.baseRate||0), 0);
    let atkRate, scale;
    if(rawSum <= (100-ATK_MIN_RATE)){
      atkRate = 100 - rawSum;
      scale = 1;
    } else {
      atkRate = ATK_MIN_RATE;
      scale = rawSum > 0 ? (100-ATK_MIN_RATE) / rawSum : 1;
    }
    const actions = enabledSkills.map(s=>({skill:s, rate:(s.baseRate||0)*scale}));
    return { atkRate, actions };
  }

  function toggleSkillEnabled(liverId, skillKey){
    const ls = liverState(liverId);
    const jp = jobProgressFor(liverId);
    const loadout = jp.loadout;
    const idx = loadout.enabled.indexOf(skillKey);
    if(idx >= 0){
      loadout.enabled.splice(idx,1);
    } else {
      const skillDef = JOB_DEFS[ls.job].skills.find(s=>s.key===skillKey);
      if(!skillDef || jp.level < (skillDef.unlockLevel||1)){
        pushLog('まだ習得していないスキルです。', 'system');
        render();
        return;
      }
      if(loadout.enabled.length >= SKILL_LOADOUT_MAX){
        pushLog(`有効にできるスキルは最大${SKILL_LOADOUT_MAX}つまで。`, 'system');
        render();
        return;
      }
      loadout.enabled.push(skillKey);
    }
    saveGame(); render();
  }

  function recomputeLiverMaxStats(id, fullRestore){
    const ls = liverState(id);
    const jp = jobProgressFor(id);
    const newMaxHp = Math.round(jobMaxHp(ls.job, jp.level) * passiveStatMult(id, 'hp'));
    const newMaxMp = Math.round(jobMaxMp(ls.job, jp.level) * passiveStatMult(id, 'mp'));
    ls.maxHp = newMaxHp;
    ls.maxMp = newMaxMp;
    if(fullRestore){
      ls.hp = newMaxHp;
      ls.mp = newMaxMp;
    } else {
      ls.hp = Math.min(ls.hp, newMaxHp);
      ls.mp = Math.min(ls.mp, newMaxMp);
    }
  }

  /* ジョブごとにレベル・EXP・スキル編成を個別管理する(ジョブを切り替えても
   * 他のジョブの成長は失われず、戻ってくればそのまま続きから)。 */
  function newJobProgress(jobId){
    return { level:1, exp:0, loadout: defaultLoadout(jobId, 1) };
  }

  function newLiverProgress(liverDefObj){
    const job = liverDefObj.job;
    const maxHp = Math.round(jobMaxHp(job, 1) * passiveStatMult(liverDefObj.id, 'hp'));
    const maxMp = Math.round(jobMaxMp(job, 1) * passiveStatMult(liverDefObj.id, 'mp'));
    const jobProgress = {};
    Object.keys(JOB_DEFS).forEach(jobId=>{ jobProgress[jobId] = newJobProgress(jobId); });
    const defaultCostume = defaultCostumeKeyFor(liverDefObj.id);
    return {
      job, jobProgress,
      hp:maxHp, maxHp, mp:maxMp, maxMp,
      equipped: {weapon:null, armor:null},
      unlocked: !!liverDefObj.startUnlocked,
      costume: defaultCostume,
      unlockedCostumes: defaultCostume ? [defaultCostume] : []
    };
  }

  function newCharacter(name, starterLiverId, playerId){
    const roster = {};
    LIVER_DEFS.forEach(def=>{ roster[def.id] = newLiverProgress(def); });
    if(starterLiverId && roster[starterLiverId]) roster[starterLiverId].unlocked = true;
    const party = (starterLiverId && roster[starterLiverId]) ? [starterLiverId] : [];
    return {
      name, gold:0,
      playerId,
      roster, party,
      inventory: [],
      log: [],
      history: [],
      screen: 'dungeon',
      activeDungeonId: 'tutorial',
      tutorialDone: false,
      home: { furniture: [] },
      ui: { expandedGroups: [], bottomTab: 'log', equipPickerSlot: null, inventoryTab: 'equip' },
      pendingDefeatGoldLoss: 0,
      dungeons: DUNGEON_DEFS.reduce((acc,d)=>{ acc[d.id]=newDungeonProgress(); return acc; }, {}),
      colosseum: { floorRight: 1, medals: 0, lastChallengeAt: 0 },
      destinyTickets: 0, guaranteedTickets: 0,
      orbs: {}, // レアリティ(common/uncommon/rare/epic)ごとの所持数。合成で消費する
      materials: {}, // 素材キーごとの所持数。錬金で消費する
      tools: {}, // 道具キーごとの所持数。所持品から直接使用する
      stamina: STAMINA_MAX, staminaUpdatedAt: Date.now(),
      rift: null // { startedAt, partyIds } / 非アクティブならnull
    };
  }

  function liverAtk(id){
    const ls = liverState(id);
    const w = ls.equipped.weapon;
    const atk = jobBaseAtk(ls.job, jobProgressFor(id).level) + (w ? itemEffectiveValue(w) : 0);
    return Math.round(atk * passiveStatMult(id, 'atk'));
  }
  function liverDefStat(id){
    const ls = liverState(id);
    const a = ls.equipped.armor;
    const def = jobBaseDef(ls.job, jobProgressFor(id).level) + (a ? itemEffectiveValue(a) : 0);
    const statusMult = statusStatMult(playerStatusEffects[id], 'defBuff', 'defDebuff');
    return Math.max(1, Math.round(def * passiveStatMult(id, 'def') * statusMult));
  }

  /* 条件付きパッシブによる「戦闘中のみ」の与ダメージ倍率。
   * lowEnemyHpBoost/allyDownRageはliverAtk自体には織り込まない
   * (liverAtkはパーティ画面のステータス表示等、戦闘外でも使われるため)。
   * 条件をまたいだ瞬間にのみpushLogで発動を知らせ、以後は同じ戦闘中は
   * 再通知しない。 */
  function activeCombatAtkMult(id){
    const p = equippedPassive(id);
    if(!p) return 1;
    if(!combatPassiveFlags[id]) combatPassiveFlags[id] = {};
    const flags = combatPassiveFlags[id];
    if(p.kind === 'allyDownRage'){
      return flags.rageActive ? p.mult : 1;
    }
    if(p.kind === 'lowEnemyHpBoost' && combatEnemy && combatEnemy._maxHp > 0){
      const ratio = Math.max(0, combatEnemyHp) / combatEnemy._maxHp;
      const active = ratio <= p.threshold;
      if(active && !flags.lowEnemyLogged){
        flags.lowEnemyLogged = true;
        pushLog(`${liverDef(id).name}のパッシブ「${p.name}」が発動！ ${combatEnemy.name}の弱った隙を突き、火力が上がった！`, 'system', true);
      }
      if(!active) flags.lowEnemyLogged = false;
      return active ? p.mult : 1;
    }
    if(p.kind === 'lowHpAtkBoost'){
      const ls = liverState(id);
      const ratio = ls.maxHp > 0 ? ls.hp / ls.maxHp : 1;
      const active = ratio <= p.threshold;
      if(active && !flags.lowHpAtkLogged){
        flags.lowHpAtkLogged = true;
        pushLog(`${liverDef(id).name}のパッシブ「${p.name}」が発動！ 火事場の力で攻撃力が上昇した！`, 'system', true);
      }
      if(!active) flags.lowHpAtkLogged = false;
      return active ? p.mult : 1;
    }
    if(p.kind === 'allyActionStack'){
      const stacks = flags.stacks || 0;
      return 1 + stacks * (p.perStack || 0);
    }
    return 1;
  }
  function combatAtk(id){
    const statusMult = statusStatMult(playerStatusEffects[id], 'atkBuff', 'atkDebuff');
    return Math.max(1, Math.round(liverAtk(id) * activeCombatAtkMult(id) * partyBuffAtkMult() * statusMult));
  }

  /* 戦闘開始直後のNターンだけパーティ全体にかかる攻撃力バフ倍率(樋口楓)。 */
  function partyBuffAtkMult(){
    let mult = 1;
    state.party.forEach(id=>{
      const p = equippedPassive(id);
      if(p && p.kind==='battleStartPartyBuff' && combatEnemy && (combatEnemy.turnCount||0) < (p.turns||0)){
        mult *= p.mult;
      }
    });
    return mult;
  }

  /* 装備武器の属性付与(rollWeaponAffixのkind:'element')による与ダメージ倍率。
   * 敵の弱点属性と一致した時だけ効果があり、一致しなければ1のまま
   * (魔導師本人の属性スキルとは別枠。属性スキル自体には重ねて適用しない)。 */
  function weaponAffixDamageMult(liverId){
    const w = liverState(liverId).equipped.weapon;
    if(!w || !w.affix || w.affix.kind !== 'element') return 1;
    if(!combatEnemy || combatEnemy.weakness !== w.affix.element) return 1;
    return w.affix.mult || 1;
  }

  /* ダンジョンのアイテムドロップ率・ゴールド獲得量にかかる倍率(加賀美ハヤト)。 */
  function partyLootMult(){
    let dropMult = 1, goldMult = 1;
    state.party.forEach(id=>{
      const p = equippedPassive(id);
      if(p && p.kind==='lootBonus'){
        dropMult *= (p.dropRateMult || 1);
        goldMult *= (p.goldMult || 1);
      }
    });
    return { dropMult, goldMult };
  }

  /* パーティ全員のスキルMP消費にかかる倍率(弦月藤士郎)。 */
  function partyMpCostMult(){
    let mult = 1;
    state.party.forEach(id=>{
      const p = equippedPassive(id);
      if(p && p.kind==='partyMpCostReduce') mult *= (p.mult || 1);
    });
    return mult;
  }

  /* 攻撃命中時、与ダメージの一部をMPとして吸収する(魔界ノりりむ)。
   * 戻り値は実際に回復したMP量(戦闘ログへの追記に使う)。 */
  function applyOnHitMpDrain(liverId, dmg){
    const ls = liverState(liverId);
    const p = equippedPassive(liverId);
    if(!p || p.kind !== 'onHitMpDrain' || dmg <= 0) return 0;
    const before = ls.mp;
    ls.mp = Math.min(ls.maxMp, ls.mp + Math.max(1, Math.round(dmg * p.ratio)));
    return ls.mp - before;
  }

  /* 毎ラウンド低確率で発動する妖精の加護(先斗寧)。ラウンド開始時に1回だけ判定する。 */
  function maybeTriggerFairyBoon(){
    const holderId = state.party.find(id=>{
      const p = equippedPassive(id);
      return p && p.kind==='randomAllyBoon' && liverState(id) && liverState(id).hp > 0;
    });
    if(!holderId) return;
    const p = equippedPassive(holderId);
    if(Math.random() >= (p.chance||0)) return;
    const alive = alivePartyIds();
    if(!alive.length) return;
    const targetId = alive[Math.floor(Math.random()*alive.length)];
    const ls = liverState(targetId);
    const before = ls.hp;
    ls.hp = Math.min(ls.maxHp, ls.hp + Math.round(ls.maxHp * (p.healRatio||0)));
    const healed = ls.hp - before;
    if(healed <= 0) return;
    pushLog(`${liverDef(holderId).name}のパッシブ「${p.name}」が発動！ ${liverDef(targetId).name}のHPが${healed}回復した！`, 'system', true);
  }

  /* 仲間が行動するたびに攻撃力が蓄積していくパッシブの通知用(風楽奏斗)。
   * 行動した本人以外で、このパッシブを持つ生存中の味方のスタックを進める。 */
  function notifyAllyActed(actorId){
    state.party.forEach(id=>{
      if(id === actorId) return;
      const ls = liverState(id);
      if(!ls || ls.hp <= 0) return;
      const p = equippedPassive(id);
      if(!p || p.kind !== 'allyActionStack') return;
      if(!combatPassiveFlags[id]) combatPassiveFlags[id] = {};
      const cur = combatPassiveFlags[id].stacks || 0;
      combatPassiveFlags[id].stacks = Math.min(p.maxStacks||99, cur+1);
    });
  }

  /* 敵の攻撃対象を、かばう役がいれば入れ替える(栞葉るり)。 */
  function applyCoverRedirect(targetId){
    if(!targetId) return targetId;
    const targetLs = liverState(targetId);
    if(!targetLs || targetLs.maxHp <= 0) return targetId;
    const coverId = state.party.find(id=>{
      if(id === targetId) return false;
      const ls = liverState(id);
      if(!ls || ls.hp <= 0) return false;
      const p = equippedPassive(id);
      return p && p.kind === 'coverAlly';
    });
    if(!coverId) return targetId;
    const p = equippedPassive(coverId);
    if((targetLs.hp/targetLs.maxHp) > (p.threshold||0)) return targetId;
    pushLog(`${liverDef(coverId).name}のパッシブ「${p.name}」が発動！ ${liverDef(targetId).name}をかばった！`, 'system', true);
    return coverId;
  }

  /* ライバーの属性耐性。レベルアップでは伸びず、装備(・将来的にはスキル等の
   * 一時効果)によってのみ変動する。数値1につき被ダメージ±3%。 */
  function liverResistances(id){
    const ls = liverState(id);
    const res = {};
    Object.keys(ELEMENT_LABELS).forEach(el=>{ res[el] = 0; });
    [ls.equipped.weapon, ls.equipped.armor].forEach(item=>{
      if(item && item.resist && res.hasOwnProperty(item.resist.element)){
        res[item.resist.element] += item.resist.value;
      }
    });
    return res;
  }
  function liverElementalMultiplier(id, element){
    if(!element) return 1;
    const value = liverResistances(id)[element] || 0;
    return Math.max(0.1, 1 - value*0.03);
  }

  /* ジョブごとにレベル・EXP・スキル編成を個別管理しているため、切り替えは
   * 現在のジョブを差し替えるだけでよい(以前そのジョブで積んだ成長は
   * jobProgressにそのまま残っており、戻ってくれば続きから)。 */
  function switchLiverJob(id, jobId){
    const ls = liverState(id);
    if(!JOB_DEFS[jobId] || ls.job === jobId) return;
    if(!ls.jobProgress[jobId]) ls.jobProgress[jobId] = newJobProgress(jobId);
    ls.job = jobId;
    recomputeLiverMaxStats(id, true);
    pushLog(`${liverDef(id).name}のジョブを「${JOB_DEFS[jobId].name}」に切り替えた。`, 'system');
    saveGame(); render();
  }

  /* 現在の編成(パーティ)の平均レベル。敵の強さ調整に使う。 */
  function partyLevel(){
    const members = state.party.filter(id=>liverState(id));
    if(!members.length) return 1;
    const sum = members.reduce((s,id)=>s+jobProgressFor(id).level, 0);
    return Math.max(1, Math.round(sum/members.length));
  }

  function togglePartyMember(id){
    const idx = state.party.indexOf(id);
    if(idx>=0){
      state.party.splice(idx,1);
    } else {
      if(!liverState(id).unlocked) return;
      if(state.party.length >= PARTY_MAX){
        pushLog(`パーティは最大${PARTY_MAX}人まで。`, 'system');
        render();
        return;
      }
      state.party.push(id);
    }

    saveGame(); render();
  }

  function unlockLiver(id){
    const ls = state.roster[id];
    if(!ls || ls.unlocked) return;
    ls.unlocked = true;
    pushLog(`新たな仲間「${liverDef(id).name}」が加わった！`, 'reward');
    if(state.party.length < PARTY_MAX) state.party.push(id);
  }

  /* ---------------- 召喚: 運命のチケット・ガチャ ----------------
   * 未解放ライバーの中からランダムに1名を選ぶ「運命のチケット」ガチャと、
   * 5枚のチケットと交換できる「確約されし運命のチケット」(指名して確実に
   * 仲間にできる)の2本立て。
   * pendingGachaは戦闘中のcombatEnemy等と同様、セーブ不要な一時状態として
   * モジュールスコープの変数で保持する(結果確定前にリロードされた場合、
   * 消費したチケットは戻らない点は割り切りとする)。 */
  const DESTINY_EXCHANGE_COST = 5;
  const DESTINY_MAX_REROLLS = 3;
  let pendingGacha = null; // { candidateId, rerollsUsed, rolling }

  function unclaimedLiverDefs(){ return LIVER_DEFS.filter(d=>!liverState(d.id).unlocked); }

  function drawDestinyCandidate(){
    const pool = unclaimedLiverDefs();
    if(!pool.length) return null;
    return pool[Math.floor(Math.random()*pool.length)].id;
  }

  function pullDestinyTicket(){
    if(inCombat || pendingGacha) return;
    if(state.destinyTickets <= 0) return;
    const candidate = drawDestinyCandidate();
    if(!candidate){
      pushLog('すでに全員のライバーと出会っている。', 'system');
      render();
      return;
    }
    state.destinyTickets -= 1;
    pendingGacha = { candidateId: candidate, rerollsUsed: 0, rolling: false };
    saveGame(); render();
  }

  /* 広告視聴による引き直し。現時点では実際の広告SDKが未導入のため、
   * 数秒待たせる疑似演出で代用している。広告SDK導入時はここを差し替える。 */
  async function rerollDestinyGacha(){
    if(!pendingGacha || pendingGacha.rolling) return;
    if(pendingGacha.rerollsUsed >= DESTINY_MAX_REROLLS) return;
    if(unclaimedLiverDefs().length <= 1) return; // 候補が1人以下なら引き直す意味がない
    pendingGacha.rolling = true;
    render();
    await sleep(2000);
    pendingGacha.candidateId = drawDestinyCandidate() || pendingGacha.candidateId;
    pendingGacha.rerollsUsed += 1;
    pendingGacha.rolling = false;
    render();
  }

  function acceptDestinyGacha(){
    if(!pendingGacha || pendingGacha.rolling) return;
    unlockLiver(pendingGacha.candidateId);
    pendingGacha = null;
    saveGame(); render();
  }

  function exchangeForGuaranteedTicket(){
    if(inCombat || pendingGacha) return;
    if(state.destinyTickets < DESTINY_EXCHANGE_COST) return;
    state.destinyTickets -= DESTINY_EXCHANGE_COST;
    state.guaranteedTickets += 1;
    pushLog(`運命のチケットを${DESTINY_EXCHANGE_COST}枚使い、「確約されし運命のチケット」と交換した。`, 'reward');
    saveGame(); render();
  }

  function useGuaranteedTicket(liverId){
    if(inCombat || pendingGacha) return;
    if(state.guaranteedTickets <= 0) return;
    const ls = liverState(liverId);
    if(!ls || ls.unlocked) return;
    state.guaranteedTickets -= 1;
    unlockLiver(liverId);
    saveGame(); render();
  }

  /* ---------------------------------------------------------------
   * 戦闘力ランキング
   * 数値自体はSupabase側(sync_combat_power RPC)がplayer_roster/
   * player_inventoryの保存済みデータから権威を持って再計算するため、
   * クライアントは表示専用。rankingListPreview/rankingBoardは戦闘中の
   * combatEnemy等と同様、セーブ不要な一時状態としてモジュールスコープの
   * 変数で保持する。
   * 「総合」は1プレイヤーにつき一番強いライバー1体だけがエントリーする
   * (liver_power_overall_rankingビュー側でplayer_idごとに絞り込み済み)。
   * --------------------------------------------------------------- */
  let rankingListPreview = null; // { loading, top:[...] } | null
  let rankingBoard = null;       // { key, loading, top:[...], myRank:{rank, entry}|null, error } | null

  function rankingBoardName(key){
    if(key === 'overall') return '総合ランキング';
    const def = liverDef(key);
    return def ? def.name : key;
  }

  async function openRankingList(){
    if(inCombat) return;
    state.screen = 'rankings';
    rankingListPreview = { loading:true, top:[] };
    render();
    try{
      const { data, error } = await sb.from('liver_power_overall_ranking').select('*')
        .order('combat_power', {ascending:false}).order('achieved_at', {ascending:true}).limit(5);
      if(error) throw error;
      rankingListPreview = { loading:false, top: data || [] };
    }catch(e){
      console.error('ranking preview fetch failed', e);
      rankingListPreview = { loading:false, top:[] };
    }
    render();
  }

  /* boardKeyは'overall'、またはライバーID(個別ランキング)。 */
  async function openRankingDetail(boardKey){
    if(inCombat) return;
    state.screen = 'rankingDetail';
    if(!state.ui) state.ui = {};
    state.ui.rankingSelected = boardKey;
    rankingBoard = { key: boardKey, loading:true, top:[], myRank:null, error:false };
    render();
    try{
      const uid = await ensureAuth();
      const table = boardKey === 'overall' ? 'liver_power_overall_ranking' : 'liver_power_rankings';

      let topQuery = sb.from(table).select('*')
        .order('combat_power', {ascending:false}).order('achieved_at', {ascending:true}).limit(100);
      if(boardKey !== 'overall') topQuery = topQuery.eq('liver_id', boardKey);
      const { data: topData, error: topError } = await topQuery;
      if(topError) throw topError;

      let myEntryQuery = sb.from(table).select('*').eq('player_id', uid);
      if(boardKey !== 'overall') myEntryQuery = myEntryQuery.eq('liver_id', boardKey);
      const { data: myEntry } = await myEntryQuery.maybeSingle();

      let myRank = null;
      if(myEntry){
        let higherQuery = sb.from(table).select('*', {count:'exact', head:true}).gt('combat_power', myEntry.combat_power);
        let tieQuery = sb.from(table).select('*', {count:'exact', head:true}).eq('combat_power', myEntry.combat_power).lt('achieved_at', myEntry.achieved_at);
        if(boardKey !== 'overall'){
          higherQuery = higherQuery.eq('liver_id', boardKey);
          tieQuery = tieQuery.eq('liver_id', boardKey);
        }
        const [{count:higherCount}, {count:tieCount}] = await Promise.all([higherQuery, tieQuery]);
        myRank = { rank: (higherCount||0) + (tieCount||0) + 1, entry: myEntry };
      }

      rankingBoard = { key: boardKey, loading:false, top: topData || [], myRank, error:false };
    }catch(e){
      console.error('ranking detail fetch failed', e);
      rankingBoard = { key: boardKey, loading:false, top:[], myRank:null, error:true };
    }
    render();
  }

  /* ---------------------------------------------------------------
   * お知らせ: announcements(管理者がSQL Editorから直接書き込む想定、
   * 管理画面は用意しない)+ player_announcement_reads(既読管理)。

   * 一時変数で保持する。

  let announcementList = null;      // { loading, items:[...] } | null
  let announcementReadIds = new Set();
  let announcementUnreadCount = 0;  // 町のボタンに出すバッジ用

  function formatAnnouncementDate(iso){
    const d = new Date(iso);
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
  }

  /* 町の画面を開くたびに毎回問い合わせるのは無駄なので、ログイン直後に
   * 1度だけ取得してバッジ件数をキャッシュしておく(お知らせ一覧を開いた
   * 際は改めて最新状態を取得し直す)。 */
  async function refreshAnnouncementUnreadCount(){
    try{
      const uid = await ensureAuth();
      const [{ data: items, error: e1 }, { data: reads, error: e2 }] = await Promise.all([
        sb.from('announcements').select('id'),
        sb.from('player_announcement_reads').select('announcement_id').eq('player_id', uid)
      ]);
      if(e1) throw e1;
      if(e2) throw e2;
      const readSet = new Set((reads||[]).map(r=>r.announcement_id));
      announcementUnreadCount = (items||[]).filter(a=>!readSet.has(a.id)).length;
      render();
    }catch(e){
      console.error('unread announcement count fetch failed', e);
    }
  }

  async function openAnnouncementList(){
    if(inCombat) return;
    state.screen = 'announcements';
    announcementList = { loading:true, items:[] };
    render();
    try{
      const uid = await ensureAuth();
      const [{ data: items, error: e1 }, { data: reads, error: e2 }] = await Promise.all([

      ]);

  async function openAnnouncementDetail(id){
    if(inCombat) return;
    state.screen = 'announcementDetail';
    if(!state.ui) state.ui = {};
    state.ui.announcementSelected = id;

  /* ---------------- Persistence(Supabase) ---------------- */

  /* stateオブジェクトの形は今まで通り保ったまま、読み書きの中身だけを
   * Supabaseのテーブルに向ける。ゲームロジック側(戦闘・探索など)は
   * 一切変更していない。 */

  async function saveGame(){
    if(!state || !state.playerId) return;
    try{
      const rosterRows = LIVER_DEFS.map(def=>{
        const r = state.roster[def.id];
        const jp = r.jobProgress[r.job];
        return {
          liver_id: def.id, job: r.job, level: jp.level, exp: jp.exp,
          hp: r.hp, max_hp: r.maxHp, mp: r.mp, max_mp: r.maxMp,
          equipped_weapon_id: r.equipped.weapon ? r.equipped.weapon.id : null,
          equipped_armor_id: r.equipped.armor ? r.equipped.armor.id : null,
          loadout: jp.loadout.enabled, unlocked: !!r.unlocked,
          job_progress: r.jobProgress,
          costume: r.costume || defaultCostumeKeyFor(def.id),
          unlocked_costumes: r.unlockedCostumes || [defaultCostumeKeyFor(def.id)]
        };
      });

      const allItems = [...state.inventory];
      LIVER_DEFS.forEach(def=>{
        const r = state.roster[def.id];
        if(r.equipped.weapon) allItems.push(r.equipped.weapon);
        if(r.equipped.armor) allItems.push(r.equipped.armor);
      });
      const inventoryRows = allItems.map(i=>({
        id: i.id, item_type: i.type, name: i.name, rarity: i.rarity,
        value: i.value,
        resist_element: i.resist ? i.resist.element : null,
        resist_value: i.resist ? i.resist.value : null,
        weapon_type: i.weaponType || null,
        affix: i.affix || null,
        enhance_level: i.enhanceLevel || 0
      }));

      const dungeonRows = DUNGEON_DEFS.map(d=>{
        const ds = state.dungeons[d.id];
        return {
          dungeon_id: d.id, depth: ds.depth, progress: ds.progress,
          cleared: !!ds.cleared, boss_kill_count: ds.bossKillCount || 0
        };
      });

      const { error } = await sb.rpc('save_full_state', {
        p_name: state.name,
        p_gold: state.gold,
        p_party: state.party,
        p_home_furniture: state.home.furniture,
        p_colosseum_floor_right: state.colosseum.floorRight,
        p_colosseum_medals: state.colosseum.medals,
        p_colosseum_last_challenge_at: state.colosseum.lastChallengeAt ? new Date(state.colosseum.lastChallengeAt).toISOString() : null,
        p_roster: rosterRows,
        p_inventory: inventoryRows,
        p_dungeons: dungeonRows,
        p_destiny_tickets: state.destinyTickets,
        p_guaranteed_tickets: state.guaranteedTickets,
        p_rift_state: state.rift ? { startedAt: state.rift.startedAt, partyIds: state.rift.partyIds, result: state.rift.result || null } : null,
        p_tutorial_done: !!state.tutorialDone,
        p_orbs: state.orbs || {},
        p_materials: state.materials || {},
        p_stamina: state.stamina,
        p_stamina_updated_at: new Date(state.staminaUpdatedAt).toISOString(),
        p_tools: state.tools || {}
      });
      if(error) console.error('save_full_state failed', error);

      // 戦闘力ランキング反映。サーバー側で保存済みのroster/inventoryから
      // 権威ある値を再計算するため、失敗してもメインの保存自体は成功扱いにする。
      const { error: cpError } = await sb.rpc('sync_combat_power');
      if(cpError) console.error('sync_combat_power failed', cpError);
    }catch(e){ console.error('save failed', e); }
  }

  async function loadGame(){
    try{
      const uid = await ensureAuth();
      const { data: playerRow, error } = await sb.from('players').select('*').eq('id', uid).maybeSingle();
      if(error) throw error;
      if(!playerRow) return null; // 新規プレイヤー(キャラ作成画面へ)

      const [rosterRes, invRes, dungeonRes] = await Promise.all([
        sb.from('player_roster').select('*').eq('player_id', uid),
        sb.from('player_inventory').select('*').eq('player_id', uid),
        sb.from('player_dungeon_progress').select('*').eq('player_id', uid)
      ]);
      const rosterRows = rosterRes.data || [];
      const invRows = invRes.data || [];
      const dungeonRows = dungeonRes.data || [];

      const itemById = {};
      const inventory = [];
      invRows.forEach(i=>{
        const item = {
          id: i.id, type: i.item_type, name: i.name,
          rarity: i.rarity, rarityLabel: i.rarity, value: i.value,
          resist: i.resist_element ? { element: i.resist_element, value: i.resist_value } : null,
          weaponType: i.weapon_type || null,
          affix: i.affix || null,
          enhanceLevel: i.enhance_level || 0
        };
        itemById[i.id] = item;
        inventory.push(item);
      });

      const roster = {};
      LIVER_DEFS.forEach(def=>{ roster[def.id] = newLiverProgress(def); });
      rosterRows.forEach(r=>{
        // job_progressが無い旧データ(ジョブ別レベル制導入前)は、各ジョブを
        // Lv.1から作った上で、当時就いていたジョブの分だけ既存の
        // level/exp/loadout列から復元する(データを失わないための互換処理)。
        let jobProgress;
        if(r.job_progress && typeof r.job_progress === 'object'){
          jobProgress = {};
          Object.keys(JOB_DEFS).forEach(jobId=>{
            const saved = r.job_progress[jobId];
            jobProgress[jobId] = saved
              ? { level: saved.level, exp: saved.exp, loadout: { enabled: Array.isArray(saved.loadout && saved.loadout.enabled) ? saved.loadout.enabled : [] } }
              : newJobProgress(jobId);
          });
        } else {
          jobProgress = {};
          Object.keys(JOB_DEFS).forEach(jobId=>{ jobProgress[jobId] = newJobProgress(jobId); });
          jobProgress[r.job] = { level: r.level, exp: r.exp, loadout: { enabled: Array.isArray(r.loadout) ? r.loadout : [] } };
        }
        roster[r.liver_id] = {
          job: r.job, jobProgress,
          hp: r.hp, maxHp: r.max_hp, mp: r.mp, maxMp: r.max_mp,
          equipped: {
            weapon: r.equipped_weapon_id ? (itemById[r.equipped_weapon_id]||null) : null,
            armor: r.equipped_armor_id ? (itemById[r.equipped_armor_id]||null) : null
          },
          unlocked: r.unlocked,
          costume: r.costume || defaultCostumeKeyFor(r.liver_id),
          unlockedCostumes: (Array.isArray(r.unlocked_costumes) && r.unlocked_costumes.length)
            ? r.unlocked_costumes
            : [defaultCostumeKeyFor(r.liver_id)]
        };
      });
      // 装備中のアイテムは所持品リストからは除外する(以前のwindow.storage版と同じ表現)
      Object.values(roster).forEach(r=>{
        [r.equipped.weapon, r.equipped.armor].forEach(item=>{
          if(!item) return;
          const idx = inventory.findIndex(x=>x.id===item.id);
          if(idx>=0) inventory.splice(idx,1);
        });
      });

      const dungeons = {};
      DUNGEON_DEFS.forEach(d=>{ dungeons[d.id] = newDungeonProgress(); });
      dungeonRows.forEach(d=>{
        dungeons[d.dungeon_id] = {
          depth: d.depth, progress: d.progress, cleared: d.cleared,
          bossKillCount: d.boss_kill_count || 0
        };
      });

      // tutorial_done未完了のうちは、リロードのたびにtown/nullへ戻さず
      // チュートリアル専用ダンジョンへ強制的に再ルーティングする
      // (screen/activeDungeonId自体は永続化していないため、ここで代わりに判定する)。
      const tutorialDone = playerRow.tutorial_done !== false;

      return {
        name: playerRow.name, gold: playerRow.gold,
        playerId: uid,
        roster, party: Array.isArray(playerRow.party) ? playerRow.party : [],
        inventory,
        log: [], history: [],
        screen: tutorialDone ? 'town' : 'dungeon',
        activeDungeonId: tutorialDone ? null : 'tutorial',
        tutorialDone,
        home: { furniture: playerRow.home_furniture || [] },
        ui: { expandedGroups: [], bottomTab: 'log', equipPickerSlot: null, inventoryTab: 'equip' },
        pendingDefeatGoldLoss: 0,
        dungeons,
        colosseum: {
          floorRight: playerRow.colosseum_floor_right,
          medals: playerRow.colosseum_medals,
          lastChallengeAt: playerRow.colosseum_last_challenge_at ? new Date(playerRow.colosseum_last_challenge_at).getTime() : 0
        },
        destinyTickets: playerRow.destiny_tickets || 0,
        guaranteedTickets: playerRow.guaranteed_tickets || 0,
        orbs: (playerRow.orbs && typeof playerRow.orbs === 'object') ? playerRow.orbs : {},
        materials: (playerRow.materials && typeof playerRow.materials === 'object') ? playerRow.materials : {},
        stamina: (typeof playerRow.stamina === 'number') ? playerRow.stamina : STAMINA_MAX,
        staminaUpdatedAt: playerRow.stamina_updated_at ? new Date(playerRow.stamina_updated_at).getTime() : Date.now(),
        tools: (playerRow.tools && typeof playerRow.tools === 'object') ? playerRow.tools : {},
        rift: (playerRow.rift_state && playerRow.rift_state.startedAt)
          ? { startedAt: playerRow.rift_state.startedAt, partyIds: playerRow.rift_state.partyIds || [], result: playerRow.rift_state.result || null }
          : null
      };
    }catch(e){
      console.error('load failed', e);
      return null;
    }
  }

  /* ---------------- Logging ----------------
   * skipMain=trueの場合、攻撃・ダメージ・回復量などの「バトルログ」を
   * メインウィンドウ(state.log)には出さず、画面下部の「冒険の記録」
   * (state.history、全件保持)にのみ残す。敵の出現/撃破やキャラの
   * 戦闘不能などの「ステップの変化」はメインウィンドウにも出したいため
   * skipMainを付けない。 */
  function pushLog(text, cls, skipMain){
    const entry = {text, cls: cls||''};
    if(!skipMain){
      state.log.push(entry);
      if(state.log.length > 6) state.log = state.log.slice(-6);
    }

    if(!state.history) state.history = [];
    state.history.push(entry);
    if(state.history.length > 100) state.history = state.history.slice(-100);
  }

  /* ---------------- Core actions ---------------- */
  /* 経験値は「現在就いているジョブ」のレベルにのみ加算される
   * (ジョブごとに個別成長するため)。 */
  function grantExpToParty(amount){
    state.party.forEach(id=>{
      const ls = liverState(id);
      if(ls.hp <= 0) return; // 戦闘不能中のメンバーは経験値を得ない
      const jp = jobProgressFor(id);
      jp.exp += amount;
      while(jp.exp >= expToNext(jp.level)){
        jp.exp -= expToNext(jp.level);
        jp.level += 1;
        recomputeLiverMaxStats(id, true);
        pushLog(`${liverDef(id).name}のレベルが ${jp.level} に上がった。傷が癒えていく。`, 'reward');
        const newSkill = JOB_DEFS[ls.job].skills.find(s=>s.unlockLevel === jp.level);
        if(newSkill){
          pushLog(`${liverDef(id).name}は新しいスキル「${newSkill.name}」を習得した!`, 'reward');
        }
      }
    });
    pushLog(`パーティは経験値を ${amount} 獲得した。`, 'reward');
  }

  function addItemToInventory(item){
    state.inventory.push(item);
    return true;
  }

  function maybeDropItem(depth){
    const { dropMult, goldMult } = partyLootMult();
    const dungeonLevel = currentDungeonDef().level;
    if(Math.random() < 0.42 * dropMult){
      const type = Math.random() < 0.5 ? 'weapon' : 'armor';
      const item = makeItem(type, dungeonLevel, depth);
      if(addItemToInventory(item)){
        pushLog(`「${item.name}」を手に入れた。`, 'reward');
      }
    }
    if(Math.random() < 0.3){
      const g = Math.round((4 + depth*1.5 + Math.random()*6) * goldMult);
      state.gold += g;
      pushLog(`${g} 枚の古い硬貨を見つけた。`, 'reward');
    }
  }

    inCombat = true;
    combatPhase = 'choice';
    combatEnemy = enemy;
    combatEnemyHp = enemy.hp;
    combatEnemy._maxHp = enemy.maxHp;
    combatEnemy._atk = enemy.atk;
    combatEnemy._def = enemy.def;

      }

  function alivePartyIds(){
    return state.party.filter(id=>liverState(id) && liverState(id).hp > 0);
  }
  function isPartyWiped(){
    return alivePartyIds().length === 0;
  }
  function pickRandomAliveTarget(){
    const alive = alivePartyIds();
    if(!alive.length) return null;
    return alive[Math.floor(Math.random()*alive.length)];
  }

  function chooseFight(){
    if(!inCombat || combatPhase !== 'choice') return;
    combatPhase = 'auto';
    render();
    runAutoBattle();
