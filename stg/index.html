  /* プレイヤーのターン処理。
   * 有効化されたスキル(loadout.enabled)と通常攻撃を、computeActionRatesで
   * 算出した実発動率に従って毎ターン抽選する。選ばれたスキルのMPが
   * 足りない場合はその場で候補から除外し、残りで再抽選する。
   * kind: 'trueDamageSpell'(防御無視の攻撃) / 'bonusAttack'(追加攻撃)
   *       'defBuff'(次の被弾を軽減) / 'heal'(自己回復)
   */
  function playerTurnActionInner(liverId, silenced){
    const ls = liverState(liverId);
    const name = liverDef(liverId).name;
    const { atkRate, actions } = computeActionRates(liverId);
    const pool = [{action:null, weight: atkRate}];
    if(!silenced){
      actions.forEach(a=>{
        if(a.rate > 0 && ls.mp >= a.skill.mpCost) pool.push({action:a.skill, weight:a.rate});
      });
    }
    const chosen = weightedPick(pool);

    /* 攻撃命中時、りりむの「ばあっ！」等によるMP吸収をログ末尾に追記するための小ヘルパー */
    const drainSuffix = (dmg) => {
      const drained = applyOnHitMpDrain(liverId, dmg);
      return drained > 0 ? ` (MP+${drained})` : '';
    };

    const affixMult = weaponAffixDamageMult(liverId);

    if(!chosen){
      if(Math.random() < CRIT_CHANCE){
        const dmg = Math.max(1, Math.round(combatAtk(liverId) * CRIT_MULT * affixMult) + rnd(-1,3));
        combatEnemyHp -= dmg;
        pushLog(`${name}の攻撃が会心の一撃となった！ ${combatEnemy.name}に防御を貫く ${dmg} の大ダメージ！${drainSuffix(dmg)}`, 'reward', true);
        return;
      }
      const dmg = Math.max(1, Math.round((combatAtk(liverId) - effectiveEnemyDef()) * affixMult) + rnd(-1,2));
      combatEnemyHp -= dmg;
      pushLog(`${name}の攻撃！ ${combatEnemy.name}に ${dmg} のダメージ。${drainSuffix(dmg)}`, 'combat', true);
      return;
    }

    const mpCost = Math.max(0, Math.round(chosen.mpCost * passiveStatMult(liverId,'mpCost') * partyMpCostMult()));
    ls.mp -= mpCost;

    if(chosen.effects){
      // 新方式: 複合効果スキル。効果を順に解決する(旧kind形式との判定は排他)。
      pushLog(`${name}の「${chosen.name}」！(MP-${mpCost})`, 'combat', true);
      chosen.effects.forEach(effect => resolveEffect(effect, false, liverId));
      return;
    }

    if(chosen.kind === 'trueDamageSpell'){
      const dmg = Math.max(1, Math.round(combatAtk(liverId)*chosen.mult*affixMult) + rnd(-1,3));
      combatEnemyHp -= dmg;
      pushLog(`${name}の「${chosen.name}」！ 防御を貫く ${dmg} のダメージ。(MP-${mpCost})${drainSuffix(dmg)}`, 'combat', true);
      return;
    }
    if(chosen.kind === 'element'){
      const isWeak = combatEnemy.weakness === chosen.element;
      const mult = isWeak ? chosen.weaknessMult : chosen.offMult;
      const dmg = Math.max(1, Math.round((combatAtk(liverId) - effectiveEnemyDef()) * mult) + rnd(-1,2));
      combatEnemyHp -= dmg;
      const elLabel = ELEMENT_LABELS[chosen.element] || '';
      pushLog(
        (isWeak
          ? `${name}の「${chosen.name}」！ 弱点(${elLabel})を突き、${dmg} のダメージ！(MP-${mpCost})`
          : `${name}の「${chosen.name}」！ ${dmg} のダメージ(弱点不一致)。(MP-${mpCost})`) + drainSuffix(dmg),
        isWeak ? 'reward' : 'combat',
        true
      );
      return;
    }
    if(chosen.kind === 'bonusAttack'){
      const dmg1 = Math.max(1, Math.round((combatAtk(liverId) - effectiveEnemyDef()) * affixMult) + rnd(-1,2));
      const dmg2 = Math.max(1, Math.round((Math.round(combatAtk(liverId)*0.6) - Math.round(effectiveEnemyDef()*0.5)) * affixMult) + rnd(-1,2));
      combatEnemyHp -= (dmg1+dmg2);
      pushLog(`${name}の「${chosen.name}」！ ${dmg1}+${dmg2} の連続攻撃。(MP-${mpCost})${drainSuffix(dmg1+dmg2)}`, 'combat', true);
      return;
    }
    if(chosen.kind === 'defBuff'){
      pendingDefBuffs[liverId] = chosen.reduceMult || 0.6;
      const dmg = Math.max(1, Math.round((combatAtk(liverId) - effectiveEnemyDef()) * affixMult) + rnd(-1,2));
      combatEnemyHp -= dmg;
      pushLog(`${name}の「${chosen.name}」！ 身構えながら ${dmg} のダメージ。次の攻撃に備える。(MP-${mpCost})${drainSuffix(dmg)}`, 'combat', true);
      return;
    }
    if(chosen.kind === 'heal'){
      const heal = Math.round(ls.maxHp*chosen.healMult);
      ls.hp = Math.min(ls.maxHp, ls.hp+heal);
      pushLog(`${name}の「${chosen.name}」！ HPが ${heal} 回復した。(MP-${mpCost})`, 'reward', true);
      return;
    }
  }

  function playerTurnAction(liverId){
    const ls = liverState(liverId);
    const name = liverDef(liverId).name;
    const effects = playerStatusEffects[liverId];
    const stunned = !!(effects && effects.stun);
    const silenced = !!(effects && effects.silence);
    if(stunned){
      pushLog(`${name}はまだ動けない！`, 'system', true);
    } else {
      playerTurnActionInner(liverId, silenced);
    }
    tickStatusEffects(effects,
      (type, eff)=>{
        if(type === 'poison'){
          const dmg = Math.max(1, Math.round(ls.maxHp * eff.amount));
          ls.hp = Math.max(0, ls.hp - dmg);
          pushLog(`${name}は毒のダメージを受けた。(-${dmg})`, 'danger', true);
          checkLiverKO(liverId);
        }
      },
      (type)=>{
        pushLog(`${name}の「${statusEffectLabel(type)}」の効果が切れた。`, 'system', true);
      }
    );
  }

  function applyDamageToLiver(liverId, rawDmg, element){
    const ls = liverState(liverId);
    let dmg = rawDmg;
    if(element){
      dmg = Math.max(1, Math.round(dmg * liverElementalMultiplier(liverId, element)));
    }
    const passive = equippedPassive(liverId);
    if(passive && passive.kind === 'lowHpMitigate' && ls.maxHp > 0 && (ls.hp/ls.maxHp) <= passive.threshold){
      dmg = Math.max(1, Math.round(dmg * passive.mult));
      if(!combatPassiveFlags[liverId]) combatPassiveFlags[liverId] = {};
      if(!combatPassiveFlags[liverId].lowHpLogged){
        combatPassiveFlags[liverId].lowHpLogged = true;
        pushLog(`${liverDef(liverId).name}のパッシブ「${passive.name}」が発動！ 傷ついた体に力が漲り、ダメージが軽減された！`, 'system', true);
      }
    }
    if(pendingDefBuffs[liverId]){
      dmg = Math.max(1, Math.round(dmg*pendingDefBuffs[liverId]));
      delete pendingDefBuffs[liverId];
    }
    ls.hp = Math.max(0, ls.hp - dmg);
    return dmg;
  }

  /* 敵のターン処理。
   * 1) 前ターンに「予告」していた大技があれば、ここで確定発動(防御力無視)
   * 2) なければ通常通りターン数を数え、条件に合うスキルを判定
   *    - trueDamage   : このターンに即、防御力無視の大ダメージ
   *    - telegraphed  : このターンは攻撃せず予告のみ。次ターンに(1)で発動
   * 3) どちらでもなければ通常攻撃
   * いずれの被弾もapplyDamageToPlayerを通し、タンクの防御バフ・プレイヤーの
   * 属性耐性(スキルにelementが設定されている場合のみ)を反映する。
   * 通常攻撃には属性を持たせていないため、耐性の影響を受けない。
   */
  /* 敵のターン処理の本体。実際の呼び出しはenemyTurnDamage()経由で、
   * どの分岐を通っても最後に必ず自身の継続効果(自己バフ等)がtickされる。 */
  function enemyTurnDamageInner(){
    combatEnemy.turnCount = (combatEnemy.turnCount||0) + 1;
    let target = pickRandomAliveTarget();
    if(!target) return; // 全滅済み(念のため)
    target = applyCoverRedirect(target);
    const targetName = liverDef(target).name;

    if(combatEnemy.charging){
      const skill = combatEnemy.charging;
      combatEnemy.charging = null;
      const raw = Math.max(1, Math.round(effectiveEnemyAtk() * skill.mult) + rnd(-1,2));
      const dmg = applyDamageToLiver(target, raw, skill.element);
      pushLog(`${(skill.executeText || (combatEnemy.name+'の渾身の一撃！')).replace('{name}', combatEnemy.name)} ${targetName}が ${dmg} のダメージを受けた。`, 'danger', true);
      checkLiverKO(target);
      return;
    }

    const skills = combatEnemy.skills || [];
    const triggered = skills.find(s => s.everyNTurns && combatEnemy.turnCount % s.everyNTurns === 0);
    if(triggered){
      if(triggered.effects){
        // 新方式: 複合効果スキル。このターンは他の行動を取らず、効果を順に解決する。
        pushLog((triggered.announceText || `${combatEnemy.name}の「${triggered.name}」！`).replace('{name}', combatEnemy.name), 'danger', true);
        triggered.effects.forEach(effect => resolveEffect(effect, true));
        return;
      }
      if(triggered.kind === 'telegraphed'){
        combatEnemy.charging = triggered;
        pushLog((triggered.warnText || `${combatEnemy.name}が力を溜めている……`).replace('{name}', combatEnemy.name), 'system');
        return;
      }
      const raw = Math.max(1, Math.round(effectiveEnemyAtk() * triggered.mult) + rnd(-1,2));
      const dmg = applyDamageToLiver(target, raw, triggered.element);
      pushLog(`${combatEnemy.name}の「${triggered.name}」！ ${targetName}が防御を貫く ${dmg} の痛恨の一撃を受けた！`, 'danger', true);
      checkLiverKO(target);
      return;
    }

    if(Math.random() < CRIT_CHANCE){
      const raw = Math.max(1, Math.round(effectiveEnemyAtk() * CRIT_MULT) + rnd(-1,2));
      const dmg = applyDamageToLiver(target, raw);
      pushLog(`${combatEnemy.name}の痛恨の一撃！ ${targetName}が防御を貫く ${dmg} の大ダメージを受けた！`, 'danger', true);
      checkLiverKO(target);
      return;
    }

    const raw = Math.max(1, effectiveEnemyAtk() - liverDefStat(target) + rnd(-1,1));
    const dmg = applyDamageToLiver(target, raw);
    pushLog(`${combatEnemy.name}の反撃、${targetName}が ${dmg} のダメージを受けた。`, 'danger', true);
    checkLiverKO(target);
  }

  function enemyTurnDamage(){
    enemyTurnDamageInner();
    if(!combatEnemy) return; // 反撃等で戦闘が終了した場合は何もしない
    tickStatusEffects(combatEnemy.statusEffects,
      (type, eff)=>{
        if(type === 'regen'){
          const heal = Math.max(1, Math.round(combatEnemy._maxHp * eff.amount));
          combatEnemyHp = Math.min(combatEnemy._maxHp, combatEnemyHp + heal);
          pushLog(`${combatEnemy.name}は自身の傷を癒やした。(+${heal})`, 'system', true);
        }
      },
      (type)=>{
        pushLog(`${combatEnemy.name}の「${statusEffectLabel(type)}」の効果が切れた。`, 'system', true);
      }
    );
  }

  function checkLiverKO(liverId){
    if(liverState(liverId).hp <= 0){
      pushLog(`${liverDef(liverId).name}が倒れた……！`, 'danger');
      state.party.forEach(otherId=>{
        if(otherId === liverId) return;
        const otherLs = liverState(otherId);
        if(!otherLs || otherLs.hp <= 0) return;
        const passive = equippedPassive(otherId);
        if(!passive || passive.kind !== 'allyDownRage') return;
        if(!combatPassiveFlags[otherId]) combatPassiveFlags[otherId] = {};
        if(!combatPassiveFlags[otherId].rageActive){
          combatPassiveFlags[otherId].rageActive = true;
          pushLog(`${liverDef(otherId).name}のパッシブ「${passive.name}」が発動！ 怒りに燃え、攻撃力が上昇した！`, 'system', true);
        }
      });
    }
  }

  function checkPartyDefeated(){
    if(isPartyWiped()){
      handleDefeat();
      return true;
    }
    return false;
  }

  async function runAutoBattle(){
    while(inCombat && combatPhase === 'auto'){
      await sleep(550);
      if(!inCombat || combatPhase !== 'auto') return;

      maybeTriggerFairyBoon();
      render();

      // パーティ全員が(生存していれば)順番に行動する。1人ずつログを反映してから
      // 少し間を置くことで、誰が何をしたのか追いやすくする。
      for(const id of state.party){
        if(!inCombat || combatPhase !== 'auto') return;
        if(liverState(id).hp <= 0) continue; // 戦闘不能者はスキップ
        playerTurnAction(id);
        notifyAllyActed(id);
        render();
        if(combatEnemyHp <= 0) break;
        if(checkPartyDefeated()) return; // 毒などの継続ダメージで全滅した場合はここで終了
        await sleep(280);
        if(!inCombat || combatPhase !== 'auto') return;
      }

      if(combatEnemyHp <= 0){
        if(combatEnemy.isColosseum){
          await resolveColosseumVictory();
          return;
        }
        pushLog(`${combatEnemy.name}を倒した。`, 'reward');
        grantExpToParty(combatEnemy.exp);
        const ds = currentDungeonState();
        maybeDropItem(ds.depth);

        if(combatEnemy.isDungeonBoss){
          const dungeonDef = currentDungeonDef();
          if(!ds.cleared){
            ds.cleared = true;
            pushLog(`${dungeonDef.name}を踏破した！`, 'reward');
            const firstItem = firstClearRewardFor(state.activeDungeonId);
            if(addItemToInventory(firstItem)){
              pushLog(`初回撃破報酬として「${firstItem.name}」を手に入れた。`, 'reward');
            }
            state.destinyTickets += 1;
            pushLog(`初回撃破報酬として「運命のチケット」を手に入れた。`, 'reward');
            DUNGEON_DEFS.filter(d=>d.requires===state.activeDungeonId).forEach(d=>{
              pushLog(`新たな地が解放された:「${d.name}」`, 'reward');
            });
          } else {
            pushLog(`${combatEnemy.name}を再び打ち破った。`, 'reward');
          }
          ds.bossKillCount = (ds.bossKillCount||0) + 1;
          ds.progress = 0; // ボス撃破のたびに踏破率はリセットし、また潜り直す必要がある

          if(dungeonDef.id === 'tutorial' && !state.tutorialDone){
            state.tutorialDone = true;
            state.screen = 'town';
            pushLog('見習いの試練を突破した！ 「召喚」で運命のチケットを使ってみよう。', 'reward');
          }
        } else if(combatEnemy.pendingProgressOnWin){
          addDungeonProgress(PROGRESS_PER_STEP);
        }

        inCombat = false; combatPhase = null; combatEnemy = null;
        saveGame(); render();
        return;
      }

      await sleep(550);
      if(!inCombat || combatPhase !== 'auto') return;

      enemyTurnDamage();
      render();
      if(checkPartyDefeated()) return;
      // 注意: ここでは意図的にsaveGame()を呼ばない。ラウンドごとに保存すると
      // 通信回数が戦闘の長さに比例して膨らむため、保存は「戦闘の決着がついた
      // 瞬間(勝利/敗北/撤退)」にまとめて1回だけ行う設計にしている。
      // トレードオフとして、戦闘の途中でブラウザが落ちた場合はそのラウンドの
      // 進行(HP/MPの増減など)が失われる可能性があるが、1戦闘は数秒〜十数秒
      // 程度なのでリスクは小さいと判断している。
    }
  }

  /* ---------------- コロシアムタワー: 画面キャッシュ・入室・挑戦 ---------------- */
  let colosseumView = { loading: true, floor: 1, record: null, isDummy: true };

  async function refreshColosseumView(){
    const floor = state.colosseum.floorRight;
    colosseumView = { loading: true, floor, record: null, isDummy: true };
    render();
    let record = await loadColosseumRecord(floor);
    let isDummy = false;
    if(!record){ record = buildDummyGatekeeper(floor); isDummy = true; }
    colosseumView = { loading: false, floor, record, isDummy };
    render();
  }

  async function gotoColosseum(){
    if(inCombat) return;
    state.screen = 'colosseum';
    saveGame(); render();
    await claimOwnMailbox();
    await refreshColosseumView();
  }

  async function challengeColosseum(){
    if(inCombat) return;
    if(!state.party.length){
      pushLog('パーティが編成されていない。町で編成してから挑もう。', 'system');
      render();
      return;
    }
    const now = Date.now();
    const remain = COLOSSEUM_COOLDOWN_MS - (now - (state.colosseum.lastChallengeAt||0));
    if(remain > 0) return; // ボタン側でも無効化しているが念のため

    // クールタイム表示はすぐに反映するが、実際の保存はresolve_colosseum_battle
    // RPC(戦闘決着時)にまとめて任せる。
    state.colosseum.lastChallengeAt = now;
    render();

    const floor = state.colosseum.floorRight;
    let record = await loadColosseumRecord(floor);
    let isDummy = false;
    if(!record){
      record = buildDummyGatekeeper(floor);
      isDummy = true;
    }
    const agg = aggregateSnapshotStats(record.snapshot);

    // 挑戦者側は毎回全回復した状態で挑む(門番側だけがダメージを引き継ぐ)
    state.party.forEach(id=>{
      const ls = liverState(id);
      ls.hp = ls.maxHp; ls.mp = ls.maxMp;
    });

    const enemy = {
      name: record.holderName || `${floor}Fの門番`,
      level: agg.level,
      hp: record.hpPool, maxHp: record.maxHpPool,
      atk: agg.atk, def: agg.def,
      exp: 0, boss: true,
      skills: [{key:'crit', name:'連携の一撃', everyNTurns:4, kind:'trueDamage', mult:2.0}],
      weakness: null,
      isColosseum: true,
      colosseumFloor: floor,
      colosseumHolderId: isDummy ? null : record.holderId,
      colosseumIsDummy: isDummy,
      colosseumSnapshot: record.snapshot,
      colosseumMaxHpPool: record.maxHpPool,
      colosseumWins: record.wins || 0,
      colosseumStartHp: record.hpPool // 今回の挑戦開始時点でのダメージ計算の基準値
    };
    startCombat(enemy);
  }

  async function resolveColosseumVictory(){
    const floor = combatEnemy.colosseumFloor;
    const enemyName = combatEnemy.name;
    const damageDealt = Math.max(0, combatEnemy.colosseumStartHp - Math.max(0, combatEnemyHp));
    const snapshot = buildPartySnapshot();
    const maxHpPool = snapshot.reduce((s,m)=>s+m.maxHp, 0);

    const { data, error } = await sb.rpc('resolve_colosseum_battle', {
      p_floor: floor, p_damage_dealt: damageDealt, p_won: true,
      p_new_snapshot: snapshot, p_new_max_hp_pool: maxHpPool
    });
    if(error){
      console.error('resolve_colosseum_battle(win) failed', error);
      pushLog('サーバーとの通信に失敗した。もう一度試してほしい。', 'danger');
      inCombat = false; combatPhase = null; combatEnemy = null;
      render();
      return;
    }
    const medals = (data && data.medals_gained) || (floor >= COLOSSEUM_FLOORS ? 50 : 1);
    state.colosseum.medals += medals;
    if(floor < COLOSSEUM_FLOORS){
      state.colosseum.floorRight = floor + 1;
      pushLog(`${enemyName}を打ち破り、コロシアム${floor}Fの門番の座を奪った！(メダル+${medals})`, 'reward');
    } else {
      pushLog(`${enemyName}を打ち破り、コロシアムタワー${COLOSSEUM_FLOORS}Fを制覇した！(メダル+${medals})`, 'reward');
    }

    inCombat = false; combatPhase = null; combatEnemy = null;
    render();
    await refreshColosseumView();
  }

  /* 敗北時は、与えたダメージ(永続)と防衛勝利のカウント、メールボックスへの
   * メダル加算を、すべてサーバー側のRPC(1トランザクション)で処理する。
   * 1F以外での敗北は挑戦権を1Fへ戻す。ダミー相手の敗北は何も永続化しない。 */
  async function resolveColosseumDefeat(ctx){
    const damageDealt = Math.max(0, ctx.startHp - ctx.remainingHp);

    const { error } = await sb.rpc('resolve_colosseum_battle', {
      p_floor: ctx.floor, p_damage_dealt: damageDealt, p_won: false
    });
    if(error) console.error('resolve_colosseum_battle(lose) failed', error);

    if(ctx.floor > 1){
      state.colosseum.floorRight = 1;
      pushLog(`コロシアム${ctx.floor}Fの門番に敗れた。挑戦権が1Fに戻された。`, 'danger');
    } else {
      pushLog(`コロシアム1Fの門番に敗れた。`, 'danger');
    }
    if(!ctx.isDummy && ctx.holderId === state.playerId){
      // 自分自身が持つ記録に挑んで負けた特殊ケース。サーバー側で自分に加算済みなのでローカルにも反映
      state.colosseum.medals += ctx.floor;
    }

    saveGame();
    await refreshColosseumView();
  }

  function fleeCombat(){
    if(!inCombat || combatPhase !== 'choice') return;
    if(Math.random() < 0.6){
      pushLog('なんとか逃げ出した。', 'system');
      inCombat = false; combatPhase = null; combatEnemy = null;
      saveGame(); render();
    }else{
      pushLog('逃げられなかった！', 'danger');
      enemyTurnDamage();
      if(checkPartyDefeated()) return;
      saveGame(); render();
    }
  }

  function handleDefeat(){
    const wasColosseum = combatEnemy && combatEnemy.isColosseum;
    const colosseumCtx = wasColosseum ? {
      floor: combatEnemy.colosseumFloor,
      holderId: combatEnemy.colosseumHolderId,
      holderName: combatEnemy.name,
      isDummy: combatEnemy.colosseumIsDummy,
      snapshot: combatEnemy.colosseumSnapshot,
      maxHpPool: combatEnemy.colosseumMaxHpPool,
      wins: combatEnemy.colosseumWins,
      startHp: combatEnemy.colosseumStartHp,
      remainingHp: Math.max(0, combatEnemyHp)
    } : null;

    inCombat = false; combatPhase = null; combatEnemy = null;
    state.party.forEach(id=>{
      const ls = liverState(id);
      ls.hp = ls.maxHp; // 全滅後、傷は癒えている
      ls.mp = ls.maxMp;
    });

    if(wasColosseum){
      resolveColosseumDefeat(colosseumCtx); // 非同期(fire-and-forget)。結果は再描画時に反映
      render();
      return;
    }

    if(state.activeDungeonId === 'tutorial' && !state.tutorialDone){
      state.tutorialDone = true;
      state.destinyTickets += 1;
    }

    const lost = Math.round(state.gold * 0.2);
    state.gold -= lost;
    state.pendingDefeatGoldLoss = lost;
    state.screen = 'dead';
    saveGame(); render();
  }

  function returnToTownAfterDeath(){
    state.pendingDefeatGoldLoss = 0;
    state.screen = 'town';
    saveGame(); render();
  }

  function advance(){
    if(inCombat) return;
    const dungeonDef = currentDungeonDef();
    const ds = currentDungeonState();
    if(!dungeonDef || !ds) return;
    if(!alivePartyIds().length) return; // 全員戦闘不能では進めない
    recomputeStamina();
    if(state.stamina < 1){
      pushLog('スタミナが足りない。時間経過で回復するのを待とう。', 'system');
      render();
      return;
    }
    state.stamina -= 1;
    // 踏破率が100%に達したら深度のカウントは止める。これが装備・敵の強さの
    // 上限になる(ボス撃破でprogressは0に戻るが、depthは戻さないので、
    // 一度上限に達したダンジョンはそれ以降ずっと同じ上限のまま)。
    if(ds.progress < 100) ds.depth += 1;
    const roll = Math.random();

    if(roll < 0.55){
      const enemy = spawnEnemy(dungeonDef, ds.depth, false);
      enemy.pendingProgressOnWin = true;
      startCombat(enemy);
    } else if(roll < 0.72){
      let healText = [];
      state.party.forEach(id=>{
        const ls = liverState(id);
        if(ls.hp<=0) return;
        const heal = Math.round(ls.maxHp*0.15);
        const mpHeal = Math.round(ls.maxMp*0.15);
        ls.hp = Math.min(ls.maxHp, ls.hp+heal);
        ls.mp = Math.min(ls.maxMp, ls.mp+mpHeal);
      });
      pushLog(`静かな小部屋で一息ついた。パーティのHP・MPが少し回復した。`, 'system');
      addDungeonProgress(PROGRESS_PER_STEP);
      saveGame(); render();
    } else if(roll < 0.90){
      maybeDropItem(ds.depth);
      if(state.log.length===0 || state.log[state.log.length-1].text.indexOf('見つけ')<0){
        pushLog('崩れた棚の奥に何かが残っていた。', 'system');
      }
      addDungeonProgress(PROGRESS_PER_STEP);
      saveGame(); render();
    } else {
      const target = pickRandomAliveTarget();
      if(target){
        const ls = liverState(target);
        const dmg = Math.round(3 + ds.depth*0.4);
        ls.hp = Math.max(1, ls.hp - dmg);
        pushLog(`罠にかかった。${liverDef(target).name}が ${dmg} のダメージ。`, 'danger');
      }
      addDungeonProgress(PROGRESS_PER_STEP);
      saveGame(); render();
    }
  }

  function challengeBoss(){
    if(inCombat || !alivePartyIds().length) return;
    const dungeonDef = currentDungeonDef();
    const ds = currentDungeonState();
    if(!dungeonDef || !ds || ds.progress < 100) return;
    recomputeStamina();
    if(state.stamina < 1){
      pushLog('スタミナが足りない。時間経過で回復するのを待とう。', 'system');
      render();
      return;
    }
    state.stamina -= 1;
    const enemy = spawnEnemy(dungeonDef, ds.depth, true);
    enemy.isDungeonBoss = true;
    startCombat(enemy);
  }

  /* 装備の変更は町(ダンジョン探索中でない状態)でのみ許可する。 */
  function canManageEquipment(){ return state.screen !== 'dungeon'; }

  /* そのライバーが装備できる武器種の集合(現在のジョブの装備可能リスト ∪
   * ライバー個人の適正武器種)。防具には武器種の概念が無いため無制限のまま。 */
  function allowedWeaponTypes(liverId){
    const ls = liverState(liverId);
    const jobTypes = (JOB_DEFS[ls.job] && JOB_DEFS[ls.job].weaponTypes) || [];
    const liverTypes = liverDef(liverId).weaponAptitude || [];
    return new Set([...jobTypes, ...liverTypes]);
  }
  function canEquipItem(liverId, item){
    if(item.type !== 'weapon') return true;
    return allowedWeaponTypes(liverId).has(item.weaponType);
  }

  /* 装備変更は「編成」画面内の専用ピッカー(state.ui.equipPickerSlot =
   * {liverId, slot})を通して行う。ピッカーはメインウィンドウ上に所持品
   * 一覧を表示するので、モバイルでもサイドパネルまでスクロールせずに
   * 装備を選べる。装備が完了したら自動的にピッカーを閉じ、詳細設定
   * 画面に戻る。 */
  function equipItemForLiver(liverId, itemId){
    if(!canManageEquipment()) return;
    if(!liverState(liverId)) return;
    const idx = state.inventory.findIndex(i=>i.id===itemId);
    if(idx<0) return;
    const item = state.inventory[idx];
    if(!canEquipItem(liverId, item)){
      pushLog(`${liverDef(liverId).name}は「${item.name}」(${WEAPON_TYPES[item.weaponType].name})を扱えない。`, 'system');
      render();
      return;
    }
    const slot = item.type;
    const ls = liverState(liverId);
    const prev = ls.equipped[slot];
    state.inventory.splice(idx,1);
    if(prev) state.inventory.push(prev); // 元々装備していた物は所持品に戻す
    ls.equipped[slot] = item;
    pushLog(`${liverDef(liverId).name}が「${item.name}」を装備した。`, 'system');
    state.ui.equipPickerSlot = null;
    saveGame(); render();
  }

  function unequipSlot(slot, liverId){
    if(!canManageEquipment()) return;
    if(!liverId || !liverState(liverId)) return;
    const ls = liverState(liverId);
    const item = ls.equipped[slot];
    if(!item) return;
    ls.equipped[slot] = null;
    state.inventory.push(item);
    pushLog(`${liverDef(liverId).name}の${slot==='weapon' ? '武器':'防具'}を外した。`, 'system');
    saveGame(); render();
  }

  /* 詳細設定画面の装備欄にある「変更」ボタンで開く。メインウィンドウの
   * 表示がピッカーに切り替わり、戻るボタンか装備完了で詳細設定画面に戻る。 */
  function openEquipPicker(liverId, slot){
    if(!canManageEquipment() || !liverState(liverId)) return;
    state.ui.equipPickerSlot = {liverId, slot};
    render();
  }
  function closeEquipPicker(){
    state.ui.equipPickerSlot = null;
    render();
  }

  function discardItem(id){
    state.inventory = state.inventory.filter(i=>i.id!==id);
    saveGame(); render();
  }

  /* ---------------- 合成(装備強化) ----------------
   * 所持品+全ライバーの装備中アイテムをまとめて対象候補にする(装備中でも
   * ここから直接強化できるようにするため)。 */
  function allOwnedItemsWithEquipInfo(){
    const list = state.inventory.map(i=>({ item:i, equippedBy:null }));
    LIVER_DEFS.forEach(def=>{
      const ls = liverState(def.id);
      if(!ls) return;
      ['weapon','armor'].forEach(slot=>{
        const it = ls.equipped[slot];
        if(it) list.push({ item: it, equippedBy: def.id });
      });
    });
    return list;
  }

  function enhanceItem(itemId){
    if(!canManageEquipment()) return;
    const found = allOwnedItemsWithEquipInfo().find(x=>x.item.id===itemId);
    if(!found) return;
    const item = found.item;
    const level = item.enhanceLevel || 0;
    if(level >= ENHANCE_MAX_LEVEL) return;
    const orbCount = (state.orbs && state.orbs[item.rarity]) || 0;
    if(orbCount < 1) return;
    state.orbs[item.rarity] = orbCount - 1;
    item.enhanceLevel = level + 1;
    pushLog(`「${item.name}」を強化した(強化値+${item.enhanceLevel})。`, 'reward');
    saveGame(); render();
  }

  /* ---------------- 街・移動 ---------------- */
  function gotoScreen(name){
    if(inCombat) return;
    state.screen = name;
    saveGame(); render();
  }
  function backToTown(){
    if(inCombat) return;
    state.screen = 'town';
    saveGame(); render();
  }
  function enterDungeon(id){
    if(inCombat) return;
    if(!isDungeonUnlocked(id)) return;
    if(!state.party.length){
      pushLog('パーティが編成されていない。町で編成してから向かおう。', 'system');
      render();
      return;
    }
    state.activeDungeonId = id;
    state.screen = 'dungeon';
    state.log = [];
    saveGame(); render();
  }

  function isPartyFull(){ return state.party.every(id=>{ const ls=liverState(id); return ls.hp>=ls.maxHp && ls.mp>=ls.maxMp; }); }

  /* ---------------- 宿屋 ---------------- */
  function stayAtInn(){
    const cost = Math.max(5, partyLevel()*3);
    if(state.gold < cost || isPartyFull() || !state.party.length) return;
    state.gold -= cost;
    state.party.forEach(id=>{
      const ls = liverState(id);
      ls.hp = ls.maxHp;
      ls.mp = ls.maxMp;
    });
    pushLog('宿でぐっすり眠り、パーティの傷とMPが癒えた。', 'reward');
    saveGame(); render();
  }

  /* ---------------- 商店 ---------------- */
  function sellItem(id){
    const idx = state.inventory.findIndex(i=>i.id===id);
    if(idx<0) return;
    const item = state.inventory[idx];
    const price = Math.max(1, Math.round(item.value*3));
    state.gold += price;
    state.inventory.splice(idx,1);
    pushLog(`「${item.name}」を ${price}G で売却した。`, 'system');
    saveGame(); render();
  }

  function toolSellPrice(key){
    return Math.max(1, Math.round(TOOL_DEFS[key].price/3));
  }
  function buyToolItem(key){
    const def = TOOL_DEFS[key];
    if(!def || !def.purchasable) return;
    if(state.gold < def.price) return;
    state.gold -= def.price;
    if(!state.tools) state.tools = {};
    state.tools[key] = toolCount(key) + 1;
    pushLog(`「${def.name}」を購入した。`, 'reward');
    saveGame(); render();
  }
  function sellToolItem(key){
    const def = TOOL_DEFS[key];
    if(!def || toolCount(key) < 1) return;
    const price = toolSellPrice(key);
    state.tools[key] = toolCount(key) - 1;
    state.gold += price;
    pushLog(`「${def.name}」を ${price}G で売却した。`, 'system');
    saveGame(); render();
  }

  function toggleShopTab(tab){
    if(!state.ui) state.ui = {expandedGroups:[]};
    state.ui.shopTab = tab;
    render();
  }
  function toggleShopItemTab(tab){
    if(!state.ui) state.ui = {expandedGroups:[]};
    state.ui.shopItemTab = tab;
    render();
  }

  /* ---------------- 家 ---------------- */
  function renameCharacter(){
    const input = document.getElementById('nameEditInput');
    if(!input) return;
    const val = input.value.trim();
    if(val){
      state.name = val;
      pushLog('名を書き換えた。', 'system');
      saveGame(); render();
    }
  }
  function buyFurniture(id){
    const item = FURNITURE_CATALOG.find(f=>f.id===id);
    if(!item) return;
    if(state.home.furniture.includes(id)) return;
    if(state.gold < item.price) return;
    state.gold -= item.price;
    state.home.furniture.push(id);
    pushLog(`「${item.name}」を家に置いた。`, 'reward');
    saveGame(); render();
  }

  /* ---------------- Rendering ---------------- */
  const app = document.getElementById('app');

  function esc(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  /* 表示名の横に添える短縮ID。名前は自由に変更できてしまうため、
   * 変更不可能なplayer_id(UUID)の先頭8文字を、なりすまし対策の
   * 目印として一緒に表示する(ランキング・チャット・コロシアムの
   * 門番表示など、他プレイヤーの名前が出る箇所全般で使う)。 */
  function shortId(playerId){
    return playerId ? esc(playerId.slice(0,8)) : '--------';
  }
  function nameWithId(name, playerId){
    return `${esc(name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:10px;">#${shortId(playerId)}</span>`;
  }

  function renderCreate(){
    const liverCardsHtml = LIVER_DEFS.map(def=>{
      const selected = createSelectedLiver === def.id;
      const passive = equippedPassive(def.id);
      return `
        <button data-pick-liver="${def.id}" class="create-liver-card${selected?' selected':''}" style="${selected?`border-color:${def.color};`:''}">
          <span class="create-liver-chip" style="background:${def.color};"></span>
          <span class="create-liver-name">${esc(def.name)}</span>
          <span class="create-liver-title">${esc(JOB_DEFS[def.job].name)}</span>
          ${passive ? `<span class="create-liver-title" style="opacity:.8;">パッシブ:${esc(passive.name)}</span>` : ''}
        </button>`;
    }).join('');

    app.innerHTML = `
      <div class="create-box">
        <h1>${GAME_TITLE_HTML}</h1>
        <p class="subtitle">${GAME_SUBTITLE}</p>
        <p style="color:#000;">かつての文明が滅びてから幾星霜。地の底には、失われた時代の遺構が今も眠っている。<br>
        あなたは再興された小さな町に降り立ち、糧となる何かを求めて迷宮へ向かおうとしている。</p>
        <input id="nameInput" type="text" placeholder="冒険者の名を入力" maxlength="12" value="${esc(createNameDraft)}">
        <p class="section-label" style="margin-top:18px;text-align:left;color:var(--text-primary);text-shadow:1px 1px 0 var(--field-ground-dark);">最初の仲間を1人選ぼう</p>
        <p style="color:var(--text-primary);text-shadow:1px 1px 0 var(--field-ground-dark);font-size:11px;margin:0 0 10px;text-align:left;">選ばなかった仲間は、この先の迷宮の奥で出会うことになる。</p>
        <div class="create-liver-grid">${liverCardsHtml}</div>
        <div class="actions" style="justify-content:center;">
          <button class="primary" id="startBtn" ${createSelectedLiver?'':'disabled'}>町へ降り立つ</button>
        </div>
      </div>
    `;
    document.querySelectorAll('[data-pick-liver]').forEach(b=>{
      b.addEventListener('click', ()=>{
        createNameDraft = document.getElementById('nameInput').value;
        createSelectedLiver = b.getAttribute('data-pick-liver');
        renderCreate();
      });
    });
    document.getElementById('startBtn').addEventListener('click', async ()=>{
      if(!createSelectedLiver) return;
      const btn = document.getElementById('startBtn');
      btn.disabled = true;
      try{
        const val = document.getElementById('nameInput').value.trim();
        const name = val || '名もなき冒険者';
        const starterName = liverDef(createSelectedLiver).name;
        const uid = await ensureAuth();
        state = newCharacter(name, createSelectedLiver, uid);
        pushLog(`${name}は、${starterName}と共に再興の町に降り立った。`, 'system');
        await saveGame();
        // ここでplayers行が初めて作られるため、ゲート同意時点では
        // 更新できなかったtos_agreed_versionをサーバー側に反映させる
        try{
          await sb.rpc('agree_to_tos', { p_version: CURRENT_TOS_VERSION });
          localStorage.removeItem('tosAgreedLocal');
        }catch(e){
          console.error('agree_to_tos resync failed', e);
        }
        refreshAnnouncementUnreadCount();
        render();
      }catch(e){
        console.error('character creation failed', e);
        btn.disabled = false;
        alert('データの初期化に失敗しました。通信状況を確認してもう一度試してください。');
      }
    });
    document.getElementById('nameInput').addEventListener('input', (e)=>{ createNameDraft = e.target.value; });
    document.getElementById('nameInput').addEventListener('keydown', (e)=>{
      if(e.key==='Enter' && createSelectedLiver) document.getElementById('startBtn').click();
    });
  }

  /* PC(901px以上)ではstate.log(バトルログ抜き・最大6件)をそのまま
   * メインウィンドウに出す。モバイル(900px以下)は冒険の記録・チャット欄が
   * 画面下部に固定されず、スクロールしないと見えないため、バトルログを
   * 含む直近の詳細(state.history、常に全件保持)をメインウィンドウ内にも
   * 表示する。どちらか一方をCSSの@mediaで出し分けるだけなので、表示側で
   * 画面幅を見て切り替わり、プッシュ時点の画面幅には依存しない。 */
  function renderLog(emptyText){
    const emptyHtml = emptyText ? `<p class="log-entry system">${esc(emptyText)}</p>` : '';
    const desktopEntries = state.log;
    const mobileEntries = (state.history||[]).slice(-8);
    const desktopHtml = desktopEntries.length
      ? desktopEntries.map(l=>`<p class="log-entry ${l.cls}">${esc(l.text)}</p>`).join('')
      : emptyHtml;
    const mobileHtml = mobileEntries.length
      ? mobileEntries.map(l=>`<p class="log-entry ${l.cls}">${esc(l.text)}</p>`).join('')
      : emptyHtml;
    return `<div class="log-desktop-only">${desktopHtml}</div><div class="log-mobile-only">${mobileHtml}</div>`;
  }

  function locationLabel(){
    if(state.screen==='dungeon' && state.activeDungeonId){
      const def = currentDungeonDef();
      return def.name;
    }
    if(state.screen==='party') return 'パーティ編成';
    if(state.screen==='colosseum') return (inCombat && combatEnemy && combatEnemy.isColosseum) ? `コロシアムタワー ${combatEnemy.colosseumFloor}F` : 'コロシアムタワー';
    if(state.screen==='inn') return '宿屋';
    if(state.screen==='shop') return '商店';
    if(state.screen==='home') return 'マイホーム';
    if(state.screen==='dead') return '……';
    return '再興の町';
  }

  /* 踏破済みのダンジョンはボス撃破のたびに内部の再挑戦用進捗が0%に
   * リセットされるため、表示上はそれを見せず「踏破済み」で固定する
   * (未クリアの間だけ実際の進捗%を出す)。ヘッダーのバッジとメイン
   * ウィンドウ右上のバッジ、両方で共通して使う。 */
  function dungeonProgressLabelAndPct(ds){
    if(ds.cleared) return { pct: 100, label: '踏破済み' };
    return { pct: Math.min(100, ds.progress), label: `${ds.progress}%` };
  }

  /* 画面右上のバッジ。ダンジョンの踏破率はメインウィンドウの見出し側に
   * 移したため、ここは現在地+簡易リソース表示(所持金・運命のチケット・
   * コロシアムメダル)に専念する。 */
  function renderHeaderBadge(){
    return `
      <div class="depth-badge">
        <div class="badge-row badge-location">${esc(locationLabel())}</div>
        <div class="badge-resources">
          <span class="badge-resource" title="スタミナ(1分に1回復、上限${STAMINA_MAX})">⚡${state.stamina}/${STAMINA_MAX}</span>
          <span class="badge-resource" title="所持金">💰${state.gold}</span>
          <span class="badge-resource" title="運命のチケット">🎫${state.destinyTickets}</span>
          <span class="badge-resource" title="コロシアムメダル">🏅${state.colosseum.medals}</span>
        </div>
      </div>`;
  }

  function sceneHeadingHtml(text, trailingHtml){
    return `<p class="scene-heading"><span>${esc(text)}</span>${trailingHtml||''}</p>`;
  }

  function toggleGroup(groupId){
    if(!state.ui) state.ui = {expandedGroups:[]};
    const idx = state.ui.expandedGroups.indexOf(groupId);
    if(idx>=0) state.ui.expandedGroups.splice(idx,1);
    else state.ui.expandedGroups.push(groupId);
    saveGame(); render();
  }

  function renderDungeonGroups(){
    const groups = [];
    const seen = {};
    visibleDungeonDefs().forEach(def=>{
      if(!seen[def.group]){
        seen[def.group] = {id:def.group, name:def.groupName, defs:[]};
        groups.push(seen[def.group]);
      }
      seen[def.group].defs.push(def);
    });

    return groups.map(g=>{
      const total = g.defs.length;
      const clearedCount = g.defs.filter(d=>state.dungeons[d.id].cleared).length;
      const expanded = !!(state.ui && state.ui.expandedGroups.includes(g.id));
      const rows = g.defs.map(def=>{
        const unlocked = isDungeonUnlocked(def.id);
        const ds = state.dungeons[def.id];
        const status = !unlocked
          ? '🔒 未解放'
          : ds.cleared
            ? '踏破済み'
            : `踏破率 ${ds.progress}%`;
        const label = def.floorLabel ? `${def.floorLabel}` : def.name;
        return `
          <div class="inv-item" style="${unlocked?'':'opacity:.55;'}">
            <span class="inv-item-name">${esc(label)} <span style="color:var(--gold);font-family:var(--font-mono);font-size:11px;">Lv.${def.level}</span><br><span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${status}</span></span>
            <span class="inv-item-actions">${unlocked ? `<button data-enter-dungeon="${def.id}">入る</button>` : ''}</span>
          </div>`;
      }).join('');

      return `
        <div style="margin-bottom:8px;">
          <button data-toggle-group="${esc(g.id)}" style="width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;">
            <span>${expanded?'▼':'▶'} ${esc(g.name)}</span>
            <span style="font-family:var(--font-mono);font-size:11px;color:var(--gold);">${clearedCount}/${total}</span>
          </button>
          ${expanded ? `<div style="margin-top:8px;">${rows}</div>` : ''}
        </div>`;
    }).join('');
  }

  function renderDungeonInner(){
    const dungeonDef = currentDungeonDef();
    const ds = currentDungeonState();
    if(inCombat){
      const hpPct = Math.max(0,Math.round(combatEnemyHp/combatEnemy._maxHp*100));
      const weaknessLabel = combatEnemy.weakness ? (ELEMENT_LABELS[combatEnemy.weakness]||'?') : '不明';
      const actionsHtml = combatPhase === 'choice'
        ? `
          <div class="actions">
            <button class="primary" id="fightBtn">戦う</button>
            <button class="danger" id="fleeBtn">逃げる</button>
          </div>`
        : `<div class="actions"><button disabled>戦闘中…</button></div>`;
      return `
        <div class="scene-text">
          ${sceneHeadingHtml(dungeonDef.name, renderSceneProgressBadge())}
          ${actionsHtml}
          <p class="log-entry" style="font-family:var(--font-mono);font-size:13px;color:var(--text-muted);margin-top:16px;">
            Lv.${combatEnemy.level} ${esc(combatEnemy.name)} — HP ${Math.max(0,combatEnemyHp)}/${combatEnemy._maxHp} ・ 弱点属性: ${esc(weaknessLabel)}
          </p>
          <div class="bar-track" style="margin-bottom:6px;"><div class="bar-fill" style="width:${hpPct}%;background:linear-gradient(90deg,#c62f2f,var(--hp-red));height:100%;"></div></div>
          <div style="margin-bottom:14px;">${renderStatusEffectChips(combatEnemy.statusEffects)}</div>
          ${renderLog()}
        </div>`;
    }

    const bossReady = ds.progress >= 100;
    const isTutorial = dungeonDef.id === 'tutorial';
    const actionsHtml = `
      <div class="actions">
        ${(bossReady && isTutorial) ? '' : `<button class="primary" id="advBtn" ${(!alivePartyIds().length || state.stamina<1)?'disabled':''}>奥へ進む</button>`}
        ${bossReady ? `<button class="danger" id="bossBtn" ${(!alivePartyIds().length || state.stamina<1)?'disabled':''}>${ds.cleared ? 'ボスに再挑戦' : 'ボスに挑む'}</button>` : ''}
        ${isTutorial ? '' : `<button id="backTownBtn">町に戻る</button>`}
      </div>`;
    return `
      <div class="scene-text">
        ${sceneHeadingHtml(dungeonDef.name, renderSceneProgressBadge())}

  function exchangeMedalsForItem(catalogId){
    if(inCombat) return;
    const entry = MEDAL_EXCHANGE_CATALOG.find(e=>e.id===catalogId);
    if(!entry) return;
    if(state.colosseum.medals < entry.cost) return;
    if(entry.gold){
      state.colosseum.medals -= entry.cost;
      state.gold += entry.gold;
      pushLog(`メダル${entry.cost}枚を「${entry.name}」(${entry.gold}G)と交換した。`, 'reward');
      saveGame(); render();
      return;
    }
    if(entry.orb){
      state.colosseum.medals -= entry.cost;
      if(!state.orbs) state.orbs = {};
      state.orbs[entry.orb] = (state.orbs[entry.orb] || 0) + 1;
      pushLog(`メダル${entry.cost}枚を「${entry.name}」と交換した。`, 'reward');
      saveGame(); render();
      return;
    }
    const item = entry.make();
    state.colosseum.medals -= entry.cost;
    addItemToInventory(item);
    pushLog(`メダル${entry.cost}枚を「${item.name}」と交換した。`, 'reward');
    saveGame(); render();
  }

        <span class="inv-item-name">${esc(def.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">Lv.${jp.level} ・ ${esc(job.name)} ・ <span style="color:var(--gold);">戦闘力 ${combatPower(id)}</span></span></span>
        <span class="inv-item-actions">
          <button data-toggle-party="${id}" ${(!inParty && state.party.length>=PARTY_MAX)?'disabled':''}>${inParty?'外す':'編成に入れる'}</button>
          <button data-toggle-group="liver:${id}" class="${expanded?'primary':''}">${expanded?'閉じる':'詳細設定'}</button>
        </span>
      </div>`;

    if(!expanded) return summaryRow;

    const { atkRate, actions } = computeActionRates(id);
    const actualRateOf = key => {
      const found = actions.find(a=>a.skill.key===key);
      return found ? Math.round(found.rate) : 0;
    };

    const jobSwitchHtml = Object.keys(JOB_DEFS).map(jobId=>`
      <button data-switch-liver-job="${id}:${jobId}" ${ls.job===jobId?'disabled':''} style="padding:3px 9px;font-size:11px;">${ls.job===jobId?'◆ ':''}${esc(JOB_DEFS[jobId].name)}</button>`).join('');

    const currentCostumeKey = equippedCostumeKey(id);
    const unlockedCostumeKeys = ls.unlockedCostumes || [defaultCostumeKeyFor(id)];
    const costumeSwitchHtml = costumeDefsFor(id).map(c=>{
      const isCurrent = c.key === currentCostumeKey;
      const isUnlocked = unlockedCostumeKeys.includes(c.key);
      if(!isUnlocked){
        return `<button disabled style="padding:3px 9px;font-size:11px;opacity:.45;">🔒 ${esc(c.name)}</button>`;
      }
      return `<button data-switch-liver-costume="${id}:${c.key}" ${isCurrent?'disabled':''} style="padding:3px 9px;font-size:11px;">${isCurrent?'◆ ':''}${esc(c.name)}</button>`;
    }).join('');

    const atkRow = `
      <div class="inv-item" style="border-left-color:var(--text-muted);opacity:.85;">
        <span class="inv-item-name">通常攻撃 <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">(常時習得済み・下限50%)</span></span>
        <span class="inv-item-actions">
          <span style="font-family:var(--font-mono);font-size:12px;color:var(--gold);">${Math.round(atkRate)}%</span>
        </span>
      </div>`;

    const passive = equippedPassive(id);
    const passiveRow = passive ? `
      <div class="inv-item" style="border-left-color:${def.color};">
        <span class="inv-item-name">
          ${esc(passive.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">(${passive.always?'常時発動':'条件付き発動'})</span><br>
          <span style="color:var(--text-muted);font-size:11px;">${esc(passive.desc)}</span>
        </span>
      </div>` : '';

    const skillRows = job.skills.map(s=>{
      const unlocked = jp.level >= (s.unlockLevel||1);
      if(!unlocked){
        return `
          <div class="inv-item" style="opacity:.4;">
            <span class="inv-item-name">
              🔒 ${esc(s.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">Lv.${s.unlockLevel}で習得</span><br>
              <span style="color:var(--text-muted);font-size:11px;">${esc(s.desc)}</span>
            </span>
          </div>`;
      }
      const enabled = jp.loadout.enabled.includes(s.key);
      return `
        <div class="inv-item" style="${enabled?'':'opacity:.5;'}">
          <span class="inv-item-name">
            ${esc(s.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">(${s.element?`${ELEMENT_LABELS[s.element]}属性 ・ `:''}MP${s.mpCost} ・ 発動率${s.baseRate}%${enabled?` → 実質${actualRateOf(s.key)}%`:''})</span><br>
            <span style="color:var(--text-muted);font-size:11px;">${esc(s.desc)}</span>
          </span>
          <span class="inv-item-actions">
            <button data-toggle-skill="${id}:${s.key}">${enabled?'無効化':'有効化'}</button>
          </span>
        </div>`;
    }).join('');

    const equipHtml = `
      <div class="equip-row">
        <span class="equip-slot">武器</span>
        <span>${weapon ? `${esc(weapon.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(itemValueLabel(weapon))}</span>` : '未装備'}
          ${weapon ? `<button data-unequip="weapon" data-unequip-for="${id}">外す</button>` : ''}
          <button data-open-equip-picker="${id}:weapon">変更</button>
        </span>
      </div>
      <div class="equip-row">
        <span class="equip-slot">防具</span>
        <span>${armor ? `${esc(armor.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(itemValueLabel(armor))}</span>` : '未装備'}
          ${armor ? `<button data-unequip="armor" data-unequip-for="${id}">外す</button>` : ''}
          <button data-open-equip-picker="${id}:armor">変更</button>
        </span>
      </div>`;

    const detailHtml = `
      <div style="margin:6px 0 14px 10px;border:1px solid ${def.color}66;border-left:3px solid ${def.color};background:rgba(255,255,255,0.04);padding:12px 14px;">
        <p style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;color:${def.color};text-transform:uppercase;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.2);">${esc(def.name)}の詳細設定</p>
        <p style="color:var(--text-muted);font-size:11px;margin:0 0 6px;">EXP ${jp.exp}/${expToNext(jp.level)} ・ ${esc(job.desc)}</p>
        <p class="section-label" style="margin:6px 0 6px;">装備</p>
        ${equipHtml}
        <p class="section-label" style="margin:10px 0 6px;">衣装</p>
        <div class="actions" style="margin-top:0;margin-bottom:10px;">${costumeSwitchHtml}</div>
        <p class="section-label" style="margin:10px 0 6px;">パッシブスキル</p>
        ${passiveRow}
        <p class="section-label" style="margin:10px 0 6px;">ジョブ</p>
        <div class="actions" style="margin-top:0;margin-bottom:10px;">${jobSwitchHtml}</div>
        <p class="section-label" style="margin:6px 0 6px;">スキル</p>
        ${atkRow}
        ${skillRows}
        <p style="color:var(--text-muted);font-size:11px;margin:4px 0 0;">有効スキルは最大${SKILL_LOADOUT_MAX}つまで。希望発動率の合計が50%を超える分は自動的に按分されます。</p>
        <p class="section-label" style="margin:10px 0 6px;">属性耐性</p>
        ${renderResistancePanel(id)}
      </div>`;

    return summaryRow + detailHtml;
  }

  /* 装備ピッカー: 「変更」ボタンから開く、メインウィンドウ上の所持品
   * 選択画面。サイドパネルまでスクロールせずに装備を選べるようにする
   * のが目的(特にモバイル)。 */
  function renderEquipPickerInner(){
    const { liverId, slot } = state.ui.equipPickerSlot;
    if(!liverState(liverId)){
      state.ui.equipPickerSlot = null;
      return renderPartyInner();
    }
    const def = liverDef(liverId);
    const ls = liverState(liverId);
    const current = ls.equipped[slot];
    const slotLabel = slot === 'weapon' ? '武器' : '防具';

    const candidates = state.inventory.filter(i=>i.type===slot);
    const itemsHtml = candidates.length ? candidates.map(i=>{
      const equippable = canEquipItem(liverId, i);
      return `
        <div class="inv-item ${i.rarityLabel}" title="${esc(itemDetailText(i))}">
          <span class="inv-item-name">${esc(i.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(itemValueLabel(i))}</span></span>
          <span class="inv-item-actions">
            <button data-equip-for="${liverId}:${i.id}" ${equippable?'':'disabled title="このライバーは装備できない武器種"'}>装備</button>
            <button data-discard="${i.id}">破棄</button>
          </span>
        </div>`;
    }).join('') : `<p class="inv-empty">${slotLabel}として装備できる所持品がない。</p>`;

    const currentHtml = current
      ? `<div class="inv-item ${current.rarityLabel}" title="${esc(itemDetailText(current))}">
          <span class="inv-item-name">${esc(current.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(itemValueLabel(current))}</span></span>
        </div>`
      : `<p class="log-entry system">未装備</p>`;

    return `
      <div class="scene-text">
        ${sceneHeadingHtml(`${esc(def.name)}の${slotLabel}を選ぶ`)}
      </div>
      <div class="section-block" style="margin-top:0;">
        <p class="section-label">現在の${slotLabel}</p>
        ${currentHtml}
      </div>
      <div class="actions">
        ${current ? `<button data-unequip="${slot}" data-unequip-for="${liverId}">外す</button>` : ''}
        <button id="closeEquipPickerBtn">戻る</button>
      </div>
      <div class="section-block">
        <p class="section-label">所持品から選ぶ</p>
        <div class="scrollbox equip-picker-scroll">${itemsHtml}</div>
      </div>
    `;
  }

  function renderPartyInner(){
    if(state.ui.equipPickerSlot) return renderEquipPickerInner();
    const unlockedDefs = LIVER_DEFS.filter(d=>liverState(d.id).unlocked);
    const inPartyDefs = unlockedDefs.filter(d=>state.party.includes(d.id));
    const benchedDefs = unlockedDefs.filter(d=>!state.party.includes(d.id));
    const lockedDefs = LIVER_DEFS.filter(d=>!liverState(d.id).unlocked);

    const partyRows = inPartyDefs.length
      ? inPartyDefs.map(renderPartyMemberRow).join('')
      : `<p class="inv-empty">まだ誰も編成されていない。下の「待機中」から選ぼう。</p>`;

    const benchRows = benchedDefs.length
      ? benchedDefs.map(renderPartyMemberRow).join('')
      : `<p class="inv-empty">${unlockedDefs.length ? '仲間は全員編成済み。' : 'まだ仲間がいない。'}</p>`;

    const lockedRows = lockedDefs.map(def=>{
      const hint = '「召喚」で運命のチケットを使うと仲間になる';
      return `
        <div class="inv-item" style="opacity:.5;">
          <span class="inv-item-name">🔒 ${esc(def.name)}<br><span style="color:var(--text-muted);font-size:11px;">${esc(hint)}</span></span>
        </div>`;
    }).join('');

    const fullNotice = (state.party.length>=PARTY_MAX && benchedDefs.length)
      ? `<p style="color:var(--text-muted);font-size:11px;margin:6px 0 0;">編成は満員。待機中の仲間を入れるには、まず誰かを外そう。</p>`
      : '';

    return `
      <div class="scene-text">
        ${sceneHeadingHtml('パーティ編成')}
        <p class="log-entry system">最大${PARTY_MAX}人まで編成できる。ダンジョンにはここで選んだ仲間だけが同行する。装備の変更も町にいる間だけ行える。</p>
        <p class="log-entry" style="font-family:var(--font-mono);font-size:12px;color:var(--gold);">現在の編成: ${state.party.length}/${PARTY_MAX} ・ 仲間の総数: ${unlockedDefs.length}</p>
      </div>
      <div class="actions"><button id="backTownBtn">町に戻る</button></div>
      <div class="section-block">
        <p class="section-label">編成中</p>
        ${partyRows}
      </div>
      <div class="section-block">
        <p class="section-label">待機中</p>
        ${benchRows}
        ${fullNotice}
      </div>
      ${lockedDefs.length ? `
      <div class="section-block">
        <p class="section-label">未解放</p>
        ${lockedRows}
      </div>` : ''}
    `;
  }

  function renderInnInner(){
    const line = INNKEEPER_LINES[Math.floor(Math.random()*INNKEEPER_LINES.length)];
    const cost = Math.max(5, partyLevel()*3);
    const full = isPartyFull();
    const partyStatusHtml = state.party.map(id=>{
      const ls = liverState(id);
      return `<p class="log-entry" style="font-size:12px;">${esc(liverDef(id).name)}: HP ${ls.hp}/${ls.maxHp} ・ MP ${ls.mp}/${ls.maxMp}</p>`;
    }).join('') || `<p class="log-entry system">パーティが編成されていない。</p>`;
    return `
      <div class="scene-text">
        ${sceneHeadingHtml('宿屋')}
        <p class="log-entry system">宿屋の女将マーレ:「${esc(line)}」</p>
        ${partyStatusHtml}
      </div>
      <div class="actions">
        <button class="primary" id="stayBtn" ${(full||state.gold<cost||!state.party.length)?'disabled':''}>パーティ全員で泊まる (${cost}G)</button>
        <button id="backTownBtn">町に戻る</button>
      </div>
    `;
  }

  function renderShopInner(){
    const line = SHOPKEEPER_LINES[Math.floor(Math.random()*SHOPKEEPER_LINES.length)];
    const buyActive = ((state.ui && state.ui.shopTab) || 'buy') === 'buy';
    const equipActive = ((state.ui && state.ui.shopItemTab) || 'equip') === 'equip';

    let bodyHtml;
    if(buyActive){
      const keys = Object.keys(TOOL_DEFS).filter(k=>TOOL_DEFS[k].purchasable);
      bodyHtml = keys.length ? keys.map(key=>{
        const def = TOOL_DEFS[key];
        return `
          <div class="inv-item" title="${esc(def.desc)}">
            <span class="inv-item-name">${esc(def.name)}</span>
            <span class="inv-item-actions">
              <button data-buy-tool="${key}" ${(state.gold<def.price)?'disabled':''}>${def.price}G 購入</button>
            </span>
          </div>`;
      }).join('') : `<p class="inv-empty">購入できるアイテムが無い。</p>`;
    } else if(equipActive){
      bodyHtml = state.inventory.length ? state.inventory.map(item=>`
        <div class="inv-item ${item.rarityLabel}" title="${esc(itemDetailText(item))}">
          <span class="inv-item-name">${esc(item.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(itemValueLabel(item))}</span></span>
          <span class="inv-item-actions">
            <button data-sell="${item.id}">${Math.max(1,Math.round(item.value*3))}G で売る</button>
          </span>
        </div>`).join('') : `<p class="inv-empty">売れる装備が無い。</p>`;
    } else {
      const keys = Object.keys(TOOL_DEFS).filter(k=>toolCount(k) > 0);
      bodyHtml = keys.length ? keys.map(key=>{
        const def = TOOL_DEFS[key];
        return `
          <div class="inv-item" title="${esc(def.desc)}">
            <span class="inv-item-name">${esc(def.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">所持: ${toolCount(key)}</span></span>
            <span class="inv-item-actions">
              <button data-sell-tool="${key}">${toolSellPrice(key)}G で売る</button>
            </span>
          </div>`;
      }).join('') : `<p class="inv-empty">売れるアイテムが無い。</p>`;
    }

    return `
      <div class="scene-text">
        ${sceneHeadingHtml('商店')}
        <p class="log-entry system">商人オーレンス:「${esc(line)}」</p>
      </div>
      <div class="actions"><button id="backTownBtn">町に戻る</button></div>
      <div style="display:flex;gap:8px;margin:14px 0 10px;">
        <button data-shop-tab="buy" class="${buyActive?'primary':''}" style="padding:6px 14px;font-size:12px;">買う</button>
        <button data-shop-tab="sell" class="${!buyActive?'primary':''}" style="padding:6px 14px;font-size:12px;">売る</button>
      </div>
      ${buyActive ? '' : `
      <div style="display:flex;gap:8px;margin:10px 0;">
        <button data-shop-item-tab="equip" class="${equipActive?'primary':''}" style="padding:6px 14px;font-size:12px;">装備</button>
        <button data-shop-item-tab="item" class="${!equipActive?'primary':''}" style="padding:6px 14px;font-size:12px;">アイテム</button>
      </div>`}
      <div class="section-block">
        ${bodyHtml}
      </div>
    `;
  }

  function renderResistancePanel(liverId){
    const res = liverResistances(liverId);
    const rows = Object.keys(ELEMENT_LABELS).map(el=>{
      const value = res[el] || 0;
      const pct = value * 3;
      const pctLabel = pct === 0 ? '±0%' : (pct > 0 ? `-${pct}%` : `+${Math.abs(pct)}%`);
      const color = value > 0 ? 'var(--rare-uncommon)' : (value < 0 ? 'var(--danger)' : 'var(--text-muted)');
      return `
        <div class="inv-item">
          <span class="inv-item-name">${ELEMENT_LABELS[el]}属性</span>
          <span class="inv-item-actions" style="font-family:var(--font-mono);font-size:12px;color:${color};">
            ${value>0?'+':''}${value} <span style="color:var(--text-muted);">(被ダメージ ${pctLabel})</span>
          </span>
        </div>`;
    }).join('');
    return rows + `<p style="color:var(--text-muted);font-size:11px;margin:6px 0 0;">レベルアップでは変化しません。装備品(主に防具)に付く耐性値によってのみ増減します。</p>`;
  }

  function renderHomeInner(){
    const ownedHtml = state.home.furniture.length
      ? state.home.furniture.map(id=>{
          const f = FURNITURE_CATALOG.find(x=>x.id===id);
          return `<div class="inv-item uncommon"><span>${esc(f.name)}<br><span style="color:var(--text-muted);font-size:11px;">${esc(f.flavor)}</span></span></div>`;
        }).join('')
      : `<p class="inv-empty">まだ何も置かれていない。</p>`;

    const catalogHtml = FURNITURE_CATALOG.filter(f=>!state.home.furniture.includes(f.id)).map(f=>`
      <div class="inv-item">
        <span class="inv-item-name">${esc(f.name)} <span style="color:var(--gold);font-family:var(--font-mono);font-size:11px;">${f.price}G</span></span>
        <span class="inv-item-actions">
          <button data-buy-furniture="${f.id}" ${state.gold<f.price?'disabled':''}>設置</button>
        </span>
      </div>`).join('');

    return `
      <div class="scene-text">
        ${sceneHeadingHtml('マイホーム')}
        <p class="log-entry system">あなただけの小さな家。まだ何もない部屋だが、少しずつ形にしていけばいい。</p>
        <p class="log-entry" style="margin-top:10px;">現在の名前: <strong>${esc(state.name)}</strong></p>
        <input id="nameEditInput" class="name-input" type="text" maxlength="12" placeholder="新しい名前">
      </div>
      <div class="actions">
        <button id="renameBtn">名前を変更</button>
        <button id="backTownBtn">町に戻る</button>
      </div>
      <div class="section-block">
        <p class="section-label">設置済みの家具</p>
        ${ownedHtml}
      </div>
      <div class="section-block">
        <p class="section-label">家具カタログ</p>
        ${catalogHtml || '<p class="inv-empty">すべて設置済み。</p>'}
      </div>
      <div class="section-block">
        <p class="section-label">デバッグ</p>
        <p style="color:var(--text-muted);font-size:11px;margin:0 0 8px;">セーブデータを完全に削除し、キャラ作成からやり直す。動作確認用の機能。</p>
        <button class="danger" id="resetGameBtn">セーブデータをリセット</button>
      </div>
    `;
  }

  function renderDeadInner(){
    const lost = state.pendingDefeatGoldLoss || 0;
    const wasTutorial = state.activeDungeonId === 'tutorial';
    return `
      <div class="scene-text" style="text-align:center;padding:24px 0 8px;">
        <p style="font-family:var(--font-display);font-weight:700;font-size:30px;color:var(--danger);text-shadow:2px 2px 0 #2c5c2c;margin:0 0 16px;">力尽きた……</p>
        <p class="log-entry system">意識が遠のく中、誰かに担がれて街まで運ばれたようだ。</p>
        ${lost>0 ? `<p class="log-entry danger">所持金を ${lost} 枚落としてしまった。</p>` : ''}
        ${wasTutorial ? `<p class="log-entry reward">この経験から「運命のチケット」を1枚手に入れた。街の「召喚」で使ってみよう。</p>` : ''}
      </div>
      <div class="actions" style="justify-content:center;">
        <button class="primary" id="returnTownBtn">街に戻る</button>
      </div>
    `;
  }

  function renderMainArea(){
    let inner;
    if(state.screen === 'dungeon') inner = renderDungeonInner();
    else if(state.screen === 'party') inner = renderPartyInner();
    else if(state.screen === 'colosseum') inner = renderColosseumInner();
    else if(state.screen === 'inn') inner = renderInnInner();
    else if(state.screen === 'shop') inner = renderShopInner();
    else if(state.screen === 'summon') inner = renderSummonInner();
    else if(state.screen === 'exchange') inner = renderExchangeInner();
    else if(state.screen === 'enhance') inner = renderEnhanceInner();
    else if(state.screen === 'alchemy') inner = renderAlchemyInner();
    else if(state.screen === 'rift') inner = renderRiftInner();
    else if(state.screen === 'home') inner = renderHomeInner();
    else if(state.screen === 'rankings') inner = renderRankingsInner();
    else if(state.screen === 'rankingDetail') inner = renderRankingDetailInner();
    else if(state.screen === 'announcements') inner = renderAnnouncementsInner();
    else if(state.screen === 'announcementDetail') inner = renderAnnouncementDetailInner();
    else if(state.screen === 'dead') inner = renderDeadInner();
    else inner = renderTownInner();
    return `<div class="scene">${inner}</div>`;
  }

  /* 見出し(sceneHeadingHtml)の右側に添えて使う、ダンジョン専用の踏破率
   * ゲージ。見出しと同じ行(同じ<p>要素内)に収めることで、高さのズレを
   * 気にせず自然に揃い、色も見出しからそのまま継承される。 */
  function renderSceneProgressBadge(){
    const ds = currentDungeonState();
    if(!ds) return '';
    const { pct, label } = dungeonProgressLabelAndPct(ds);
    return `
      <span class="scene-heading-progress">
        踏破率
        <span class="badge-progress-track"><span class="badge-progress-fill" style="width:${pct}%;"></span></span>
        ${label}
      </span>`;
  }

  function renderPartyCompactRows(){
    return state.party.map(id=>{
      const ls = liverState(id);
      const def = liverDef(id);
      const hpPct = ls.maxHp>0 ? Math.round(ls.hp/ls.maxHp*100) : 0;
      const mpPct = ls.maxMp>0 ? Math.round(ls.mp/ls.maxMp*100) : 0;
      return `

  const RARITY_SORT_ORDER = {common:0, uncommon:1, rare:2, epic:3};
  const INVENTORY_SORT_DEFAULT = 'new_asc';
  const INVENTORY_SORT_OPTIONS = [
    { value:'new_asc',     label:'新着順(昇順)' },
    { value:'new_desc',    label:'新着順(降順)' },
    { value:'rarity_asc',  label:'レアリティ順(昇順)' },
    { value:'rarity_desc', label:'レアリティ順(降順)' },
  ];

  /* mode: 'new_asc'|'new_desc'|'rarity_asc'|'rarity_desc'。新着順は登録順
   * (配列の並び=古いものが上)を基準に、必要なら反転するだけ。
   * rarityOfはリストの各要素からレアリティの序列値を取り出す関数
   * (レアリティの概念が無い素材は-1を返し、昇順では先頭・降順では末尾に来る)。 */
  function applyInventorySort(list, mode, rarityOf){
    if(mode === 'new_desc') return [...list].reverse();
    if(mode === 'rarity_asc') return [...list].sort((a,b)=> rarityOf(a) - rarityOf(b));
    if(mode === 'rarity_desc') return [...list].sort((a,b)=> rarityOf(b) - rarityOf(a));
    return list; // new_asc
  }

  function renderItemStackRow(name, count, rarityLabel, actionHtml, desc){

  }

  function renderInventorySortSelect(currentSort){
    const options = INVENTORY_SORT_OPTIONS.map(o=>
      `<option value="${o.value}" ${currentSort===o.value?'selected':''}>${esc(o.label)}</option>`
    ).join('');
    return `<select id="inventorySortSelect" style="width:100%;margin-bottom:10px;font-size:11px;padding:4px 6px;background:var(--win-bg-1);color:var(--text-primary);border:1px solid var(--win-border);">${options}</select>`;
  }

  /* 装備の変更は「編成」画面の詳細設定から行うため、このサイドパネルは
   * 所持品の一覧確認と破棄だけを担う。装備(武器・防具、個体ごとに
   * 別枠で保持)とアイテム(オーブ・素材、種類ごとにスタックして個数だけ
   * 保持)はデータの持ち方が違うため、タブで切り替えて表示する。
   * ソート順(新着順/レアリティ順 × 昇順/降順)は装備・アイテムそれぞれ
   * 別に保持する。 */
  function renderInventoryLane(){
    const tab = (state.ui && state.ui.inventoryTab) || 'equip';
    const equipActive = tab === 'equip';
    const equipSort = (state.ui && state.ui.equipSort) || INVENTORY_SORT_DEFAULT;
    const itemSort = (state.ui && state.ui.itemSort) || INVENTORY_SORT_DEFAULT;

    const equipList = applyInventorySort(state.inventory, equipSort, i => RARITY_SORT_ORDER[i.rarity] || 0);
    const equipHtml = equipList.length
      ? equipList.map(i=>`
          <div class="inv-item ${i.rarityLabel}" title="${esc(itemDetailText(i))}">
            <span class="inv-item-name">${esc(i.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(itemValueLabel(i))}</span></span>
            <span class="inv-item-actions">
              <button data-discard="${i.id}">破棄</button>
            </span>
          </div>`).join('')
      : `<p class="inv-empty">所持している装備はまだない。</p>`;

    const orbStacks = Object.keys(RARITY)
      .filter(key => ((state.orbs && state.orbs[key]) || 0) > 0)
      .map(key => ({ name:`${RARITY[key].label}のオーブ`, count: state.orbs[key], rarity: key }));
    const materialStacks = Object.keys(MATERIAL_DEFS)
      .filter(key => materialCount(key) > 0)
      .map(key => ({ name: MATERIAL_DEFS[key].name, count: materialCount(key), rarity: null }));
    const toolStacks = Object.keys(TOOL_DEFS)
      .filter(key => toolCount(key) > 0)
      .map(key => {
        const def = TOOL_DEFS[key];
        const usable = !def.canUse || def.canUse();
        return {
          name: def.name, count: toolCount(key), rarity: null, desc: def.desc,
          actionHtml: usable ? `<button data-use-tool="${key}">使用</button>` : ''
        };
      });
    const itemStacksBase = [...orbStacks, ...materialStacks, ...toolStacks]; // 新着順の代わり(取得順の記録が無いため、オーブ→素材→道具の固定順)
    const itemStacks = applyInventorySort(itemStacksBase, itemSort, s => s.rarity ? RARITY_SORT_ORDER[s.rarity] : -1);
    const itemHtml = itemStacks.length
      ? itemStacks.map(s=>renderItemStackRow(s.name, s.count, s.rarity, s.actionHtml, s.desc)).join('')
      : `<p class="inv-empty">アイテムはまだない。</p>`;

    return `
      <div class="panel">
        <h2>所持品</h2>
        <div style="display:flex;gap:8px;margin-bottom:10px;">
          <button data-inventory-tab="equip" class="${equipActive?'primary':''}" style="padding:6px 14px;font-size:12px;">装備</button>
          <button data-inventory-tab="item" class="${!equipActive?'primary':''}" style="padding:6px 14px;font-size:12px;">アイテム</button>
        </div>
        ${renderInventorySortSelect(equipActive ? equipSort : itemSort)}
        <div class="scrollbox inventory-scroll">${equipActive ? equipHtml : itemHtml}</div>
      </div>
    `;
  }

  /* ---------------- チャット(全ユーザー共有、Supabase Realtime) ---------------- */
  const CHAT_CHANNEL_DEFS = [
    { id:'general', name:'総合チャット' },
    { id:'strategy', name:'攻略チャット' },
    { id:'casual', name:'雑談チャット' },
  ];
  let chatCache = [];
  let chatChannel = null;
  let activeChatChannel = 'general';

  async function loadChat(channel){
    try{
      const { data, error } = await sb.from('chat_messages')
        .select('*').eq('channel', channel).order('created_at', {ascending:false}).limit(100);
      if(error) throw error;
      return (data||[]).slice().reverse().map(m=>(
        { name: m.player_name, id: m.player_id, text: m.body, ts: new Date(m.created_at).getTime() }
      ));
    }catch(e){
      console.error('load chat failed', e);
      return [];
    }
  }

  function renderChatMessages(){
    if(!chatCache.length) return '<p style="color:var(--text-muted);">まだ発言はない。</p>';
    return chatCache.map(m=>`<p><span style="color:var(--gold);">${nameWithId(m.name, m.id)}:</span> ${esc(m.text)}</p>`).join('');
  }

  async function refreshChatDOM(){
    const el = document.getElementById('chatLog');
    if(!el) return;
    chatCache = await loadChat(activeChatChannel);
    el.innerHTML = renderChatMessages();
    el.scrollTop = el.scrollHeight;
  }

  function switchChatChannel(channelId){
    if(!CHAT_CHANNEL_DEFS.some(c=>c.id === channelId)) return;
    activeChatChannel = channelId;
    toggleBottomTab('chat');
  }

  async function sendChatMessage(rawText){
    const text = (rawText||'').trim().slice(0,200);
    if(!text || !state) return;
    try{
      const { error } = await sb.from('chat_messages').insert({
        player_id: state.playerId, player_name: state.name, body: text, channel: activeChatChannel
      });
      if(error) throw error;
      // 表示への反映は、下のRealtime購読側のINSERTイベントで(自分の発言も含めて)行われる
    }catch(e){
      console.error('send chat failed', e);
      pushLog('チャットの送信に失敗した。通信状況を確認してほしい。', 'system');
      render();
    }
  }

  function toggleBottomTab(tab){
    if(!state.ui) state.ui = {expandedGroups:[]};
    state.ui.bottomTab = tab;
    saveGame(); render();
    if(tab === 'chat') refreshChatDOM();

  /* ポーリングではなく、Supabase Realtimeで新着メッセージをプッシュ受信する。
   * ページを開いた時に1回だけ購読を開始し、以降は通信を発生させずに
   * 新着があった時だけイベントが飛んでくる。 */
  function startChatPolling(){
    if(chatChannel) return;
    chatChannel = sb.channel('public:chat_messages')
      .on('postgres_changes', {event:'INSERT', schema:'public', table:'chat_messages'}, (payload)=>{
        const m = payload.new;
        if(m.channel !== activeChatChannel) return;
        chatCache.push({ name: m.player_name, id: m.player_id, text: m.body, ts: new Date(m.created_at).getTime() });
        if(chatCache.length > 100) chatCache.shift();
        if(state && state.ui && state.ui.bottomTab === 'chat'){
          const el = document.getElementById('chatLog');
          if(el){ el.innerHTML = renderChatMessages(); el.scrollTop = el.scrollHeight; }
        }
      })
      .subscribe();
  }

  function renderBottomPanel(){
    if(historyLogHeightPx <= 0){
      return `<div class="panel history-panel" style="padding:10px 14px;">
        <button id="showHistoryPanelBtn" style="width:100%;padding:6px 14px;font-size:12px;">▲ 冒険の記録・チャットを表示</button>
      </div>`;
    }

    const tab = (state.ui && state.ui.bottomTab) || 'log';
    const logActive = tab === 'log';
    const channelTabsHtml = CHAT_CHANNEL_DEFS.map(c=>
      `<button data-chat-channel="${c.id}" class="${(!logActive && activeChatChannel===c.id)?'primary':''}" style="padding:6px 14px;font-size:12px;">${esc(c.name)}</button>`
    ).join('');
    const heightOptions = HISTORY_LOG_PRESETS.map(o=>
      `<option value="${o.px}" ${historyLogHeightPx===o.px?'selected':''}>${esc(o.label)}</option>`
    ).join('');
    const tabsHtml = `
      <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center;">
        <button data-bottom-tab="log" class="${logActive?'primary':''}" style="padding:6px 14px;font-size:12px;">冒険の記録</button>
        ${channelTabsHtml}
        <select id="historyLogHeightSelect" title="この欄の表示行数(この端末だけの設定)" style="margin-left:auto;font-size:11px;padding:4px 6px;background:var(--win-bg-1);color:var(--text-primary);border:1px solid var(--win-border);">${heightOptions}</select>
      </div>`;
    let body;
    if(logActive){
      const rows = (state.history||[]).map(l=>`<p class="${l.cls}">${esc(l.text)}</p>`).join('')
        || '<p style="color:var(--text-muted);">まだ記録はない。</p>';
      body = `<div class="scrollbox history-log" id="historyLog">${rows}</div>`;
    } else {
      const activeChannelDef = CHAT_CHANNEL_DEFS.find(c=>c.id === activeChatChannel) || CHAT_CHANNEL_DEFS[0];
      body = `
        <div class="scrollbox history-log" id="chatLog">${renderChatMessages()}</div>
        <div class="actions" style="margin-top:10px;flex-wrap:nowrap;">
          <input id="chatInput" class="name-input" style="flex:1;margin:0;" type="text" maxlength="200" placeholder="${esc(activeChannelDef.name)}に発言(他の全ユーザーに公開されます)">
          <button class="primary" id="sendChatBtn">送信</button>
        </div>`;
    }
    return `<div class="panel history-panel">${tabsHtml}${body}</div>`;
  }

  /* 次元断層ポモ・ドーロが進行中/受け取り待ちの間は、state.screenが何で
   * あろうと関係なく、この専用画面だけを強制表示する。画面遷移・チャット
   * 閲覧も含め、通常のヘッダーやレイアウトを一切描画しないことで
   * 「ロック」を実現している。 */
  function renderRiftLockScreen(){
    const participantsHtml = state.rift.partyIds.map(id=>liverDef(id)).filter(Boolean).map(def=>`
        <div class="inv-item" style="border-left-color:${def.color};">
          <span style="width:10px;height:10px;background:${def.color};display:inline-block;margin-right:8px;"></span>
          <span class="inv-item-name">${esc(def.name)}</span>
        </div>`).join('');

    if(state.rift.result){
      const r = state.rift.result;
      const levelUpHtml = r.levelUps.length
        ? r.levelUps.map(lu=>`<p class="log-entry reward" style="margin:2px 0;color:var(--gold);">${esc(lu.name)}のレベルが ${lu.level} に上がった！</p>`).join('')
        : '';
      return `
        <div class="create-box" style="text-align:center;">
          <h1>${GAME_TITLE_HTML}</h1>
          <p class="subtitle">${GAME_SUBTITLE}</p>
          <h2 style="margin-top:24px;">次元断層ポモ・ドーロ ― 探索結果</h2>
          <p class="log-entry system" style="font-size:15px;color:#000;">パーティが無事に帰還した。</p>
          <div class="section-block" style="text-align:left;max-width:360px;margin:16px auto;">
            <div class="inv-item"><span class="inv-item-name">ゴールド</span><span class="inv-item-actions" style="color:var(--gold);">+${r.gold}G</span></div>
            <div class="inv-item"><span class="inv-item-name">経験値</span><span class="inv-item-actions">+${r.exp}</span></div>
            ${r.itemName ? `<div class="inv-item"><span class="inv-item-name">獲得アイテム</span><span class="inv-item-actions">${esc(r.itemName)}</span></div>` : ''}
          </div>
          ${levelUpHtml}
          <div class="actions" style="justify-content:center;margin-top:16px;"><button class="primary" id="riftCloseResultBtn">閉じる</button></div>
          <p class="section-label" style="margin-top:20px;color:var(--text-primary);text-shadow:1px 1px 0 var(--field-ground-dark);">挑んでいた仲間</p>
          <div style="max-width:360px;margin:0 auto;">${participantsHtml}</div>
        </div>
      `;
    }

    const ready = riftReady();
    const remainMs = riftRemainMs();
    const mins = Math.floor(remainMs/60000);
    const secs = Math.floor((remainMs%60000)/1000);

    return `
      <div class="create-box" style="text-align:center;">
        <h1>${GAME_TITLE_HTML}</h1>
        <p class="subtitle">${GAME_SUBTITLE}</p>
        <h2 style="margin-top:24px;">次元断層ポモ・ドーロ</h2>
        ${ready
          ? `<p class="log-entry reward" style="font-size:16px;color:var(--gold);">探索が完了した。仲間たちが戻ってくる……</p>
             <div class="actions" style="justify-content:center;"><button class="primary" id="riftClaimBtn">結果を受け取る</button></div>`
          : `<p class="log-entry system" style="font-size:16px;color:#000;">次元の狭間に挑んでいる……</p>
             <p style="font-family:var(--font-mono);font-size:28px;color:var(--gold);margin:16px 0;">${mins}:${String(secs).padStart(2,'0')}</p>
             <p style="color:var(--text-primary);text-shadow:1px 1px 0 var(--field-ground-dark);font-size:12px;">この間、画面遷移やチャットを含め他の操作は一切行えません。</p>
             <div class="actions" style="justify-content:center;margin-top:12px;"><button class="danger" id="riftRetreatBtn">撤退する</button></div>`
        }
        <p class="section-label" style="margin-top:20px;color:var(--text-primary);text-shadow:1px 1px 0 var(--field-ground-dark);">挑んでいる仲間</p>
        <div style="max-width:360px;margin:0 auto;">${participantsHtml}</div>
      </div>
    `;
  }

  /* render()はapp.innerHTMLを毎回まるごと作り直すため、何もしないと
   * ボタンを押すたびにスクロール位置が消えて先頭に戻ってしまう
   * (PC版はメインウィンドウ(.scene)内部のスクロール、それ以外は
   * ウィンドウ全体のスクロールが対象)。同じ画面内での再描画(アイテム
   * 使用・購入・強化などのアクション後)ではスクロール位置を復元し、
   * 別の画面へ実際に遷移した時だけ先頭に戻す。 */
  function render(){
    if(!state){ document.body.classList.remove('playing'); renderCreate(); return; }
    recomputeStamina();
    if(state.rift){
      document.body.classList.remove('playing');
      app.innerHTML = renderRiftLockScreen();
      bindEvents();
      return;
    }

    const keepScroll = state.screen === lastRenderedScreen;
    const prevSceneEl = document.querySelector('.layout > div > .scene');
    const prevSceneScrollTop = keepScroll && prevSceneEl ? prevSceneEl.scrollTop : 0;
    const prevWindowScrollY = keepScroll ? window.scrollY : 0;
    lastRenderedScreen = state.screen;

    document.body.classList.add('playing');
    app.innerHTML = `
      <header>
        <div>
          <h1>${GAME_TITLE_HTML}</h1>
          <p class="subtitle">${GAME_SUBTITLE}</p>
        </div>
        <div class="depth-badge-slot">${renderHeaderBadge()}</div>
      </header>
      <div class="layout">
        <div>${renderMainArea()}</div>
        <div>${renderCharacterLane()}</div>
        <div>${renderInventoryLane()}</div>
      </div>
      ${renderBottomPanel()}
    `;
    bindEvents();
    const historyEl = document.getElementById('historyLog');
    if(historyEl) historyEl.scrollTop = historyEl.scrollHeight;
    const chatEl = document.getElementById('chatLog');
    if(chatEl) chatEl.scrollTop = chatEl.scrollHeight;

    const newSceneEl = document.querySelector('.layout > div > .scene');
    if(newSceneEl) newSceneEl.scrollTop = prevSceneScrollTop;
    window.scrollTo(0, prevWindowScrollY);
  }

  /* ---------------- Init / セーブのマイグレーション ---------------- */

  /* 利用規約同意・BAN確認をクリアした後の本来の起動処理。
   * 規約同意直後、および通常起動の両方から呼ばれる。 */
  async function proceedToGame(){
    const loaded = await loadGame();
    if(loaded){
      state = loaded;
      // 念のための軽い安全確認(想定外のDB状態に対する保険)
      state.party = (state.party||[]).filter(id=>state.roster[id] && state.roster[id].unlocked).slice(0, PARTY_MAX);
      if(state.ui.equipPickerSlot && !state.roster[state.ui.equipPickerSlot.liverId]) state.ui.equipPickerSlot = null;
      // チュートリアル追加前からの既存セーブは、いきなり強制送りにしないようクリア済み扱いにする
      if(state.tutorialDone === undefined) state.tutorialDone = true;
    }
    render();
    startChatPolling();
    refreshAnnouncementUnreadCount();
    setInterval(()=>{
      if(!state) return;
      let needsRender = recomputeStamina();
      if(state.screen === 'colosseum' && !inCombat){
        const remain = COLOSSEUM_COOLDOWN_MS - (Date.now() - (state.colosseum.lastChallengeAt||0));
        if(remain > 0) needsRender = true;
      }
      if(state.rift){
        needsRender = true;
      }
      if(needsRender) render();
    }, 5000);
  }

  function renderBanScreen(reason){
    app.innerHTML = `
      <div class="create-box">
        <h1>${GAME_TITLE_HTML}</h1>
        <p class="subtitle">${GAME_SUBTITLE}</p>
        <p style="color:var(--danger);font-weight:700;margin-top:24px;">このアカウントは利用規約違反により、利用を停止しています。</p>
        ${reason ? `<p style="color:#000;font-size:12px;">理由: ${esc(reason)}</p>` : ''}
      </div>
    `;
  }

  async function handleAgreeTos(){
    const btn = document.getElementById('agreeTosBtn');
    if(btn) btn.disabled = true;
    try{
      const { error } = await sb.rpc('agree_to_tos', { p_version: CURRENT_TOS_VERSION });
      if(error) throw error;
      // まだplayers行が無い(=これからキャラ作成する)場合、agree_to_tosのUPDATEは
      // 実質何もしない。キャラ作成前に再読み込みされてもゲートを出し直さないよう、
      // ブラウザ側にも同意済みを控えておく(キャラ作成完了時にサーバー側へ再送する)。
      localStorage.setItem('tosAgreedLocal', String(CURRENT_TOS_VERSION));
      app.innerHTML = `<p style="text-align:center;color:#000;margin-top:80px;font-family:var(--font-mono);">呼び起こしている……</p>`;
      await proceedToGame();
    }catch(e){
      console.error('agree_to_tos failed', e);
      if(btn) btn.disabled = false;
      alert('同意の送信に失敗した。通信状況を確認してもう一度試してほしい。');
    }
  }

  function renderTosGateScreen(){
    app.innerHTML = `
      <div class="create-box">
        <h1>${GAME_TITLE_HTML}</h1>
        <p class="subtitle">${GAME_SUBTITLE}</p>
        <p class="section-label" style="text-align:left;margin-top:20px;color:#000;">利用規約</p>
        <div class="panel tos-panel scrollbox" style="max-height:320px;font-size:12px;">
          ${TOS_TEXT_HTML}
        </div>
        <p style="font-size:11px;color:var(--text-primary);text-shadow:1px 1px 0 #2c5c2c;margin-top:10px;">「同意して始める」を押すと、上記の利用規約に同意したものとみなします。</p>
        <div class="actions" style="justify-content:center;margin-top:10px;">
          <button class="primary" id="agreeTosBtn">同意して始める</button>
        </div>
      </div>
    `;
    const btn = document.getElementById('agreeTosBtn');
    if(btn) btn.addEventListener('click', handleAgreeTos);
  }

  (async function init(){
    app.innerHTML = `<p style="text-align:center;color:var(--text-muted);margin-top:80px;font-family:var(--font-mono);">呼び起こしている……</p>`;
    try{
      const uid = await ensureAuth();
      const { data: gateRow, error } = await sb.from('players')
        .select('tos_agreed_version, banned_at, ban_reason').eq('id', uid).maybeSingle();
      if(error) throw error;

      if(gateRow && gateRow.banned_at){
        renderBanScreen(gateRow.ban_reason);
        return;
      }
      // players行がまだ無い(=キャラ作成前)場合は、agree_to_tosのUPDATEが
      // 何も更新できないため、ブラウザ側に控えた同意記録を代わりに参照する
      // (キャラ作成完了時にサーバー側へ改めて同意を記録する)。
      const agreedVersion = gateRow
        ? (gateRow.tos_agreed_version || 0)
        : parseInt(localStorage.getItem('tosAgreedLocal') || '0', 10);
      if(agreedVersion < CURRENT_TOS_VERSION){
        renderTosGateScreen();
        return;
      }
    }catch(e){
      // 規約確認自体の通信に失敗した場合は、プレイ不能にはせず通常フローに進む
      // (実際の書き込みは各RPC側のBANチェックで最終的に守られているため)
      console.error('tos/ban check failed', e);
    }
    await proceedToGame();
  })();

})();
</script>
</body>
</html>
