    const level = Math.max(1, dungeonDef.level + BOSS_LEVEL_PREMIUM);
    const base = statsForLevel(level);
    const hp = Math.max(5, Math.round(base.hp * 1.6 * partySizeHpMult()));
    const atk = Math.max(1, Math.round(base.atk * 1.25));
    const def = Math.max(0, Math.round(base.def * 1.2));
    const exp = Math.round(base.exp * 1.6);
    return {name:'化けた宝箱', level, hp, maxHp:hp, atk, def, exp, boss:false, isMimic:true, critBonus:0.15, skills:[], weakness:null};
  }
  function startMimicCombat(enemy){
    startCombat(enemy);
    const target = pickRandomAliveTarget();
    if(!target) return;
    const type = ['poison','stun','silence'][Math.floor(Math.random()*3)];
    const amount = type==='poison' ? 0.1 : 1;
    const duration = type==='poison' ? 3 : 2;
    applyStatusEffect(statusEffectsMapFor(target), type, amount, duration, false);
    pushLog(`ミミックの奇襲！ ${liverDef(target).name}に「${statusEffectLabel(type)}」が問答無用で刻まれた！`, 'danger', true);
    render(); // startCombat()内で既に一度描画済みだが、その後に追加したこの奇襲ログ・状態異常を画面に反映するため再描画する
  }

  /* ボス撃破後: 七彩の塔と同様、リザルトを挟んで町へ強制送還する。
   * 到達済みフラグ(cleared)自体は通常ダンジョンと同じく永続するが、
   * 踏破率・深度はここで必ず0に戻す(再突入時は常に0から)。 */
  function resolvePrismBossVictory(dungeonDef, ds){
    ds.cleared = true;
    ds.bossKillCount = (ds.bossKillCount||0) + 1;
    ds.progress = 0; ds.depth = 0;

    const drop = rollPrismDrop(dungeonDef.floorNum, true);
    if(drop.equip) addItemToInventory(drop.equip);
    if(drop.materialQty > 0) grantPrismMaterial(drop.materialQty);

    state.lastPrismResult = { floorName: dungeonDef.name, reward: drop.equip, materialQty: drop.materialQty };
    state.prismRun = null;
    state.activeDungeonId = null;
    state.screen = 'prismResult';
    inCombat = false; combatPhase = null; combatEnemy = null;
    saveGame(); render();
  }
  function closePrismResult(){
    state.lastPrismResult = null;
    state.screen = 'materialDungeons';
    saveGame(); render();
  }
  function enterPrismFloor(id){
    if(inCombat) return;
    if(!isDungeonUnlocked(id)) return;
    if(!state.party.length){
      pushLog('パーティが編成されていない。町で編成してから向かおう。', 'system');
      render();
      return;
    }
    const def = dungeonDefById(id);
    recomputeStamina();
    const cost = def.floorNum * 10;
    if(state.stamina < cost){
      pushLog(`スタミナが足りない(必要: ${cost})。時間経過で回復するのを待とう。`, 'system');
      render();
      return;
    }
    state.stamina -= cost;
    const ds = state.dungeons[id];
    ds.progress = 0; ds.depth = 0;
    state.activeDungeonId = id;
    state.prismRun = { floorId: id };
    state.screen = 'dungeon';
    state.log = [];
    pushLog(`${def.name}に突入した。`, 'system');
    saveGame(); render();
  }
  /* 探索を切り上げて出る(自主撤退)。全滅時と同じく、退出時は必ず
   * 踏破率0%に戻す(救済措置は行わない)。 */
  function leavePrismFloor(){
    if(inCombat || !state.activeDungeonId) return;
    const ds = currentDungeonState();
    if(ds){ ds.progress = 0; ds.depth = 0; }
    state.prismRun = null;
    state.activeDungeonId = null;
    state.screen = 'materialDungeons';
    saveGame(); render();
  }

  /* 装備の変更は町(ダンジョン探索中でない状態)でのみ許可する。 */
  function canManageEquipment(){ return state.screen !== 'dungeon'; }

  /* そのライバーが装備できる武器種の集合(現在のジョブの装備可能リスト ∪
   * ライバー個人の適正武器種)。防具には武器種の概念が無いため無制限のまま。 */
  function allowedWeaponTypes(liverId){
    const ls = liverState(liverId);
    const jobTypes = (JOB_DEFS[ls.job] && JOB_DEFS[ls.job].weaponTypes) || [];
    const liverTypes = liverDef(liverId).weaponAptitude || [];
    return new Set([...jobTypes, ...liverTypes]);
  }
  function canEquipItem(liverId, item){
    if(item.uniqueFor && item.uniqueFor !== liverId) return false;
    if(item.type !== 'weapon') return true;
    return allowedWeaponTypes(liverId).has(item.weaponType);
  }

  /* 装備変更は「ライバー」の詳細画面内の専用ピッカー(state.ui.equipPickerSlot =
   * {liverId, slot})を通して行う。ピッカーはメインウィンドウ上に所持品
   * 一覧を表示するので、モバイルでもサイドパネルまでスクロールせずに
   * 装備を選べる。装備が完了したら自動的にピッカーを閉じ、詳細画面に戻る。 */
  function equipItemForLiver(liverId, itemId){
    if(!canManageEquipment()) return;
    if(!liverState(liverId) || !liverState(liverId).unlocked) return;
    const idx = state.inventory.findIndex(i=>i.id===itemId);
    if(idx<0) return;
    const item = state.inventory[idx];
    if(!canEquipItem(liverId, item)){
      if(item.uniqueFor && item.uniqueFor !== liverId){
        pushLog(`「${item.name}」は${liverDef(item.uniqueFor).name}専用の固有装備で、${liverDef(liverId).name}は装備できない。`, 'system');
      } else {
        pushLog(`${liverDef(liverId).name}は「${item.name}」(${WEAPON_TYPES[item.weaponType].name})を扱えない。`, 'system');
      }
      render();
      return;
    }
    const slot = item.type;
    const ls = liverState(liverId);
    const prev = ls.equipped[slot];
    state.inventory.splice(idx,1);
    if(prev) state.inventory.push(prev); // 元々装備していた物は所持品に戻す(クリスタルも装着したまま付いてくる)
    ls.equipped[slot] = item;
    pushLog(`${liverDef(liverId).name}が「${item.name}」を装備した。`, 'system');
    state.ui.equipPickerSlot = null;
    recomputeLiverMaxStats(liverId, false);
    saveGame(); render();
  }

  const EQUIP_SLOT_LABELS = { weapon:'武器', armor:'防具', accessory:'アクセサリー' };
  function unequipSlot(slot, liverId){
    if(!canManageEquipment()) return;
    if(!liverId || !liverState(liverId) || !liverState(liverId).unlocked) return;
    const ls = liverState(liverId);
    const item = ls.equipped[slot];
    if(!item) return;
    ls.equipped[slot] = null;
    state.inventory.push(item);
    pushLog(`${liverDef(liverId).name}の${EQUIP_SLOT_LABELS[slot]||slot}を外した。`, 'system');
    recomputeLiverMaxStats(liverId, false);
    saveGame(); render();
  }

  /* ライバー詳細画面の装備欄にある「変更」ボタンで開く。メインウィンドウの
   * 表示がピッカーに切り替わり、戻るボタンか装備完了で詳細画面に戻る。 */
  function openEquipPicker(liverId, slot){
    if(!canManageEquipment() || !liverState(liverId) || !liverState(liverId).unlocked) return;
    state.ui.equipPickerSlot = {liverId, slot};
    render();
  }
  function closeEquipPicker(){
    state.ui.equipPickerSlot = null;
    render();
  }

  /* ---------------- クリスタルの着脱 ----------------
   * クリスタルは所持品からアクセサリーのスロットへ「移動」する形で扱う
   * (装備品と同じ考え方: 装備した瞬間に所持品リストからは消え、外すと戻る)。 */
  function socketCrystal(liverId, crystalId){
    if(!canManageEquipment()) return;
    const ls = liverState(liverId);
    if(!ls || !ls.unlocked) return;
    const accessory = ls.equipped.accessory;
    if(!accessory) return;
    const idx = state.inventory.findIndex(i=>i.id===crystalId && i.type==='crystal');
    if(idx<0) return;
    const crystal = state.inventory[idx];
    const used = (accessory.crystals||[]).reduce((s,c)=>s+(c.slotCost||0), 0);
    if(used + crystal.slotCost > (accessory.slotCount||0)){
      pushLog(`「${accessory.name}」のスロットが足りない。`, 'system');
      render();
      return;
    }
    state.inventory.splice(idx,1);
    if(!accessory.crystals) accessory.crystals = [];
    accessory.crystals.push(crystal);
    pushLog(`「${accessory.name}」に「${crystal.name}」を装備した。`, 'system');
    state.ui.crystalPickerSlot = null;
    recomputeLiverMaxStats(liverId, false);
    saveGame(); render();
  }
  function unsocketCrystal(liverId, crystalIndex){
    if(!canManageEquipment()) return;
    const ls = liverState(liverId);
    if(!ls || !ls.unlocked) return;
    const accessory = ls.equipped.accessory;
    if(!accessory || !accessory.crystals) return;
    const crystal = accessory.crystals[crystalIndex];
    if(!crystal) return;
    accessory.crystals.splice(crystalIndex, 1);
    state.inventory.push(crystal);
    pushLog(`「${accessory.name}」から「${crystal.name}」を外した。`, 'system');
    recomputeLiverMaxStats(liverId, false);
    saveGame(); render();
  }
  function openCrystalPicker(liverId){
    const ls = liverState(liverId);
    if(!canManageEquipment() || !ls || !ls.unlocked || !ls.equipped.accessory) return;
    state.ui.crystalPickerSlot = { liverId };
    render();
  }
  function closeCrystalPicker(){
    state.ui.crystalPickerSlot = null;
    render();
  }

  function discardItem(id){
    const item = state.inventory.find(i=>i.id===id);
    if(!item) return;
    if(item.rarity === 'unique'){
      pushLog(`「${item.name}」は固有装備のため破棄できない。`, 'system');
      render();
      return;
    }
    // レア以上(マーケットに出品できる価値がある装備)を破棄する時だけ、
    // 誤操作防止の確認を挟む。
    const isHighRarity = (MARKET_EQUIP_RARITY_RANK[item.rarity]||0) >= MARKET_MIN_EQUIP_RARITY_RANK;
    if(isHighRarity){
      const ok = confirm(`「${item.name}」は${RARITY[item.rarity].label}の装備です。破棄すると元に戻せません。本当に破棄しますか？`);
      if(!ok) return;
    }
    state.inventory = state.inventory.filter(i=>i.id!==id);
    saveGame(); render();
  }

  /* ---------------- 合成(装備強化) ----------------
   * 所持品+全ライバーの装備中アイテムをまとめて対象候補にする(装備中でも
   * ここから直接強化できるようにするため)。 */
  function allOwnedItemsWithEquipInfo(){
    const list = state.inventory.map(i=>({ item:i, equippedBy:null }));
    LIVER_DEFS.forEach(def=>{
      const ls = liverState(def.id);
      if(!ls) return;
      ['weapon','armor'].forEach(slot=>{
        const it = ls.equipped[slot];
        if(it) list.push({ item: it, equippedBy: def.id });
      });
    });
    return list;
  }

  function enhanceItem(itemId){
    if(!canManageEquipment()) return;
    const found = allOwnedItemsWithEquipInfo().find(x=>x.item.id===itemId);
    if(!found) return;
    const item = found.item;
    if(item.rarity === 'unique') return;
    const level = item.enhanceLevel || 0;
    if(level >= ENHANCE_MAX_LEVEL) return;
    const orbCount = (state.orbs && state.orbs[item.rarity]) || 0;
    if(orbCount < 1) return;
    state.orbs[item.rarity] = orbCount - 1;
    item.enhanceLevel = level + 1;
    pushLog(`「${item.name}」を強化した(強化値+${item.enhanceLevel})。`, 'reward');
    saveGame(); render();
  }

  function gotoScreen(name){

  function enterDungeon(id){
    if(inCombat) return;
    if(!isDungeonUnlocked(id)) return;
    if(!state.party.length){
      pushLog('パーティが編成されていない。町で編成してから向かおう。', 'system');

      return;

    state.activeDungeonId = id;

  function isPartyFull(){ return state.party.every(id=>{ const ls=liverState(id); return ls.hp>=ls.maxHp && ls.mp>=ls.maxMp; }); }

  /* ---------------- 宿屋 ---------------- */
  /* 宿代は「回復するHP×1+回復するMP×1」をパーティ全員分合計する。
   * 戦闘不能(HP0)のキャラだけは、その本人の回復量(HP・MP分とも)を
   * まとめて1.5倍にする(他のキャラの回復量には影響しない)。 */
  function innStayCost(){
    return state.party.reduce((sum, id)=>{
      const ls = liverState(id);
      if(!ls) return sum;
      const missingHp = Math.max(0, ls.maxHp - ls.hp);
      const missingMp = Math.max(0, ls.maxMp - ls.mp);
      const charCost = Math.round((missingHp + missingMp) * (ls.hp <= 0 ? 1.5 : 1));
      return sum + charCost;
    }, 0);
  }
  function stayAtInn(){
    const cost = innStayCost();
    if(state.gold < cost || isPartyFull() || !state.party.length) return;
    state.gold -= cost;
    state.party.forEach(id=>{
      const ls = liverState(id);
      ls.hp = ls.maxHp;
      ls.mp = ls.maxMp;
    });
    pushLog('宿でぐっすり眠り、パーティの傷とMPが癒えた。', 'reward');
    saveGame(); render();
  }

  /* ---------------- 商店 ---------------- */
  /* アクセサリー・クリスタルはvalueを持たないため、レアリティとスロット
   * 数/消費数から簡易的に売却額を出す(武器・防具のitem.value*3とは別式)。 */
  function itemSellPrice(item){
    if(item.type === 'accessory' || item.type === 'crystal'){
      const rarityMult = (RARITY[item.rarity] && RARITY[item.rarity].mult) || 1;
      const sizeFactor = item.type === 'accessory' ? (item.slotCount||0) : (item.slotCost||1);
      return Math.max(1, Math.round(rarityMult*10 + sizeFactor*5));
    }
    return Math.max(1, Math.round(item.value*3));
  }
  function sellItem(id){
    const idx = state.inventory.findIndex(i=>i.id===id);
    if(idx<0) return;
    const item = state.inventory[idx];
    if(item.rarity === 'unique'){
      pushLog(`「${item.name}」は固有装備のため売却できない。`, 'system');
      render();
      return;
    }
    const price = itemSellPrice(item);
    state.gold += price;
    state.inventory.splice(idx,1);
    pushLog(`「${item.name}」を ${price}G で売却した。`, 'system');
    saveGame(); render();
  }

  /* 商店で買える固定効果のアクセサリー。錬金・(将来の)特殊ダンジョン産と
   * 違い、効果・スロット数が固定な代わりに数値は控えめ(狙った効果を
   * 確実に手に入れたい人向け)。 */
  const ACCESSORY_SHOP_DEFS = [
    { key:'shop_acc_hp',   name:'うさ耳',   effectType:'hpPct',  value:1, slotCount:0, price:300 },
    { key:'shop_acc_mp',   name:'王冠',     effectType:'mpPct',  value:1, slotCount:0, price:300 },
    { key:'shop_acc_atk',  name:'集中線',   effectType:'atkPct', value:1, slotCount:0, price:350 },
    { key:'shop_acc_def',  name:'リボン',   effectType:'defPct', value:1, slotCount:0, price:350 },
    { key:'shop_acc_drop', name:'猫耳',     effectType:'dropRate', value:1, slotCount:1, price:450 },
  ];
  function buyAccessoryFromShop(key){
    const def = ACCESSORY_SHOP_DEFS.find(d=>d.key===key);
    if(!def || state.gold < def.price) return;
    state.gold -= def.price;
    addItemToInventory({
      id: 'itm_'+Math.random().toString(36).slice(2,9),
      type:'accessory', rarity:'common', rarityLabel:'common',
      name: def.name,
      mainEffect: { type: def.effectType, value: def.value },
      slotCount: def.slotCount,
      crystals: []
    });
    pushLog(`「${def.name}」を購入した。`, 'reward');
    saveGame(); render();
  }

  function toolSellPrice(key){
    return Math.max(1, Math.round(TOOL_DEFS[key].price/3));
  }
  function buyToolItem(key){
    const def = TOOL_DEFS[key];
    if(!def || !def.purchasable) return;
    if(state.gold < def.price) return;
    state.gold -= def.price;
    if(!state.tools) state.tools = {};
    state.tools[key] = toolCount(key) + 1;
    pushLog(`「${def.name}」を購入した。`, 'reward');
    saveGame(); render();
  }
  function sellToolItem(key){
    const def = TOOL_DEFS[key];
    if(!def || toolCount(key) < 1) return;
    const price = toolSellPrice(key);
    state.tools[key] = toolCount(key) - 1;
    state.gold += price;
    pushLog(`「${def.name}」を ${price}G で売却した。`, 'system');
    saveGame(); render();
  }

  /* PC(901px以上)ではstate.log(バトルログ抜き・最大6件)をそのまま
   * メインウィンドウに出す。モバイル(900px以下)は冒険の記録・チャット欄が
   * 画面下部に固定されず、スクロールしないと見えないため、バトルログを
   * 含む直近の詳細(state.history、常に全件保持)をメインウィンドウ内にも
   * 表示する。どちらか一方をCSSの@mediaで出し分けるだけなので、表示側で
   * 画面幅を見て切り替わり、プッシュ時点の画面幅には依存しない。
   * モバイルは基本最大5行だが、戦闘勝利時のドロップなど1回のアクションで
   * 5行を超えるまとまり(batch)が発生した場合はそちらを優先し、まとまり
   * ごと表示する(直近のまとまりが5行未満なら、5行になるよう1つ前の
   * まとまりから補って表示する)。 */
  function renderLog(emptyText){
    const emptyHtml = emptyText ? `<p class="log-entry system">${esc(emptyText)}</p>` : '';
    const desktopEntries = state.log;
    const history = state.history || [];
    let latestBatchEntries = [];
    if(history.length){
      const latestBatch = history[history.length-1].batch;
      let i = history.length-1;
      while(i>=0 && history[i].batch===latestBatch){ latestBatchEntries.unshift(history[i]); i--; }
    }
    const mobileEntries = latestBatchEntries.length >= 5 ? latestBatchEntries : history.slice(-5);
    const desktopHtml = desktopEntries.length
      ? desktopEntries.map(l=>`<p class="log-entry ${l.cls}">${esc(l.text)}</p>`).join('')
      : emptyHtml;
    const mobileHtml = mobileEntries.length
      ? mobileEntries.map(l=>`<p class="log-entry ${l.cls}">${esc(l.text)}</p>`).join('')
      : emptyHtml;
    return `<div class="log-desktop-only">${desktopHtml}</div><div class="log-mobile-only">${mobileHtml}</div>`;
  }

  function helpButtonHtml(topicKey){
    if(!HELP_TEXTS[topicKey]) return '';
    return `<button class="help-btn" data-open-help="${topicKey}" title="このコンテンツについて">${uiIcon('help')}</button>`;
  }
  function openHelpPopup(topicKey){
    if(!state || !state.ui || !HELP_TEXTS[topicKey]) return;
    state.ui.helpTopicKey = topicKey;
    render();
  }
  function closeHelpPopup(){
    if(!state || !state.ui) return;
    state.ui.helpTopicKey = null;
    render();
  }
  function renderHelpPopup(){
    const key = state && state.ui ? state.ui.helpTopicKey : null;
    const texts = key && HELP_TEXTS[key];
    if(!texts) return '';
    const bodyHtml = texts.map(t=>`<p class="log-entry system">${t}</p>`).join('');
    return `
      <div class="help-popup-backdrop" id="helpPopupBackdrop">
        <div class="help-popup">
          ${bodyHtml}
          <div class="actions" style="justify-content:center;margin-top:14px;">
            <button class="primary" id="helpPopupCloseBtn">閉じる</button>
          </div>
        </div>
      </div>`;
  }

  function renderStaminaPopup(){
    if(!state || !state.ui || !state.ui.staminaPopupOpen) return '';
    const potionDef = TOOL_DEFS.stamina_potion_10;
    const potionCount = toolCount('stamina_potion_10');
    const full = state.stamina >= STAMINA_MAX;
    return `
      <div class="help-popup-backdrop" id="staminaPopupBackdrop">
        <div class="help-popup">
          <p class="section-label" style="margin-top:0;">スタミナ回復</p>
          <p class="log-entry system" style="margin:0 0 10px;">現在 ${state.stamina}/${STAMINA_MAX}</p>
          <div class="market-popup-row">
            <span>${esc(potionDef.name)} (所持数${potionCount})</span>
            <button id="staminaUsePotionBtn" ${(potionCount<1||full)?'disabled':''}>使う(+10)</button>
          </div>
          <div class="market-popup-row" style="border-bottom:none;">
            <span>広告を見て回復</span>
            <button id="staminaWatchAdBtn" ${(full||staminaAdWatching)?'disabled':''}>${staminaAdWatching?'視聴中…':`広告を見る(+${STAMINA_AD_RECOVER_AMOUNT})`}</button>
          </div>
          <p style="color:var(--text-muted);font-size:11px;margin:6px 0 0;">※広告視聴は現在仮の演出です。実際の広告は後日導入予定。</p>
          <div class="actions" style="justify-content:center;margin-top:14px;">
            <button id="staminaPopupCloseBtn">閉じる</button>
          </div>
        </div>
      </div>`;
  }

  function toggleGroup(groupId){
    if(!state.ui) state.ui = {expandedGroups:[]};
    const idx = state.ui.expandedGroups.indexOf(groupId);
    if(idx>=0) state.ui.expandedGroups.splice(idx,1);
    else state.ui.expandedGroups.push(groupId);
    saveGame(); render();
  }

  function renderDungeonGroups(){
    const groups = [];
    const seen = {};
    visibleDungeonDefs().forEach(def=>{
      if(!seen[def.group]){
        seen[def.group] = {id:def.group, name:def.groupName, defs:[]};
        groups.push(seen[def.group]);
      }
      seen[def.group].defs.push(def);
    });

    return groups.map(g=>{
      const total = g.defs.length;
      const clearedCount = g.defs.filter(d=>state.dungeons[d.id].cleared).length;
      const expanded = !!(state.ui && state.ui.expandedGroups.includes(g.id));
      const rows = g.defs.map(def=>{
        const unlocked = isDungeonUnlocked(def.id);
        const ds = state.dungeons[def.id];
        const status = !unlocked
          ? `${uiIcon('lock')} 未解放`
          : ds.cleared
            ? '踏破済み'
            : `踏破率 ${ds.progress}%`;
        const label = def.floorLabel ? `${def.floorLabel}` : def.name;
        return `
          <div class="inv-item" style="${unlocked?'':'opacity:.55;'}">
            <span class="inv-item-name">${esc(label)} <span style="color:var(--gold);font-family:var(--font-mono);font-size:11px;">Lv.${def.level}</span><br><span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${status}</span></span>
            <span class="inv-item-actions">${unlocked ? `<button data-enter-dungeon="${def.id}">入る</button>` : ''}</span>
          </div>`;
      }).join('');

      return `
        <div style="margin-bottom:8px;">
          <button data-toggle-group="${esc(g.id)}" style="width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;">
            <span>${expanded?'▼':'▶'} ${esc(g.name)}</span>
            <span style="font-family:var(--font-mono);font-size:11px;color:var(--gold);">${clearedCount}/${total}</span>
          </button>
          ${expanded ? `<div style="margin-top:8px;">${rows}</div>` : ''}
        </div>`;
    }).join('');
  }

  function renderDungeonInner(){
    const dungeonDef = currentDungeonDef();
    const ds = currentDungeonState();
    if(inCombat){
      const hpPct = Math.max(0,Math.round(combatEnemyHp/combatEnemy._maxHp*100));
      const weaknessLabel = combatEnemy.weakness ? (ELEMENT_LABELS[combatEnemy.weakness]||'?') : '不明';
      const actionsHtml = combatPhase === 'choice'
        ? `
          <div class="actions">
            <button class="primary" id="fightBtn">戦う</button>
            <button class="danger" id="fleeBtn">逃げる</button>
          </div>`
        : `<div class="actions"><button disabled>戦闘中…</button></div>`;
      return `
        <div class="scene-text">
          ${sceneHeadingHtml(dungeonDef.name, renderSceneProgressBadge())}
          ${actionsHtml}
          <p class="log-entry" style="font-family:var(--font-mono);font-size:13px;color:var(--text-muted);margin-top:16px;">
            Lv.${combatEnemy.level} ${esc(combatEnemy.name)} — HP ${Math.max(0,combatEnemyHp)}/${combatEnemy._maxHp} ・ 弱点属性: ${esc(weaknessLabel)}
          </p>
          <div class="bar-track" style="margin-bottom:6px;"><div class="bar-fill" style="width:${hpPct}%;background:linear-gradient(90deg,#c62f2f,var(--hp-red));height:100%;"></div></div>
          <div style="margin-bottom:14px;">${renderStatusEffectChips(combatEnemy.statusEffects)}</div>
          ${renderLog()}
        </div>`;
    }

    const bossReady = ds.progress >= 100;
    const isTutorial = dungeonDef.id === 'tutorial';
    const isPrism = !!dungeonDef.isPrismTower;
    // プリズムタワーは突入時にスタミナを前払い済みのため、探索中はスタミナ切れで
    // 止まらない(進行可否はパーティの生存状況だけで決める)。
    const advDisabled = !alivePartyIds().length || (!isPrism && state.stamina<1);
    const actionsHtml = `
      <div class="actions">
        ${(bossReady && (isTutorial || isPrism)) ? '' : `<button class="primary" id="advBtn" ${advDisabled?'disabled':''}>奥へ進む</button>`}
        ${bossReady ? `<button class="danger" id="bossBtn" ${advDisabled?'disabled':''}>${ds.cleared ? 'ボスに再挑戦' : 'ボスに挑む'}</button>` : ''}
        ${isTutorial ? '' : (isPrism ? `<button id="leavePrismBtn">撤退する</button>` : `<button id="backTownBtn">町に戻る</button>`)}
      </div>`;
    return `
      <div class="scene-text">
        ${sceneHeadingHtml(dungeonDef.name, renderSceneProgressBadge())}
        ${actionsHtml}
        <div style="margin-top:16px;">
          ${renderLog('静寂が続いている……')}
        </div>
      </div>`;
  }

  function renderTownInner(){
    return `
      <div class="scene-text">

  function renderRiftInner(){

      </div>
      <div class="actions">
        <button id="backTownBtn">町に戻る</button>
        <button class="danger" id="riftEnterBtn" ${(!state.party.length || state.stamina<RIFT_STAMINA_COST)?'disabled':''}>突入する(25分・スタミナ${RIFT_STAMINA_COST}消費)</button>
      </div>
      <div class="section-block">
        <p class="section-label">挑むパーティ</p>
        ${partyRowsHtml || '<p class="inv-empty">パーティが編成されていない。</p>'}
      </div>
    `;

  function renderTowerSelectInner(){
    const globallyUnlocked = towersGloballyUnlocked();
    const gateDungeonName = dungeonDefById(TOWER_UNLOCK_DUNGEON_ID).groupName;
    const towerRows = TOWER_DEFS.map(def=>{
      const accessible = isTowerAccessible(def);
      let actionHtml;
      if(!globallyUnlocked){
        actionHtml = `<span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${uiIcon('lock')} 「${esc(gateDungeonName)}」踏破で解放</span>`;
      } else if(!accessible){
        const reqDef = towerDefById(def.requires.towerId);
        actionHtml = `<span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${uiIcon('lock')} ${esc(reqDef.name)} ${def.requires.floor}F踏破で解放</span>`;
      } else {
        actionHtml = `<button data-enter-tower="${def.id}" ${(!state.party.length || state.stamina<TOWER_ENTRY_STAMINA_COST)?'disabled':''}>挑む(スタミナ${TOWER_ENTRY_STAMINA_COST}消費)</button>`;
      }
      return `
      <div class="inv-item" style="${accessible?'':'opacity:.65;'}">
        <span class="inv-item-name">${esc(def.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">(${esc(def.color)}・${ELEMENT_LABELS[def.element]}属性)</span></span>
        <span class="inv-item-actions">${actionHtml}</span>
      </div>`;
    }).join('');
    const lockedRows = Array.from({length: Math.max(0, 7 - TOWER_DEFS.length)}).map(()=>`
      <div class="inv-item" style="opacity:.55;">
        <span class="inv-item-name">？？？の塔 <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">近日追加予定</span></span>
      </div>`).join('');
    return `
      <div class="scene-text">
        ${sceneHeadingHtml('七彩の塔', helpButtonHtml('towerSelect'))}
        ${!globallyUnlocked ? `<p class="log-entry danger">「${esc(gateDungeonName)}」を踏破すると、この場所そのものが解放される。</p>` : ''}
      </div>
      <div class="actions">
        <button id="backTownBtn">町に戻る</button>
      </div>
      <div class="section-block">
        ${towerRows}
        ${lockedRows}
      </div>
    `;
  }

  function renderTowerRunInner(){
    const def = currentTowerDef();
    const floor = state.towerRun.floor;
    if(inCombat){
      const hpPct = Math.max(0,Math.round(combatEnemyHp/combatEnemy._maxHp*100));
      const weaknessLabel = combatEnemy.weakness ? (ELEMENT_LABELS[combatEnemy.weakness]||'?') : '不明';
      const actionsHtml = combatPhase === 'choice'
        ? `
          <div class="actions">
            <button class="primary" id="fightBtn">戦う</button>
            <button class="danger" id="fleeBtn">逃げる</button>
          </div>`
        : `<div class="actions"><button disabled>戦闘中…</button></div>`;
      return `
        <div class="scene-text">
          ${sceneHeadingHtml(def.name, `<span style="float:right;color:var(--gold);font-family:var(--font-mono);font-size:12px;">${floor}F</span>`)}
          ${actionsHtml}
          <p class="log-entry" style="font-family:var(--font-mono);font-size:13px;color:var(--text-muted);margin-top:16px;">
            Lv.${combatEnemy.level} ${esc(combatEnemy.name)} — HP ${Math.max(0,combatEnemyHp)}/${combatEnemy._maxHp} ・ 弱点属性: ${esc(weaknessLabel)}
          </p>
          <div class="bar-track" style="margin-bottom:6px;"><div class="bar-fill" style="width:${hpPct}%;background:linear-gradient(90deg,#c62f2f,var(--hp-red));height:100%;"></div></div>
          <div style="margin-bottom:14px;">${renderStatusEffectChips(combatEnemy.statusEffects)}</div>
          ${renderLog()}
        </div>`;
    }
    const nextFloor = floor + 1;
    const nextIsBoss = isTowerBossFloor(nextFloor);
    return `
      <div class="scene-text">
        ${sceneHeadingHtml(def.name, `<span style="float:right;color:var(--gold);font-family:var(--font-mono);font-size:12px;">${floor}/${TOWER_MAX_FLOOR}F</span>`)}
        <div class="actions">
          <button class="primary" id="towerAdvanceBtn" ${(!alivePartyIds().length)?'disabled':''}>${nextIsBoss ? `${nextFloor}Fのボスに挑む` : '進む'}</button>
          <button class="danger" id="towerRetreatBtn">撤退する</button>
        </div>
        <div style="margin-top:16px;">
          ${renderLog('静寂が続いている……')}
        </div>
      </div>`;
  }

  function renderTowerResultInner(){
    const result = state.lastTowerResult;
    if(!result) return renderTownInner();
    const def = towerDefById(result.towerId);
    const r = result.rewards;
    const equipLine = r.equipment
      ? `<p class="log-entry reward">限定装備「${esc(r.equipment.name)}」を手に入れた！</p>`
      : '';
    const materialLine = r.exclusiveMaterialCount>0
      ? `<p class="log-entry reward">「${esc(MATERIAL_DEFS[def.exclusiveMaterialKey].name)}」を${r.exclusiveMaterialCount}個手に入れた！</p>`
      : '';
    const crystalLine = `<p class="log-entry reward">「${esc(MATERIAL_DEFS[def.crystalKey].name)}」を${r.crystalCount}個手に入れた。</p>`;
    const titleText = result.reason === 'clear'
      ? `${def.name}を完全踏破した！`
      : result.reason === 'retreat'
        ? `${def.name} ${result.floor}Fで撤退した`
        : `${def.name} ${result.floor}Fで力尽きた……`;
    return `
      <div class="scene-text" style="text-align:center;padding:24px 0 8px;">
        <p style="font-family:var(--font-display);font-weight:700;font-size:24px;color:${result.reason==='clear'?'var(--gold)':'var(--danger)'};text-shadow:2px 2px 0 #2c5c2c;margin:0 0 16px;">
          ${esc(titleText)}
        </p>
        <div style="text-align:left;display:inline-block;">
          ${equipLine}
          ${materialLine}
          ${crystalLine}
        </div>
      </div>
      <div class="actions" style="justify-content:center;">
        <button class="primary" id="towerResultCloseBtn">街に戻る</button>
      </div>
    `;
  }

  /* 素材ダンジョン一覧画面。現状はプリズムタワーのみを収録するが、
   * 今後別のダンジョンを追加する余地を持たせて「カテゴリ画面」として
   * 独立させてある(七彩の塔のtowerSelect画面と同じ位置づけ)。 */
  function renderMaterialDungeonsInner(){
    const rows = visiblePrismDefs().map(def=>{
      const unlocked = isDungeonUnlocked(def.id);
      const ds = state.dungeons[def.id];
      const status = !unlocked
        ? `${uiIcon('lock')} 未解放`
        : `踏破率 ${dungeonProgressLabelAndPct(ds).label}`;
      const cost = def.floorNum * 10;
      const actionHtml = unlocked
        ? `<button data-enter-prism="${def.id}" ${(!state.party.length || state.stamina<cost)?'disabled':''}>入る(スタミナ${cost}消費)</button>`
        : '';
      return `
        <div class="inv-item" style="${unlocked?'':'opacity:.55;'}">
          <span class="inv-item-name">${esc(def.floorLabel)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${status}</span></span>
          <span class="inv-item-actions">${actionHtml}</span>
        </div>`;
    }).join('');
    return `
      <div class="scene-text">
        ${sceneHeadingHtml('素材ダンジョン', helpButtonHtml('materialDungeons'))}
      </div>
      <div class="actions">
        <button id="backTownBtn">町に戻る</button>
      </div>
      <div class="section-block">
        <p class="section-label">プリズムタワー</p>
        ${rows}
      </div>
    `;
  }

  /* ライバーダンジョン(固有装備クエスト)一覧画面。ライバーごとにグループ
   * 分けし、各クエストの必要戦闘力・現在の戦闘力・クリア状況・挑戦ボタン
   * を表示する。戦闘中は素材ダンジョンと同様、この画面のまま戦闘UIに
   * 差し替える(renderDungeonInnerのif(inCombat)ブロックと同じ構造)。 */
  /* ライバー選択画面(トップ)。ライバーダンジョンを持つライバーだけを
   * 一覧表示し、現在の戦闘力とそのライバーの通算クリア数(◯/◯)を
   * 添えて、ボタンで個別のダンジョン画面に入る。 */
  function renderLiverQuestSelectInner(){
    const rows = LIVER_DEFS_BY_DEBUT.filter(def=>liverHasDungeonLines(def.id)).map(def=>{
      const ls = liverState(def.id);
      const unlocked = ls && ls.unlocked;
      const statusHtml = unlocked
        ? `<span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">戦闘力 ${combatPower(def.id)} ・ クリア ${liverDungeonClearedCount(def.id)}/${liverDungeonTotalCount(def.id)}</span>`
        : `<span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${uiIcon('lock')} 未解放</span>`;
      return `
        <div class="inv-item" style="${unlocked?'':'opacity:.55;'}">
          <span class="inv-item-name">${esc(def.name)}<br>${statusHtml}</span>
          <span class="inv-item-actions"><button data-open-liver-dungeon="${def.id}" ${unlocked?'':'disabled'}>開く</button></span>
        </div>`;
    }).join('');

    return `
      <div class="scene-text">
        ${sceneHeadingHtml('ライバーダンジョン', helpButtonHtml('liverQuests'))}
      </div>
      <div class="actions">
        <button id="backTownBtn">町に戻る</button>
      </div>
      <div class="section-block">
        ${rows || `<p class="inv-empty">挑戦できるライバーダンジョンが無い。</p>`}
      </div>
    `;

  /* 個別ライバーのダンジョン画面。武器/防具/アクセサリーのタブで系統を
   * 切り替え、その系統の1〜5段階を縦に並べる。1段階目は固有装備、
   * 2〜5段階目は強化素材が報酬(周回可能)。 */
  function renderLiverQuestsInner(){
    if(inCombat && combatEnemy && combatEnemy.isLiverQuest){
      const stage = liverDungeonStageById(combatEnemy.liverQuestId);
      const hpPct = Math.max(0,Math.round(combatEnemyHp/combatEnemy._maxHp*100));
      const weaknessLabel = combatEnemy.weakness ? (ELEMENT_LABELS[combatEnemy.weakness]||'?') : '不明';
      const actionsHtml = combatPhase === 'choice'
        ? `
          <div class="actions">
            <button class="primary" id="fightBtn">戦う</button>
            <button class="danger" id="fleeBtn">逃げる</button>
          </div>`
        : `<div class="actions"><button disabled>戦闘中…</button></div>`;
      return `
        <div class="scene-text">
          ${sceneHeadingHtml(stage.line.lineName, `<span style="float:right;color:var(--gold);font-family:var(--font-mono);font-size:12px;">${stage.depth}/${LIVER_DUNGEON_STAGE_COUNT}</span>`)}
          ${actionsHtml}
          <p class="log-entry" style="font-family:var(--font-mono);font-size:13px;color:var(--text-muted);margin-top:16px;">
            Lv.${combatEnemy.level} ${esc(combatEnemy.name)} — HP ${Math.max(0,combatEnemyHp)}/${combatEnemy._maxHp} ・ 弱点属性: ${esc(weaknessLabel)}
          </p>
          <div class="bar-track" style="margin-bottom:6px;"><div class="bar-fill" style="width:${hpPct}%;background:linear-gradient(90deg,#c62f2f,var(--hp-red));height:100%;"></div></div>
          <div style="margin-bottom:14px;">${renderStatusEffectChips(combatEnemy.statusEffects)}</div>
          ${renderLog()}
        </div>`;
    }

    const liverId = state.ui.liverDungeonLiverId;
    const def = liverId && liverDef(liverId);
    if(!def || !liverHasDungeonLines(liverId)) return renderLiverQuestSelectInner();

    const slotTab = ['weapon','armor','accessory'].includes(state.ui.liverDungeonSlotTab) ? state.ui.liverDungeonSlotTab : 'weapon';
    const inParty = state.party.includes(liverId);
    const cp = combatPower(liverId);

    const rows = liverDungeonStagesFor(liverId, slotTab).map(stage=>{
      const ds = state.dungeons[stage.id];
      const cleared = ds && ds.cleared;
      const challengeable = isLiverDungeonStageChallengeable(stage);
      const statusHtml = !inParty
        ? `<span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(def.name)}をパーティに編成すると挑戦可能</span>`
        : `<span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">必要戦闘力 ${stage.requiredCP}(現在 ${cp})${cleared?' ・ クリア済み':''}</span>`;
      const rewardLabel = stage.depth === 1 ? '固有装備' : `強化素材 x${stage.materialQty}`;
      const btnHtml = `<button data-challenge-liver-quest="${stage.id}" ${challengeable ? '' : 'disabled'}>${cleared ? '再挑戦' : '挑戦する'}</button>`;
      return `
        <div class="inv-item" style="${challengeable||cleared?'':'opacity:.65;'}">
          <span class="inv-item-name">${stage.depth}段階目 <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">[${esc(rewardLabel)}]</span><br>${statusHtml}</span>
          <span class="inv-item-actions">${btnHtml}</span>
        </div>`;
    }).join('');

    return `
      <div class="scene-text">
        ${sceneHeadingHtml(`${def.name}のライバーダンジョン`, helpButtonHtml('liverQuests'))}
      </div>
      <div class="actions">
        <button id="backLiverDungeonSelectBtn">ライバー一覧に戻る</button>
      </div>
      <div class="tab-strip">
        <button data-liver-dungeon-slot-tab="weapon" class="${slotTab==='weapon'?'active':''}">武器</button>
        <button data-liver-dungeon-slot-tab="armor" class="${slotTab==='armor'?'active':''}">防具</button>
        <button data-liver-dungeon-slot-tab="accessory" class="${slotTab==='accessory'?'active':''}">アクセサリー</button>
      </div>
      <div class="section-block">
        ${rows}
      </div>
    `;
  }

  /* ---------------------------------------------------------------
   * マーケット: ユーザー間でのアイテム売買。出品・購入自体はサーバー側
   * (SECURITY DEFINERのRPC)で他プレイヤーとの整合性を取るため、
   * 通常の所持品操作と違いRPCの戻り値(処理後の権威ある値)をそのまま
   * state.gold/materials/tools/inventoryに反映する(差分加算はしない)。
   * こうしないと、この直後に走る通常のsaveGame(state全体を上書き保存)
   * が、他プレイヤーの購入で増えた分・出品で減った分を古いローカル値で
   * 巻き戻してしまう恐れがあるため。
   *
   * 出品中の一覧・購入可能な一覧はプレイヤー自身のstateの一部ではない
   * (他プレイヤーの出品も見えるサーバー側の共有データ)ため、
   * ランキングと同様にstate外のモジュール変数(marketData)で持ち、
   * 画面を開くたび・操作するたびに読み直す。
   * --------------------------------------------------------------- */
  const MARKET_EQUIP_SORT_OPTIONS = [
    { value:'rarity_desc', label:'レアリティ順(降順)' },
    { value:'rarity_asc',  label:'レアリティ順(昇順)' },
    { value:'listed_desc', label:'出品順(新しい順)' },
    { value:'listed_asc',  label:'出品順(古い順)' },
  ];
  function sortMarketEquipListings(list, mode){
    const sorted = [...list];
    if(mode === 'rarity_asc') sorted.sort((a,b)=>(MARKET_EQUIP_RARITY_RANK[a.item_snapshot.rarity]||0)-(MARKET_EQUIP_RARITY_RANK[b.item_snapshot.rarity]||0));
    else if(mode === 'rarity_desc') sorted.sort((a,b)=>(MARKET_EQUIP_RARITY_RANK[b.item_snapshot.rarity]||0)-(MARKET_EQUIP_RARITY_RANK[a.item_snapshot.rarity]||0));
    else if(mode === 'listed_asc') sorted.sort((a,b)=>new Date(a.listed_at)-new Date(b.listed_at));
    else sorted.sort((a,b)=>new Date(b.listed_at)-new Date(a.listed_at));
    return sorted;
  }

  /* market_listings行のitem_snapshot(DBの列名そのまま)を、既存の
   * itemDetailText/itemValueLabelがそのまま使えるクライアント側の
   * アイテム形(loadGame()での変換と同じ形)に直す。 */
  function marketItemFromSnapshot(snap){
    const item = {
      id: snap.id, type: snap.item_type, name: snap.name,
      rarity: snap.rarity, rarityLabel: snap.rarity, value: snap.value,
      resist: snap.resist_element ? { element: snap.resist_element, value: snap.resist_value } : null,
      weaponType: snap.weapon_type || null,
      affix: snap.affix || null,
      enhanceLevel: snap.enhance_level || 0
    };
    if(snap.item_type === 'accessory'){
      item.mainEffect = snap.effect_type ? { type: snap.effect_type, value: snap.effect_value } : null;
      item.slotCount = snap.slot_count || 0;
      item.crystals = [];
    } else if(snap.item_type === 'crystal'){
      item.effect = snap.effect_type ? { type: snap.effect_type, value: snap.effect_value } : null;
      item.slotCost = snap.slot_cost || 1;
    }
    return item;
  }
  function applyMarketItemSnapshotToInventory(snap){
    state.inventory.push(marketItemFromSnapshot(snap));
  }
  function formatMarketRemaining(expiresAtIso){
    const remainMs = new Date(expiresAtIso).getTime() - Date.now();
    if(remainMs <= 0) return '受け取り待ち';
    return `残り${Math.ceil(remainMs / 3600000)}時間`;
  }
  function aggregateStackListings(listings){
    const map = new Map();
    listings.forEach(row=>{
      const k = row.bucket + ':' + row.material_key;
      if(!map.has(k)) map.set(k, { bucket: row.bucket, key: row.material_key, name: marketStackName(row.bucket, row.material_key), totalQty:0, minPrice: Infinity });
      const agg = map.get(k);
      agg.totalQty += row.quantity;
      agg.minPrice = Math.min(agg.minPrice, row.price_per_unit);
    });
    return Array.from(map.values());
  }

  let marketData = null; // { loading, stackListings, equipListings, myListings, error } | null

  async function refreshMarketData(){
    marketData = { loading:true, stackListings:[], equipListings:[], myListings:[], error:false };
    render();
    try{
      const uid = await ensureAuth();
      const nowIso = new Date().toISOString();
      const [stackRes, equipRes, mineRes] = await Promise.all([
        sb.from('market_listings').select('*').eq('kind','stack').eq('status','active').gt('expires_at', nowIso),
        sb.from('market_listings').select('*').eq('kind','equipment').eq('status','active').gt('expires_at', nowIso),
        sb.from('market_listings').select('*').eq('seller_id', uid).eq('status','active')
      ]);
      if(stackRes.error) throw stackRes.error;
      if(equipRes.error) throw equipRes.error;
      if(mineRes.error) throw mineRes.error;
      marketData = {
        loading:false,
        stackListings: stackRes.data || [],
        equipListings: equipRes.data || [],
        myListings: mineRes.data || [],
        error:false
      };
    }catch(e){
      console.error('market fetch failed', e);
      marketData = { loading:false, stackListings:[], equipListings:[], myListings:[], error:true };
    }
    render();
  }

  async function claimMarketGold(){
    try{
      const { data, error } = await sb.rpc('claim_market_mailbox');
      if(error){ console.error('claim market mailbox failed', error); return; }
      const newGold = data;
      if(typeof newGold === 'number' && newGold !== state.gold){
        const gained = newGold - state.gold;
        state.gold = newGold;
        if(gained > 0) pushLog(`マーケットでの売上として、ゴールドを${gained}枚受け取った。`, 'reward');
        saveGame(); render();
      }
    }catch(e){ console.error('claim market mailbox failed', e); }
  }

  async function claimExpiredMarketListings(){
    try{
      const { data, error } = await sb.rpc('market_claim_expired');
      if(error){ console.error('claim expired listings failed', error); return; }
      const results = data || [];
      if(!results.length) return;
      results.forEach(r=>{
        if(r.kind === 'equipment'){
          applyMarketItemSnapshotToInventory(r.item);
          pushLog(`出品期限切れの「${r.item.name}」が戻ってきた。`, 'system');
        } else {
          if(r.bucket === 'materials') state.materials[r.material_key] = r.new_qty;
          else state.tools[r.material_key] = r.new_qty;
          pushLog(`出品期限切れの「${marketStackName(r.bucket, r.material_key)}」が戻ってきた。`, 'system');
        }
      });
      saveGame(); render();
    }catch(e){ console.error('claim expired listings failed', e); }
  }

    state.ui.marketPopup = null;
    saveGame(); render();
    await claimMarketGold();
    await claimExpiredMarketListings();

  function openMarketSellStackPopup(bucket, key){
    const owned = bucket === 'materials' ? materialCount(key) : toolCount(key);
    if(owned <= 0) return;
    const rows = marketData ? marketData.stackListings.filter(r=>r.bucket===bucket && r.material_key===key) : [];
    const lowest = rows.length ? Math.min(...rows.map(r=>r.price_per_unit)) : null;
    openMarketPopup({ type:'sellStack', bucket, key, name: marketStackName(bucket, key), owned, lowest });
  }

    if(!item || !marketEquipEligible(item)) return;

  async function confirmMarketBuyStack(){
    const popup = state.ui && state.ui.marketPopup;
    if(!popup || popup.type !== 'buyStack') return;
    const qtyInput = document.getElementById('marketPopupQty');
    const qty = qtyInput ? Math.max(1, Math.min(popup.stock, Math.floor(Number(qtyInput.value)||0))) : 0;
    if(qty <= 0) return;
    const total = qty * popup.price;
    if(total > state.gold) return;
    try{
      const { data, error } = await sb.rpc('market_buy_stack', {
        p_material_key: popup.key, p_bucket: popup.bucket, p_price_per_unit: popup.price, p_quantity: qty
      });
      if(error){
        pushLog(`購入に失敗した(出品状況が変わった可能性がある): ${error.message}`, 'danger');
        closeMarketPopup(); await refreshMarketData(); return;
      }
      state.gold = data.new_gold;
      if(popup.bucket === 'materials') state.materials[popup.key] = data.new_qty;
      else state.tools[popup.key] = data.new_qty;
      pushLog(`「${popup.name}」を${qty}個購入した(${total}G)。`, 'reward');
      closeMarketPopup();
      saveGame();
      await refreshMarketData();
    }catch(e){
      console.error('buy stack failed', e);
      pushLog('購入に失敗した。時間をおいて試してみてほしい。', 'danger');
    }
  }
  async function confirmMarketBuyEquip(){
    const popup = state.ui && state.ui.marketPopup;
    if(!popup || popup.type !== 'buyEquip') return;
    if(popup.price > state.gold) return;
    try{
      const { data, error } = await sb.rpc('market_buy_item', { p_listing_id: popup.listingId });
      if(error){
        pushLog(`購入に失敗した(先に売れてしまった可能性がある): ${error.message}`, 'danger');
        closeMarketPopup(); await refreshMarketData(); return;
      }
      state.gold = data.new_gold;
      applyMarketItemSnapshotToInventory(data.item);
      pushLog(`「${data.item.name}」を購入した(${popup.price}G)。`, 'reward');
      closeMarketPopup();
      saveGame();
      await refreshMarketData();
    }catch(e){
      console.error('buy item failed', e);
      pushLog('購入に失敗した。時間をおいて試してみてほしい。', 'danger');
    }
  }
  async function confirmMarketSellStack(){
    const popup = state.ui && state.ui.marketPopup;
    if(!popup || popup.type !== 'sellStack') return;
    const priceInput = document.getElementById('marketSellStackPrice');
    const qtyInput = document.getElementById('marketSellStackQty');
    const price = priceInput ? Math.floor(Number(priceInput.value)||0) : 0;
    const qty = qtyInput ? Math.max(1, Math.min(popup.owned, Math.floor(Number(qtyInput.value)||0))) : 0;
    if(qty <= 0) return;
    if(price < MARKET_MIN_PRICE){
      pushLog(`単価は${MARKET_MIN_PRICE}G以上にしてほしい。`, 'danger');
      render();
      return;
    }
    try{
      const { data, error } = await sb.rpc('market_list_stack', {
        p_material_key: popup.key, p_bucket: popup.bucket, p_quantity: qty, p_price_per_unit: price
      });
      if(error){ pushLog(`出品に失敗した: ${error.message}`, 'danger'); return; }
      if(popup.bucket === 'materials') state.materials[popup.key] = data;
      else state.tools[popup.key] = data;
      pushLog(`「${popup.name}」を${qty}個(単価${price}G)出品した。`, 'system');
      closeMarketPopup();
      saveGame();
      await refreshMarketData();
    }catch(e){
      console.error('list stack failed', e);
      pushLog('出品に失敗した。時間をおいて試してみてほしい。', 'danger');
    }
  }
  async function confirmMarketSellEquip(){
    const popup = state.ui && state.ui.marketPopup;
    if(!popup || popup.type !== 'sellEquip') return;
    const priceInput = document.getElementById('marketSellEquipPrice');
    const price = priceInput ? Math.floor(Number(priceInput.value)||0) : 0;
    if(price < MARKET_MIN_PRICE){
      pushLog(`単価は${MARKET_MIN_PRICE}G以上にしてほしい。`, 'danger');
      render();
      return;
    }
    try{
      const { error } = await sb.rpc('market_list_item', { p_item_id: popup.item.id, p_price: price });
      if(error){ pushLog(`出品に失敗した: ${error.message}`, 'danger'); return; }
      state.inventory = state.inventory.filter(i=>i.id !== popup.item.id);
      pushLog(`「${popup.item.name}」を${price}Gで出品した。`, 'system');
      closeMarketPopup();
      saveGame();
      await refreshMarketData();
    }catch(e){
      console.error('list item failed', e);
      pushLog('出品に失敗した。時間をおいて試してみてほしい。', 'danger');
    }
  }
  async function cancelMarketListing(listingId){
    try{
      const { data, error } = await sb.rpc('market_cancel_listing', { p_listing_id: listingId });
      if(error){ pushLog(`出品の取り消しに失敗した: ${error.message}`, 'danger'); return; }
      if(data.kind === 'equipment'){
        applyMarketItemSnapshotToInventory(data.item);
        pushLog(`「${data.item.name}」の出品を取り消した。`, 'system');
      } else {
        if(data.bucket === 'materials') state.materials[data.material_key] = data.new_qty;
        else state.tools[data.material_key] = data.new_qty;
        pushLog(`「${marketStackName(data.bucket, data.material_key)}」の出品を取り消した。`, 'system');
      }
      saveGame();
      await refreshMarketData();
    }catch(e){
      console.error('cancel listing failed', e);
      pushLog('出品の取り消しに失敗した。時間をおいて試してみてほしい。', 'danger');
    }
  }

  /* ---------------------------------------------------------------
   * マーケットの売却通知。ログに流れて消えると気付けないため、
   * 「冒険の記録」欄に総合チャットなどと並ぶ専用タブ(マーケット)を
   * 用意し、そこに売却履歴を残す。町のマーケットボタン・このタブ両方に
   * 未読件数バッジを出す(お知らせのバッジと同じ考え方)。
   * バッジの基準はplayers.market_last_seen_at(最後にタブを開いた時刻)。
   * --------------------------------------------------------------- */
  let marketNotifications = null; // { loading, items } | null
  let marketUnseenCount = 0;

  function formatNotificationDateTime(iso){
    const d = new Date(iso);
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }
  function marketNotificationText(n){
    const name = n.kind === 'equipment' ? n.item_name : marketStackName(n.bucket, n.material_key);
    const countLabel = n.kind === 'equipment' ? '' : `×${n.quantity}`;
    if(n.event === 'listed'){
      return `「${name}」${countLabel}を単価${n.price_per_unit}Gで出品した。`;
    }
    if(n.event === 'expired'){
      return `「${name}」${countLabel}の出品が72時間経過で失効し、手元に返却された。`;
    }
    const receivedLabel = (typeof n.received_amount === 'number') ? n.received_amount : n.total_price;
    if(n.kind === 'equipment') return `「${name}」が${n.total_price}Gで売れ、${receivedLabel}Gを受け取った。`;
    return `「${name}」${countLabel}が単価${n.price_per_unit}Gで売れた(合計${n.total_price}G、受取${receivedLabel}G)。`;
  }
  function marketNotificationLogClass(n){
    if(n.event === 'listed') return 'system';
    if(n.event === 'expired') return 'danger';
    return 'reward';
  }

  /* ログイン直後に1度だけ取得してバッジ件数をキャッシュしておく
   * (お知らせの未読数キャッシュと同じ方針)。 */
  async function refreshMarketUnseenCount(){
    try{
      const uid = await ensureAuth();
      const { data: playerRow, error: e1 } = await sb.from('players').select('market_last_seen_at').eq('id', uid).maybeSingle();
      if(e1) throw e1;
      const lastSeen = (playerRow && playerRow.market_last_seen_at) || '1970-01-01T00:00:00Z';
      const { count, error: e2 } = await sb.from('market_sale_notifications')
        .select('*', { count:'exact', head:true })
        .eq('seller_id', uid).neq('event', 'listed').gt('created_at', lastSeen);
      if(e2) throw e2;
      marketUnseenCount = count || 0;
      render();
    }catch(e){
      console.error('market unseen count fetch failed', e);
    }
  }

  async function refreshMarketNotifications(){
    marketNotifications = { loading:true, items:[] };
    render();
    try{
      const uid = await ensureAuth();
      const { data, error } = await sb.from('market_sale_notifications')
        .select('*').eq('seller_id', uid).order('created_at', {ascending:false}).limit(50);
      if(error) throw error;
      marketNotifications = { loading:false, items: data || [] };
      marketUnseenCount = 0;
      const { error: markError } = await sb.rpc('mark_market_notifications_seen');
      if(markError) console.error('mark market notifications seen failed', markError);
    }catch(e){
      console.error('market notifications fetch failed', e);
      marketNotifications = { loading:false, items:[] };
    }
    render();
  }

  function renderMarketEquipSortSelect(current){
    const options = MARKET_EQUIP_SORT_OPTIONS.map(o=>
      `<option value="${o.value}" ${current===o.value?'selected':''}>${esc(o.label)}</option>`
    ).join('');
    return `<select id="marketEquipSortSelect" style="margin-left:auto;min-width:0;flex:0 1 auto;font-size:11px;padding:4px 4px;background:var(--win-bg-1);color:var(--text-primary);border:1px solid var(--win-border);">${options}</select>`;
  }

  function renderMarketBuyStackList(){
    const aggregates = aggregateStackListings(marketData.stackListings);
    if(!aggregates.length) return `<p class="inv-empty">現在出品されている素材・アイテムは無い。</p>`;
    return aggregates.map(a=>`
      <div class="inv-item" data-market-open-book="${a.bucket}:${a.key}" style="cursor:pointer;">
        <span class="inv-item-name">${esc(a.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">出品数 ${a.totalQty}個</span></span>
        <span class="inv-item-actions">
          <span style="color:var(--gold);font-family:var(--font-mono);">最安値 ${a.minPrice}G〜</span>
          <span style="color:var(--text-muted);">▶</span>
        </span>
      </div>`).join('');
  }
  function renderMarketStackBook(){
    const sel = state.ui.marketSelectedStackKey;
    if(!sel) return '';
    const [bucket, key] = sel.split(':');
    const rows = marketData.stackListings.filter(r=>r.bucket===bucket && r.material_key===key);
    const byPrice = new Map();
    rows.forEach(r=>{
      if(!byPrice.has(r.price_per_unit)) byPrice.set(r.price_per_unit, { price:r.price_per_unit, stock:0, count:0 });
      const g = byPrice.get(r.price_per_unit);
      g.stock += r.quantity;
      g.count += 1;
    });
    const priceRows = Array.from(byPrice.values()).sort((a,b)=>a.price-b.price);
    const name = marketStackName(bucket, key);
    const rowsHtml = priceRows.length ? priceRows.map(p=>`
      <div class="inv-item" data-market-buy-stack="${bucket}:${key}:${p.price}:${p.stock}" style="cursor:pointer;">
        <span class="inv-item-name" style="color:var(--gold);font-family:var(--font-mono);font-weight:700;">${p.price}G</span>
        <span class="inv-item-actions" style="font-family:var(--font-mono);font-size:12px;color:var(--text-muted);">在庫 ${p.stock} ・ ${p.count}件</span>
      </div>`).join('') : `<p class="inv-empty">この商品は現在出品されていない。</p>`;
    return `
      <button id="marketStackBackBtn">← 一覧に戻る</button>
      <p class="section-label">${esc(name)}</p>
      ${rowsHtml}
    `;
  }
  function renderMarketBuyEquipList(){
    const sortMode = (state.ui && state.ui.marketEquipSort) || 'rarity_desc';
    const sorted = sortMarketEquipListings(marketData.equipListings, sortMode);
    return sorted.length ? sorted.map(row=>{
      const snap = row.item_snapshot;
      const item = marketItemFromSnapshot(snap);
      return `
      <div class="inv-item ${snap.rarity}" data-market-open-buy-equip="${row.id}" style="cursor:pointer;" title="${esc(itemDetailText(item))}">
        <span class="inv-item-name">${esc(snap.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(marketEquipMetaLabel(item))}</span></span>
        <span class="inv-item-actions" style="color:var(--gold);font-family:var(--font-mono);font-weight:700;">${row.price_per_unit}G</span>
      </div>`;
    }).join('') : `<p class="inv-empty">現在出品されている装備は無い。</p>`;
  }
  function renderMarketBuyPanel(){
    if(!marketData || marketData.loading){
      return `<div class="section-block"><p class="log-entry system">読み込み中……</p></div>`;
    }
    if(marketData.error){
      return `<div class="section-block"><p class="log-entry danger">読み込みに失敗した。時間をおいて開き直してみてほしい。</p></div>`;
    }
    const subTab = (state.ui && state.ui.marketBuySubTab) || 'stack';
    const bookOpen = !!(state.ui && state.ui.marketStackBookOpen);
    const equipSortHtml = (subTab === 'equip' && !bookOpen)
      ? renderMarketEquipSortSelect((state.ui && state.ui.marketEquipSort) || 'rarity_desc') : '';
    const subTabHtml = (subTab === 'stack' && bookOpen) ? '' : `
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;">
        <div class="tab-strip sub" style="margin-top:0;">
          <button data-market-buy-sub="stack" class="${subTab==='stack'?'active':''}">素材・アイテム</button>
          <button data-market-buy-sub="equip" class="${subTab==='equip'?'active':''}">装備</button>
        </div>
        ${equipSortHtml}
      </div>`;
    let contentHtml;
    if(subTab === 'equip') contentHtml = renderMarketBuyEquipList();
    else if(bookOpen) contentHtml = renderMarketStackBook();
    else contentHtml = renderMarketBuyStackList();
    return `<div class="section-block">${subTabHtml}${contentHtml}</div>`;
  }

  function renderMarketSellStackList(){
    const stacks = marketTradableStacks();
    if(!stacks.length) return `<p class="inv-empty">出品できる素材・道具を所持していない。</p>`;
    return stacks.map(s=>{
      const rows = marketData ? marketData.stackListings.filter(r=>r.bucket===s.bucket && r.material_key===s.key) : [];
      const lowest = rows.length ? Math.min(...rows.map(r=>r.price_per_unit)) : null;
      return `
      <div class="inv-item" data-market-open-sell-stack="${s.bucket}:${s.key}" style="cursor:pointer;">
        <span class="inv-item-name">${esc(s.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">所持 ${s.owned}個</span></span>
        <span class="inv-item-actions" style="font-family:var(--font-mono);font-size:12px;color:var(--text-muted);">${lowest!==null ? `市場最安値 ${lowest}G〜` : '市場に出品なし'}</span>
      </div>`;
    }).join('');
  }
  function renderMarketSellEquipList(){
    const eligible = state.inventory.filter(marketEquipEligible);
    if(!eligible.length) return `<p class="inv-empty">出品可能な装備を所持していない(レア未満は出品できない)。</p>`;
    return eligible.map(i=>`
      <div class="inv-item ${i.rarityLabel}" data-market-open-sell-equip="${i.id}" style="cursor:pointer;" title="${esc(itemDetailText(i))}">
        <span class="inv-item-name">${esc(i.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(marketEquipMetaLabel(i))}</span></span>
      </div>`).join('');
  }
  function renderMarketSellPanel(){
    const subTab = (state.ui && state.ui.marketSellSubTab) || 'stack';
    const subTabHtml = `
      <div class="tab-strip sub" style="margin-top:0;margin-bottom:14px;">
        <button data-market-sell-sub="stack" class="${subTab==='stack'?'active':''}">素材・アイテム</button>
        <button data-market-sell-sub="equip" class="${subTab==='equip'?'active':''}">装備</button>
      </div>`;
    const contentHtml = subTab === 'equip' ? renderMarketSellEquipList() : renderMarketSellStackList();
    return `<div class="section-block">${subTabHtml}${contentHtml}</div>`;
  }

  function renderMarketListPanel(){
    if(!marketData || marketData.loading){
      return `<div class="section-block"><p class="log-entry system">読み込み中……</p></div>`;
    }
    const mine = marketData.myListings || [];
    const rowsHtml = mine.map(row=>{
      const remaining = formatMarketRemaining(row.expires_at);
      const mainHtml = row.kind === 'equipment'
        ? `${esc(row.item_snapshot.name)} <span style="color:var(--text-muted);">(単価${row.price_per_unit}G)</span>`
        : `${esc(marketStackName(row.bucket, row.material_key))} ×${row.quantity} <span style="color:var(--text-muted);">(単価${row.price_per_unit}G)</span>`;
      return `
      <div class="inv-item">
        <span class="inv-item-name">${mainHtml}</span>
        <span class="inv-item-actions">
          <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);">${remaining}</span>
          <button data-market-cancel-listing="${row.id}">取り消す</button>
        </span>
      </div>`;
    }).join('');
    const emptySlots = Math.max(0, MARKET_LISTING_SLOTS - mine.length);
    const emptyHtml = Array.from({length: emptySlots}).map(()=>`
      <div class="inv-item" data-market-open-empty-slot style="cursor:pointer;opacity:.65;">
        <span class="inv-item-name">空き枠 ・ クリックして新しく出品する</span>
      </div>`).join('');
    return `
      <div class="section-block">
        <p class="section-label">あなたの出品 <span style="color:var(--gold);font-family:var(--font-mono);font-size:12px;">(${mine.length}/${MARKET_LISTING_SLOTS}枠 使用中)</span></p>
        ${rowsHtml}${emptyHtml}
      </div>
    `;
  }

    const defaultQty = Math.min(1, popup.owned);
    return `
    <div class="help-popup-backdrop" id="marketPopupBackdrop">
      <div class="help-popup">
        <p class="section-label" style="margin-top:0;">${esc(popup.name)}を出品</p>
        <div class="market-popup-row"><span>所持数</span><span>${popup.owned}個</span></div>

        <label style="display:block;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:10px;">単価(最低${MARKET_MIN_PRICE}G)</label>

        <div class="market-popup-row" style="margin-top:6px;border-bottom:none;"><span>合計</span><span id="marketSellStackTotal" style="color:var(--gold);font-weight:700;">${defaultPrice*defaultQty}G</span></div>

  function renderMarketSellEquipPopup(popup){

  function renderMarketPopup(){

    if(popup.type === 'buyEquip') return renderMarketBuyEquipPopup(popup);
    if(popup.type === 'sellStack') return renderMarketSellStackPopup(popup);

  function renderAnnouncementsInner(){
    const list = announcementList;
    const allItems = (!list || list.loading) ? [] : list.items;
    const globalItems = allItems.filter(a=>!a.target_player_id);
    const personalItems = allItems.filter(a=>!!a.target_player_id);
    const shownItems = announcementTab === 'personal' ? personalItems : globalItems;
    const globalUnread = globalItems.filter(a=>!announcementReadIds.has(a.id)).length;
    const personalUnread = personalItems.filter(a=>!announcementReadIds.has(a.id)).length;

    const itemsHtml = (!list || list.loading)
      ? '<p class="log-entry system">読み込み中……</p>'
      : shownItems.length
        ? shownItems.map(a=>{
            const unread = !announcementReadIds.has(a.id);
            const tagsHtml = (Array.isArray(a.tags) ? a.tags : [])
              .map(t=>`<span class="tag-chip">${esc(t)}</span>`).join('');
            return `
              <div class="inv-item" data-open-announcement="${a.id}" style="cursor:pointer;${unread?'border-left-color:var(--gold);':''}">
                <span class="inv-item-name">
                  ${unread ? '<span class="notify-badge" style="margin-left:0;margin-right:6px;">未読</span>' : ''}${esc(a.title)}
                  <span style="float:right;color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${formatAnnouncementDate(a.published_at)}</span>
                </span>
                ${a.sender_name ? `<div style="margin-top:4px;color:var(--text-muted);font-size:11px;">${esc(a.sender_name)}より</div>` : ''}
                ${tagsHtml ? `<div style="margin-top:6px;">${tagsHtml}</div>` : ''}
              </div>`;
          }).join('')
        : `<p class="inv-empty">${announcementTab === 'personal' ? '個人宛てのお知らせはありません。' : 'お知らせはまだありません。'}</p>`;

    return `
      <div class="scene-text">
        ${sceneHeadingHtml('お知らせ')}
      </div>
      <div class="actions">
        <button id="backTownBtn">町に戻る</button>
      </div>
      <div class="tab-strip">
        <button data-announcement-tab="global" class="${announcementTab==='global'?'active':''}">全体${globalUnread>0?`<span class="notify-badge">${globalUnread}</span>`:''}</button>
        <button data-announcement-tab="personal" class="${announcementTab==='personal'?'active':''}">個人宛て${personalUnread>0?`<span class="notify-badge">${personalUnread}</span>`:''}</button>
      </div>
      <div class="section-block">
        ${itemsHtml}
      </div>
    `;
  }

  function renderAnnouncementDetailInner(){
    const id = state.ui.announcementSelected;
    const a = (announcementList && announcementList.items || []).find(x=>x.id === id);
    if(!a){
      return `
        <div class="scene-text">
          ${sceneHeadingHtml('お知らせ')}
          <p class="log-entry system">読み込み中……</p>
        </div>
        <div class="actions">
          <button id="backAnnouncementsBtn">お知らせ一覧に戻る</button>
        </div>
      `;
    }
    const tagsHtml = (Array.isArray(a.tags) ? a.tags : [])
      .map(t=>`<span class="tag-chip">${esc(t)}</span>`).join('');
    const bodyHtml = esc(a.body).replace(/\n/g, '<br>');
    return `
      <div class="scene-text">
        ${sceneHeadingHtml(a.title)}
        <p style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;margin-top:4px;">${formatAnnouncementDate(a.published_at)}${a.sender_name ? ` ／ 送信元: ${esc(a.sender_name)}` : ''}</p>
        ${tagsHtml ? `<div style="margin:8px 0 4px;">${tagsHtml}</div>` : ''}
        <p class="log-entry system" style="margin-top:12px;">${bodyHtml}</p>
      </div>
      <div class="actions">
        <button id="backAnnouncementsBtn">お知らせ一覧に戻る</button>
      </div>
    `;
  }

  function renderSummonInner(){
    if(pendingGacha){
      const candidateDef = liverDef(pendingGacha.candidateId);
      const rerollsLeft = DESTINY_MAX_REROLLS - pendingGacha.rerollsUsed;
      const canReroll = !pendingGacha.rolling && rerollsLeft > 0 && unclaimedLiverDefs().length > 1;
      return `
        <div class="scene-text">
          ${sceneHeadingHtml('召喚 ― 運命の顕現')}
          <p class="log-entry system">運命の糸が、ひとりのライバーを示している……</p>
          <div class="inv-item" style="border-left-color:${candidateDef.color};">
            <span style="width:10px;height:10px;background:${candidateDef.color};display:inline-block;margin-right:8px;"></span>
            <span class="inv-item-name">${esc(candidateDef.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(JOB_DEFS[candidateDef.job].name)}</span></span>
          </div>
          <p style="color:var(--text-muted);font-size:11px;margin:8px 0 0;">
            ${pendingGacha.rolling ? '広告を視聴中……' : `引き直し残り ${rerollsLeft}/${DESTINY_MAX_REROLLS}回(広告視聴で引き直せる。現在は仮の演出です)`}
          </p>
        </div>
        <div class="actions">
          <button class="primary" id="acceptGachaBtn" ${pendingGacha.rolling?'disabled':''}>この仲間を迎える</button>
          <button id="rerollGachaBtn" ${canReroll?'':'disabled'}>${pendingGacha.rolling?'視聴中…':'広告を見て引き直す'}</button>
        </div>
      `;
    }

    const unclaimed = unclaimedLiverDefs();
    const guaranteedRows = unclaimed.length ? unclaimed.map(def=>`
        <div class="inv-item" style="border-left-color:${def.color};">
          <span style="width:10px;height:10px;background:${def.color};display:inline-block;margin-right:8px;"></span>
          <span class="inv-item-name">${esc(def.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(JOB_DEFS[def.job].name)}</span></span>
          <span class="inv-item-actions">
            <button data-use-guaranteed="${def.id}" ${state.guaranteedTickets<=0?'disabled':''}>指名して迎える</button>
          </span>
        </div>`).join('')
      : `<p class="inv-empty">すでに全員のライバーと出会っている。</p>`;

    return `
      <div class="scene-text">
        ${sceneHeadingHtml('召喚', helpButtonHtml('summon'))}
        <p class="log-entry" style="font-family:var(--font-mono);font-size:13px;color:var(--gold);">運命のチケット: ${state.destinyTickets}枚 ・ 確約されし運命のチケット: ${state.guaranteedTickets}枚</p>
      </div>
      <div class="actions">
        <button id="backTownBtn">町に戻る</button>
        <button class="primary" id="pullGachaBtn" ${(state.destinyTickets<=0 || !unclaimed.length)?'disabled':''}>運命のチケットを使う</button>
        <button id="exchangeGuaranteedBtn" ${state.destinyTickets<DESTINY_EXCHANGE_COST?'disabled':''}>チケット${DESTINY_EXCHANGE_COST}枚 → 確約されしチケット</button>
      </div>
      <div class="section-block">
        <p class="section-label">確約されし運命のチケットで指名する</p>
        ${guaranteedRows}
      </div>
    `;
  }

  /* ---------------- 交換所: コロシアムメダルとの交換(アイテム限定) ----------------
   * ここは仮のラインナップ。今後アイテム構成やコスト感を調整していく想定。 */
  const MEDAL_EXCHANGE_CATALOG = [
    { id:'medal_sword', name:'闘士の剣', cost:15, desc:'剣 (+25)',
      make: () => ({ id:'itm_'+Math.random().toString(36).slice(2,9), type:'weapon', weaponType:'sword',
        rarity:'rare', rarityLabel:'rare', name:'闘士の剣', value:25, affix:null, resist:null }) },
    { id:'medal_armor', name:'闘士の鎧', cost:15, desc:'防具 (+20)',
      make: () => ({ id:'itm_'+Math.random().toString(36).slice(2,9), type:'armor',
        rarity:'rare', rarityLabel:'rare', name:'闘士の鎧', value:20, resist:null }) },
    { id:'medal_charm', name:'闘技場の護符', cost:25, desc:'防具 (+15) 火耐性+2',
      make: () => ({ id:'itm_'+Math.random().toString(36).slice(2,9), type:'armor',
        rarity:'epic', rarityLabel:'epic', name:'闘技場の護符', value:15, resist:{element:'fire', value:2} }) },
    { id:'medal_gold_small', name:'勝者の金袋(小)', cost:10, desc:'+100G', gold:100 },
    { id:'medal_gold_large', name:'勝者の金袋(大)', cost:40, desc:'+500G', gold:500 },
    { id:'medal_orb_common', name:'コモンのオーブ', cost:8, desc:'合成で使う強化素材', orb:'common' },
    { id:'medal_orb_uncommon', name:'アンコモンのオーブ', cost:20, desc:'合成で使う強化素材', orb:'uncommon' },
    { id:'medal_orb_rare', name:'レアのオーブ', cost:45, desc:'合成で使う強化素材', orb:'rare' },
    { id:'medal_orb_epic', name:'エピックのオーブ', cost:90, desc:'合成で使う強化素材', orb:'epic' },
  ];

  function exchangeMedalsForItem(catalogId){
    if(inCombat) return;
    const entry = MEDAL_EXCHANGE_CATALOG.find(e=>e.id===catalogId);
    if(!entry) return;
    if(state.colosseum.medals < entry.cost) return;
    if(entry.gold){
      state.colosseum.medals -= entry.cost;
      state.gold += entry.gold;
      pushLog(`メダル${entry.cost}枚を「${entry.name}」(${entry.gold}G)と交換した。`, 'reward');
      saveGame(); render();
      return;
    }
    if(entry.orb){
      state.colosseum.medals -= entry.cost;
      if(!state.orbs) state.orbs = {};
      state.orbs[entry.orb] = (state.orbs[entry.orb] || 0) + 1;
      pushLog(`メダル${entry.cost}枚を「${entry.name}」と交換した。`, 'reward');
      saveGame(); render();
      return;
    }
    const item = entry.make();
    state.colosseum.medals -= entry.cost;
    addItemToInventory(item);
    pushLog(`メダル${entry.cost}枚を「${item.name}」と交換した。`, 'reward');
    saveGame(); render();
  }

  function renderExchangeInner(){
    const rows = MEDAL_EXCHANGE_CATALOG.map(entry=>{
      const affordable = state.colosseum.medals >= entry.cost;
      return `
        <div class="inv-item">
          <span class="inv-item-name">${esc(entry.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(entry.desc)}</span></span>
          <span class="inv-item-actions">
            <button data-exchange-medal="${entry.id}" ${affordable?'':'disabled'}>${entry.cost}メダルで交換</button>
          </span>
        </div>`;
    }).join('');

    return `
      <div class="scene-text">
        ${sceneHeadingHtml('交換所', helpButtonHtml('exchange'))}
        <p class="log-entry" style="font-family:var(--font-mono);font-size:13px;color:var(--gold);">所持メダル: ${state.colosseum.medals}枚</p>
      </div>
      <div class="actions">
        <button id="backTownBtn">町に戻る</button>
      </div>
      <div class="section-block">
        <p class="section-label">交換ラインナップ(仮)</p>
        ${rows}
      </div>
    `;
  }

  /* ---------------- 合成: 装備強化画面 ---------------- */
  /* オーブの所持数表示。以前は「コモンオーブ 0 アンコモンオーブ 0 ...」と
   * 同じ太さのテキストを横に並べていたため、どこが名前でどこが数字か
   * 読み取りづらかった。装備のレアリティ表示(.inv-item.rarity系クラス)
   * と同じ配色のチップに分け、名前(控えめな色)と数字(ゴールド)を
   * 分離することで、幅を抑えつつ一目で数量を追えるようにする。 */
  function renderOrbSummary(){
    const chips = Object.keys(RARITY).filter(k=>k!=='unique').map(key=>{
      const count = (state.orbs && state.orbs[key]) || 0;
      const r = RARITY[key];
      return `
        <span class="orb-chip ${r.cls}" title="${esc(r.label)}のオーブ">
          <span class="orb-chip-label">${esc(r.label)}</span>
          <span class="orb-chip-count">${count}</span>
        </span>`;
    }).join('');
    return `<div class="orb-chip-row">${chips}</div>`;
  }

  function renderEnhanceItemRow({item, equippedBy}){
    const level = item.enhanceLevel || 0;
    const rarity = RARITY[item.rarity];
    const isUnique = item.rarity === 'unique';
    const orbCount = (state.orbs && state.orbs[item.rarity]) || 0;
    const maxed = level >= ENHANCE_MAX_LEVEL;
    const canAfford = orbCount >= 1;
    const equipLabel = equippedBy ? ` <span style="color:var(--text-muted);font-size:11px;">(装備中: ${esc(liverDef(equippedBy).name)})</span>` : '';
    const actionLabel = isUnique ? '強化対象外' : (maxed ? '強化上限' : `${esc(rarity.label)}のオーブ1個で強化`);
    return `
      <div class="inv-item ${item.rarityLabel}" title="${esc(itemDetailText(item))}">
        <span class="inv-item-name">${esc(item.name)}${equipLabel} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(itemValueLabel(item))}${isUnique?'':` ・ 強化 ${level}/${ENHANCE_MAX_LEVEL}`}</span></span>
        <span class="inv-item-actions">
          <button data-enhance-item="${item.id}" ${(isUnique||maxed||!canAfford)?'disabled':''}>${actionLabel}</button>
        </span>
      </div>`;
  }

  function switchEnhanceTab(tab){
    if(!state.ui) state.ui = {expandedGroups:[]};
    state.ui.enhanceTab = tab;
    render();
  }
  function setEnhanceSort(mode){
    if(!state.ui) state.ui = {expandedGroups:[]};
    state.ui.enhanceSort = mode;
    render();
  }
  function renderEnhanceInner(){
    const owned = allOwnedItemsWithEquipInfo();
    const weapons = owned.filter(x=>x.item.type==='weapon');
    const armors = owned.filter(x=>x.item.type==='armor');
    const tab = (state.ui && state.ui.enhanceTab) === 'armor' ? 'armor' : 'weapon';
    const sortMode = (state.ui && state.ui.enhanceSort) || INVENTORY_SORT_DEFAULT;
    const sorted = applyInventorySort(tab === 'armor' ? armors : weapons, sortMode, x => RARITY_SORT_ORDER[x.item.rarity] || 0);
    const rows = sorted.length ? sorted.map(renderEnhanceItemRow).join('') : `<p class="inv-empty">強化できる${tab==='armor'?'防具':'武器'}がない。</p>`;

    return `
      <div class="scene-text">
        ${sceneHeadingHtml('合成', helpButtonHtml('enhance'))}
      </div>
      <div class="actions">
        <button id="backTownBtn">町に戻る</button>
      </div>
      ${renderOrbSummary()}
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <div class="tab-strip" style="margin-top:0;">
          <button data-enhance-tab="weapon" class="${tab==='weapon'?'active':''}">武器</button>
          <button data-enhance-tab="armor" class="${tab==='armor'?'active':''}">防具</button>
        </div>
        ${renderSortSelect('enhanceSortSelect', sortMode)}
      </div>
      <div class="section-block">
        ${rows}
      </div>
    `;
  }

  /* ---------------- 錬金: レシピ実行画面 ---------------- */
  function renderRecipeRow(recipe){
    const affordable = canAffordRecipe(recipe);
    const materialsHtml = recipe.materials.map(m=>{
      const have = materialCount(m.key);
      const ok = have >= m.qty;
      return `<span style="color:${ok?'var(--text-muted)':'var(--danger)'};">${esc(MATERIAL_DEFS[m.key].name)} ${have}/${m.qty}</span>`;
    }).join('<br>');
    return `
      <div class="inv-item" title="${esc(recipeOutputDetailText(recipe))}">
        <span class="inv-item-name">${esc(recipe.name)}<br><span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${materialsHtml}</span></span>
        <span class="inv-item-actions">
          <button data-craft-recipe="${recipe.id}" ${affordable?'':'disabled'}>錬成する</button>
        </span>
      </div>`;
  }

  function switchAlchemyTab(cat){
    if(!state.ui) state.ui = {expandedGroups:[]};
    state.ui.alchemyTab = cat;
    render();
  }
  /* 錬金には「新着順」のような概念が無い(取得順を記録していない)ため、
   * ソートは独自に「錬成できる順」(材料が揃っているものを先に)と
   * 「一覧順」(定義順のまま)の2択とする。 */
  const ALCHEMY_SORT_DEFAULT = 'craftable_first';
  const ALCHEMY_SORT_OPTIONS = [
    { value:'craftable_first', label:'錬成できる順' },
    { value:'default',         label:'一覧順' },
  ];
  function renderAlchemySortSelect(current){
    const options = ALCHEMY_SORT_OPTIONS.map(o=>
      `<option value="${o.value}" ${current===o.value?'selected':''}>${esc(o.label)}</option>`
    ).join('');
    return `<select id="alchemySortSelect" style="margin-left:auto;min-width:0;flex:0 1 auto;font-size:11px;padding:4px 4px;background:var(--win-bg-1);color:var(--text-primary);border:1px solid var(--win-border);">${options}</select>`;
  }
  function setAlchemySort(mode){
    if(!state.ui) state.ui = {expandedGroups:[]};
    state.ui.alchemySort = mode;
    render();
  }
  function renderAlchemyInner(){
    const categories = [];
    ALCHEMY_RECIPES.forEach(r=>{ if(!categories.includes(r.category)) categories.push(r.category); });
    const activeCat = categories.includes(state.ui && state.ui.alchemyTab) ? state.ui.alchemyTab : categories[0];
    const sortMode = (state.ui && state.ui.alchemySort) || ALCHEMY_SORT_DEFAULT;
    const tabStripHtml = `
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <div class="tab-strip" style="margin-top:0;">
          ${categories.map(cat=>`<button data-alchemy-tab="${esc(cat)}" class="${activeCat===cat?'active':''}">${esc(cat)}</button>`).join('')}
        </div>
        ${renderAlchemySortSelect(sortMode)}
      </div>`;
    let recipes = ALCHEMY_RECIPES.filter(r=>r.category===activeCat);
    if(sortMode === 'craftable_first'){
      recipes = [...recipes].sort((a,b)=> (canAffordRecipe(b)?1:0) - (canAffordRecipe(a)?1:0));
    }
    const rows = recipes.map(renderRecipeRow).join('');

    return `
      <div class="scene-text">
        ${sceneHeadingHtml('錬金', helpButtonHtml('alchemy'))}
      </div>
      <div class="actions">
        <button id="backTownBtn">町に戻る</button>
      </div>
      ${tabStripHtml}
      <div class="section-block">
        ${rows}
      </div>
    `;
  }

  /* パーティ編成画面の1行。編成の出し入れと、詳細画面(ライバー個別の
   * 装備・ジョブ・スキル設定はすべてそちら)へのリンクだけを持つ。 */
  function renderPartyMemberRow(def){
    const id = def.id;
    const ls = liverState(id);
    const jp = jobProgressFor(id);
    const job = JOB_DEFS[ls.job];
    const inParty = state.party.includes(id);

    return `
      <div class="inv-item" style="${inParty?'border-left-color:var(--gold);':''}">
        <span style="width:10px;height:10px;background:${def.color};display:inline-block;margin-right:8px;"></span>
        <span class="inv-item-name">${esc(def.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">Lv.${jp.level} ・ ${esc(job.name)} ・ <span style="color:var(--gold);">戦闘力 ${combatPower(id)}</span></span></span>
        <span class="inv-item-actions">
          <button data-toggle-party="${id}" ${(!inParty && state.party.length>=PARTY_MAX)?'disabled':''}>${inParty?'外す':'編成に入れる'}</button>
          <button data-view-liver-detail="${id}">詳細を見る</button>
        </span>
      </div>`;
  }

  /* ---------------- ライバー一覧・詳細画面 ---------------- */
  function openLiverDetail(id, from){
    if(inCombat) return;
    if(!state.ui) state.ui = {};
    state.ui.rosterDetailId = id;
    state.ui.rosterDetailFrom = from === 'party' ? 'party' : 'roster';
    state.ui.liverDetailTab = 'detail';
    state.ui.dialogueSubTab = 'common';
    state.screen = 'liverDetail';
    saveGame(); render();
  }
  function backFromLiverDetail(){
    gotoScreen(state.ui.rosterDetailFrom === 'party' ? 'party' : 'roster');
  }

  const ROSTER_SORT_DEFAULT = 'default';
  const ROSTER_SORT_OPTIONS = [
    { value:'default',        label:'標準' },
    { value:'cp_asc',         label:'戦闘力順(昇順)' },
    { value:'cp_desc',        label:'戦闘力順(降順)' },
    { value:'acquired_asc',   label:'入手順(昇順)' },
    { value:'acquired_desc',  label:'入手順(降順)' },
  ];

  /* 並び順のルール: 解放済みを常に未解放より上、その中でも編成中を
   * 最上部に固定する。そのうえで、各グループ内をソートモードに応じて
   * 並べ替える(標準時はLIVER_DEFS_BY_DEBUT=デビュー日昇順のまま)。未解放グループは
   * ソート対象にしない(定義順で固定)。 */
  function sortRosterDefs(defs, mode){
    if(mode === 'cp_asc') return [...defs].sort((a,b)=> combatPower(a.id) - combatPower(b.id));
    if(mode === 'cp_desc') return [...defs].sort((a,b)=> combatPower(b.id) - combatPower(a.id));
    if(mode === 'acquired_asc') return [...defs].sort((a,b)=> (liverState(a.id).unlockedAt||0) - (liverState(b.id).unlockedAt||0));
    if(mode === 'acquired_desc') return [...defs].sort((a,b)=> (liverState(b.id).unlockedAt||0) - (liverState(a.id).unlockedAt||0));
    return defs;
  }

  function renderRosterInner(){
    const sortMode = (state.ui && state.ui.rosterSort) || ROSTER_SORT_DEFAULT;
    const unlockedInParty = [];
    const unlockedOthers = [];
    const lockedDefs = [];
    LIVER_DEFS_BY_DEBUT.forEach(def=>{
      if(!liverState(def.id).unlocked){ lockedDefs.push(def); return; }
      (state.party.includes(def.id) ? unlockedInParty : unlockedOthers).push(def);
    });
    const orderedDefs = [...sortRosterDefs(unlockedInParty, sortMode), ...sortRosterDefs(unlockedOthers, sortMode), ...lockedDefs];

    const rows = orderedDefs.map(def=>{
      const ls = liverState(def.id);
      if(!ls.unlocked){
        return `
          <div class="inv-item" style="opacity:.55;cursor:pointer;" data-open-roster-detail="${def.id}">
            <span style="width:10px;height:10px;background:${def.color};display:inline-block;margin-right:8px;"></span>
            <span class="inv-item-name">${uiIcon('lock')} ${esc(def.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">未解放</span></span>
          </div>`;
      }
      const jp = jobProgressFor(def.id);
      const job = JOB_DEFS[ls.job];
      const inParty = state.party.includes(def.id);
      return `
        <div class="inv-item" style="${inParty?'border-left-color:var(--gold);':''}cursor:pointer;" data-open-roster-detail="${def.id}">
          <span style="width:10px;height:10px;background:${def.color};display:inline-block;margin-right:8px;"></span>
