<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七彩の塔 管理画面</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#12151c; --panel:#1b212c; --border:#2c3446;
    --text:#e8ecf4; --muted:#8b93a7;
    --accent:#5b8cff; --danger:#ff6b6b; --gold:#e8c15a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic","Meiryo",sans-serif;
    min-height:100vh;
  }
  #app{max-width:960px;margin:0 auto;padding:24px 20px 60px;}
  h1{font-size:20px;margin:0;}
  h3{margin:0 0 12px;font-size:15px;color:var(--gold);}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);}
  nav{display:flex;gap:8px;margin-bottom:20px;}
  button{
    font-family:inherit;font-size:13px;
    background:var(--panel);color:var(--text);
    border:1px solid var(--border);border-radius:6px;
    padding:8px 16px;cursor:pointer;
  }
  button:hover{border-color:var(--accent);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  button.danger{border-color:var(--danger);color:var(--danger);}
  button.danger:hover{background:rgba(255,107,107,0.12);}
  input, textarea{
    font-family:inherit;font-size:13px;
    background:#0e1219;color:var(--text);
    border:1px solid var(--border);border-radius:6px;
    padding:8px 10px;width:100%;
  }
  textarea{resize:vertical;}
  label{display:block;margin-bottom:12px;font-size:12px;color:var(--muted);}
  label input, label textarea{margin-top:6px;}
  .toolbar{display:flex;gap:8px;margin-bottom:16px;}
  .toolbar input{flex:1;}
  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  .muted{color:var(--muted);font-size:12px;}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:6px;}
  .badge.danger{background:rgba(255,107,107,0.16);color:var(--danger);}
  .badge.gold{background:rgba(232,193,90,0.16);color:var(--gold);}
  .tag{display:inline-block;font-size:11px;color:var(--gold);border:1px solid var(--gold);border-radius:10px;padding:1px 8px;margin:4px 4px 0 0;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:20px;}
  .actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .ann-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;flex-wrap:wrap;}
  .login-box{max-width:340px;margin:120px auto;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:28px;text-align:center;}
  .login-box h1{margin-bottom:20px;font-size:18px;}
  .login-box input{margin-bottom:12px;}
  .recipient-option{padding:6px 8px;border-radius:4px;cursor:pointer;font-size:13px;}
  .recipient-option:hover{background:rgba(255,255,255,0.06);}
  .btn-sm{padding:4px 10px;font-size:12px;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
  .modal-box{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:20px;max-width:420px;width:100%;}
  .modal-box input{margin-top:12px;}
  .chatlog-row{display:flex;align-items:flex-start;gap:10px;padding:8px 4px;border-bottom:1px solid var(--border);}
  .chatlog-row:hover{background:rgba(255,255,255,0.03);}
  .chatlog-row-main{flex:1;min-width:0;}
  .chatlog-row-meta{display:flex;align-items:baseline;gap:6px;font-size:11px;}
  .chatlog-row-body{font-size:13px;margin-top:2px;white-space:pre-wrap;word-break:break-word;}
  .chatlog-row-actions{display:flex;gap:6px;flex-shrink:0;padding-top:1px;}
  .chatlog-user-link{color:var(--accent);text-decoration:none;cursor:pointer;font-weight:600;background:none;border:none;padding:0;font-size:inherit;font-family:inherit;}
  .chatlog-user-link:hover{text-decoration:underline;}
  .chatlog-row-expand{display:flex;align-items:center;gap:8px;padding:6px 4px 10px;border-bottom:1px solid var(--border);}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  const SUPABASE_URL = 'https://ijmjnpxhyipinurgberu.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_YTtamjdgpadvgGmTAa4yEg_N7GYNUIP';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const app = document.getElementById('app');

  // 属性値(value="...")の中でも使うため、DOMのtextContent/innerHTML
  // 往復(<, >, & のみエスケープ)ではなく、クォート類も含めて明示的に
  // エスケープする(属性コンテキストで " や ' を残すと属性から抜けられる)。
  function esc(str){
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function showAlert(message){
    return new Promise(resolve=>{ modal = { kind:'alert', message, resolve }; render(); });
  }
  function showConfirm(message){
    return new Promise(resolve=>{ modal = { kind:'confirm', message, resolve }; render(); });
  }
  function showPrompt(message, defaultValue){
    return new Promise(resolve=>{ modal = { kind:'prompt', message, defaultValue: defaultValue == null ? '' : defaultValue, resolve }; render(); });
  }
  function resolveModal(value){
    if(!modal) return;
    const r = modal.resolve;
    modal = null;
    render();
    r(value);
  }

  let session = null;
  let tab = 'players';
  let playerQuery = '';
  let playerList = [];
  let playerListLoading = false;
  let banList = [];
  let banListLoading = false;
  let penaltyList = [];
  let penaltyListLoading = false;
  let announcementList = [];
  let announcementListLoading = false;
  let announcementSubTab = 'global'; // 'global' | 'personal' — お知らせ一覧のタブ
  let targetPlayerNames = {}; // 個別宛てお知らせの宛先表示用: player_id -> name
  const DEFAULT_SENDER_NAME = '七彩の塔運営';
  // null=非表示 / {id,title,body,tags,published_at,target_player_id,sender_name,editable,isPersonalNew,recipients}
  // editable=falseで詳細(読み取り専用)表示、trueで編集フォーム表示。新規作成時は最初からeditable=true。
  // isPersonalNew=trueの間だけrecipients([{id,name}])を複数選択できる(個別の新規作成のみ)。
  let announcementDetail = null;
  let recipientSearchQuery = '';
  let recipientSearchResults = [];
  let recipientSearchTimer = null;
  let reportList = [];
  let reportListLoading = false;
  let reportFilter = 'open'; // 'open' | 'resolved' | 'all'
  let openReportCount = 0;
  let chatLogChannel = 'general';
  let chatLogMessages = [];
  let chatLogLoading = false;
  let chatLogSinceDays = 30; // 何日前まで遡って表示するか(「さらに遡る」で30ずつ延ばす)
  let chatLogOpenActionId = null; // 「処分」パネルを開いている投稿のid(1件だけ開ける)
  let modal = null; // {kind:'alert'|'confirm'|'prompt', message, defaultValue, resolve} — 標準のalert/confirm/promptは
  // Chromeネイティブのダイアログとして表示され、自動操作ツールからは一切操作できない(クリック待ちで固まる)ため、
  // 自前のオーバーレイに置き換える。showAlert/showConfirm/showPromptはPromiseを返すので、呼び出し側はawaitする。
  let userDetail = null; // {id, name} — 設定されている間はどのタブよりも優先してユーザー詳細画面を表示する
  let userDetailData = null; // {player, messages} — openUserDetail()で非同期に読み込む
  let userDetailLoading = false;

  const CHAT_LOG_CHANNELS = [
    { id:'general', name:'総合チャット' },
    { id:'strategy', name:'攻略チャット' },
    { id:'casual', name:'雑談チャット' },
  ];

  const REPORT_REASON_LABELS = {
    spam: 'スパム・広告',
    harassment: '誹謗中傷・嫌がらせ',
    inappropriate: '不適切な内容',
    impersonation: 'なりすまし',
    cheat: '不正・チートの疑い',
    other: 'その他',
  };
  const REPORT_ACTION_LABELS = {
    ban: 'BAN',
    penalty: 'ペナルティ',
    warn: '警告',
  };

  async function init(){
    const { data: { session: s } } = await sb.auth.getSession();
    session = s;
    if(session){
      const ok = await checkAdmin();
      if(ok){
        await Promise.all([loadPlayers(), loadAnnouncements(), loadReports(), loadBanList(), loadPenaltyList()]);
      }
    }
    render();
  }

  async function checkAdmin(){
    try{
      const { data, error } = await sb.rpc('is_admin');
      if(error) throw error;
      if(!data){
        await sb.auth.signOut();
        session = null;
        await showAlert('このアカウントには管理者権限がありません。');
        return false;
      }
      return true;
    }catch(e){
      console.error('is_admin check failed', e);
      await sb.auth.signOut();
      session = null;
      return false;
    }
  }

  async function handleLogin(email, password){
    const btn = document.getElementById('loginBtn');
    if(btn) btn.disabled = true;
    try{
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
      session = data.session;
      const ok = await checkAdmin();
      if(ok){
        await Promise.all([loadPlayers(), loadAnnouncements(), loadReports(), loadBanList(), loadPenaltyList()]);
      }
    }catch(e){
      await showAlert('ログインに失敗しました: ' + e.message);
    }
    if(btn) btn.disabled = false;
    render();
  }

  async function handleLogout(){
    await sb.auth.signOut();
    session = null;
    render();
  }

  async function loadPlayers(){
    playerListLoading = true; render();
    try{
      let q = sb.from('players').select('id,name,gold,banned_at,ban_reason,created_at,updated_at')
        .order('created_at', {ascending:false}).limit(100);
      if(playerQuery.trim()) q = q.ilike('name', `%${playerQuery.trim()}%`);
      const { data, error } = await q;
      if(error) throw error;
      playerList = data || [];
    }catch(e){
      console.error('load players failed', e);
      playerList = [];
    }
    playerListLoading = false; render();
  }

  async function setBan(id, banned, reason){
    try{
      const { error } = await sb.rpc('admin_set_ban', { p_target_id: id, p_banned: banned, p_reason: reason || null });
      if(error) throw error;
      await refreshModerationLists();
    }catch(e){
      await showAlert('BAN処理に失敗しました: ' + e.message);
    }
  }

  async function loadBanList(){
    banListLoading = true; render();
    try{
      const { data, error } = await sb.from('players').select('id,name,gold,banned_at,ban_reason')
        .not('banned_at', 'is', null).order('banned_at', {ascending:false}).limit(200);
      if(error) throw error;
      banList = data || [];
    }catch(e){
      console.error('load ban list failed', e);
      banList = [];
    }
    banListLoading = false; render();
  }

  async function loadPenaltyList(){
    penaltyListLoading = true; render();
    try{
      const { data, error } = await sb.from('players').select('id,name,penalty_until,penalty_reason')
        .not('penalty_until', 'is', null).order('penalty_until', {ascending:false}).limit(200);
      if(error) throw error;
      penaltyList = data || [];
    }catch(e){
      console.error('load penalty list failed', e);
      penaltyList = [];
    }
    penaltyListLoading = false; render();
  }

  async function refreshModerationLists(){
    await Promise.all([loadPlayers(), loadBanList(), loadPenaltyList()]);
  }

  async function setPenalty(id, hours, reason){
    try{
      const { error } = await sb.rpc('admin_set_penalty', { p_target_id: id, p_hours: hours || null, p_reason: reason || null });
      if(error) throw error;
      await refreshModerationLists();
    }catch(e){
      await showAlert('利用制限の更新に失敗しました: ' + e.message);
    }
  }

  async function loadAnnouncements(){
    announcementListLoading = true; render();
    try{
      const { data, error } = await sb.from('announcements').select('*')
        .order('published_at', {ascending:false}).limit(200);
      if(error) throw error;
      announcementList = data || [];

      const targetIds = [...new Set(announcementList.map(a=>a.target_player_id).filter(Boolean))];
      if(targetIds.length){
        const { data: players, error: pErr } = await sb.from('players').select('id,name').in('id', targetIds);
        if(pErr) throw pErr;
        targetPlayerNames = Object.fromEntries((players||[]).map(p=>[p.id, p.name]));
      } else {
        targetPlayerNames = {};
      }
    }catch(e){
      console.error('load announcements failed', e);
      announcementList = [];
      targetPlayerNames = {};
    }
    announcementListLoading = false; render();
  }

  async function saveAnnouncement(form){
    try{
      const tags = form.tags.split(',').map(s=>s.trim()).filter(Boolean);
      const publishedIso = form.publishedAt ? new Date(form.publishedAt).toISOString() : new Date().toISOString();
      const { error } = await sb.rpc('admin_upsert_announcement', {
        p_title: form.title, p_body: form.body, p_id: form.id || null,
        p_tags: tags, p_published_at: publishedIso,
        p_sender_name: form.senderName || null,
        p_target_player_ids: form.targetPlayerIds && form.targetPlayerIds.length ? form.targetPlayerIds : null
      });
      if(error) throw error;
      announcementDetail = null;
      await loadAnnouncements();
    }catch(e){
      await showAlert('保存に失敗しました: ' + e.message);
    }
  }

  async function searchRecipientCandidates(query){
    const q = query.trim();
    if(!q){ recipientSearchResults = []; render(); return; }
    try{
      const { data, error } = await sb.rpc('search_players_by_id_prefix', { p_query: q });
      if(error) throw error;
      recipientSearchResults = data || [];
    }catch(e){
      console.error('search recipients failed', e);
      recipientSearchResults = [];
    }
    render();
    // render()はinnerHTMLをまるごと作り直すため入力欄のフォーカスが切れる。
    // 検索は入力停止から250ms後にしか走らないとはいえ、続けて入力したい
    // 場合のためにフォーカスとカーソル位置を戻しておく。
    const input = document.getElementById('annRecipientInput');
    if(input){ input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  }

  async function deleteAnnouncement(id){
    if(!(await showConfirm('このお知らせを削除しますか？'))) return;
    try{
      const { error } = await sb.rpc('admin_delete_announcement', { p_id: id });
      if(error) throw error;
      if(announcementDetail && announcementDetail.id === id) announcementDetail = null;
      await loadAnnouncements();
    }catch(e){
      await showAlert('削除に失敗しました: ' + e.message);
    }
  }

  async function loadReports(){
    reportListLoading = true; render();
    try{
      let q = sb.from('chat_reports').select('*').order('created_at', {ascending:false}).limit(200);
      if(reportFilter !== 'all') q = q.eq('status', reportFilter);
      const [{ data, error }, { count, error: countError }] = await Promise.all([
        q,
        sb.from('chat_reports').select('id', {count:'exact', head:true}).eq('status', 'open')
      ]);
      if(error) throw error;
      if(countError) throw countError;
      reportList = data || [];
      openReportCount = count || 0;
    }catch(e){
      console.error('load reports failed', e);
      reportList = [];
    }
    reportListLoading = false; render();
  }

  async function reportAction(id, side, action, deleteMessage, penaltyHours, note){
    try{
      const { error } = await sb.rpc('admin_report_action', {
        p_report_id: id, p_side: side, p_action: action, p_delete_message: !!deleteMessage,
        p_penalty_hours: penaltyHours || null, p_note: note || null
      });
      if(error) throw error;
      await loadReports();
    }catch(e){
      await showAlert('処理に失敗しました: ' + e.message);
    }
  }

  async function closeReport(id, deleteMessage){
    try{
      const { error } = await sb.rpc('admin_close_report', {
        p_report_id: id, p_delete_message: !!deleteMessage
      });
      if(error) throw error;
      await loadReports();
    }catch(e){
      await showAlert('クローズに失敗しました: ' + e.message);
    }
  }

  // side: 'reported'(通報された側) | 'reporter'(通報した側)。
  // それぞれ独立して1回だけ選べる(クローズはしない、別ボタンで行う)。
  async function handleReportSideAction(id, side, action, deleteMessage){
    const sideLabel = side === 'reported' ? '対象ユーザー' : '通報者';
    const label = REPORT_ACTION_LABELS[action] || action;
    const deleteNote = deleteMessage ? '対象の投稿も削除されます。' : '';

    if(action === 'penalty'){
      const hoursStr = await showPrompt('利用を制限する時間を入力してください(時間単位):', '24');
      if(hoursStr === null) return;
      const hours = parseInt(hoursStr, 10);
      if(!hours || hours <= 0){ await showAlert('有効な時間を入力してください。'); return; }
      const note = await showPrompt('制限理由を入力してください(空欄可):', '');
      if(note === null) return;
      if(!(await showConfirm(`${sideLabel}に${label}(${hours}時間)を実行します。${deleteNote}よろしいですか？`))) return;
      reportAction(id, side, action, deleteMessage, hours, note);
      return;
    }
    if(action === 'ban'){
      const note = await showPrompt('BAN理由を入力してください:', 'チャットでの通報対応によるBAN');
      if(note === null) return;
      if(!(await showConfirm(`${sideLabel}に${label}を実行します。${deleteNote}よろしいですか？`))) return;
      reportAction(id, side, action, deleteMessage, null, note);
      return;
    }
    // warn
    const defaultMsg = side === 'reported'
      ? 'チャットへの投稿内容について、運営より警告いたします。利用規約に違反する投稿を繰り返した場合、アカウントの利用を制限することがあります。'
      : 'いただいた通報を運営で確認しましたが、妥当性が認められず、悪意のある通報(嫌がらせ)であると判断いたしました。今後このような通報を繰り返した場合、アカウントの利用を制限することがあります。';
    const note = await showPrompt('お知らせに表示する警告文を確認・編集してください:', defaultMsg);
    if(note === null) return;
    if(!(await showConfirm(`${sideLabel}に${label}を実行します。${deleteNote}よろしいですか？`))) return;
    reportAction(id, side, action, deleteMessage, null, note);
  }

  async function handleCloseReport(id, deleteMessage){
    const deleteNote = deleteMessage ? '対象の投稿も削除されます。' : '';
    if(!(await showConfirm(`この通報をクローズします。${deleteNote}よろしいですか？`))) return;
    closeReport(id, deleteMessage);
  }

  async function loadChatLog(){
    chatLogLoading = true; render();
    try{
      const since = new Date(Date.now() - chatLogSinceDays*24*60*60*1000).toISOString();
      const { data, error } = await sb.from('chat_messages')
        .select('id,player_id,player_name,body,created_at')
        .eq('channel', chatLogChannel)
        .gte('created_at', since)
        .order('created_at', {ascending:false})
        .limit(500);
      if(error) throw error;
      chatLogMessages = data || [];
    }catch(e){
      console.error('load chat log failed', e);
      chatLogMessages = [];
    }
    chatLogLoading = false; render();
  }

  async function deleteChatMessage(id){
    if(!(await showConfirm('この投稿を削除しますか？(取り消せません)'))) return;
    try{
      const { error } = await sb.rpc('admin_delete_chat_message', { p_message_id: id });
      if(error) throw error;
      chatLogMessages = chatLogMessages.filter(m=>m.id!==id);
      chatLogOpenActionId = null;
      render();
    }catch(e){
      await showAlert('削除に失敗しました: ' + e.message);
    }
  }

  async function warnPlayerFromChatLog(playerId, playerName){
    const defaultMsg = 'チャットへの投稿内容について、運営より警告いたします。利用規約に違反する投稿を繰り返した場合、アカウントの利用を制限することがあります。';
    const note = await showPrompt(`${playerName} に送る警告文を確認・編集してください:`, defaultMsg);
    if(note === null) return;
    if(!(await showConfirm(`${playerName} に警告を送信します。よろしいですか？`))) return;
    try{
      const { error } = await sb.rpc('admin_warn_player', { p_target_id: playerId, p_note: note });
      if(error) throw error;
      chatLogOpenActionId = null;
      render();
    }catch(e){
      await showAlert('警告の送信に失敗しました: ' + e.message);
    }
  }

  async function banPlayerFromChatLog(playerId, playerName){
    const reason = await showPrompt(`${playerName} をBANする理由を入力してください:`, 'チャットでの投稿内容によるBAN');
    if(reason === null) return;
    if(!(await showConfirm(`${playerName} をBANします。よろしいですか？`))) return;
    await setBan(playerId, true, reason);
    chatLogOpenActionId = null;
    render();
  }

  async function penalizePlayerFromChatLog(playerId, playerName){
    const hoursStr = await showPrompt('利用を制限する時間を入力してください(時間単位):', '24');
    if(hoursStr === null) return;
    const hours = parseInt(hoursStr, 10);
    if(!hours || hours <= 0){ await showAlert('有効な時間を入力してください。'); return; }
    const reason = await showPrompt(`${playerName} への制限理由を入力してください(空欄可):`, 'チャットでの投稿内容による利用制限');
    if(reason === null) return;
    if(!(await showConfirm(`${playerName} に利用制限(${hours}時間)を実行します。よろしいですか？`))) return;
    await setPenalty(playerId, hours, reason);
    chatLogOpenActionId = null;
    render();
  }

  async function openUserDetail(id, name){
    userDetail = { id, name };
    userDetailData = null;
    userDetailLoading = true;
    render();
    try{
      const [{ data: player, error: pErr }, { data: messages, error: mErr }] = await Promise.all([
        sb.from('players').select('id,name,gold,created_at,banned_at,ban_reason,penalty_until,penalty_reason,warning_count').eq('id', id).single(),
        sb.from('chat_messages').select('id,channel,body,created_at').eq('player_id', id).order('created_at', {ascending:false}).limit(50)
      ]);
      if(pErr) throw pErr;
      if(mErr) throw mErr;
      userDetailData = { player, messages: messages || [] };
    }catch(e){
      console.error('load user detail failed', e);
      userDetailData = { player: null, messages: [] };
    }
    userDetailLoading = false;
    render();
  }

  function closeUserDetail(){
    userDetail = null;
    userDetailData = null;
    render();
  }

  async function refreshUserDetail(){
    if(!userDetail) return;
    await openUserDetail(userDetail.id, userDetail.name);
  }

  async function toggleBanFromUserDetail(id, currentlyBanned){
    if(currentlyBanned){
      if(await showConfirm('BANを解除しますか？')) await setBan(id, false, null);
    } else {
      const reason = await showPrompt('BAN理由を入力してください:');
      if(reason !== null) await setBan(id, true, reason);
    }
    await refreshUserDetail();
  }

  async function setPenaltyFromUserDetail(id, lift){
    if(lift){
      if(!(await showConfirm('この利用制限を解除しますか？'))) return;
      await setPenalty(id, null, null);
    } else {
      const hoursStr = await showPrompt('利用を制限する時間を入力してください(時間単位):', '24');
      if(hoursStr === null) return;
      const hours = parseInt(hoursStr, 10);
      if(!hours || hours <= 0){ await showAlert('有効な時間を入力してください。'); return; }
      const reason = await showPrompt('制限理由を入力してください(空欄可):', '');
      if(reason === null) return;
      if(!(await showConfirm(`${hours}時間後を新しい解除予定として設定します。よろしいですか？`))) return;
      await setPenalty(id, hours, reason);
    }
    await refreshUserDetail();
  }

  function toLocalInputValue(iso){
    const d = new Date(iso);
    const pad = n=>String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

    const loginBtn = document.getElementById('loginBtn');

  }

  function renderUserDetailScreen(){
    const backBtnHtml = `<div class="actions" style="margin-bottom:16px;"><button id="userDetailBackBtn">← 戻る</button></div>`;
    if(userDetailLoading || !userDetailData){
      return `${backBtnHtml}<p class="muted">読み込み中……</p>`;
    }
    const p = userDetailData.player;
    if(!p){
      return `${backBtnHtml}<p class="muted">ユーザー情報を取得できませんでした。</p>`;
    }
    const banned = !!p.banned_at;
    const penaltyActive = p.penalty_until && new Date(p.penalty_until) > new Date();
    const messagesHtml = userDetailData.messages.length
      ? userDetailData.messages.map(m=>{
          const channelName = (CHAT_LOG_CHANNELS.find(c=>c.id===m.channel) || {}).name || m.channel;
          return `
            <div class="chatlog-row">
              <div class="chatlog-row-main">
                <div class="chatlog-row-meta">
                  <span class="tag" style="margin:0;">${esc(channelName)}</span>
                  <span class="muted mono" style="margin-left:auto;">${new Date(m.created_at).toLocaleString('ja-JP')}</span>
                </div>
                <div class="chatlog-row-body">${esc(m.body)}</div>
              </div>
            </div>
          `;
        }).join('')
      : '<p class="muted">投稿履歴はありません。</p>';

    return `
      ${backBtnHtml}
      <div class="panel">
        <h3>${esc(p.name)} <span class="mono muted" style="font-size:12px;">#${esc(p.id)}</span></h3>
        <p style="font-size:13px;">
          ゴールド: <span class="mono">${p.gold}</span> ・
          作成日: <span class="mono">${new Date(p.created_at).toLocaleDateString('ja-JP')}</span>
          ${banned ? `<span class="badge danger">BAN中</span>` : ''}
          ${penaltyActive ? `<span class="badge gold">利用制限中</span>` : ''}
          ${p.warning_count > 0 ? `<span class="badge gold">警告${p.warning_count}回</span>` : ''}
        </p>
        ${banned ? `<p class="muted" style="font-size:12px;">BAN理由: ${esc(p.ban_reason||'')}</p>` : ''}
        ${penaltyActive ? `<p class="muted" style="font-size:12px;">制限理由: ${esc(p.penalty_reason||'')} / 解除予定: ${new Date(p.penalty_until).toLocaleString('ja-JP')}</p>` : ''}
        <div class="actions">
          <button data-userdetail-ban="${p.id}" data-banned="${banned}" class="${banned?'':'danger'}">${banned?'BAN解除':'BAN'}</button>
          ${penaltyActive
            ? `<button data-userdetail-penalty-lift="${p.id}">利用制限を解除</button>`
            : `<button data-userdetail-penalty="${p.id}">利用制限を設定</button>`}
        </div>
      </div>
      <div class="panel">
        <h3>チャット投稿履歴(直近50件・全チャンネル)</h3>
        ${messagesHtml}
      </div>
    `;
  }

  function renderModal(){
    if(!modal) return '';
    const isAlert = modal.kind === 'alert';
    const isPrompt = modal.kind === 'prompt';
    const inputHtml = isPrompt ? `<input id="modalPromptInput" type="text" value="${esc(modal.defaultValue)}">` : '';
    const buttonsHtml = isAlert
      ? `<button id="modalOkBtn" class="primary">OK</button>`
      : `<button id="modalCancelBtn">キャンセル</button><button id="modalOkBtn" class="primary">OK</button>`;
    return `
      <div class="modal-backdrop" id="modalBackdrop">
        <div class="modal-box">
          <p style="white-space:pre-wrap;margin:0;">${esc(modal.message)}</p>
          ${inputHtml}
          <div class="actions" style="justify-content:flex-end;margin-top:16px;">
            ${buttonsHtml}
          </div>
        </div>
      </div>
    `;
  }

  function renderTabContent(){
    if(userDetail) return renderUserDetailScreen();
    switch(tab){
      case 'players': return renderPlayersTab();
      case 'announcements': return renderAnnouncementsTab();
      case 'reports': return renderReportsTab();
      case 'banlist': return renderBanListTab();
      case 'penaltylist': return renderPenaltyListTab();
      case 'chatlog': return renderChatLogTab();
      default: return '';
    }
  }

  function render(){
    if(!session){ renderLogin(); return; }
    app.innerHTML = `
      <header>
        <h1>七彩の塔 管理画面</h1>
        <button id="logoutBtn">ログアウト</button>
      </header>
      <nav>
        <button data-tab="players" class="${tab==='players'?'primary':''}">プレイヤー</button>
        <button data-tab="announcements" class="${tab==='announcements'?'primary':''}">お知らせ</button>
        <button data-tab="reports" class="${tab==='reports'?'primary':''}">通報${openReportCount>0 ? `<span class="badge danger">${openReportCount}</span>` : ''}</button>
        <button data-tab="banlist" class="${tab==='banlist'?'primary':''}">BANリスト</button>
        <button data-tab="penaltylist" class="${tab==='penaltylist'?'primary':''}">利用制限リスト</button>
        <button data-tab="chatlog" class="${tab==='chatlog'?'primary':''}">チャットログ</button>
      </nav>
      <main>${renderTabContent()}</main>
      ${renderModal()}
    `;
    bindEvents();
  }

  function bindModalEvents(){
    if(!modal) return;
    const backdrop = document.getElementById('modalBackdrop');
    const okBtn = document.getElementById('modalOkBtn');
    const cancelBtn = document.getElementById('modalCancelBtn');
    const input = document.getElementById('modalPromptInput');
    if(backdrop) backdrop.addEventListener('click', (e)=>{
      if(e.target === backdrop) resolveModal(modal.kind === 'prompt' ? null : false);
    });
    if(okBtn) okBtn.addEventListener('click', ()=>{
      if(modal.kind === 'prompt') resolveModal(input ? input.value : '');
      else resolveModal(true);
    });
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{
      resolveModal(modal.kind === 'prompt' ? null : false);
    });
    if(input){
      input.focus();
      input.select();
      input.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter'){ e.preventDefault(); okBtn.click(); }
        if(e.key === 'Escape'){ e.preventDefault(); cancelBtn.click(); }
      });
    } else if(okBtn){
      okBtn.focus();
    }
  }

  function bindEvents(){
    const logoutBtn = document.getElementById('logoutBtn');
    if(logoutBtn) logoutBtn.addEventListener('click', handleLogout);

    document.querySelectorAll('[data-tab]').forEach(b=>{
      b.addEventListener('click', ()=>{
        tab = b.getAttribute('data-tab');
        userDetail = null; userDetailData = null;
        render();
        if(tab === 'chatlog') loadChatLog();
      });
    });

    const searchBtn = document.getElementById('playerSearchBtn');
    const searchInput = document.getElementById('playerSearchInput');
    if(searchBtn) searchBtn.addEventListener('click', ()=>{
      playerQuery = searchInput.value;
      loadPlayers();
    });
    if(searchInput) searchInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') searchBtn.click(); });

    document.querySelectorAll('[data-ban-toggle]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const id = b.getAttribute('data-ban-toggle');
        const currentlyBanned = b.getAttribute('data-banned') === 'true';
        if(currentlyBanned){
          if(await showConfirm('BANを解除しますか？')) setBan(id, false, null);
        } else {
          const reason = await showPrompt('BAN理由を入力してください:');
          if(reason !== null) setBan(id, true, reason);
        }
      });
    });

    document.querySelectorAll('[data-penalty-change]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const id = b.getAttribute('data-penalty-change');
        const hoursStr = await showPrompt('新しい制限時間を入力してください(時間単位。今からこの時間後が新しい解除予定になります):', '24');
        if(hoursStr === null) return;
        const hours = parseInt(hoursStr, 10);
        if(!hours || hours <= 0){ await showAlert('有効な時間を入力してください。'); return; }
        const reason = await showPrompt('制限理由を入力してください(空欄可):', '');
        if(reason === null) return;
        if(!(await showConfirm(`${hours}時間後を新しい解除予定として設定します。よろしいですか？`))) return;
        setPenalty(id, hours, reason);
      });
    });
    document.querySelectorAll('[data-penalty-lift]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const id = b.getAttribute('data-penalty-lift');
        if(!(await showConfirm('この利用制限を解除しますか？'))) return;
        setPenalty(id, null, null);
      });
    });
    document.querySelectorAll('[data-penalty-ban]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const id = b.getAttribute('data-penalty-ban');
        const reason = await showPrompt('BAN理由を入力してください:', '利用制限中の違反によるBAN');
        if(reason === null) return;
        if(!(await showConfirm('このユーザーをBANします。よろしいですか？'))) return;
        setBan(id, true, reason);
      });
    });

    document.querySelectorAll('[data-ann-tab]').forEach(b=>{
      b.addEventListener('click', ()=>{
        announcementSubTab = b.getAttribute('data-ann-tab');
        announcementDetail = null;
        render();
      });
    });

    const newBtn = document.getElementById('annNewBtn');
    if(newBtn) newBtn.addEventListener('click', ()=>{
      const isPersonal = announcementSubTab === 'personal';
      recipientSearchQuery = '';
      recipientSearchResults = [];
      announcementDetail = {
        id:null, title:'', body:'', tags:[], published_at:new Date().toISOString(),
        target_player_id:null, sender_name:DEFAULT_SENDER_NAME, editable:true,
        isPersonalNew:isPersonal, recipients:[]
      };
      render();
    });

    document.querySelectorAll('[data-view-ann]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const id = Number(b.getAttribute('data-view-ann'));
        const a = announcementList.find(a=>a.id===id);
        announcementDetail = a ? { ...a, editable:false, isPersonalNew:false, recipients:[] } : null;
        render();
      });
    });
    document.querySelectorAll('[data-delete-ann]').forEach(b=>{
      b.addEventListener('click', ()=>{ deleteAnnouncement(Number(b.getAttribute('data-delete-ann'))); });
    });

    const annEditBtn = document.getElementById('annEditBtn');
    if(annEditBtn) annEditBtn.addEventListener('click', ()=>{
      announcementDetail.editable = true;
      render();
    });
    const annDetailCloseBtn = document.getElementById('annDetailCloseBtn');
    if(annDetailCloseBtn) annDetailCloseBtn.addEventListener('click', ()=>{
      announcementDetail = null;
      render();
    });

    const recipientInput = document.getElementById('annRecipientInput');
    if(recipientInput){
      recipientInput.addEventListener('input', (e)=>{
        recipientSearchQuery = e.target.value;
        clearTimeout(recipientSearchTimer);
        recipientSearchTimer = setTimeout(()=>searchRecipientCandidates(recipientSearchQuery), 250);
      });
    }
    document.querySelectorAll('[data-pick-recipient]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const id = b.getAttribute('data-pick-recipient');
        const name = b.getAttribute('data-pick-name');
        if(!announcementDetail.recipients.some(r=>r.id===id)){
          announcementDetail.recipients.push({ id, name });
        }
        recipientSearchQuery = '';
        recipientSearchResults = [];
        render();
      });
    });
    document.querySelectorAll('[data-remove-recipient]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const id = b.getAttribute('data-remove-recipient');
        announcementDetail.recipients = announcementDetail.recipients.filter(r=>r.id!==id);
        render();
      });
    });

    document.querySelectorAll('[data-report-filter]').forEach(b=>{
      b.addEventListener('click', ()=>{
        reportFilter = b.getAttribute('data-report-filter');
        loadReports();
      });
    });
    document.querySelectorAll('[data-report-action]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const id = Number(b.getAttribute('data-report-action'));
        const side = b.getAttribute('data-side');
        const action = b.getAttribute('data-action');
        const checkbox = document.querySelector(`[data-delete-msg="${id}"]`);
        const deleteMessage = checkbox ? checkbox.checked : false;
        handleReportSideAction(id, side, action, deleteMessage);
      });
    });
    document.querySelectorAll('[data-close-report]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const id = Number(b.getAttribute('data-close-report'));
        const checkbox = document.querySelector(`[data-delete-msg="${id}"]`);
        const deleteMessage = checkbox ? checkbox.checked : false;
        handleCloseReport(id, deleteMessage);
      });
    });

    document.querySelectorAll('[data-chatlog-channel]').forEach(b=>{
      b.addEventListener('click', ()=>{
        chatLogChannel = b.getAttribute('data-chatlog-channel');
        chatLogSinceDays = 30;
        chatLogOpenActionId = null;
        loadChatLog();
      });
    });
    const chatLogExtendBtn = document.getElementById('chatLogExtendBtn');
    if(chatLogExtendBtn) chatLogExtendBtn.addEventListener('click', ()=>{
      chatLogSinceDays += 30;
      loadChatLog();
    });
    document.querySelectorAll('[data-chatlog-delete]').forEach(b=>{
      b.addEventListener('click', ()=>{ deleteChatMessage(Number(b.getAttribute('data-chatlog-delete'))); });
    });
    document.querySelectorAll('[data-chatlog-toggle]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const id = Number(b.getAttribute('data-chatlog-toggle'));
        chatLogOpenActionId = chatLogOpenActionId === id ? null : id;
        render();
      });
    });
    document.querySelectorAll('[data-chatlog-ban]').forEach(b=>{
      b.addEventListener('click', ()=>{
        banPlayerFromChatLog(b.getAttribute('data-player-id'), b.getAttribute('data-player-name'));
      });
    });
    document.querySelectorAll('[data-chatlog-penalty]').forEach(b=>{
      b.addEventListener('click', ()=>{
        penalizePlayerFromChatLog(b.getAttribute('data-player-id'), b.getAttribute('data-player-name'));
      });
    });
    document.querySelectorAll('[data-chatlog-warn]').forEach(b=>{
      b.addEventListener('click', ()=>{
        warnPlayerFromChatLog(b.getAttribute('data-player-id'), b.getAttribute('data-player-name'));
      });
    });

    document.querySelectorAll('[data-view-user]').forEach(b=>{
      b.addEventListener('click', ()=>{
        openUserDetail(b.getAttribute('data-view-user'), b.getAttribute('data-user-name'));
      });
    });
    const userDetailBackBtn = document.getElementById('userDetailBackBtn');
    if(userDetailBackBtn) userDetailBackBtn.addEventListener('click', closeUserDetail);
    document.querySelectorAll('[data-userdetail-ban]').forEach(b=>{
      b.addEventListener('click', ()=>{
        toggleBanFromUserDetail(b.getAttribute('data-userdetail-ban'), b.getAttribute('data-banned') === 'true');
      });
    });
    document.querySelectorAll('[data-userdetail-penalty]').forEach(b=>{
      b.addEventListener('click', ()=>{
        setPenaltyFromUserDetail(b.getAttribute('data-userdetail-penalty'), false);
      });
    });
    document.querySelectorAll('[data-userdetail-penalty-lift]').forEach(b=>{
      b.addEventListener('click', ()=>{
        setPenaltyFromUserDetail(b.getAttribute('data-userdetail-penalty-lift'), true);
      });
    });

    const saveBtn = document.getElementById('annSaveBtn');
    if(saveBtn) saveBtn.addEventListener('click', async ()=>{
      const title = document.getElementById('annTitle').value.trim();
      const body = document.getElementById('annBody').value.trim();
      const tags = document.getElementById('annTags').value;
      const publishedAt = document.getElementById('annPublishedAt').value;
      const senderName = document.getElementById('annSender').value.trim();
      if(!title || !body){ await showAlert('タイトルと本文は必須です。'); return; }
      if(announcementDetail.isPersonalNew){
        if(recipientSearchQuery.trim()){
          await showAlert('宛先の入力欄に未確定の文字列が残っています。候補から選択するか、入力欄を空にしてください。');
          return;
        }
        if(!announcementDetail.recipients.length){
          await showAlert('宛先を1人以上選択してください。');
          return;
        }
      }
      saveAnnouncement({
        id: announcementDetail.id || null, title, body, tags, publishedAt, senderName,
        targetPlayerIds: announcementDetail.isPersonalNew ? announcementDetail.recipients.map(r=>r.id) : null
      });
    });
    const cancelBtn = document.getElementById('annCancelBtn');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ announcementDetail = null; render(); });

    bindModalEvents();
  }

  init();
})();
</script>
</body>
</html>
