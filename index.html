        <p class="section-label">編成中</p>
        ${partyRows}
      </div>
      <div class="section-block">
        <p class="section-label">待機中</p>
        ${benchRows}
        ${fullNotice}
      </div>
      ${lockedDefs.length ? `
      <div class="section-block">
        <p class="section-label">未解放</p>
        ${lockedRows}
      </div>` : ''}
    `;
  }

  function renderInnInner(){
    const line = INNKEEPER_LINES[Math.floor(Math.random()*INNKEEPER_LINES.length)];
    const cost = Math.max(5, partyLevel()*3);
    const full = isPartyFull();
    const partyStatusHtml = state.party.map(id=>{
      const ls = liverState(id);
      return `<p class="log-entry" style="font-size:12px;">${esc(liverDef(id).name)}: HP ${ls.hp}/${ls.maxHp} ・ MP ${ls.mp}/${ls.maxMp}</p>`;
    }).join('') || `<p class="log-entry system">パーティが編成されていない。</p>`;
    return `
      <div class="scene-text">
        ${sceneHeadingHtml('宿屋')}
        <p class="log-entry system">宿屋の女将マーレ:「${esc(line)}」</p>
        ${partyStatusHtml}
      </div>
      <div class="actions">
        <button class="primary" id="stayBtn" ${(full||state.gold<cost||!state.party.length)?'disabled':''}>パーティ全員で泊まる (${cost}G)</button>
        <button id="backTownBtn">町に戻る</button>
      </div>
    `;
  }

  function renderShopInner(){
    const line = SHOPKEEPER_LINES[Math.floor(Math.random()*SHOPKEEPER_LINES.length)];
    const buyHtml = shopStock.length ? shopStock.map(item=>`
      <div class="inv-item ${item.rarityLabel}" title="${esc(itemDetailText(item))}">
        <span class="inv-item-name">${esc(item.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(itemValueLabel(item))}</span></span>
        <span class="inv-item-actions">
          <button data-buy-shop="${item.id}" ${(state.gold<item.price || state.inventory.length>=INVENTORY_MAX)?'disabled':''}>${item.price}G 購入</button>
        </span>
      </div>`).join('') : `<p class="inv-empty">今日の品はもう出払っている。</p>`;

    const sellHtml = state.inventory.length ? state.inventory.map(item=>`
      <div class="inv-item ${item.rarityLabel}" title="${esc(itemDetailText(item))}">
        <span class="inv-item-name">${esc(item.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(itemValueLabel(item))}</span></span>
        <span class="inv-item-actions">
          <button data-sell="${item.id}">${Math.max(1,Math.round(item.value*3))}G で売る</button>
        </span>
      </div>`).join('') : `<p class="inv-empty">売れる物がない。</p>`;

    return `
      <div class="scene-text">
        ${sceneHeadingHtml('商店')}
        <p class="log-entry system">商人オーレンス:「${esc(line)}」</p>
      </div>
      <div class="actions"><button id="backTownBtn">町に戻る</button></div>
      <div class="section-block">
        <p class="section-label">購入</p>
        ${buyHtml}
      </div>
      <div class="section-block">
        <p class="section-label">売却</p>
        ${sellHtml}
      </div>
    `;
  }

  function renderResistancePanel(liverId){
    const res = liverResistances(liverId);
    const rows = Object.keys(ELEMENT_LABELS).map(el=>{
      const value = res[el] || 0;
      const pct = value * 3;
      const pctLabel = pct === 0 ? '±0%' : (pct > 0 ? `-${pct}%` : `+${Math.abs(pct)}%`);
      const color = value > 0 ? 'var(--rare-uncommon)' : (value < 0 ? 'var(--danger)' : 'var(--text-muted)');
      return `
        <div class="inv-item">
          <span class="inv-item-name">${ELEMENT_LABELS[el]}属性</span>
          <span class="inv-item-actions" style="font-family:var(--font-mono);font-size:12px;color:${color};">
            ${value>0?'+':''}${value} <span style="color:var(--text-muted);">(被ダメージ ${pctLabel})</span>
          </span>
        </div>`;
    }).join('');
    return rows + `<p style="color:var(--text-muted);font-size:11px;margin:6px 0 0;">レベルアップでは変化しません。装備品(主に防具)に付く耐性値によってのみ増減します。</p>`;
  }

  function renderHomeInner(){
    const ownedHtml = state.home.furniture.length
      ? state.home.furniture.map(id=>{
          const f = FURNITURE_CATALOG.find(x=>x.id===id);
          return `<div class="inv-item uncommon"><span>${esc(f.name)}<br><span style="color:var(--text-muted);font-size:11px;">${esc(f.flavor)}</span></span></div>`;
        }).join('')
      : `<p class="inv-empty">まだ何も置かれていない。</p>`;

    const catalogHtml = FURNITURE_CATALOG.filter(f=>!state.home.furniture.includes(f.id)).map(f=>`
      <div class="inv-item">
        <span class="inv-item-name">${esc(f.name)} <span style="color:var(--gold);font-family:var(--font-mono);font-size:11px;">${f.price}G</span></span>
        <span class="inv-item-actions">
          <button data-buy-furniture="${f.id}" ${state.gold<f.price?'disabled':''}>設置</button>
        </span>
      </div>`).join('');

    const rosterHtml = LIVER_DEFS.filter(def=>liverState(def.id).unlocked).map(def=>{
      const id = def.id;
      const ls = liverState(id);
      const job = JOB_DEFS[ls.job];
      const expanded = !!(state.ui.expandedGroups.includes('liver:'+id));
      const { atkRate, actions } = computeActionRates(id);
      const actualRateOf = key => {
        const found = actions.find(a=>a.skill.key===key);
        return found ? Math.round(found.rate) : 0;
      };

      const jobSwitchHtml = Object.keys(JOB_DEFS).map(jobId=>`
        <button data-switch-liver-job="${id}:${jobId}" ${ls.job===jobId?'disabled':''} style="padding:3px 9px;font-size:11px;">${ls.job===jobId?'◆ ':''}${esc(JOB_DEFS[jobId].name)}</button>`).join('');

      const atkRow = `
        <div class="inv-item" style="border-left-color:var(--text-muted);opacity:.85;">
          <span class="inv-item-name">通常攻撃 <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">(常時習得済み・下限50%)</span></span>
          <span class="inv-item-actions">
            <span style="font-family:var(--font-mono);font-size:12px;color:var(--gold);">${Math.round(atkRate)}%</span>
          </span>
        </div>`;

      const passive = def.passive;
      const passiveRow = passive ? `
        <div class="inv-item" style="border-left-color:${def.color};">
          <span class="inv-item-name">
            ${esc(passive.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">(${passive.kind==='statMult'?'常時発動':'条件付き発動'})</span><br>
            <span style="color:var(--text-muted);font-size:11px;">${esc(passive.desc)}</span>
          </span>
        </div>` : '';

      const skillRows = job.skills.map(s=>{
        const enabled = ls.loadout.enabled.includes(s.key);
        return `
          <div class="inv-item" style="${enabled?'':'opacity:.5;'}">
            <span class="inv-item-name">
              ${esc(s.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">(${s.element?`${ELEMENT_LABELS[s.element]}属性 ・ `:''}MP${s.mpCost} ・ 発動率${s.baseRate}%${enabled?` → 実質${actualRateOf(s.key)}%`:''})</span><br>
              <span style="color:var(--text-muted);font-size:11px;">${esc(s.desc)}</span>
            </span>
            <span class="inv-item-actions">
              <button data-toggle-skill="${id}:${s.key}">${enabled?'無効化':'有効化'}</button>
            </span>
          </div>`;
      }).join('');

      const summaryRow = `
        <button data-toggle-group="liver:${id}" style="width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;">
          <span><span style="width:9px;height:9px;background:${def.color};display:inline-block;margin-right:6px;"></span>${expanded?'▼':'▶'} ${esc(def.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">Lv.${ls.level} ・ ${esc(job.name)}${state.party.includes(id)?' ・ 編成中':''}</span></span>
        </button>`;

      const detailHtml = expanded ? `
        <div style="margin:8px 0 14px 10px;">
          <p style="color:var(--text-muted);font-size:11px;margin:0 0 6px;">EXP ${ls.exp}/${expToNext(ls.level)} ・ ${esc(job.desc)}</p>
          <p class="section-label" style="margin:6px 0 6px;">パッシブスキル</p>
          ${passiveRow}
          <p class="section-label" style="margin:10px 0 6px;">ジョブ</p>
          <div class="actions" style="margin-top:0;margin-bottom:10px;">${jobSwitchHtml}</div>
          <p class="section-label" style="margin:6px 0 6px;">スキル</p>
          ${atkRow}
          ${skillRows}
          <p style="color:var(--text-muted);font-size:11px;margin:4px 0 0;">有効スキルは最大${SKILL_LOADOUT_MAX}つまで。希望発動率の合計が50%を超える分は自動的に按分されます。</p>
          <p class="section-label" style="margin:10px 0 6px;">属性耐性</p>
          ${renderResistancePanel(id)}
        </div>` : '';

      return `<div style="margin-bottom:6px;">${summaryRow}${detailHtml}</div>`;
    }).join('');

    return `
      <div class="scene-text">
        ${sceneHeadingHtml('マイホーム')}
        <p class="log-entry system">あなただけの小さな家。まだ何もない部屋だが、少しずつ形にしていけばいい。</p>
        <p class="log-entry" style="margin-top:10px;">現在の名前: <strong>${esc(state.name)}</strong></p>
        <input id="nameEditInput" class="name-input" type="text" maxlength="12" placeholder="新しい名前">
      </div>
      <div class="actions">
        <button id="renameBtn">名前を変更</button>
        <button id="backTownBtn">町に戻る</button>
      </div>
      <div class="section-block">
        <p class="section-label">仲間の管理(ジョブ・スキル・耐性)</p>
        ${rosterHtml}
      </div>
      <div class="section-block">
        <p class="section-label">設置済みの家具</p>
        ${ownedHtml}
      </div>
      <div class="section-block">
        <p class="section-label">家具カタログ</p>
        ${catalogHtml || '<p class="inv-empty">すべて設置済み。</p>'}
      </div>
      <div class="section-block">
        <p class="section-label">デバッグ</p>
        <p style="color:var(--text-muted);font-size:11px;margin:0 0 8px;">セーブデータを完全に削除し、キャラ作成からやり直す。動作確認用の機能。</p>
        <button class="danger" id="resetGameBtn">セーブデータをリセット</button>
      </div>
    `;
  }

  function renderDeadInner(){
    const lost = state.pendingDefeatGoldLoss || 0;
    return `
      <div class="scene-text" style="text-align:center;padding:24px 0 8px;">
        <p style="font-family:var(--font-display);font-weight:700;font-size:30px;color:var(--danger);text-shadow:2px 2px 0 #2c5c2c;margin:0 0 16px;">力尽きた……</p>
        <p class="log-entry system">意識が遠のく中、誰かに担がれて街まで運ばれたようだ。</p>
        ${lost>0 ? `<p class="log-entry danger">所持金を ${lost} 枚落としてしまった。</p>` : ''}
      </div>
      <div class="actions" style="justify-content:center;">
        <button class="primary" id="returnTownBtn">街に戻る</button>
      </div>
    `;
  }

  function renderMainArea(){
    let inner;
    if(state.screen === 'dungeon') inner = renderDungeonInner();
    else if(state.screen === 'party') inner = renderPartyInner();
    else if(state.screen === 'colosseum') inner = renderColosseumInner();
    else if(state.screen === 'inn') inner = renderInnInner();
    else if(state.screen === 'shop') inner = renderShopInner();
    else if(state.screen === 'exchange') inner = renderExchangeInner();
    else if(state.screen === 'home') inner = renderHomeInner();
    else if(state.screen === 'dead') inner = renderDeadInner();
    else inner = renderTownInner();
    return `<div class="scene">${inner}</div>`;
  }

  function renderPartyCompactRows(){
    return state.party.map(id=>{
      const ls = liverState(id);
      const def = liverDef(id);
      const hpPct = ls.maxHp>0 ? Math.round(ls.hp/ls.maxHp*100) : 0;
      const mpPct = ls.maxMp>0 ? Math.round(ls.mp/ls.maxMp*100) : 0;
      return `
        <div class="party-compact-row${ls.hp<=0?' ko':''}">
          <span class="party-compact-chip" style="background:${def.color};"></span>
          <span class="party-compact-name">${esc(def.name)}<span class="party-compact-lv">Lv.${ls.level}</span></span>
          <span class="party-compact-bars">
            <span class="mini-bar-track"><span class="mini-bar-fill hp" style="width:${hpPct}%;"></span></span>
            <span class="mini-bar-track"><span class="mini-bar-fill mp" style="width:${mpPct}%;"></span></span>
          </span>
          <span class="party-compact-hp">${ls.hp<=0?'戦闘不能':`${ls.hp}/${ls.maxHp}`}</span>
        </div>`;
    }).join('');
  }

  function renderColosseumInner(){
    if(inCombat && combatEnemy && combatEnemy.isColosseum){
      const hpPct = Math.max(0, Math.round(combatEnemyHp/combatEnemy._maxHp*100));
      const partyRowsHtml = renderPartyCompactRows();
      const actionsHtml = combatPhase === 'choice'
        ? `
          <div class="actions">
            <button class="primary" id="fightBtn">戦う</button>
            <button class="danger" id="fleeBtn">逃げる</button>
          </div>`
        : `<div class="actions"><button disabled>戦闘中…</button></div>`;
      return `
        <div class="scene-text">
          ${sceneHeadingHtml(`コロシアムタワー ${combatEnemy.colosseumFloor}F`)}
          ${actionsHtml}
          <p class="log-entry" style="font-family:var(--font-mono);font-size:13px;color:var(--text-muted);margin-top:16px;">
            Lv.${combatEnemy.level} ${esc(combatEnemy.name)} — HP ${Math.max(0,combatEnemyHp)}/${combatEnemy._maxHp}
          </p>
          <div class="bar-track" style="margin-bottom:14px;"><div class="bar-fill" style="width:${hpPct}%;background:linear-gradient(90deg,#7a2fc6,#b06bff);height:100%;"></div></div>
          <div style="margin-bottom:14px;">${partyRowsHtml}</div>
          ${renderLog()}
        </div>`;
    }

    const cs = state.colosseum;
    const now = Date.now();
    const cooldownLeft = Math.max(0, COLOSSEUM_COOLDOWN_MS - (now - (cs.lastChallengeAt||0)));
    const canChallenge = cooldownLeft <= 0 && state.party.length > 0;

    let gatekeeperHtml = '<p class="log-entry system">門番の情報を読み込み中……</p>';
    if(!colosseumView.loading && colosseumView.floor === cs.floorRight && colosseumView.record){
      const rec = colosseumView.record;
      const hpPct = rec.maxHpPool>0 ? Math.max(0,Math.round(rec.hpPool/rec.maxHpPool*100)) : 0;
      const memberRows = rec.snapshot.map(m=>`
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
          <span style="width:8px;height:8px;background:${m.color};display:inline-block;flex:0 0 auto;"></span>
          <span style="font-family:var(--font-mono);font-size:11px;">${esc(m.name)} <span style="color:var(--text-muted);">Lv.${m.level} ・ ${esc((JOB_DEFS[m.job]&&JOB_DEFS[m.job].name)||m.job)}</span></span>
        </div>`).join('');
      gatekeeperHtml = `
        <p class="log-entry" style="font-family:var(--font-mono);font-size:12px;color:var(--gold);">
          ${cs.floorRight}Fの門番: ${esc(rec.holderName || '(まだ誰も登録していない)')}
        </p>
        <p class="log-entry" style="font-size:12px;color:var(--text-muted);">残りHP: ${rec.hpPool} / ${rec.maxHpPool} (${hpPct}%)${rec.wins ? ` ・ 防衛${rec.wins}勝` : ''}</p>
        <div class="bar-track" style="margin-bottom:10px;"><div class="bar-fill" style="width:${hpPct}%;background:linear-gradient(90deg,#7a2fc6,#b06bff);height:100%;"></div></div>
        <div style="margin-bottom:14px;">${memberRows}</div>
      `;
    }

    const cooldownHtml = cooldownLeft > 0
      ? `<p class="log-entry danger">クールタイム中: 残り約${Math.ceil(cooldownLeft/1000)}秒</p>`
      : '';

    const ladderHtml = Array.from({length: COLOSSEUM_FLOORS}, (_,i)=>i+1).map(f=>{
      const st = f < cs.floorRight ? 'clear' : (f === cs.floorRight ? 'current' : 'locked');
      return `<span style="display:inline-block;padding:3px 8px;margin:2px 4px 2px 0;border:1px solid ${st==='current'?'var(--gold)':'var(--win-border)'};font-family:var(--font-mono);font-size:10px;color:${st==='locked'?'var(--text-muted)':'#fff'};opacity:${st==='locked'?0.5:1};">${f}F</span>`;
    }).join('');

    return `
      <div class="scene-text">
        ${sceneHeadingHtml('コロシアムタワー')}
        <p class="log-entry system">全プレイヤー共有のPvPタワー。門番に勝てば次のフロアへの挑戦権とメダルを獲得できる。負けると1Fからやり直しになる。</p>
        <p class="log-entry" style="font-family:var(--font-mono);font-size:12px;color:var(--gold);">挑戦権: ${cs.floorRight}F ・ メダル所持数: ${cs.medals}</p>
        <div style="margin:10px 0 14px;">${ladderHtml}</div>
        ${cooldownHtml}
        ${gatekeeperHtml}
      </div>
      <div class="actions">
        <button class="primary" id="colosseumChallengeBtn" ${canChallenge?'':'disabled'}>挑戦する</button>
        <button id="backTownBtn">町に戻る</button>
      </div>
    `;
  }

  function renderCharacterLane(){
    if(!state.party.length){
      return `
        <div class="panel">
          <h2>パーティ</h2>
          <p class="log-entry system">まだ誰も編成されていない。町で「編成」から仲間を選ぼう。</p>
        </div>`;
    }

    return `
      <div class="panel">
        <h2>パーティ</h2>
        ${renderPartyCompactRows()}
        <p style="color:var(--text-muted);font-size:11px;margin:10px 0 0;">詳細(レベル・EXP・ジョブ・スキル・装備)は町の「マイホーム」「編成」から確認・変更できる。</p>
      </div>
    `;
  }

  function renderInventoryLane(){
    const manageOk = canManageEquipment();
    const viewingId = state.ui.equipViewLiver;
    const targetName = manageOk && viewingId && liverState(viewingId) ? liverDef(viewingId).name : null;
    const inv = state.inventory.length
      ? state.inventory.map(i=>`
          <div class="inv-item ${i.rarityLabel}" title="${esc(itemDetailText(i))}">
            <span class="inv-item-name">${esc(i.name)} <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${esc(itemValueLabel(i))}</span></span>
            <span class="inv-item-actions">
              ${targetName ? `<button data-equip="${i.id}">装備</button>` : ''}
              <button data-discard="${i.id}">破棄</button>
            </span>
          </div>`).join('')
      : `<p class="inv-empty">所持品はまだない。</p>`;

    const noteHtml = !manageOk
      ? `<p style="color:var(--text-muted);font-size:11px;margin:0 0 8px;">※装備の変更は町にいる間だけ行える。</p>`
      : (targetName
          ? `<p style="color:var(--text-muted);font-size:11px;margin:0 0 8px;">装備対象: <strong style="color:var(--gold);">${esc(targetName)}</strong></p>`
          : '');

    return `
      <div class="panel">
        <h2>所持品</h2>
        ${noteHtml}
        <p class="inventory-count">${state.inventory.length} / ${INVENTORY_MAX}</p>
        <div class="scrollbox inventory-scroll">${inv}</div>
      </div>
    `;
  }

  function bindEvents(){
    const on = (id, fn) => { const el = document.getElementById(id); if(el) el.addEventListener('click', fn); };
    on('advBtn', advance);
    on('bossBtn', challengeBoss);
    on('fightBtn', chooseFight);
    on('fleeBtn', fleeCombat);
    on('backTownBtn', backToTown);
    on('gotoInnBtn', ()=>gotoScreen('inn'));
    on('gotoShopBtn', ()=>gotoScreen('shop'));
    on('gotoExchangeBtn', ()=>gotoScreen('exchange'));
    on('gotoHomeBtn', ()=>gotoScreen('home'));
    on('pullGachaBtn', pullDestinyTicket);
    on('acceptGachaBtn', acceptDestinyGacha);
    on('rerollGachaBtn', rerollDestinyGacha);
    on('exchangeGuaranteedBtn', exchangeForGuaranteedTicket);
    on('gotoPartyBtn', ()=>gotoScreen('party'));
    on('gotoColosseumBtn', gotoColosseum);
    on('colosseumChallengeBtn', challengeColosseum);
    on('stayBtn', stayAtInn);
    on('renameBtn', renameCharacter);
    on('resetGameBtn', resetGameData);
    on('returnTownBtn', returnToTownAfterDeath);
    on('sendChatBtn', ()=>{
      const input = document.getElementById('chatInput');
      if(!input) return;
      const text = input.value;
      input.value = '';
      sendChatMessage(text);
    });

    const chatInput = document.getElementById('chatInput');
    if(chatInput) chatInput.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){ document.getElementById('sendChatBtn').click(); }
    });

    document.querySelectorAll('[data-bottom-tab]').forEach(b=>{
      b.addEventListener('click', ()=>toggleBottomTab(b.getAttribute('data-bottom-tab')));
    });
    document.querySelectorAll('[data-toggle-group]').forEach(b=>{
      b.addEventListener('click', ()=>toggleGroup(b.getAttribute('data-toggle-group')));
    });
    document.querySelectorAll('[data-enter-dungeon]').forEach(b=>{
      b.addEventListener('click', ()=>enterDungeon(b.getAttribute('data-enter-dungeon')));
    });
    document.querySelectorAll('[data-equip]').forEach(b=>{
      b.addEventListener('click', ()=>equipItem(b.getAttribute('data-equip')));
    });
    document.querySelectorAll('[data-discard]').forEach(b=>{
      b.addEventListener('click', ()=>discardItem(b.getAttribute('data-discard')));
    });
    document.querySelectorAll('[data-unequip]').forEach(b=>{
      b.addEventListener('click', ()=>unequipSlot(b.getAttribute('data-unequip'), b.getAttribute('data-unequip-for')));
    });
    document.querySelectorAll('[data-buy-shop]').forEach(b=>{
      b.addEventListener('click', ()=>buyShopItem(b.getAttribute('data-buy-shop')));
    });
    document.querySelectorAll('[data-use-guaranteed]').forEach(b=>{
      b.addEventListener('click', ()=>useGuaranteedTicket(b.getAttribute('data-use-guaranteed')));
    });
    document.querySelectorAll('[data-sell]').forEach(b=>{
      b.addEventListener('click', ()=>sellItem(b.getAttribute('data-sell')));
    });
    document.querySelectorAll('[data-buy-furniture]').forEach(b=>{
      b.addEventListener('click', ()=>buyFurniture(b.getAttribute('data-buy-furniture')));
    });
    document.querySelectorAll('[data-switch-liver-job]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const [liverId, jobId] = b.getAttribute('data-switch-liver-job').split(':');
        switchLiverJob(liverId, jobId);
      });
    });
    document.querySelectorAll('[data-toggle-skill]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const [liverId, skillKey] = b.getAttribute('data-toggle-skill').split(':');
        toggleSkillEnabled(liverId, skillKey);
      });
    });
    document.querySelectorAll('[data-toggle-party]').forEach(b=>{
      b.addEventListener('click', ()=>togglePartyMember(b.getAttribute('data-toggle-party')));
    });
    document.querySelectorAll('[data-toggle-equip-view]').forEach(b=>{
      b.addEventListener('click', ()=>toggleEquipView(b.getAttribute('data-toggle-equip-view')));
    });
  }

  /* ---------------- チャット(全ユーザー共有、Supabase Realtime) ---------------- */
  let chatCache = [];
  let chatChannel = null;

  async function loadChat(){
    try{
      const { data, error } = await sb.from('chat_messages')
        .select('*').order('created_at', {ascending:false}).limit(100);
      if(error) throw error;
      return (data||[]).slice().reverse().map(m=>(
        { name: m.player_name, text: m.body, ts: new Date(m.created_at).getTime() }
      ));
    }catch(e){
      console.error('load chat failed', e);
      return [];
    }
  }

  function renderChatMessages(){
    if(!chatCache.length) return '<p style="color:var(--text-muted);">まだ発言はない。</p>';
    return chatCache.map(m=>`<p><span style="color:var(--gold);">${esc(m.name)}:</span> ${esc(m.text)}</p>`).join('');
  }

  async function refreshChatDOM(){
    const el = document.getElementById('chatLog');
    if(!el) return;
    chatCache = await loadChat();
    el.innerHTML = renderChatMessages();
    el.scrollTop = el.scrollHeight;
  }

  async function sendChatMessage(rawText){
    const text = (rawText||'').trim().slice(0,200);
    if(!text || !state) return;
    try{
      const { error } = await sb.from('chat_messages').insert({
        player_id: state.playerId, player_name: state.name, body: text
      });
      if(error) throw error;
      // 表示への反映は、下のRealtime購読側のINSERTイベントで(自分の発言も含めて)行われる
    }catch(e){
      console.error('send chat failed', e);
      pushLog('チャットの送信に失敗した。通信状況を確認してほしい。', 'system');
      render();
    }
  }

  function toggleBottomTab(tab){
    if(!state.ui) state.ui = {expandedGroups:[]};
    state.ui.bottomTab = tab;
    saveGame(); render();
    if(tab === 'chat') refreshChatDOM();
  }

  /* ポーリングではなく、Supabase Realtimeで新着メッセージをプッシュ受信する。
   * ページを開いた時に1回だけ購読を開始し、以降は通信を発生させずに
   * 新着があった時だけイベントが飛んでくる。 */
  function startChatPolling(){
    if(chatChannel) return;
    chatChannel = sb.channel('public:chat_messages')
      .on('postgres_changes', {event:'INSERT', schema:'public', table:'chat_messages'}, (payload)=>{
        const m = payload.new;
        chatCache.push({ name: m.player_name, text: m.body, ts: new Date(m.created_at).getTime() });
        if(chatCache.length > 100) chatCache.shift();
        if(state && state.ui && state.ui.bottomTab === 'chat'){
          const el = document.getElementById('chatLog');
          if(el){ el.innerHTML = renderChatMessages(); el.scrollTop = el.scrollHeight; }
        }
      })
      .subscribe();
  }

  function renderBottomPanel(){
    const tab = (state.ui && state.ui.bottomTab) || 'log';
    const logActive = tab === 'log';
    const tabsHtml = `
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <button data-bottom-tab="log" class="${logActive?'primary':''}" style="padding:6px 14px;font-size:12px;">冒険の記録</button>
        <button data-bottom-tab="chat" class="${!logActive?'primary':''}" style="padding:6px 14px;font-size:12px;">チャット</button>
      </div>`;
    let body;
    if(logActive){
      const rows = (state.history||[]).map(l=>`<p class="${l.cls}">${esc(l.text)}</p>`).join('')
        || '<p style="color:var(--text-muted);">まだ記録はない。</p>';
      body = `<div class="scrollbox history-log" id="historyLog">${rows}</div>`;
    } else {
      body = `
        <div class="scrollbox history-log" id="chatLog">${renderChatMessages()}</div>
        <div class="actions" style="margin-top:10px;flex-wrap:nowrap;">
          <input id="chatInput" class="name-input" style="flex:1;margin:0;" type="text" maxlength="200" placeholder="全体チャットに発言(他の全ユーザーに公開されます)">
          <button class="primary" id="sendChatBtn">送信</button>
        </div>`;
    }
    return `<div class="panel history-panel">${tabsHtml}${body}</div>`;
  }

  function render(){
    if(!state){ renderCreate(); return; }
    app.innerHTML = `
      <header>
        <div>
          <h1>${GAME_TITLE_HTML}</h1>
          <p class="subtitle">${GAME_SUBTITLE}</p>
        </div>
        <div class="depth-badge-slot">${renderHeaderBadge()}</div>
      </header>
      <div class="layout">
        <div>${renderMainArea()}</div>
        <div>${renderCharacterLane()}</div>
        <div>${renderInventoryLane()}</div>
      </div>
      ${renderBottomPanel()}
    `;
    bindEvents();
    const historyEl = document.getElementById('historyLog');
    if(historyEl) historyEl.scrollTop = historyEl.scrollHeight;
    const chatEl = document.getElementById('chatLog');
    if(chatEl) chatEl.scrollTop = chatEl.scrollHeight;
  }

  /* ---------------- Init / セーブのマイグレーション ---------------- */
  (async function init(){
    app.innerHTML = `<p style="text-align:center;color:var(--text-muted);margin-top:80px;font-family:var(--font-mono);">呼び起こしている……</p>`;
    const loaded = await loadGame();
    if(loaded){
      state = loaded;
      // 念のための軽い安全確認(想定外のDB状態に対する保険)
      state.party = (state.party||[]).filter(id=>state.roster[id] && state.roster[id].unlocked).slice(0, PARTY_MAX);
      if(state.ui.equipViewLiver && !state.roster[state.ui.equipViewLiver]) state.ui.equipViewLiver = null;
    }
    render();
    startChatPolling();
    setInterval(()=>{
      if(state && state.screen === 'colosseum' && !inCombat){
        const remain = COLOSSEUM_COOLDOWN_MS - (Date.now() - (state.colosseum.lastChallengeAt||0));
        if(remain > 0) render();
      }
    }, 5000);
  })();

})();
</script>
